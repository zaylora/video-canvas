server:
  name: video-canvas
  mode: debug # debug | release | test
  port: 8080
  read_timeout: 10s
  write_timeout: 60s
  shutdown_timeout: 10s
  # 对外 ID（画布 ID 等）十六进制编码的密钥。同一环境的所有实例必须一致，改了以后旧 ID（如书签里的画布地址）全部失效，所以定下来就不要再改。
  id_key: "id_key"
  allowed_origins: # WebSocket 升级允许的 Origin 白名单；为空只允许同源
    - http://localhost:5173
    - http://127.0.0.1:5173

log:
  level: debug # debug | info | warn | error
  format: console # console | json
  filename: "" # 为空只输出到控制台，例如 logs/app.log
  max_size: 100 # 单个日志文件大小（MB）
  max_backups: 7
  max_age: 30 # 保留天数

database:
  dsn: host=127.0.0.1 user=postgres password=root dbname=video_canvas port=5432 sslmode=disable TimeZone=Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  auto_migrate: true
  log_level: warn # silent | error | warn | info

redis:
  enabled: true # 关闭时缓存层自动降级为直查数据库
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: "change-me-in-prod" # 生产环境务必用环境变量 APP_JWT_SECRET 覆盖，不要用配置文件里的明文值
  issuer: video-canvas
  expire_hours: 72

ai:
  # secret_key（加解密渠道 Key 的主密钥）只通过环境变量 APP_AI_SECRET_KEY 提供
  plugin_runner: # 协议插件的沙箱执行进程，见 docs/design/协议插件设计.md 6.4
    mode: spawn # spawn（主服务把自己作为 plugin-runner 子进程拉起，开发用）| external（连独立容器，生产用）| inprocess（同进程无隔离，仅测试排障）
    network: tcp # unix | tcp；生产用 unix（共享卷里的 socket），开发用本机回环 tcp
    address: 127.0.0.1:47650 # tcp 是 host:port；unix 是 socket 路径，如 /run/plugin-runner/runner.sock
    hook_timeout: 1s # 单次钩子调用时限
    pool_size: 8 # 每个插件版本最多的 goja Runtime 数
    memory_limit_mb: 512 # spawn 模式下子进程的 GOMEMLIMIT 软限制；生产环境由容器 mem_limit 兜底
    startup_wait: 15s # 启动时等 runner 就绪的最长时间
  worker:
    enabled: true
    concurrency: 8 # 每个 worker 并发数
    tick: 1s # worker 每次轮询任务的间隔
    batch_size: 50 # 每次轮询任务的批量大小
    lease: 60s # worker 处理任务的租约时长，超过这个时间未完成的任务会被其他 worker 重新抢占

agent:
  # 画布 Agent。pi 的 agent 循环在独立的 Node 进程里跑（要求 Node >= 22.19，并在仓库根目录 agent/ 里 npm ci 装好依赖），
  # 所以默认关闭，显式开启。渠道、模型、凭证和计费在后台的 AI 配置里（模型种类选 agent），不在这里。
  enabled: ture
  node_path: node # node 可执行文件；不在 PATH 里时写绝对路径
  runtime_dir: ../agent # 含 src/main.mjs 和 node_modules 的目录
  bridge_addr: 127.0.0.1:0 # 桥的监听地址，必须是回环地址；0 表示随机端口。Node 进程通过它回调 Go（模型、工具、状态）
  work_dir: "" # 每个运行片段的临时目录建在这里，为空用系统临时目录

storage:
  # 对象存储（阿里云 OSS / 腾讯云 COS / S3 / Cloudflare R2）不在这里配，请到后台“存储配置”页面添加。
  # 这里只保留内置的本地磁盘（开发用，也是对象存储配好之前的兜底）和全局上限。
  max_upload_bytes: 209715200 # 200MB
  max_result_bytes: 2147483648 # 2GB
  signed_ttl: 1h # 存储自己没配签名有效期时的兜底
  local:
    dir: ./data/assets
    base_url: "" # 素材稳定地址 /files/<key> 的站点前缀，为空时使用相对路径；所有存储共用
  # 升级提示：旧版用 APP_STORAGE_DRIVER=s3 + APP_STORAGE_S3_* 配置的对象存储，升级后首次启动会自动导入为后台存储，
  # 导入后可以删掉这些环境变量。导入需要配置 APP_AI_SECRET_KEY（用来加密保存密钥）。

# 所有配置项都可以用环境变量覆盖，规则：APP_ + 大写路径，点换成下划线
# 例如 APP_SERVER_PORT=9000、APP_DATABASE_DSN=...、APP_JWT_SECRET=...
