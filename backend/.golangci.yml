# golangci-lint v2 配置。规则说明见 docs/standards/，每个 linter 对应的规范条目写在注释里。
# 本地：make lint（全量） / make lint-new（只查相对 master 的增量）
version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    # —— 正确性 ——
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint # 错误用 %w 包装、用 errors.Is/As 判断（02-错误处理 E3/E4）
    - bodyclose # http 响应体必须关闭
    - noctx # 发 HTTP 请求必须带 ctx（01-架构 A8）
    - gosec
    - nolintlint # //nolint 必须写明 linter 和原因
    # —— 架构 ——
    - depguard # 分层依赖方向（01-架构 A1）
    - forbidigo # 禁用的调用（handler 里 c.JSON、fmt.Print 等）
    # —— 可读性 ——
    - revive
    - funlen # 函数长度（03-可读性 R1）
    - gocognit # 认知复杂度（03-可读性 R1）

  settings:
    depguard:
      rules:
        model:
          files: ["**/internal/model/**"]
          deny:
            - pkg: video-canvas/internal
              desc: model 是最底层，不依赖任何内部包（A1）
        repository:
          files: ["**/internal/repository/**"]
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: repository 不感知 HTTP（A1）
            - pkg: video-canvas/internal/service
              desc: 依赖方向是 service → repository（A1）
            - pkg: video-canvas/internal/handler
              desc: 依赖方向是 handler → service → repository（A1）
        service:
          files: ["**/internal/service/**", "!**/internal/service/aiconfigfake/**"]
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: service 不感知 HTTP，入参用普通类型或 model 结构体（A1）
            - pkg: gorm.io/gorm
              desc: 事务和查询收在 repository，service 只认 repository.ErrNotFound 等哨兵（A1）
            - pkg: video-canvas/internal/handler
              desc: 依赖方向是 handler → service（A1）
            - pkg: video-canvas/internal/middleware
              desc: 依赖方向是 middleware → service（A1）
            - pkg: video-canvas/internal/provider/plugin
              desc: service 只依赖 provider 包里的接口，不依赖具体实现（A3）
            - pkg: video-canvas/internal/provider/pluginrunner
              desc: service 只依赖 provider 包里的接口，不依赖具体实现（A3）
            - pkg: video-canvas/internal/provider/worker
              desc: service 只依赖 provider 包里的接口，不依赖具体实现（A3）
        handler:
          files: ["**/internal/handler/**", "!**/internal/handler/health.go"]
          deny:
            - pkg: video-canvas/internal/repository
              desc: handler 不直接访问 repository（A1）
            - pkg: video-canvas/internal/cache
              desc: handler 不直接访问缓存（A1）
            - pkg: gorm.io/gorm
              desc: handler 不直接访问数据库（A1；health.go 是登记过的例外）
            - pkg: github.com/redis/go-redis/v9
              desc: handler 不直接访问 Redis（A1；health.go 是登记过的例外）
        public-pkg:
          files: ["**/backend/pkg/**"]
          deny:
            - pkg: video-canvas/internal
              desc: pkg/ 可被外部引用，不能依赖 internal（U2）

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^fmt\.Print.*$
          msg: 用 logger.L()，不要直接打印到标准输出（E7）
        - pattern: ^log\.(Print|Fatal|Panic).*$
          msg: 用 logger.L()（E7）
        - pattern: ^gin\.Context\.(JSON|AbortWithStatusJSON|IndentedJSON|PureJSON|String)$
          msg: 统一走 response 包，保证带上 request_id（A6）

    revive:
      rules:
        - name: exported # 导出符号的注释以名字开头（R6）
          arguments: ["disableStutteringCheck"]
        - name: var-naming # ID / URL / JSON 等缩写全大写（R4）
        - name: receiver-naming
        - name: error-naming
        - name: error-return
        - name: errorf
        - name: context-as-argument # ctx 作为第一个参数（A8）
        - name: context-keys-type
        - name: indent-error-flow
        - name: early-return
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: time-naming
        - name: increment-decrement
        - name: blank-imports
        - name: file-length-limit # 单文件不超过 500 行代码（不计注释和空行）（R1）
          arguments: [{max: 500, skipComments: true, skipBlankLines: true}]

    funlen:
      lines: 80
      statements: 50
      ignore-comments: true

    gocognit:
      min-complexity: 20

    gosec:
      excludes:
        - G115 # 整数类型转换溢出：本项目 ID 为 uint64，与 uint 互转在 64 位平台安全，误报过多

    errcheck:
      exclude-functions:
        - (*go.uber.org/zap.Logger).Sync

    nolintlint:
      require-explanation: true
      require-specific: true

  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # 表驱动测试天然很长；httptest.NewRequest 与 WebSocket 拨号的响应体不需要处理
      - path: _test\.go
        linters: [funlen, gocognit, gosec, noctx, bodyclose, forbidigo]
      - path: _test\.go
        linters: [revive]
        text: file-length-limit
      # 测试共享 fake 只给测试用，不要求导出注释
      - path: internal/service/aiconfigfake/
        linters: [revive]
        text: exported
      # response 包是唯一允许直接写 JSON 的地方
      - path: internal/pkg/response/
        linters: [forbidigo]
        text: response 包
      # 健康检查按探活约定在降级时返回 503，是登记过的例外（存量问题清单 X1）
      - path: internal/handler/health\.go
        linters: [forbidigo]
        text: response 包
      # export_testing.go 只给测试用
      - path: export_testing\.go
        linters: [revive]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes: [video-canvas]

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
