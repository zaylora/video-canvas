root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/server"
  bin = "./tmp/server"
  args_bin = ["-c", "configs/config.yaml"]
  delay = 1000
  exclude_dir = ["tmp", "bin", "data", "logs", "internal/tests"]
  exclude_file = []
  exclude_regex = ["_test.go"]
  include_ext = ["go", "yaml"]
  kill_delay = "1s"
  log = "build-errors.log"
  send_interrupt = true
  stop_on_error = true

[log]
  time = true

[screen]
  clear_on_rebuild = true

[misc]
  clean_on_exit = true
