name: video-canvas

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-video_canvas}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  backend:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-zaylora}/video-canvas-backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      APP_SERVER_MODE: release
      APP_DATABASE_DSN: host=postgres user=${POSTGRES_USER:-postgres} password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required} dbname=${POSTGRES_DB:-video_canvas} port=5432 sslmode=disable TimeZone=Asia/Shanghai
      # 退回旧版本镜像、而数据库已被新版本迁移过时，旧版本默认拒绝启动；确认那些迁移只新增表或列后在 .env 设为 true 放行
      APP_DATABASE_ALLOW_NEWER_SCHEMA: ${APP_DATABASE_ALLOW_NEWER_SCHEMA:-false}
      APP_REDIS_ENABLED: "true"
      APP_REDIS_ADDR: redis:6379
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET is required}
      APP_AI_SECRET_KEY: ${APP_AI_SECRET_KEY:?APP_AI_SECRET_KEY is required}
      APP_AI_PLUGIN_RUNNER_MODE: external
      APP_AI_PLUGIN_RUNNER_NETWORK: unix
      APP_AI_PLUGIN_RUNNER_ADDRESS: /run/plugin-runner/runner.sock
      APP_STORAGE_LOCAL_DIR: /app/data/assets
      APP_SERVER_ALLOWED_ORIGINS: ${APP_SERVER_ALLOWED_ORIGINS:-http://localhost:38080}
      # 画布 Agent：会话、运行、审批在下方独立的 agent 服务里，backend 负责登录校验、反向代理和平台能力（画布读写、模型代理和计费、生成任务、素材）。
      # 默认开启，设为 false 关闭（关闭后画布里的 Agent 提示「暂不可用」）；还要在后台 AI 配置里发布 agent 类型的模型
      APP_AGENT_ENABLED: ${APP_AGENT_ENABLED:-true}
      # 联网工具（搜索、读网页）：默认开启，设为 false 关闭。请求由 backend 发出，内网和本机地址一律拒绝。
      # 搜索源默认依次试 Exa（免 Key 的公开接口）、Bing、DuckDuckGo 网页搜索，后两个对数据中心的出口常给降级结果或要求人机验证；生产环境建议启用下方的 searxng，并设置它的地址
      APP_AGENT_WEB_ENABLED: ${APP_AGENT_WEB_ENABLED:-true}
      APP_AGENT_SEARXNG_URL: ${APP_AGENT_SEARXNG_URL:-}
      # 平台 API（agent 服务来调用）监听 0.0.0.0:47001，只在 compose 内网可达、不对外开放端口，靠服务令牌鉴权
      APP_AGENT_URL: http://agent:8090
      APP_AGENT_BRIDGE_URL: http://backend:47001
      APP_AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?.env 里缺少 AGENT_SERVICE_TOKEN（至少 32 个字符）：加一行 AGENT_SERVICE_TOKEN=openssl rand -hex 32 的输出，再重新升级}
      # 一键升级（可选，见下方 updater）：与 updater 共用的 token，为空表示没启用
      APP_UPDATE_UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - backend_assets:/app/data/assets
      - plugin_runner_sock:/run/plugin-runner
      - updater_sock:/run/updater
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      plugin-runner:
        condition: service_healthy

  plugin-runner:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-zaylora}/video-canvas-backend:${IMAGE_TAG:-latest}
    restart: always
    network_mode: none
    mem_limit: ${PLUGIN_RUNNER_MEM_LIMIT:-512m}
    entrypoint:
      [
        "/app/server",
        "plugin-runner",
        "-network",
        "unix",
        "-address",
        "/run/plugin-runner/runner.sock",
      ]
    volumes:
      - plugin_runner_sock:/run/plugin-runner
    healthcheck:
      test:
        [
          "CMD",
          "/app/server",
          "plugin-runner",
          "-healthcheck",
          "-network",
          "unix",
          "-address",
          "/run/plugin-runner/runner.sock",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-zaylora}/video-canvas-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-38080}:80"
    depends_on:
      backend:
        condition: service_healthy

  # Agent 服务：画布 Agent 的会话、运行、审批、事件都在这里（Pi Durable + SQLite，数据在 agent_data 卷）。
  # backend 负责登录校验、反向代理前端的接口，并提供平台能力（画布读写、模型代理和计费、生成任务、素材）。
  # 服务重启后没跑完的运行在窗口内自动续跑（AGENT_RESUME_WINDOW_SECONDS，默认 5 分钟），界面显示「恢复中」；backend 重启不影响运行。
  # 只在 compose 内网提供服务，不对外开放端口。
  # AGENT_SERVICE_TOKEN 是 backend 和 agent 互相认的唯一凭据（deploy.sh 新部署和命令行运行的新版 update.sh 会在 .env 里生成；后台一键升级跑的是 updater 里的旧脚本，不会生成，见 docs/docker-production.md「Agent 服务」），
  # 没配时这里在解析阶段就报错，升级停在拉取镜像之前，运行中的服务不受影响。
  # AGENT_ID_KEY 必须和 backend 对外 ID 的编码密钥一致（backend 用配置文件里的 id_key，镜像里默认就是 id_key；
  # 改过 backend 的密钥才需要在 .env 里设 AGENT_ID_KEY）。不一致时 agent 启动后自检会发现，/health 报不健康。
  agent:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-zaylora}/video-canvas-agent:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?.env 里缺少 AGENT_SERVICE_TOKEN（至少 32 个字符）：加一行 AGENT_SERVICE_TOKEN=openssl rand -hex 32 的输出，再重新升级}
      AGENT_LISTEN: 0.0.0.0:8090
      # 数据文件、backend 的平台 API 地址、对外 ID 的编码密钥、重启后自动续跑的窗口（秒）
      AGENT_DB_PATH: /data/agent.sqlite
      AGENT_BRIDGE_URL: http://backend:47001
      AGENT_ID_KEY: ${AGENT_ID_KEY:-id_key}
      AGENT_RESUME_WINDOW_SECONDS: ${AGENT_RESUME_WINDOW_SECONDS:-300}
      NODE_OPTIONS: --max-old-space-size=1536
    mem_limit: ${AGENT_MEM_LIMIT:-2g}
    volumes:
      # 会话、运行、审批、事件和对话历史：升级前 update.sh 会在线备份它，不要放网络盘
      - agent_data:/data
    expose:
      - "8090"
    # 收到停止信号时只关闭服务和数据库、不中止运行（下次启动按窗口续跑），25 秒内退出，留 5 秒余量
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://127.0.0.1:8090/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # 联网搜索（可选，默认不启动）：自己部署的元搜索，聚合多个搜索引擎，免费、不需要 API Key。
  #   1. 在 .env 里加一行 APP_AGENT_SEARXNG_URL=http://searxng:8080
  #   2. 在本目录执行 docker compose --profile search up -d
  # 只在 compose 内部网络提供服务，不对外开放端口；它需要访问外网。
  searxng:
    image: searxng/searxng:latest
    profiles: ["search"]
    restart: unless-stopped
    configs:
      - source: searxng_settings
        target: /etc/searxng/settings.yml
    expose:
      - "8080"

  # 后台「一键升级」的执行端，默认不启动。它挂载 docker.sock，等同服务器 root 权限，按需启用：
  #   1. 在 .env 里加一行 UPDATER_TOKEN=<随机字符串>（如 openssl rand -hex 32）
  #   2. 在本目录执行 docker compose --profile updater up -d
  # 它只执行镜像自带的 update.sh（备份 → 拉镜像 → 重建 → 等就绪 → 失败回退），只接受 backend 发来的版本号。
  # 升级时它自己不会被重建；要升级 updater 本身，在本目录再执行一次第 2 步。
  updater:
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_OWNER:-zaylora}/video-canvas-updater:${IMAGE_TAG:-latest}
    profiles: ["updater"]
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/deploy
      - updater_sock:/run/updater

configs:
  # SearXNG 的配置：json 格式必须打开，backend 靠它拿搜索结果；不限流（只在内部网络里被 backend 调用）
  searxng_settings:
    content: |
      use_default_settings: true
      server:
        secret_key: "${SEARXNG_SECRET:-video-canvas-searxng}"
        limiter: false
        image_proxy: false
      search:
        formats:
          - html
          - json

volumes:
  postgres_data:
  redis_data:
  backend_assets:
  agent_data:
  plugin_runner_sock:
  updater_sock:
