server:
  name: video-canvas
  mode: debug # debug | release | test
  port: 8080
  read_timeout: 10s
  write_timeout: 60s
  shutdown_timeout: 10s

log:
  level: debug # debug | info | warn | error
  format: console # console | json
  filename: "" # 为空只输出到控制台，例如 logs/app.log
  max_size: 100 # 单个日志文件大小（MB）
  max_backups: 7
  max_age: 30 # 保留天数

database:
  driver: postgres # sqlite | mysql | postgres
  # mysql 示例: root:123456@tcp(127.0.0.1:3306)/video_canvas?charset=utf8mb4&parseTime=True&loc=Local
  # postgres 示例: host=127.0.0.1 user=postgres password=root dbname=video_canvas port=5432 sslmode=disable TimeZone=Asia/Shanghai
  dsn: host=127.0.0.1 user=postgres password=root dbname=video_canvas port=5432 sslmode=disable TimeZone=Asia/Shanghai
  max_idle_conns: 10
  max_open_conns: 100
  conn_max_lifetime: 1h
  auto_migrate: true
  log_level: warn # silent | error | warn | info

redis:
  enabled: true # 关闭时缓存层自动降级为直查数据库
  addr: 127.0.0.1:6379
  password: ""
  db: 0

jwt:
  secret: "change-me-in-prod" # 生产环境务必用环境变量 APP_JWT_SECRET 覆盖，不要用配置文件里的明文值
  issuer: video-canvas
  expire_hours: 72

# 所有配置项都可以用环境变量覆盖，规则：APP_ + 大写路径，点换成下划线
# 例如 APP_SERVER_PORT=9000、APP_DATABASE_DSN=...、APP_JWT_SECRET=...
