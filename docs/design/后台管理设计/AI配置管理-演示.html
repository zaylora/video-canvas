  const c = (v) => `hsl(var(--${v}) / <alpha-value>)`;
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        fontFamily: {
          sans: ["Geist", "PingFang SC", "Microsoft YaHei", "system-ui", "sans-serif"],
          mono: ["Geist Mono", "SF Mono", "Consolas", "monospace"],
        },
        colors: {
          border: c("border"), input: c("input"), ring: c("ring"),
          background: c("background"), foreground: c("foreground"),
          primary: { DEFAULT: c("primary"), foreground: c("primary-foreground") },
          secondary: { DEFAULT: c("secondary"), foreground: c("secondary-foreground") },
          muted: { DEFAULT: c("muted"), foreground: c("muted-foreground") },
          accent: { DEFAULT: c("accent"), foreground: c("accent-foreground") },
          destructive: { DEFAULT: c("destructive"), foreground: c("destructive-foreground") },
          card: { DEFAULT: c("card"), foreground: c("card-foreground") },
          popover: { DEFAULT: c("popover"), foreground: c("popover-foreground") },
          sidebar: {
            DEFAULT: c("sidebar"), foreground: c("sidebar-foreground"),
            accent: c("sidebar-accent"), "accent-foreground": c("sidebar-accent-foreground"),
            border: c("sidebar-border"),
          },
        },
        borderColor: { DEFAULT: "hsl(var(--border))" },
        borderRadius: { xl: "calc(var(--radius) + 4px)", lg: "var(--radius)", md: "calc(var(--radius) - 2px)", sm: "calc(var(--radius) - 4px)" },

    },
  };

/** 价格文案：表格与预览共用 */
function priceSummary(m) {
  const p = m.price;
  if (p.billing === "token") return `<span class="tabular font-medium">${p.tin} / ${p.tout}</span> <span class="text-xs text-muted-foreground">积分·百万 Token（入/出）</span>`;
  if (p.billing === "per_second") return `<span class="tabular font-medium">${p.perSec}</span> <span class="text-xs text-muted-foreground">积分/秒</span>`;
  return `<span class="tabular font-medium">${p.unit || 0}</span> <span class="text-xs text-muted-foreground">积分/次</span>${p.tiers.filter((t) => t.on).length ? `<span class="ml-1 text-xs text-muted-foreground">起</span>` : ""}`;
}
/** 给定一组参数，算出用户实际消耗的积分（先匹配启用的规格价，再回落到默认价） */
function priceFor(price, combo) {
  const tier = price.tiers.find((t) => t.on && Object.entries(t.cond).every(([k, v]) => v === "*" || String(combo[k]) === String(v)));
  const unit = tier ? tier.unit : price.unit;
  if (price.billing === "per_second") return (tier ? tier.unit : price.perSec) * Number(combo.duration || 1);
  return unit;
}
function versionBadges(m, compact = false) {
  const out = [];
  if (m.pub) out.push(badge("emerald", dot("emerald") + (compact ? `v${m.pub}` : `已发布 v${m.pub}`)));

  if (m.draft) out.push(badge("sky", compact ? `草稿 v${m.draft}` : `草稿 v${m.draft} 待发布`));
  return out.join("");
}
/** 发布前检查：对齐 publishBlockReason，并补上表单层面能看懂的缺项 */
function checksOf(m) {
  const out = [];
  const ch = channel(m.channel);
  if (!m.label) out.push(["basic", "填写展示名称"]);
  if (!m.channel) out.push(["basic", "选择所属渠道"]);

  return out;
}

  document.body.classList.remove("sb-mobile"); $("#sb-scrim").classList.add("hidden");
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; ks.slice(0, -1).forEach((k) => (o = o[k])); o[ks[ks.length - 1]] = val; }
function addTag(v) { v = v.trim().slice(0, 12); if (!v || E.m.tags.includes(v) || E.m.tags.length >= 5) return; E.m.tags.push(v); E.dirty = true; renderModalBody(); $("#mm-tag-in")?.focus(); }
function modalRefresh() { E.dirty = true; renderModalBody(); }
function commitModel(publish) {
  const m = E.m;
  if (E.isNew) { if (!m.key) { toast("请填写产品模型标识", "", "amber"); E.tab = "basic"; renderModal(); return false; } MODELS.unshift(m); }
  else Object.assign(model(m.key), m);
  const t = model(m.key);
  t.credits = t.price.unit;
  t.draft = (t.draft || t.pub || 0) + (t.draft ? 0 : 1);
  if (publish) { t.pub = t.draft; t.draft = null; }
  closeModel(true); render();
  toast(publish ? `已发布 v${t.pub}` : `草稿 v${t.draft} 已保存`, publish ? (t.enabled ? "画布里的新任务立即使用这个版本。" : "还没上架，打开“在画布中上架”后用户才能看到。") : "测试通过后可以发布。");
  return true;
}

/* ================================================================== 事件 */
const ACT = {
  go: (v) => go(v),
  toast: (v) => toast(v),
  "sb-toggle": () => {
    if (innerWidth < 1024) { document.body.classList.toggle("sb-mobile"); $("#sb-scrim").classList.toggle("hidden"); }
    else document.body.classList.toggle("sb-collapsed");
  },
  theme: () => { const d = document.documentElement.classList.toggle("dark"); try { localStorage.setItem("vc-admin-theme", d ? "dark" : "light"); } catch (e) {} },
  "user-menu": (_, el) => openMenu(el, () => `<div class="px-2 py-1.5 text-xs font-medium text-muted-foreground">演示：切换角色查看权限差异</div>
    ${mitem("role", S.role === "super_admin" ? "circle-check" : "circle", "超级管理员（运维）", "super_admin")}
    ${mitem("role", S.role === "admin" ? "circle-check" : "circle", "管理员（运营）", "admin")}${sep}${mitem("toast", "log-out", "退出登录", "已退出（演示）")}`, "start"),
  role: (v) => { S.role = v; render(); toast(v === "super_admin" ? "以超级管理员查看" : "以管理员查看", v === "admin" ? "插件、渠道变为只读；模型仍可编辑、测试、发布。" : ""); },
  copy: (v) => { try { navigator.clipboard.writeText(v); } catch (e) {} toast("已复制", v); },
  "layer-close": () => closeLayer(),
  saved: (v) => { closeLayer(); toast(v); },

  // 渠道
  "ch-select": (v) => { S.ch = v; S.chModelKinds.clear(); render(); },
  "ch-kind": (v) => { S.chModelKinds.clear(); if (v !== "all") S.chModelKinds.add(v); render(); },
  "ch-new": () => channelSheet(true),
  "ch-edit": () => channelSheet(false),
  "ch-key": () => keyDialog(),
  "key-save": () => { const ch = channel(S.ch); ch.secret_set = true; ch.check = null; closeLayer(); render(); toast("Key 已保存", "下一步可以做连通性检查。"); },
  "ch-more": (_, el) => { const ch = channel(S.ch); openMenu(el, () => `${mitem("ch-key", "key-round", ch.secret_set ? "更新 Key" : "设置 Key")}${sep}${mitem("ch-toggle", ch.enabled ? "pause" : "play", ch.enabled ? "停用渠道" : "启用渠道", "", ch.enabled ? "text-red-600 dark:text-red-400" : "")}`); },
  "ch-toggle": () => { const ch = channel(S.ch); ch.enabled = !ch.enabled; render(); toast(ch.enabled ? "渠道已启用" : "渠道已停用", ch.enabled ? "" : "使用它的模型不再接新任务，进行中的任务不受影响。"); },
  "ch-check": () => {
    const ch = channel(S.ch); ch.checking = true; ch.check = null; render();
    setTimeout(() => {
      ch.checking = false;
      ch.check = keyMissing(ch) ? { tone: "amber", icon: "key-round", title: "Key 未设置", msg: "设置 Key 后再检查。", action: ["ch-key", "设置 Key"] }
        : ch.plugin_key !== "newapi" ? { tone: "zinc", icon: "info", title: "插件不支持连通性检查", msg: "可以打开模型点“测试模型”验证。" }
        : { tone: "emerald", icon: "circle-check", title: "连通正常", msg: `HTTP 200 · ${180 + Math.floor(Math.random() * 300)} ms` };
      if (S.page === "channels") render();
    }, 900);
  },
  import: () => importDialog(),
  "imp-apply": () => {
    const picks = [...document.querySelectorAll(".imp:checked")];
    picks.forEach((x) => { const m = { key: x.value, label: x.value, kind: x.dataset.kind, channel: S.ch, up: x.value, credits: 0, deadline: x.dataset.kind === "text" ? "5m" : "30m", enabled: false, pub: null, draft: 1, desc: "", tags: [], logo: "zinc" }; m.cap = capTemplate(m.kind); m.price = priceTemplate(m); MODELS.unshift(m); });
    closeLayer(); S.mStatus = "todo"; S.mKind = "all"; S.mChannel = S.ch; go("models");
    toast(`已导入 ${picks.length} 个草稿`, "已筛出待处理的模型，补齐价格后即可测试、发布。");
  },
  "open-channel": (v) => { S.ch = v; go("channels"); },
  "go-plugin": (v) => { S.p = v; go("plugins"); },

  // 模型列表
  "m-fkind": (v) => { S.mKind = v; render(); },
  "m-new": (v) => openModel(null, v),
  "m-edit": (v) => openModel(v),
  "row-shelf": (v, el) => { if (el.disabled) return; const m = model(v); m.enabled = !m.enabled; render(); toast(m.enabled ? `${m.label} 已上架` : `${m.label} 已下架`, m.enabled ? "画布里立即可见。" : "画布里不再显示，已发起的任务不受影响。"); },
  "m-more": (v, el) => { const m = model(v); const revs = []; for (let r = m.pub || 0; r >= 1; r--) revs.push(r);
    openMenu(el, () => `${mitem("m-test-row", "flask-conical", "测试模型", v)}${sep}<div class="px-2 py-1.5 text-xs font-medium text-muted-foreground">版本历史</div>
      ${m.draft ? `<div class="${ITEM}"><span class="w-8 font-mono">v${m.draft}</span>${badge("sky", "草稿")}</div>` : ""}
      ${revs.map((r) => r === m.pub ? `<div class="${ITEM}"><span class="w-8 font-mono">v${r}</span>${badge("emerald", "线上")}</div>` : `<button data-act="rollback" data-v="${v}|${r}" class="${ITEM}"><span class="w-8 font-mono">v${r}</span>${badge("zinc", "已归档")}<span class="ml-auto text-xs text-muted-foreground">回滚</span></button>`).join("") || `<div class="px-2 py-2 text-sm text-muted-foreground">还没有发布过</div>`}`); },
  "m-test-row": (v) => { openModel(v); openTest(); },
  rollback: (v) => { const [k, r] = v.split("|"); const m = model(k);
    openDialog({ title: `把 ${esc(m.label)} 回滚到 v${r}？`, desc: `会用 v${r} 的配置重新发布为 v${(m.draft || m.pub) + 1}，当前线上版本归档。进行中的任务不受影响。`, footer: `${cancelBtn()}<button data-act="saved" data-v="已回滚到 v${r}" class="${PRIMARY} h-9 px-4 text-sm">回滚</button>` }); },

  // 模型弹窗
  "mm-close": () => closeModel(),
  "mm-tab": (v) => { E.tab = v; renderModal(); },
  "mm-logo": (v) => { E.m.logo = v; modalRefresh(); },
  "mm-tag-del": (v) => { E.m.tags.splice(+v, 1); modalRefresh(); },
  "mm-kind": (v) => { if (v === E.m.kind) return; E.m.kind = v; E.m.cap = capTemplate(v); E.m.price.tiers = []; E.m.price.billing = v === "text" ? "token" : "per_call"; const ch = channel(E.m.channel); if (ch && !supportsKind(ch, v)) E.m.channel = ""; E.kindChanged = true; modalRefresh(); },
  "mm-channel": (v) => { E.m.channel = v; modalRefresh(); },
  "mm-deadline": (v) => { E.m.deadline = v; modalRefresh(); },
  "mm-op": (v) => { const o = E.m.cap.ops; o.includes(v) ? o.splice(o.indexOf(v), 1) : o.push(v); modalRefresh(); },
  "mm-ref": (v) => { const r = E.m.cap.refs[+v]; r.on = !r.on; modalRefresh(); },
  "mm-bool": (v) => { const o = E.m.cap.opts[+v]; o.on = !o.on; modalRefresh(); },
  "mm-open": (v) => { const o = E.m.cap.opts[+v]; o.open = !o.open; modalRefresh(); },
  "mm-chip": (v) => { const [i, val] = v.split("|"); const o = E.m.cap.opts[+i];
    if (o.sel.includes(val)) { if (o.sel.length === 1) return toast("至少保留一个可选值", "", "amber"); o.sel = o.sel.filter((x) => x !== val); if (o.def === val) o.def = o.sel[0]; }
    else o.sel = o.all.filter((x) => o.sel.includes(x) || x === val);
    modalRefresh(); },
  "mm-def": (v) => { const [i, val] = v.split("|"); E.m.cap.opts[+i].def = val; modalRefresh(); },
  "mm-billing": (v, el) => { if (el.disabled) return; E.m.price.billing = v; if (v === "token") E.m.price.tiers = []; modalRefresh(); },
  "mm-cost": () => { E.m.price.costOn = !E.m.price.costOn; modalRefresh(); },
  "mm-tier-add": () => { const cond = {}; E.m.cap.opts.filter((o) => o.spec).forEach((o) => (cond[o.k] = "*")); E.m.price.tiers.push({ on: true, cond, unit: E.m.price.billing === "per_second" ? E.m.price.perSec : E.m.price.unit }); modalRefresh(); },
  "mm-tier-del": (v) => { E.m.price.tiers.splice(+v, 1); modalRefresh(); },
  "mm-tier-on": (v) => { const t = E.m.price.tiers[+v]; t.on = !t.on; modalRefresh(); },
  "mm-tier-cond": (v) => { const [i, k, val] = v.split("|"); E.m.price.tiers[+i].cond[k] = val; modalRefresh(); },
  "mm-shelf": (_, el) => { if (el.disabled) return; E.m.enabled = !E.m.enabled; el.setAttribute("aria-checked", E.m.enabled); E.dirty = true; },
  "mm-test": () => openTest(),
  "test-go": (_, el) => { el.disabled = true; runTest(); },
  "mm-save": () => commitModel(false),
  "mm-publish": (_, el) => { if (el.disabled) return; const m = E.m, ch = channel(m.channel), pl = plugin(ch.plugin_key);
    openDialog({ title: `发布 ${esc(m.label)}？`, desc: "发布后新任务立即使用这份配置；进行中的任务按原版本跑完。可以随时回滚。",
      body: `<dl class="grid grid-cols-[6rem_1fr] gap-x-3 gap-y-2 rounded-lg border p-4 text-sm">
        <dt class="text-muted-foreground">渠道</dt><dd>${esc(ch.name)}</dd>
        <dt class="text-muted-foreground">插件版本</dt><dd>${pl.name} <span class="font-mono text-xs text-muted-foreground">v${ch.plugin_version} · ${verSha(ch)}</span></dd>
        <dt class="text-muted-foreground">上游模型</dt><dd class="font-mono text-xs">${esc(m.up)}</dd>
        <dt class="text-muted-foreground">价格</dt><dd>${priceSummary(m)}</dd>
        <dt class="text-muted-foreground">版本</dt><dd>${m.pub ? `v${m.pub} → ` : ""}<span class="font-medium">v${(m.draft || m.pub || 0) + (m.draft ? 0 : 1)}</span></dd></dl>`,
      footer: `${cancelBtn()}<button data-act="publish-ok" class="${PRIMARY} h-9 px-4 text-sm">${I("rocket", "size-4")}发布</button>` }); },
  "publish-ok": () => { closeLayer(); commitModel(true); },

  // 插件
  "p-select": (v) => { S.p = v; render(); },
  "p-toggle": (_, el) => { if (el.disabled) return; const p = plugin(S.p);
    if (p.enabled) openDialog({ title: `停用插件 ${p.name}？`, desc: `${CHANNELS.filter((c) => c.plugin_key === p.key).length} 个渠道在用。停用后这些渠道不再接新任务，进行中的任务不受影响。`, footer: `${cancelBtn()}${dangerBtn("p-off", "", "停用")}` });
    else { p.enabled = true; render(); toast("插件已启用"); } },
  "p-off": () => { plugin(S.p).enabled = false; closeLayer(); render(); toast("插件已停用"); },
  "v-del": (v) => openDialog({ title: `删除版本 v${v}？`, desc: "删除后不能恢复。若还有未结束的任务引用这个版本，后端会拒绝删除，原因会显示在这里。", footer: `${cancelBtn()}${dangerBtn("saved", `已删除 v${v}`, "删除")}` }),
  upload: () => uploadDialog(),
  "upload-pick": () => {
    const box = $("#up-result");
    box.innerHTML = `<div class="flex items-center gap-2 rounded-lg border px-3 py-2 text-sm">${I("file-code-2", "size-4")}<span class="font-mono">kling.js</span><span class="text-muted-foreground">18.4KB</span><span class="ml-auto inline-flex items-center gap-1.5 text-xs text-muted-foreground">${I("loader-circle", "size-3.5 animate-spin")}预检中…</span></div>`; icons();
    setTimeout(() => {
      box.innerHTML = window.__upOk
        ? `<div class="space-y-3 rounded-lg border p-4 ${TONE.emerald}"><div class="flex items-center gap-2 font-medium">${I("circle-check", "size-4")}已登记 可灵 v0.3.1</div>
            <button data-act="next-channel" data-v="kling" class="${PRIMARY} h-8 px-3 text-xs">下一步：新建渠道${I("arrow-right", "size-3.5")}</button></div>`
        : `<div class="space-y-2"><div class="flex items-center gap-2 text-sm font-medium text-red-600 dark:text-red-400">${I("circle-x", "size-4")}预检未通过，文件没有登记</div>
            <div class="divide-y rounded-lg border">${[["视频生成", "声明了异步视频，但没有实现“查询进度”这一步"], ["版本号", "版本号 0.3.0 已经存在，请改成新版本号"]].map(([p, m]) => `<div class="px-3 py-2"><div class="text-xs font-medium text-red-600 dark:text-red-400">${p}</div><div class="text-sm">${m}</div></div>`).join("")}</div>
            <p class="text-xs text-muted-foreground">改完文件后重新选择即可（演示：再点一次上方区域会通过）。</p></div>`;
      window.__upOk = true; icons();
    }, 900);
  },
  "next-channel": (v) => { closeLayer(); go("channels"); channelSheet(true, v); },
};

document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]");
  if (menu && !menu.el.contains(e.target)) { const same = t && t === menu.anchor; closeMenu(); if (same) return; }
  if (!t) {
    // 表单里的普通开关：本地切换；带确认的开关额外展开确认框
    const s = e.target.closest('[role="switch"]');
    if (s && !s.disabled) {
      const on = s.getAttribute("aria-checked") !== "true"; s.setAttribute("aria-checked", on);
      if (s.dataset.confirm === "internal") { const box = $("#confirm-internal"); box.classList.toggle("hidden", !on); box.classList.toggle("flex", on); }
    }
    return;
  }
  // 表格行本身可点击；行内的开关和按钮只做自己的事
  if (t.tagName === "TR" && e.target.closest("[data-stop], button")) return;
  e.preventDefault();
  const fn = ACT[t.dataset.act];
  if (fn) fn(t.dataset.v, t);
  if (menu && menu.el.contains(t)) closeMenu();
});
document.addEventListener("input", (e) => {
  const el = e.target;
  if (!E || !el.dataset.bind) return;
  const v = el.type === "number" ? (el.value === "" ? null : parseFloat(el.value)) : el.value;
  setPath(E, el.dataset.bind, v); E.dirty = true;
  if (el.dataset.bind === "m.desc") $("#mm-desc-count").textContent = `${v.length} / 500`;
  renderModalPreview(); renderChecks();
});
document.addEventListener("change", (e) => { if (E && e.target.hasAttribute("data-rerender")) renderModalBody(); });
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (menu) closeMenu(); else if ($("#layer")) closeLayer(); else if (E) closeModel(); } });
addEventListener("resize", () => closeMenu());

try { if (localStorage.getItem("vc-admin-theme") === "light") document.documentElement.classList.remove("dark"); } catch (e) {}
const h = location.hash.slice(1); if (["models", "channels", "plugins"].includes(h)) S.page = h;
render();
</script>
</body>
</html>
