<script>
/* ================================================================== 基础小件 */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const seg = (opts, val, act, extra = "") => `<div class="inline-flex gap-0.5 rounded-lg bg-muted p-0.5 text-xs ${extra}">${opts.map(([v, l, dis]) => `<button data-act="${act}" data-v="${v}" ${dis ? `disabled title="${esc(dis)}"` : ""} class="rounded-md px-3 py-1.5 font-medium disabled:cursor-not-allowed disabled:opacity-40 ${String(val) === String(v) ? "bg-background text-foreground shadow-sm" : "text-muted-foreground hover:text-foreground"}">${l}</button>`).join("")}</div>`;
const chip = (on, label, act, v, extra = "") => `<button data-act="${act}" data-v="${v}" class="inline-flex h-8 items-center gap-1.5 rounded-md border px-3 text-xs font-medium transition ${on ? "border-foreground/80 bg-foreground text-background" : "border-input bg-background text-muted-foreground hover:text-foreground"} ${extra}">${on ? I("check", "size-3.5") : ""}${label}</button>`;
const help = (t) => `<span class="group relative inline-flex">${I("circle-help", "size-3.5 text-muted-foreground")}<span class="pointer-events-none absolute bottom-full left-1/2 z-10 mb-1.5 hidden w-60 -translate-x-1/2 rounded-md border bg-popover px-2.5 py-2 text-xs font-normal leading-relaxed text-popover-foreground shadow-md group-hover:block">${t}</span></span>`;
const fld = (label, control, hint = "", req = false, tip = "") => `<div class="space-y-2"><label class="flex items-center gap-1.5 text-sm font-medium leading-none">${req ? '<span class="text-red-500">*</span>' : ""}${label}${tip ? help(tip) : ""}</label>${control}${hint ? `<div class="text-[0.8rem] leading-relaxed text-muted-foreground">${hint}</div>` : ""}</div>`;
const PHASE = { 1: ["sky", "一期"], 2: ["violet", "二期"], 3: ["amber", "三期"] };
const pb = (n) => `<span class="ml-1.5 rounded border px-1 py-px text-[10px] font-medium ${TONE[PHASE[n][0]]}">${PHASE[n][1]}</span>`;
const block = (title, phase, desc, inner) => `<section class="mb-7 last:mb-0"><div class="mb-3 flex flex-wrap items-baseline gap-x-2"><h3 class="flex items-center text-sm font-semibold">${title}${phase ? pb(phase) : ""}</h3>${desc ? `<p class="text-xs text-muted-foreground">${desc}</p>` : ""}</div>${inner}</section>`;
const numIn = (path, val, attrs = "") => `<input type="number" data-bind="${path}" data-t="num" value="${val ?? ""}" class="${INPUT} tabular" ${attrs}>`;
const toast = (msg) => { const el = document.createElement("div"); el.className = "toast-in pointer-events-auto rounded-lg border bg-popover px-3 py-2 text-sm shadow-lg"; el.textContent = msg; $("#toasts").appendChild(el); setTimeout(() => el.remove(), 2600); };
const getp = (o, p) => p.split(".").reduce((a, k) => (a == null ? a : a[k]), o);
const setp = (o, p, v) => { const ks = p.split("."); const last = ks.pop(); const t = ks.reduce((a, k) => a[k], o); t[last] = v; };

/* ================================================================== 厂商 logo（lobe-icons 静态包，版本固定） */
const ICON_BASE = "https://cdn.jsdelivr.net/npm/@lobehub/icons-static-svg@1.95.1/icons/";
// [slug, 名称, 是否有彩色版]（slug 已对照 1.95.1 文件清单核对）
const VENDORS = [
  ["kling", "可灵", 1], ["jimeng", "即梦", 1], ["doubao", "豆包", 1], ["hailuo", "海螺", 1], ["vidu", "Vidu", 1], ["runway", "Runway", 0], ["luma", "Luma", 1], ["pika", "Pika", 0],
  ["pixverse", "PixVerse", 1], ["sora", "Sora", 1], ["midjourney", "Midjourney", 0], ["flux", "Flux", 0], ["stability", "Stability", 1], ["ideogram", "Ideogram", 0], ["recraft", "Recraft", 0], ["nanobanana", "Nano Banana", 1],
  ["openai", "OpenAI", 0], ["claude", "Claude", 1], ["gemini", "Gemini", 1], ["deepseek", "DeepSeek", 1], ["qwen", "通义千问", 1], ["kimi", "Kimi", 1], ["zhipu", "智谱", 1], ["minimax", "MiniMax", 1],
  ["hunyuan", "混元", 1], ["wenxin", "文心", 1], ["spark", "讯飞星火", 1], ["grok", "Grok", 0], ["mistral", "Mistral", 1], ["meta", "Meta", 1], ["suno", "Suno", 0], ["elevenlabs", "ElevenLabs", 0],
  ["volcengine", "火山引擎", 1], ["bytedance", "字节跳动", 1], ["alibaba", "阿里巴巴", 1], ["tencent", "腾讯", 1], ["baidu", "百度", 1], ["newapi", "New API", 1], ["openrouter", "OpenRouter", 1], ["comfyui", "ComfyUI", 1],
];
const VMAP = Object.fromEntries(VENDORS.map(([s, n, c]) => [s, { slug: s, name: n, color: !!c }]));
const GRADS = ["from-amber-400 to-orange-600", "from-sky-400 to-blue-600", "from-emerald-400 to-teal-600", "from-violet-400 to-purple-600", "from-rose-400 to-pink-600"];
const initialOf = (name) => (String(name || "?").replace(/[（(].*$/, "").trim().slice(0, 1).toUpperCase() || "?");
/** 有 vendor 用厂商 logo（白底圆角方块，亮暗主题一致）；没选或加载失败回退首字渐变头像 */
const avatar = (m, size = "size-9", text = "text-sm") => {
  const g = GRADS[[...(m.key || m.label || "?")].reduce((s, c) => s + c.charCodeAt(0), 0) % GRADS.length];
  const v = VMAP[m.vendor];
  const base = `relative grid ${size} shrink-0 place-items-center overflow-hidden rounded-lg shadow-sm`;
  const init = `<span class="${text} font-semibold text-white">${esc(initialOf(m.label))}</span>`;
  if (!v) return `<span class="${base} bg-gradient-to-br ${g}">${init}</span>`;
  const url = `${ICON_BASE}${v.slug}${v.color ? "-color" : ""}.svg`;
  return `<span class="${base} bg-gradient-to-br ${g}">${init}<img src="${url}" alt="${esc(v.name)}" loading="lazy" onerror="this.remove()" class="absolute inset-0 size-full rounded-lg border bg-white object-contain p-[17%]"></span>`;
};

/* ================================================================== 模型数据（能力由运营在后台手填；插件只负责对接平台，不声明能力） */
const RATIOS = ["Auto", "16:9", "4:3", "1:1", "3:4", "9:16", "21:9"];
/** 后端校验用的固定上下限（防手误，不是某个平台的真实上限；参考了影策的取值）。运营在这个范围内自己填 */
const HARD = { refMax: 50, refMb: 500, durationMax: 3600, ctxWindow: 10000000, ctxOutMin: 256, ctxOutMax: 1000000 };
/** 新增可选值时的常用预设（只是快捷按钮，运营也可以自己输入别的值） */
const PRESETS = { ratio: RATIOS, resolution: { video: ["480P", "720P", "1080P", "2K", "4K"], image: ["1K", "2K", "4K"] }, count: [1, 2, 4, 8] };
const OPS = { t2v: "文生视频", i2v: "图生视频", omni: "全能参考", t2i: "文生图", i2i: "图生图" };
const OPS_OF = { video: ["t2v", "i2v", "omni"], image: ["t2i", "i2i"] };
const KIND_META = { video: ["sky", "视频", "clapperboard"], image: ["violet", "图片", "image"], text: ["emerald", "文本", "type"], audio: ["amber", "音频", "audio-lines"] };
const MEDIA = { image: ["图片", "image"], audio: ["音频", "audio-lines"], video: ["视频", "film"] };
/** 各生成方式能引用哪些素材：文生不引用；图生只引用图片；全能参考不区分类型，已开启的素材都可以引用（连什么上游节点就是什么） */
function allowedMedia(m, op) {
  const refs = m.capabilities.refs;
  if (!refs || !op) return [];
  const on = Object.keys(refs).filter((k) => refs[k].on && refs[k].max > 0);
  if (op === "t2v" || op === "t2i") return [];
  if (op === "i2v" || op === "i2i") return on.filter((k) => k === "image");
  return on;
}
const DUR = [["5m", "5 分钟"], ["10m", "10 分钟"], ["20m", "20 分钟"], ["30m", "30 分钟"], ["60m", "60 分钟"]];

const MODELS = {
  video: {
    key: "kling-v2-master", kind: "video", label: "可灵 2.0 大师版", vendor: "kling", tags: ["推荐", "带音轨"],
    hint: "支持文生、图生与全能参考，时长可调。", deadline: "30m", sort: 100, up: "kling-v2-master", enabled: true, channel: "newapi-main",
    capabilities: {
      ops: ["t2v", "i2v", "omni"],
      refs: { image: { on: true, max: 4, mb: 10 }, audio: { on: true, max: 1, mb: 15 }, video: { on: true, max: 1, mb: 100 } },
      prompt: { max_length: 2000 },
      params: {
        ratio: { type: "enum", label: "比例", open: true, options: [...RATIOS], default: "Auto" },
        resolution: { type: "enum", label: "清晰度", open: true, options: ["720P", "1080P", "4K"], default: "720P", spec: true },
        duration: { type: "number", label: "视频时长", open: true, min: 4, max: 12, default: 5, step: 1, unit: "秒" },
        audio: { type: "boolean", label: "生成音频", open: true, default: true, spec: true },
        count: { type: "enum", label: "生成数量", open: true, options: [1, 2, 4], default: 1, fanout: true, unit: "个" },
      },
    },
    pricing: {
      billing: "per_second", unit: 10, per_second: 2, token: { in: 300, out: 1200 },
      tiers: [{ on: true, when: { audio: "true" }, unit: 3 }, { on: true, when: { resolution: "1080P" }, unit: 4 }, { on: true, when: { resolution: "1080P", audio: "true" }, unit: 5 }, { on: true, when: { resolution: "4K" }, unit: 8 }, { on: true, when: { ref_video: "true" }, unit: 2 }, { on: true, when: { audio: "true", ref_video: "true" }, unit: 3 }],
      cost: { on: true, unit: 6, per_second: 1, in: 100, out: 400 },
    },
  },
  image: {
    key: "jimeng-image-3", kind: "image", label: "即梦 图片 3.0", vendor: "jimeng", tags: ["推荐"],
    hint: "文生图与图生图，支持 1K / 2K / 4K，档位不同价格不同。", deadline: "10m", sort: 100, up: "jimeng-image-3.0", enabled: true, channel: "newapi-main",
    capabilities: {
      ops: ["t2i", "i2i"],
      refs: { image: { on: true, max: 4, mb: 10 }, audio: { on: false, max: 0, mb: 0 }, video: { on: false, max: 0, mb: 0 } },
      prompt: { max_length: 1500 },
      params: {
        ratio: { type: "enum", label: "比例", open: true, options: ["Auto", "1:1", "16:9", "9:16", "4:3", "3:4"], default: "1:1" },
        resolution: { type: "enum", label: "清晰度", open: true, options: ["1K", "2K", "4K"], default: "1K", spec: true },
        count: { type: "enum", label: "生成数量", open: true, options: [1, 2, 4], default: 1, fanout: true, unit: "张" },
      },
    },
    pricing: {
      billing: "per_call", unit: 4, per_second: 0, token: { in: 300, out: 1200 },
      tiers: [{ on: true, when: { resolution: "2K" }, unit: 8 }, { on: true, when: { resolution: "4K" }, unit: 16 }],
      cost: { on: true, unit: 2, per_second: 0, in: 0, out: 0 },
    },
  },
  text: {
    key: "deepseek-chat", kind: "text", label: "DeepSeek 对话", vendor: "deepseek", tags: ["性价比"],
    hint: "通用对话与写作，支持长上下文。", deadline: "5m", sort: 100, up: "deepseek-chat", enabled: true, channel: "newapi-main",
    capabilities: {
      prompt: { max_length: 8000 }, context: { window: 128000, output: 8192 }, system: "你是一名资深分镜师，回答使用中文。",
      params: {},
    },
    pricing: { billing: "token", unit: 1, per_second: 0, token: { in: 300, out: 1200 }, tiers: [], cost: { on: false, unit: 0, per_second: 0, in: 120, out: 480 } },
  },
};
const OTHERS = {
  video: [{ label: "即梦 视频 3.0", vendor: "jimeng", price: "1.5 积分/秒起", tags: ["快"], hint: "适合快速出草稿。" }, { label: "Runway Gen-4", vendor: "runway", price: "5 积分/秒", tags: [], hint: "" }],
  image: [{ label: "GPT Image 1", vendor: "openai", price: "6 积分起", tags: [], hint: "文字渲染更稳。" }, { label: "Flux Pro", vendor: "flux", price: "3 积分", tags: ["快"], hint: "" }],
  text: [{ label: "GPT-4.1", vendor: "openai", price: "按 Token", tags: [], hint: "长文本理解更稳。" }, { label: "Kimi K2", vendor: "kimi", price: "按 Token", tags: ["长上下文"], hint: "" }],
};

/* ================================================================== 状态 */
const S = {
  scene: "admin", preset: "video", tab: "basic", vpOpen: false, vq: "", view: "admin",
  canvas: { op: "i2v", params: {}, img: false, aud: false, vid: false, failN: 0, lowK: 0, stage: 2 },
  calc: { chars: 1000, maxOut: 8192, uin: 1200, uout: 3000, noUsage: false, fail: false },
};
const M = () => MODELS[S.preset];
const fix = (n) => (Math.round(n * 100) / 100).toString();

/** 画布选择与当前模型对齐：方式必须在 ops 里，参数值必须在可选值里 */
function syncCanvas() {
  const m = M(), cs = S.canvas, cap = m.capabilities;
  if (cap.ops) { if (!cap.ops.includes(cs.op)) cs.op = cap.ops[0] || null; } else cs.op = null;
  for (const [k, p] of Object.entries(cap.params)) {
    if (!p.open) { delete cs.params[k]; continue; }
    if (p.type === "enum" && !p.options.some((o) => String(o) === String(cs.params[k]))) cs.params[k] = p.default;
    if (p.type === "number") { const v = cs.params[k]; if (v == null || v < p.min || v > p.max) cs.params[k] = Math.min(p.max, Math.max(p.min, p.default)); }
    if (p.type === "boolean" && cs.params[k] == null) cs.params[k] = p.default;

function limCheck(path) {

  const pr = m.pricing;

}
const refBar = (k) => { const r = M().capabilities.refs[k]; return Array.from({ length: 12 }, (_, j) => `<span class="h-1.5 flex-1 rounded-full ${r.on && j < Math.min(r.max, 12) ? "bg-foreground/70" : "bg-muted"}"></span>`).join(""); };

function paramRow(k) {

  return `<div class="space-y-3 p-4 ${p.open ? "" : "bg-muted/20"}">${head}${p.open ? "" : `<div class="text-[11px] text-muted-foreground">未开放：不出现在画布节点上，按默认值发送给上游。</div>`}${body}</div>`;

function priceForm() {

    : fld(pr.billing === "per_second" ? "每秒消耗积分" : "每次消耗积分", unitIn(pr.billing === "per_second" ? "pricing.per_second" : "pricing.unit", pr.billing === "per_second" ? pr.per_second : pr.unit, unitTxt), "价格是整数积分，最小 1 积分，不能带小数。", true);

    : fld(pr.billing === "per_second" ? "每秒成本" : "每次成本", unitIn(pr.billing === "per_second" ? "pricing.cost.per_second" : "pricing.cost.unit", pr.billing === "per_second" ? pr.cost.per_second : pr.cost.unit, "积分"));

    }).join("")
      + (cap.refs && cap.refs.video.on ? chips("ref_video", "参考素材里有视频", [["true", "有"], ["false", "没有"]]) : "")

  };
  const tiers = pr.tiers.map((t, i) => `<div class="rounded-xl border ${t.on ? "" : "opacity-60"}">
    <div class="flex flex-wrap items-center gap-3 border-b px-4 py-3"><span class="grid size-8 place-items-center rounded-md bg-muted font-mono text-xs">${String(i + 2).padStart(2, "0")}</span><div><div class="text-sm font-semibold">规格价格</div><div class="text-xs text-muted-foreground">满足下面所有条件时使用这个价格</div></div>
      <label class="ml-auto flex items-center gap-2 text-xs text-muted-foreground">可供用户使用${sw(t.on, `data-act="tier-on" data-v="${i}"`)}</label>
      <button data-act="tier-del" data-v="${i}" class="${GHOST} h-8 px-2 text-xs text-red-600 dark:text-red-400">${I("trash-2", "size-3.5")}删除</button></div>
    <div class="space-y-4 p-4">${condRow(i, t)}

      <div class="flex flex-wrap gap-2" id="tmargin-${i}">${tierMargin(i)}</div>
    </div></div>`).join("");
  const noTier = pr.billing === "token";

      <div class="space-y-4 p-4">${fld("计费方式", seg(bill, pr.billing, "billing"), pr.billing === "per_second" ? "按用户拖动的视频时长 × 每秒价格计算。视频模型大多按秒计费。" : pr.billing === "token" ? "下单按上限预冻结，完成后按实际用量多退少补。" : "每生成一次扣一次。图片模型一般按次。", true)}${main}${costBlock}</div></div>
    <div class="mt-4 space-y-4">${tiers}

function marginsHtml() {
  const m = M(), pr = m.pricing;
  if (pr.billing === "token") return marginBadge(marginOf(pr.token.out, pr.cost.out)) + `<span class="text-xs text-muted-foreground">（按输出价计算）</span>`;
  const [price, cost] = costPair(pr, m, null);
  return marginBadge(marginOf(price, cost)) + `<span class="text-xs text-muted-foreground">（默认价格）</span>`;
}
/** 当前计费方式下的 [用户价, 成本]；tier 不为空时用规格价作为用户价 */
function costPair(pr, m, tier) {
  if (pr.billing === "per_second") return [tier ? tier.unit : pr.per_second, pr.cost.per_second];
  return [tier ? tier.unit : pr.unit, pr.cost.unit];
}
function tierMargin(i) {
  const m = M(), pr = m.pricing; if (!pr.cost.on) return "";
  const [price, cost] = costPair(pr, m, pr.tiers[i]);
  return marginBadge(marginOf(price, cost)) + `<span class="text-xs text-muted-foreground">（本条规格价格）</span>`;
}

function fanoutPanel(q, km) {
  if (q.n <= 1) return "";
  const cs = S.canvas, cap = M().capabilities, allowed = allowedMedia(M(), cs.op), fail = cs.failN, low = cs.lowK;
  const ups = [];
  if (cap.refs && cs.img && allowed.includes("image")) ups.push(["image", "图片节点"]);
  if (cap.refs && cs.aud && allowed.includes("audio")) ups.push(["audio-lines", "音频节点"]);
  if (cap.refs && cs.vid && allowed.includes("video")) ups.push(["film", "视频节点"]);
  const same = ["提示词", "模型", "参数", "生成方式", ups.length ? "引用的素材" : null].filter(Boolean).join("、");
  const created = cs.stage === 1 ? 0 : low ? Math.min(q.n, low) : q.n;
  const refunded = cs.stage === 1 || !fail || fail > created ? 0 : q.one;
  const state = (i) => {
    if (cs.stage === 1) return ["", `${I("loader-circle", "inline size-3 animate-spin")} 提交中…`];
    if (low && i > low) return [TONE.red, "积分不足，无法生成 · 没有冻结"];
    if (fail === i) return [TONE.red, `生成失败（上游返回错误）· 已退回 ${q.one}`];
    return ["", `生成中 · 冻结 ${q.one}`];
  };

    <p class="mb-3 text-xs leading-relaxed text-muted-foreground">像「复制节点」一样：<b>点发送的瞬间</b> ${q.n} 个节点就已经在画布上了（原节点 + ${q.n - 1} 个副本）。副本的${same}都和原节点一样，并且连着<b>同样的上游节点</b>；只有生成结果不复制。<b>哪个节点失败，就哪个节点显示它自己的错误；失败的节点不会被删掉</b>，和单个节点失败一样。</p>
    <div class="flex items-stretch gap-3">

      <div class="flex shrink-0 flex-col justify-center text-muted-foreground">${I("chevrons-right", "size-5")}</div>
      <div class="grid flex-1 gap-2" style="grid-template-columns:repeat(${Math.min(q.n, 2)},minmax(0,1fr))">${Array.from({ length: q.n }, (_, i) => { const [tone, txt] = state(i + 1); return `<div class="rounded-lg border p-2.5 text-xs ${tone}"><div class="flex items-center gap-1.5 font-medium">${I(km[2], "size-3.5")}${km[1]}节点 ${i + 1}${i === 0 ? '<span class="ml-auto rounded bg-muted px-1 text-[10px] font-normal text-muted-foreground">原节点</span>' : '<span class="ml-auto rounded bg-sky-500/15 px-1 text-[10px] font-normal text-sky-600 dark:text-sky-400">副本</span>'}</div><div class="mt-1 ${tone ? "" : "text-muted-foreground"}">${txt}</div></div>`; }).join("")}</div>
    </div>
    <div class="mt-3 flex flex-wrap items-center gap-2 text-xs"><span class="text-muted-foreground">模拟</span>${seg([["1", "刚点发送"], ["2", "服务端已返回"]], String(cs.stage), "c-stage")}${chip(fail > 0, "第 2 个任务失败", "c-failn", "")}${chip(low > 0, "余额只够 2 个", "c-lowk", "")}<span class="ml-auto tabular">已冻结 ${created * q.one}${refunded ? `，已退回 ${refunded}` : ""}</span></div></div>`;
}

function calcScene() {
  const m = M(), spec = specOf(m), q = quote(m, spec), pr = m.pricing, c = S.calc;
  let ledger = [], notes = "";
  const one = q.one;
  if (q.billing === "token") {
    const actual = Math.max(1, Math.ceil((c.uin * pr.token.in + c.uout * pr.token.out) / 1e6));
    if (c.fail) ledger = [["freeze", -one, "冻结（上限）"], ["refund", one, "任务失败，全额退回"]];
    else if (c.noUsage) { ledger = [["freeze", -one, "冻结（上限）"], ["settle", one, "插件没回传 usage → 按冻结额全额扣（提案）"]]; notes = "缺 usage 的保守策略是提案，见设计文档 §11。"; }
    else { const settle = Math.min(actual, one); ledger = [["freeze", -one, "冻结（上限）"], ["settle", settle, `实际 ${actual} 积分 = ⌈(${c.uin}×${pr.token.in} + ${c.uout}×${pr.token.out}) ÷ 1e6⌉，取 min(实际, 冻结)`], ...(one - settle ? [["refund", one - settle, "多冻结的部分退回"]] : [])]; }
  } else ledger = c.fail ? [["freeze", -one, "冻结"], ["refund", one, "任务失败，全额退回"]] : [["freeze", -one, "冻结"], ["settle", one, "任务成功，扣除冻结额"]];
  const lcolor = { freeze: "text-amber-600 dark:text-amber-400", settle: "text-red-600 dark:text-red-400", refund: "text-emerald-600 dark:text-emerald-400" };
  const view = clone(m);

  const shown = S.view === "admin" ? adm : cm;

  return `<div class="grid gap-5 lg:grid-cols-2">
    <div class="space-y-4">
      <div class="rounded-xl border bg-card p-4"><div class="mb-3 flex items-center gap-2 text-sm font-semibold">${I("calculator")}用户这次的选择</div>
        <div id="node">${nodeHtml()}</div></div>
      <div class="rounded-xl border bg-card p-4"><div class="mb-3 flex items-center gap-2 text-sm font-semibold">${I("receipt")}Quote 计价</div>
        <dl class="space-y-2 text-sm"><div class="flex justify-between gap-3"><dt class="text-muted-foreground">计费方式</dt><dd>${{ per_call: "按次", per_second: "按秒", token: "Token" }[pr.billing]}</dd></div>
          <div class="flex justify-between gap-3"><dt class="text-muted-foreground">规格</dt><dd class="text-right font-mono text-xs">${esc(JSON.stringify(spec))}</dd></div>
          <div class="flex justify-between gap-3"><dt class="text-muted-foreground">命中</dt><dd class="text-right">${q.tier ? `规格价格 ${String(q.tier.idx + 2).padStart(2, "0")}（${Object.entries(q.tier.when).map(([k, v]) => `${k}=${v}`).join("，")}）` : "默认价格"}</dd></div>

      </div>
      <div class="rounded-xl border bg-card p-4"><div class="mb-3 flex items-center gap-2 text-sm font-semibold">${I("book-open-text")}积分流水<span class="text-xs font-normal text-muted-foreground">${q.n > 1 ? `下面是其中 1 个任务；一共 ${q.n} 个任务，每个都是这几类流水，互不影响（某个失败只退它自己的）` : "一个任务"}</span></div>
        <div class="divide-y rounded-lg border">${ledger.map(([t, n, d]) => `<div class="flex items-center gap-3 px-3 py-2 text-sm"><span class="w-14 font-mono text-xs ${lcolor[t]}">${t}</span><span class="w-14 text-right tabular font-medium ${lcolor[t]}">${n > 0 ? "+" : ""}${n}</span><span class="flex-1 text-xs text-muted-foreground">${esc(d)}</span></div>`).join("")}</div>${notes ? `<p class="mt-2 text-[11px] text-muted-foreground">${notes}</p>` : ""}</div>
    </div>
    <div><div class="sticky top-20 rounded-xl border bg-card">
      <div class="flex flex-wrap items-center gap-2 border-b p-3"><span class="flex items-center gap-2 text-sm font-semibold">${I("braces")}模型正文</span><span class="ml-auto">${seg([["admin", "管理端（含 cost）"], ["canvas", "画布端 GET /models"]], S.view, "view")}</span></div>
      <pre class="json max-h-[34rem] p-3">${esc(JSON.stringify(shown, null, 2))}</pre>
      <div class="border-t p-3 text-[11px] leading-relaxed text-muted-foreground">${S.view === "canvas" ? `画布端已剔除：<span class="font-mono">pricing.cost</span>（成本价）、<span class="font-mono">capabilities.system</span>（系统提示）、顶层 <span class="font-mono">params</span>（固定参数）、渠道与插件信息。` : "管理端正文：保存/发布的就是这一份；成本价只存在这里。"}</div>
    </div></div>
  </div>`;
}

/* ================================================================== 页面框架 */
function renderIntro() {
  const items = [[1, "基本信息", ["厂商 Logo（vendor）", "展示标签 ≤5 个 / 12 字", "描述 500 字计数", "选择器预览：logo、标签、价格"]], [2, "能力与参数", ["capabilities 取代 input_schema", "生成方式：文生 / 图生 / 全能参考（不区分素材类型）", "参考素材开关与数量、大小上限", "开放给用户、可选值勾选、时长可拖动（最小 / 最大）", "上下文能力、固定系统提示", "能力由运营手填，后端固定上下限兜底"]], [3, "积分定价", ["按次 / 按秒 / Token", "清晰度档位定价：图片 1K/2K/4K，视频 720P/1080P/4K", "规格价格：清晰度 / 音频开关 / 有无参考视频", "计费方式由模型决定：视频按秒、图片按次、文本 Token", "生成数量 = 复制出 N 个一模一样的节点 + N 个任务，各自冻结", "成本价与利润率（仅管理端）", "前端本地计价，后端冻结为准", "Token 预冻结，多退少补"]]];
  $("#intro").innerHTML = items.map(([n, t, l]) => `<div class="rounded-xl border bg-card p-4"><div class="mb-2 flex items-center gap-2"><span class="rounded border px-1.5 py-0.5 text-xs font-medium ${TONE[PHASE[n][0]]}">${PHASE[n][1]}</span><span class="text-sm font-semibold">${t}</span></div><ul class="space-y-1 text-xs text-muted-foreground">${l.map((x) => `<li class="flex gap-1.5"><span class="mt-1.5 size-1 shrink-0 rounded-full bg-muted-foreground/60"></span>${x}</li>`).join("")}</ul></div>`).join("");
}
function render() {
  $("#scene-seg").innerHTML = seg([["admin", "管理端 · 编辑模型"], ["canvas", "画布端"], ["calc", "计价与扣费"]], S.scene, "scene");
  $("#preset-seg").innerHTML = seg([["video", "视频"], ["image", "图片"], ["text", "文本"]], S.preset, "preset");
  syncCanvas();
  if (S.scene === "admin") { $("#stage").innerHTML = adminShell(); renderAdminForm(); }
  else { $("#stage").innerHTML = S.scene === "canvas" ? canvasScene() : calcScene(); }
  icons();
}
/** 画布端/计价页内，只刷新节点与依赖区域 */
const rerenderScene = () => { if (S.scene === "admin") { refreshSide(); } else { const y = window.scrollY; render(); window.scrollTo(0, y); } };

/* ================================================================== 事件 */
const ACT = {
  scene: (v) => { S.scene = v; S.vpOpen = false; render(); },
  preset: (v) => { S.preset = v; S.tab = "basic"; S.vpOpen = false; S.canvas.params = {}; render(); },
  theme: () => { document.documentElement.classList.toggle("dark"); },
  toast: (v) => toast(v),
  tab: (v) => { S.tab = v; S.vpOpen = false; render(); },
  shelf: (_, el) => { const m = M(); m.enabled = !m.enabled; el.setAttribute("aria-checked", m.enabled); },
  publish: (_, el) => { if (!el.disabled) toast("已发布为新版本 v4（演示）"); },
  "vp-toggle": () => { S.vpOpen = !S.vpOpen; S.vq = ""; renderAdminForm(); if (S.vpOpen) $("#vq")?.focus(); },
  "vp-pick": (v) => { M().vendor = v; S.vpOpen = false; renderAdminForm(); },
  "tag-del": (v) => { M().tags.splice(+v, 1); renderAdminForm(); },
  deadline: (v) => { M().deadline = v; renderAdminForm(); },
  "op-toggle": (v) => { const o = M().capabilities.ops, i = o.indexOf(v); i >= 0 ? o.splice(i, 1) : o.push(v); const order = Object.keys(OPS); o.sort((a, b) => order.indexOf(a) - order.indexOf(b)); renderAdminForm(); },
  "ref-on": (v) => { const r = M().capabilities.refs[v]; r.on = !r.on; if (r.on && r.max === 0) { r.max = 1; r.mb = 10; } renderAdminForm(); },
  "opt-open": (k) => { const p = M().capabilities.params[k]; p.open = !p.open; renderAdminForm(); },
  "opt-choice": (v) => {
    const [k, val] = v.split("|"), p = M().capabilities.params[k], at = p.options.findIndex((o) => String(o) === val);
    if (at >= 0) { if (p.options.length === 1) return toast("至少保留一个可选值"); p.options.splice(at, 1); if (String(p.default) === val) p.default = p.options[0]; }
    else { const u = unionOptions(k, p), raw = u.find((o) => String(o) === val); p.options.push(raw); p.options.sort((a, b) => u.findIndex((x) => String(x) === String(a)) - u.findIndex((x) => String(x) === String(b))); }
    renderAdminForm();
  },
  "opt-def": (v) => { const [k, val] = v.split("|"), p = M().capabilities.params[k]; p.default = p.options.find((o) => String(o) === val); renderAdminForm(); },
  "opt-spec": (k) => { const p = M().capabilities.params[k]; p.spec = !p.spec; renderAdminForm(); },
  "opt-bool": (k) => { const p = M().capabilities.params[k]; p.default = !p.default; renderAdminForm(); },
  billing: (v) => { const m = M(), pr = m.pricing; if ((v === "token" && m.kind !== "text") || (v === "per_second" && !m.capabilities.params.duration)) return; if (pr.billing !== v && pr.tiers.length) { pr.tiers = []; toast("切换计费方式会清空规格价格（单位不同）"); } pr.billing = v; renderAdminForm(); },
  "cost-on": () => { const c = M().pricing.cost; c.on = !c.on; renderAdminForm(); },
  "tier-add": () => { const m = M(), specs = Object.entries(m.capabilities.params).filter(([, p]) => p.spec); const when = {}; specs.forEach(([k]) => (when[k] = "*")); m.pricing.tiers.push({ on: true, when, unit: costPair(m.pricing, m, null)[0] }); renderAdminForm(); },
  "tier-del": (v) => { M().pricing.tiers.splice(+v, 1); renderAdminForm(); },
  "tier-on": (v) => { const t = M().pricing.tiers[+v]; t.on = !t.on; renderAdminForm(); },
  "tier-cond": (v) => { const [i, k, val] = v.split("|"), t = M().pricing.tiers[+i]; if (val === "*") delete t.when[k]; else t.when[k] = val; if (val === "*" && k !== "op") t.when[k] = "*"; renderAdminForm(); },
  "c-op": (v) => { S.canvas.op = v; rerenderScene(); },
  "c-pop": () => { S.canvas.pop = !S.canvas.pop; rerenderScene(); },
  "c-boolset": (v) => { const [k, b] = v.split("|"); S.canvas.params[k] = b === "1"; rerenderScene(); },
  "c-param": (v) => { const [k, val] = v.split("|"), p = M().capabilities.params[k]; S.canvas.params[k] = p.options.find((o) => String(o) === val); rerenderScene(); },
  "c-bool": (k) => { S.canvas.params[k] = !S.canvas.params[k]; rerenderScene(); },
  "c-img": () => { S.canvas.img = !S.canvas.img; rerenderScene(); },
  "c-aud": () => { S.canvas.aud = !S.canvas.aud; rerenderScene(); },
  "c-stage": (v) => { S.canvas.stage = +v; rerenderScene(); },
  "c-lowk": () => { S.canvas.lowK = S.canvas.lowK ? 0 : 2; rerenderScene(); },
  "c-failn": () => { S.canvas.failN = S.canvas.failN ? 0 : 2; rerenderScene(); },
  "c-vid": () => { S.canvas.vid = !S.canvas.vid; rerenderScene(); },
  "c-result": (v) => { S.calc.fail = v === "fail"; rerenderScene(); },
  "c-nousage": () => { S.calc.noUsage = !S.calc.noUsage; rerenderScene(); },
  view: (v) => { S.view = v; render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el || el.disabled) return;
  const f = ACT[el.dataset.act]; if (f) f(el.dataset.v, el);
  icons();
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.id === "vq") { S.vq = t.value; const q = t.value.trim().toLowerCase(); $("#vgrid").innerHTML = vgrid(VENDORS.filter(([s, n]) => !q || s.includes(q) || n.toLowerCase().includes(q))); icons(); return; }
  if (t.dataset.bind) {
    let v = t.value;
    if (t.dataset.t === "num") v = t.value === "" ? 0 : Math.round(Number(t.value));
    setp(M(), t.dataset.bind, v);
    if (t.dataset.bind === "hint") $("#hint-n").textContent = `${v.length} / 500`;
    if (/\.(min|max|default)$/.test(t.dataset.bind) && /params\./.test(t.dataset.bind)) { /* 数字参数范围变化需要重画滑轨：失焦时再整体刷新，避免打断输入 */ }
    refreshSide(); return;
  }
  if (t.dataset.cp) {
    const k = t.dataset.cp, p = M().capabilities.params[k];
    let v = Number(t.value); if (!Number.isFinite(v)) return;
    v = Math.min(p.max, Math.max(p.min, v)); S.canvas.params[k] = v;
    document.querySelectorAll(`[data-cp="${k}"]`).forEach((x) => { if (x !== t) x.value = v; });
    const q = quote(M(), specOf(M())); document.querySelectorAll("[data-genprice]").forEach((x) => (x.textContent = creditText(q)));
    document.querySelectorAll("[data-sum]").forEach((x) => (x.innerHTML = sumHtml(M()))); icons();
    return;
  }
  if (t.dataset.calc) { S.calc[t.dataset.calc] = Number(t.value) || 0; const y = window.scrollY, id = t.dataset.calc, pos = t.selectionStart; render(); window.scrollTo(0, y); const n = document.querySelector(`[data-calc="${id}"]`); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} } }
});
// 数字参数的范围改完后，失焦时整体刷新左侧（滑轨、默认值点位）
document.addEventListener("change", (e) => { if (e.target.dataset?.cop !== undefined) { S.canvas.op = e.target.value; rerenderScene(); return; } const b = e.target.dataset?.bind; if (b && /^capabilities\.params\.\w+\.(min|max|default)$/.test(b)) renderAdminForm(); });
document.addEventListener("keydown", (e) => {
  if (e.target.dataset?.addopt && e.key === "Enter") {
    e.preventDefault(); const k = e.target.dataset.addopt, p = M().capabilities.params[k], raw = e.target.value.trim(); if (!raw) return;
    const val = p.options.every((o) => typeof o === "number") ? Number(raw) : raw;
    if (typeof val === "number" && !Number.isFinite(val)) return toast("这个参数的可选值是数字");
    if (p.options.some((o) => String(o) === String(val))) return toast("已经有这个值了");
    p.options.push(val); renderAdminForm(); document.querySelector(`[data-addopt="${k}"]`)?.focus(); return;
  }
  if (e.target.id === "tag-in" && e.key === "Enter") {
    e.preventDefault(); const v = e.target.value.trim(), t = M().tags;
    if (!v) return; if (t.includes(v)) return toast("标签已存在"); if (t.length >= 5) return toast("最多 5 个标签");
    t.push(v.slice(0, 12)); renderAdminForm(); $("#tag-in")?.focus();
  }
  if (e.key === "Escape" && S.vpOpen) { S.vpOpen = false; renderAdminForm(); }
});
document.addEventListener("mousedown", (e) => { if (S.vpOpen && !e.target.closest("#vp")) { S.vpOpen = false; renderAdminForm(); } });

renderIntro(); render();
</script>
</body>
</html>
