      const before = takeBefore(),
        cur = chipsOf(el, kind),
        same = cur.find((c) => c.dataset.pid === id);
      const drop = (c) => {
        const nx = c.nextSibling;
        if (nx && nx.nodeType === 3 && nx.nodeValue.startsWith(" ")) nx.nodeValue = nx.nodeValue.slice(1);
        c.remove();
      };
      if (same) drop(same);
      else if (target?.isConnected) {
        /* 从 chip 点进来的：原位换成选中的这一个 */
        const nc = makeChip(kind, id);
        target.replaceWith(nc);
        popIn(nc);
      } else if (!PKIND[kind].multi && cur.length) {
        const nc = makeChip(kind, id);
        cur[0].replaceWith(nc);
        popIn(nc);
      } else {
        const chip = makeChip(kind, id),
          sp = document.createTextNode(" ");
        let r;
        if (kind === "tpl") {
          /* 模板是整条任务的说明，永远排在最前面 */
          r = document.createRange();
          r.setStart(el, 0);
          r.collapse(true);
        } else {
          r = lastRange && el.contains(lastRange.startContainer) ? lastRange : null;
          if (!r) {
            r = document.createRange();
            r.selectNodeContents(el);
            r.collapse(false);
          }
        }
        r.deleteContents();
        r.insertNode(sp);
        r.insertNode(chip);
        popIn(chip);
      }
      n.prompt = readPrompt(el);
      syncEmpty(el);
      commit(before);
    }
    const stateText = (kind, p) => {
      const el = $("#prompt");
      const opp = kind === "motion" && OPPOSITE[p.id] && chipsOf(el, "motion").find((c) => c.dataset.pid === OPPOSITE[p.id]);
      return opp ? `<div class="warn">与已选的「${findPreset("motion", opp.dataset.pid).name}」方向相反，模型可能只执行其中一个</div>` : "";
    };
    function openPresetPop(n, kind, anchor, target) {
      if (n.status === "running") return;
      const pop = $("#pop-preset"),
        el = $("#prompt");
      const selected = () => new Set(chipsOf(el, kind).map((c) => c.dataset.pid));
      const hint = {
        style: "悬停卡片查看人物参考图；点击选用，再点一次取消",
        motion: "可多选，点卡片加入或取消，按光标位置写进提示词；悬停播放示意动图",
        tpl: "预设模板会改写整个任务，只能选一个",
      }[kind];
      const foot = (html) => ($("#pk-foot").innerHTML = html || `<div class="tx">${hint}</div>`);
      let body = "",
        cat = "all";
      if (kind === "tpl") {
        const groups = ["分镜叙事", "质感调节", "空间与机位", "设定图"];
        const col = (gs) =>
          `<div>${gs.map((g, i) => `<div class="gl">${g}</div>` + PRESET.tpl.filter((t) => t.group === g).map((t) => `<button class="tpl-item${selected().has(t.id) ? " on" : ""}" data-pid="${t.id}"><span class="ti">${ic(t.icon)}</span>${t.name}</button>`).join("") + (i < gs.length - 1 ? '<div class="gap"></div>' : "")).join("")}</div>`;
        body = `<div class="tpl-cols">${col([groups[0]])}${col([groups[1], groups[2]])}${col([groups[3]])}</div>`;
      } else {
        const cats = kind === "style" ? STYLE_CAT : MOTION_CAT;
        body = `<div class="pk-tabs" role="tablist"><button class="pk-tab on" data-cat="all">全部</button>${Object.entries(cats).map(([c, l]) => `<button class="pk-tab" data-cat="${c}">${l}</button>`).join("")}</div><div class="pk-grid${kind === "motion" ? " sq" : ""}" id="pk-grid"></div>`;
      }
      pop.innerHTML = body + '<div class="pk-foot" id="pk-foot"></div>';
      foot();
      const paintGrid = () => {
        const g = $("#pk-grid");
        if (!g) return;
        const sels = selected();
        g.innerHTML = PRESET[kind].filter((p) => cat === "all" || p.cat === cat).map((p) => `<button class="pk-card${sels.has(p.id) ? " on" : ""}" data-pid="${p.id}" aria-pressed="${sels.has(p.id)}" aria-label="${p.name}">${kind === "style" ? `<img src="${p.img}" alt="" loading="lazy" draggable="false">` : `<canvas width="256" height="256"></canvas>`}<span class="nm">${p.name}</span><span class="ck">${ic("check")}</span></button>`).join("");
        if (kind === "motion")
          $$(".pk-card", g).forEach((c) => {
            /* 动图不能暂停：先解一帧画到 canvas 当静态首帧，悬停才换成真的动图 */
            const im = new Image();
            im.onload = () => c.querySelector("canvas")?.getContext("2d").drawImage(im, 0, 0, 256, 256);
            im.src = findPreset("motion", c.dataset.pid).img;
          });
      };
      const sync = () => {
        const sels = selected();
        $$(".pk-card, .tpl-item", pop).forEach((c) => {
          const on = sels.has(c.dataset.pid);
          c.classList.toggle("on", on);
          c.setAttribute("aria-pressed", on);
        });
      };
      paintGrid();
      const show = (c) => {
        const p = findPreset(kind, c.dataset.pid);
        if (!p) return;
        if (kind === "style")
          foot(`<div class="tx"><b>${p.name}</b><span class="sn">${esc(p.p)}…</span></div><div class="refs">${p.refs.map((r) => `<span style="background-image:url(${r})"></span>`).join("")}</div>`);
        else if (kind === "motion")
          foot(`<div class="tx"><b>${p.name} · ${p.use}</b><span class="sn">${esc(p.p.replace(/^运镜：/, ""))}</span>${stateText(kind, p)}</div>`);
        else foot(`<div class="tx"><b>${p.name}</b><span class="sn">${esc(p.use)}</span></div>`);
        if (kind === "motion") {
          const cv = c.querySelector("canvas");
          if (cv && !c.querySelector("img")) {
            const im = document.createElement("img");
            im.alt = "";
            im.draggable = false;
            im.src = p.img + "?r=" + Date.now();
            c.prepend(im);
          }
        }
      };
      const leave = (c) => {
        c.querySelector("img")?.remove();
        foot();
      };
      pop.onmouseover = (e) => {
        const c = e.target.closest("[data-pid]");
        if (c && !c.dataset.hot) {
          c.dataset.hot = "1";
          show(c);
        }
      };
      pop.onmouseout = (e) => {
        const c = e.target.closest("[data-pid]");
        if (c && !c.contains(e.relatedTarget)) {
          delete c.dataset.hot;
          leave(c);
        }
      };
      pop.onfocusin = (e) => e.target.dataset?.pid && show(e.target);
      pop.onfocusout = (e) => e.target.dataset?.pid && leave(e.target);
      pop.onclick = (e) => {
        const tab = e.target.closest(".pk-tab");
        if (tab) {
          cat = tab.dataset.cat;
          $$(".pk-tab", pop).forEach((t) => t.classList.toggle("on", t === tab));
          return paintGrid();
        }
        const c = e.target.closest("[data-pid]");
        if (!c) return;
        /* 替换模式下，运镜已经在别处选过的那一条不能再选 */
        if (target && c.dataset.pid !== target.dataset.pid && selected().has(c.dataset.pid)) {
          foot('<div class="tx" style="color:var(--warn)">这一条已经选过了，换一条别的</div>');
          return;
        }
        applyPreset(kind, c.dataset.pid, target);
        if (PKIND[kind].multi && !target) {
          sync();
          show(c);
        } else {
          closePops();
          el.focus();
        }
      };
      /* 方向键在卡片间移动 */
      pop.onkeydown = (e) => {
        const items = $$("[data-pid]:not([aria-disabled='true'])", pop),
          i = items.indexOf(document.activeElement);
        if (i < 0 || !e.key.startsWith("Arrow")) return;
        const cols = kind === "tpl" ? 1 : getComputedStyle($("#pk-grid")).gridTemplateColumns.split(" ").length;
        const d = { ArrowRight: 1, ArrowLeft: -1, ArrowDown: cols, ArrowUp: -cols }[e.key];
        const t = items[i + d];
        if (t) {
          e.preventDefault();
          t.focus();
        }
      };
      openPop(pop, anchor);
    }
    /* 点提示词里的预设 chip：在 chip 旁边弹出同类选择器，选另一个就原位替换，点自己就取消 */
    document.addEventListener("click", (e) => {
      const chip = e.target.closest("#prompt .pchip[data-pk]");
      const n = sel();
      if (chip && n && presetKinds(n).includes(chip.dataset.pk)) openPresetPop(n, chip.dataset.pk, chip, chip);
    });
    function openModelPop(n, anchor) {
      const pop = $("#pop-model");
      pop.innerHTML =
        `<div class="mlabel">${KIND[n.kind].name}模型</div>` +
        MODELS[n.kind]
          .map(
            (m) =>
              `<button class="mi${m.id === n.params.model ? " checked" : ""}" data-model="${m.id}"><span class="pc vendor" style="height:22px;width:22px;padding:0;justify-content:center;box-shadow:none;background:var(--surface-3);font-size:11px;font-weight:700">${m.v}</span><span>${m.name}<span class="sub">${m.sub}</span></span>${ic("check", 16, "ck")}</button>`,
          )
          .join("");
      pop.onclick = (e) => {
        const b = e.target.closest("[data-model]");
        if (!b) return;
        const m = MODELS[n.kind].find((x) => x.id === b.dataset.model);
        n.params.model = m.id;
        if (m.ops && !m.ops.includes(n.params.op)) n.params.op = m.ops[0];
        closePops();
        buildPanel();
        markDirty();
      };
      openPop(pop, anchor);
    }
    function openParamPop(n, anchor) {
      const pop = $("#pop-param");
      const rows =
        n.kind === "video"
          ? [
              ["分辨率", "res", ["480p", "720p", "1080p"]],
              ["比例", "ratio", ["16:9", "9:16", "1:1"]],
              ["时长", "dur", [4, 6, 8]],
            ]
          : [["比例", "ratio", ["16:9", "4:3", "1:1", "9:16"]]];
      const draw = () => {
        pop.innerHTML =
          rows
            .map(
              ([lab, key, opts]) =>
                `<div class="prow"><span class="k">${lab}</span><div class="chips">${opts.map((o) => `<button class="chip-o${n.params[key] === o ? " on" : ""}" data-k="${key}" data-v="${o}">${o}${key === "dur" ? "s" : ""}</button>`).join("")}</div></div>`,
            )
            .join("") +
          `<div class="msep"></div><div class="prow" style="grid-template-columns:1fr auto;align-items:center"><span class="k">本次消耗</span><span class="num" style="font-family:var(--mono);color:var(--credit)">✦ ${fmt(cost(n))}</span></div>`;
      };
      draw();
      pop.onclick = (e) => {
        const b = e.target.closest("[data-k]");
        if (!b) return;
        const v = b.dataset.k === "dur" ? +b.dataset.v : b.dataset.v;
        n.params[b.dataset.k] = v;
        draw();
        markDirty();
        const chip = $("#chip-param");
        if (chip)
          chip.innerHTML =
            n.kind === "video"
              ? `${n.params.res} · ${n.params.ratio} · ${n.params.dur}s`
              : ic("crop", 15) + "比例 " + n.params.ratio;
        refreshPanel();
      };
      openPop(pop, anchor);
    }

    /* 面板与浮条定位：宽度跟随节点但不随缩放变小；下方放不下就翻到上方 */
    function layoutOverlay() {
      const n = sel();
      if (!n) return;
      const k = KIND[n.kind],
        W = innerWidth,
        H = innerHeight;
      const sx = n.x * view.k + view.x,
        sy = n.y * view.k + view.y,
        sw = k.w * view.k,
        sh = k.h * view.k;
      const pw = Math.min(W - 24, Math.max(480, Math.min(720, sw + 160)));
      panel.style.width = pw + "px";
      const ph = panel.offsetHeight,
        bottomLimit = H - 80;
      const below = sy + sh + 16,
        above = sy - 34 - 16 - ph;
      flipped = below + ph > bottomLimit && above > 60;
      const top = flipped ? above : below;
      const left = Math.min(Math.max(12, sx + sw / 2 - pw / 2), W - pw - 12);
      panel.style.left = left + "px";
      panel.style.top = top + "px";
      panel.style.setProperty("--pdy", flipped ? "6px" : "-6px");
      const hw = hist.offsetWidth;
      hist.style.left = Math.min(Math.max(12, sx + sw / 2 - hw / 2), W - hw - 12) + "px";
      hist.style.top = (flipped ? sy + sh + 14 : sy - 34 - 12 - 40) + "px";
    }

    /* ---------- 生成（模拟异步任务 + 积分冻结/退回） ---------- */
    function setCredits(v) {
      const from = credits;
      credits = v;
      roll($("#credits"), from, v);
      roll($("#bal-big"), from, v);
      refreshPanel();
    }
    function roll(el, from, to) {
      const t0 = performance.now(),
        d = REDUCE ? 0 : 520;
      (function f(t) {
        const p = d ? Math.min(1, (t - t0) / d) : 1,
          e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(Math.round(from + (to - from) * e));
        if (p < 1) requestAnimationFrame(f);
      })(t0);
    }
    function addLedger(label, amt) {
      ledger.unshift({ label, amt });
      $("#ledger").innerHTML = ledger
        .slice(0, 6)
        .map(
          (l) =>
            `<div><span>${esc(l.label)}</span><span class="${l.amt < 0 ? "neg" : "pos"}">${l.amt < 0 ? "−" : "+"}${fmt(Math.abs(l.amt))}</span></div>`,
        )
        .join("");
    }
    function send(n) {
      const ta = $("#prompt");
      if (n.status === "running") return;
      if (!(n.prompt || "").trim()) {
        ta?.classList.remove("shake");
        void ta?.offsetWidth;
        ta?.classList.add("shake");
        ta?.focus();
        return;
      }
      const np = [...(n.prompt || "").matchAll(PTOKEN)].length;
      if (np) toast(`已把 ${np} 个预设展开成完整提示词`, "info");
      const c = cost(n);
      if (credits < c) {
        toast(`积分不足，还差 ${fmt(c - credits)}`, "bad");
        return;
      }
      setCredits(credits - c);
      addLedger(`${n.label} · ${KIND[n.kind].name}`, -c);
      n.status = "running";
      n.progress = 0;
      n.error = null;
      const willFail = demo.failGen;
      demo.failGen = false;
      syncDemo();
      const dur = (n.kind === "video" ? 3200 : 2200) * (REDUCE ? 0.5 : 1),
        t0 = performance.now();
      render();
      refreshPanel();
      (function tick(t) {
        if (!byId(n.id)) return;
        const p = Math.min(1, (t - t0) / dur);
        n.progress = Math.min(99, (1 - Math.pow(1 - p, 2)) * 100);
        if (willFail && p > 0.55) {
          n.status = "failed";
          n.error = "上游服务繁忙，请稍后重试";
          n.progress = 0;
          setCredits(credits + c);
          addLedger(`${n.label} · 失败退回`, c);
          toast(`生成失败，已退回 ${fmt(c)} 积分`, "bad");
          render();
          refreshPanel();
          markDirty();
          return;
        }
        if (p < 1) {
          render();
          requestAnimationFrame(tick);
          return;
        }
        const b = n.params.batch || 1;
        for (let i = 0; i < b; i++) n.outputs.push({ id: "o" + ++uid, seed: ++seedN });
        if (n.kind === "text") n.text = SAMPLE_TEXT;
        if (n.outputs.length > 20) n.outputs.splice(0, n.outputs.length - 20);
        n.active = n.outputs[n.outputs.length - 1]?.id || null;
        n.status = "done";
        n.progress = 0;
        hist.dataset.sig = "";
        render();
        refreshPanel();
        markDirty();
        toast(
          n.outputs.length > 1
            ? `生成完成，已加入节点历史（共 ${n.outputs.length} 版）`
            : "生成完成",
          "ok",
        );
      })(t0);
    }

    /* ---------- 节点操作 ---------- */
    function defaults(kind) {
      const m = MODELS[kind][0];
      return {
        model: m.id,
        op: m.ops?.[0],
        res: "480p",
        ratio: "16:9",
        dur: 4,
        size: "2K",
        batch: 1,
      };
    }
    function addNode(kind, at, opts = {}) {
      const before = snap(),
        k = KIND[kind];
      const c = at || {
        x: (innerWidth / 2 - view.x) / view.k - k.w / 2,
        y: (innerHeight * 0.36 - view.y) / view.k - k.h / 2,
      };
      const n = {
        id: "n" + ++uid,
        kind,
        label: k.name,
        x: Math.round(c.x),
        y: Math.round(c.y),
        outputs: [],
        active: null,
        status: "idle",
        params: defaults(kind),
        prompt: "",
      };
      nodes.push(n);
      if (opts.from) edges.push({ id: "e" + ++uid, source: opts.from, target: n.id });
      if (opts.to) edges.push({ id: "e" + ++uid, source: n.id, target: opts.to });
      selId = n.id;
      histOpen = false;
      commit(before);
      buildPanel();
      const el = els.get(n.id);
      if (M && !REDUCE)
        M.animate(
          el,
          { opacity: [0, 1], scale: [0.94, 1] },
          { duration: 0.22, ease: [0.2, 0, 0, 1] },
        );
      setTimeout(() => $("#prompt")?.focus(), 60);
      return n;
    }
    function deleteSel() {
      const n = sel();
      if (!n) return;
      const before = snap();
      nodes = nodes.filter((x) => x.id !== n.id);
      edges = edges.filter((e) => e.source !== n.id && e.target !== n.id);
      selId = null;
      commit(before);
      buildPanel();
      toast("已删除节点，⌘Z 可恢复", "info");
    }
    function duplicate(src, offset = 32) {
      const before = snap();
      const n = JSON.parse(JSON.stringify(src));
      n.id = "n" + ++uid;
      n.x += offset;
      n.y += offset;
      n.status = n.outputs.length ? "done" : "idle";
      n.progress = 0;
      nodes.push(n);
      selId = n.id;
      commit(before);
      buildPanel();
    }
    function select(id) {
      if (selId === id) return;
      selId = id;
      histOpen = false;
      hist.dataset.sig = "";
      render();
      buildPanel();
    }

    /* ---------- 指针：选择、拖拽、平移 ---------- */
    let drag = null;
    stage.addEventListener("pointerdown", (e) => {
      closePops();
      const port = e.target.closest(".port"),
        nodeE = e.target.closest(".node");
      const panMode = tool === "hand" || spaceHeld || e.button === 1;
      if (e.target.closest("[data-retry]")) {
        const n = byId(e.target.closest("[data-retry]").dataset.retry);
        select(n.id);
        send(n);
        return;
      }
      if (port && !panMode) {
        const n = byId(nodeE.dataset.id),
          k = KIND[n.kind],
          right = port.classList.contains("r");
        const kind = right
          ? n.kind === "image"
            ? "video"
            : n.kind === "text"
              ? "image"
              : "video"
          : n.kind === "video"
            ? "image"
            : "text";
        const nk = KIND[kind];
        addNode(
          kind,
          { x: right ? n.x + k.w + 140 : n.x - nk.w - 140, y: n.y + (k.h - nk.h) / 2 },
          right ? { from: n.id } : { to: n.id },
        );
        return;
      }
      stage.setPointerCapture(e.pointerId);
      if (nodeE && !panMode) {
        const n = byId(nodeE.dataset.id);
        select(n.id);
        drag = {
          type: "node",
          n,
          sx: e.clientX,
          sy: e.clientY,
          ox: n.x,
          oy: n.y,
          moved: false,
          before: snap(),
        };
      } else {
        if (!panMode && !nodeE) select(null);
        drag = { type: "pan", sx: e.clientX, sy: e.clientY, ox: view.x, oy: view.y, moved: false };
        stage.classList.add("panning");
      }
    });
    stage.addEventListener("pointermove", (e) => {
      if (!drag) return;
      const dx = e.clientX - drag.sx,
        dy = e.clientY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) < 3) return;
      if (!drag.moved) {
        drag.moved = true;
        interacting = true;
        hist.classList.add("dim");
        panel.classList.add("dim");
      }
      if (drag.type === "node") {
        drag.n.x = Math.round(drag.ox + dx / view.k);
        drag.n.y = Math.round(drag.oy + dy / view.k);
        const el = els.get(drag.n.id);
        el.style.left = drag.n.x + "px";
        el.style.top = drag.n.y + "px";
        renderEdges();
        layoutOverlay();
      } else {
        view.x = drag.ox + dx;
        view.y = drag.oy + dy;
        apply();
      }
    });
    const endDrag = () => {
      if (!drag) return;
      if (drag.type === "node" && drag.moved) commit(drag.before);
      drag = null;
      interacting = false;
      stage.classList.remove("panning");
      hist.classList.remove("dim");
      panel.classList.remove("dim");
    };
    stage.addEventListener("pointerup", endDrag);
    stage.addEventListener("pointercancel", endDrag);
    stage.addEventListener("dblclick", (e) => {
      if (e.target.closest(".node")) return;
      const p = { x: (e.clientX - view.x) / view.k - 210, y: (e.clientY - view.y) / view.k - 118 };
      openPopAt($("#pop-add"), e.clientX, e.clientY);
      $("#pop-add").dataset.at = JSON.stringify(p);
    });
    stage.addEventListener(
      "wheel",
      (e) => {
        e.preventDefault();
        if (e.ctrlKey || e.metaKey)
          zoomAt(view.k * Math.exp(-e.deltaY * 0.01), e.clientX, e.clientY);
        else {
          view.x -= e.deltaX;
          view.y -= e.deltaY;
          apply();
        }
      },
      { passive: false },
    );

    /* ---------- 弹出层 ---------- */
    let openPopEl = null,
      openAnchor = null;
    function openPop(pop, anchor) {
      if (openPopEl === pop && openAnchor === anchor) return closePops();
      closePops();
      const r = anchor.getBoundingClientRect();
      pop.style.visibility = "hidden";
      pop.classList.add("measure");
      const pw = pop.offsetWidth,
        ph = pop.offsetHeight;
      pop.classList.remove("measure");
      pop.style.visibility = "";
      const up = r.top > innerHeight / 2;
      let left = r.left + r.width / 2 - pw / 2;
      if (r.left < 120) left = r.left;
      else if (r.right > innerWidth - 120) left = r.right - pw;
      left = Math.min(Math.max(8, left), innerWidth - pw - 8);
      pop.style.left = left + "px";
      pop.style.top = (up ? r.top - ph - 8 : r.bottom + 8) + "px";
      pop.style.setProperty("--dy", up ? "6px" : "-6px");
      pop.style.transformOrigin = `${r.left + r.width / 2 - left}px ${up ? "100%" : "0"}`;
      pop.classList.add("open");
      openPopEl = pop;
      openAnchor = anchor;
      anchor.setAttribute?.("aria-expanded", "true");
    }
    function openPopAt(pop, x, y) {
      closePops();
      const pw = pop.offsetWidth || 240,
        ph = pop.offsetHeight || 300;
      pop.style.left = Math.min(x, innerWidth - pw - 8) + "px";
      pop.style.top = Math.min(y, innerHeight - ph - 8) + "px";
      pop.style.setProperty("--dy", "-6px");
      pop.style.transformOrigin = "0 0";
      pop.classList.add("open");
      openPopEl = pop;
      openAnchor = null;
    }
    function closePops() {
      mention = null;
      if (openAnchor?.setAttribute) openAnchor.setAttribute("aria-expanded", "false");
      $$(".pop.open").forEach((p) => p.classList.remove("open"));
      openPopEl = null;
      openAnchor = null;
    }
    document.addEventListener("pointerdown", (e) => {
      if (openPopEl && !e.target.closest(".pop") && !e.target.closest("button")) closePops();
    });

    $("#btn-logo").onclick = (e) => openPop($("#pop-logo"), e.currentTarget);
    $("#btn-more").onclick = (e) => openPop($("#pop-more"), e.currentTarget);
    $("#btn-credits").onclick = (e) => openPop($("#pop-credits"), e.currentTarget);
    $("#btn-avatar").onclick = (e) => openPop($("#pop-avatar"), e.currentTarget);
    $("#btn-add").onclick = (e) => {
      $("#pop-add").dataset.at = "";
      openPop($("#pop-add"), e.currentTarget);
    };
    $("#btn-zoom").onclick = (e) => openPop($("#pop-zoom"), e.currentTarget);
    $("#btn-undo").onclick = undo;
    $("#btn-redo").onclick = redo;
    $("#btn-help").onclick = () => openDialog($("#dlg-keys"));
    $("#btn-assets").onclick = () => toast("原型：素材库会从底部升起抽屉", "info");
    $("#btn-tasks").onclick = () => toast("原型：任务历史抽屉列出全部生成记录", "info");
    $("#st-warn").onclick = () => {
      const f = nodes.filter((n) => n.status === "failed");
      if (!f.length) return toast("没有失败的节点", "info");
      const n = f[(f.indexOf(sel()) + 1) % f.length];
      select(n.id);
      centerOn(n);
    };
    document.addEventListener("click", (e) => {
      const nw = e.target.closest("[data-new]");
      if (nw) {
        const at = $("#pop-add").dataset.at;
        closePops();
        addNode(nw.dataset.new, at ? JSON.parse(at) : null);
        $("#pop-add").dataset.at = "";
        return;
      }
      const z = e.target.closest("[data-zoom]");
      if (z) {
        const v = z.dataset.zoom,
          cx = innerWidth / 2,
          cy = innerHeight / 2;
        if (v === "fit") fitView();
        else if (v === "100") flyTo(cx - (cx - view.x) / view.k, cy - (cy - view.y) / view.k, 1);
        else zoomAt(view.k * (v === "in" ? 1.2 : 1 / 1.2), cx, cy);
        return;
      }
      const d = e.target.closest("[data-demo]");
      if (d) {
        demo[d.dataset.demo] = !demo[d.dataset.demo];
        syncDemo();
        if (d.dataset.demo === "failSave") markDirty();
        return;
      }
      const a = e.target.closest("[data-act]");
      if (a) {
        closePops();
        const act = a.dataset.act;
        if (act === "keys") openDialog($("#dlg-keys"));
        else if (act === "clear") {
          const b = snap();
          nodes = [];
          edges = [];
          selId = null;
          commit(b);
          buildPanel();
          toast("已清空，⌘Z 可恢复", "info");
        } else if (act === "upload") toast("原型：打开文件选择，上传后生成素材节点", "info");
        else
          toast(
            {
              back: "原型：返回项目列表",
              newcanvas: "原型：新建画布",
              settings: "原型：打开画布设置",
              admin: "原型：进入管理后台",
              logout: "原型：退出登录",
            }[act],
            "info",
          );
      }
      if (e.target.closest("[data-close]") || e.target.id === "backdrop") closeDialog();
    });
    function syncDemo() {
      $$("[data-demo]").forEach((b) => b.classList.toggle("checked", demo[b.dataset.demo]));
      const ws = $("#ws");
      ws.classList.toggle("down", demo.wsDown);
      ws.title = demo.wsDown ? "实时进度已断开，正在重连" : "实时进度已连接";
    }

    /* ---------- 底部分段：工具 / 背景 ---------- */
    function setTool(t) {
      tool = t;
      stage.classList.toggle("hand", t === "hand");
      const seg = $("#seg-tool"),
        b = $(`[data-tool="${t}"]`, seg);
      $$("button", seg).forEach((x) => x.classList.toggle("on", x === b));
      segTo(seg, b);
    }
    $("#seg-tool").onclick = (e) => {
      const b = e.target.closest("[data-tool]");
      if (b) setTool(b.dataset.tool);
    };
    $("#seg-view").onclick = (e) => {
      const b = e.target.closest("[data-view]");
      if (!b) return;
      stage.classList.toggle("grid", b.dataset.view === "grid");
      $$("#seg-view button").forEach((x) => x.classList.toggle("on", x === b));
      segTo($("#seg-view"), b);
    };

    /* ---------- 标题 ---------- */
    const title = $("#title");
    const sizeTitle = () => {
      title.style.width =
        Math.max(
          4,
          [...title.value].reduce((s, c) => s + (c.charCodeAt(0) > 255 ? 2 : 1.05), 0) + 1,
        ) + "ch";
    };
    let titleBefore = title.value;
    title.addEventListener("input", sizeTitle);
    title.addEventListener("focus", () => {
      titleBefore = title.value;
      title.select();
    });
    title.addEventListener("keydown", (e) => {
      if (e.key === "Enter") title.blur();
      if (e.key === "Escape") {
        title.value = titleBefore;
        sizeTitle();
        title.blur();
      }
    });
    title.addEventListener("blur", () => {
      if (!title.value.trim()) title.value = titleBefore;
      sizeTitle();
      if (title.value !== titleBefore) markDirty();
    });
    sizeTitle();

    /* ---------- 对话框（放大编辑提示词，从面板位置展开） ---------- */
    let dlgOpen = null,
      flipFrom = null;
    function openDialog(dlg, fromEl) {
      closePops();
      dlgOpen = dlg;
      $("#backdrop").classList.add("open");
      dlg.classList.add("open");
      if (REDUCE) return;
      if (fromEl && M) {
        const a = fromEl.getBoundingClientRect(),
          b = dlg.getBoundingClientRect();
        flipFrom = {
          x: a.left + a.width / 2 - (b.left + b.width / 2),
          y: a.top + a.height / 2 - (b.top + b.height / 2),
          s: a.width / b.width,
        };
        M.animate(
          dlg,
          { x: [flipFrom.x, 0], y: [flipFrom.y, 0], scale: [flipFrom.s, 1], opacity: [0.4, 1] },
          SPRING,
        );
      } else if (M) {
        flipFrom = null;
        M.animate(
          dlg,
          { scale: [0.96, 1], opacity: [0, 1] },
          { duration: 0.24, ease: [0.2, 0, 0, 1] },
        );
      }
    }
    function closeDialog() {
      if (!dlgOpen) return;
      const dlg = dlgOpen;
      dlgOpen = null;
      $("#backdrop").classList.remove("open");
      if (dlg.id === "dlg-prompt") {
        const n = sel();
        if (n) {
          n.prompt = readPrompt($("#big-prompt"));
          buildPanel();
          markDirty();
        }
      }
      const done = () => {
        dlg.classList.remove("open");
        dlg.style.transform = "";
        dlg.style.opacity = "";
      };
      if (M && !REDUCE) {
        const to =
          flipFrom && dlg.id === "dlg-prompt"
            ? { x: flipFrom.x, y: flipFrom.y, scale: flipFrom.s, opacity: 0 }
            : { scale: 0.97, opacity: 0 };
        M.animate(dlg, to, { duration: 0.17, ease: [0.4, 0, 1, 1] }).then(done);
      } else done();
    }
    function openPromptDialog() {
      const n = sel();
      if (!n) return;
      const big = $("#big-prompt");
      setEditor(big, n);
      $("#big-counter").textContent = `${promptLen(n.prompt)}/16000`;
      openDialog($("#dlg-prompt"), panel);
      setTimeout(() => big.focus(), 80);
    }
    bindHover($("#dlg-prompt"));
    bindEditor($("#big-prompt"), () => {
      $("#big-counter").textContent = `${promptLen(readPrompt($("#big-prompt")))}/16000`;
    });
    $("#big-prompt").addEventListener("keydown", (e) => {
      if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        const n = sel();
        closeDialog();
        if (n) send(n);
      }
    });

    /* ---------- 键盘 ---------- */
    const typing = (el) =>
      el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
    document.addEventListener("keydown", (e) => {
      const mod = e.metaKey || e.ctrlKey;
      if (e.key === "Escape") {
        if (dlgOpen) return closeDialog();
        if (openPopEl) return closePops();
        if (!typing(document.activeElement)) select(null);
        return;
      }
      if (typing(document.activeElement) || dlgOpen) return;
      const k = e.key.toLowerCase();
      if (mod && k === "z") {
        e.preventDefault();
        e.shiftKey ? redo() : undo();
        return;
      }
      if (mod && k === "y") {
        e.preventDefault();
        redo();
        return;
      }
      if (mod && k === "d") {
        e.preventDefault();
        if (sel()) duplicate(sel());
        return;
      }
      if (mod && k === "c") {
        if (sel()) {
          clipboard = JSON.stringify(sel());
          toast("已复制节点", "info");
        }
        return;
      }
      if (mod && k === "v") {
        if (clipboard) {
          const src = JSON.parse(clipboard);
          src.x += 48;
          src.y += 48;
          duplicate(src, 0);
          clipboard = JSON.stringify(src);
        }
        return;
      }
      if (mod && (k === "=" || k === "+")) {
        e.preventDefault();
        zoomAt(view.k * 1.2, innerWidth / 2, innerHeight / 2);
        return;
      }
      if (mod && k === "-") {
        e.preventDefault();
        zoomAt(view.k / 1.2, innerWidth / 2, innerHeight / 2);
        return;
      }
      if (mod) return;
      if (e.key === "Delete" || e.key === "Backspace") {
        e.preventDefault();
        deleteSel();
        return;
      }
      if (e.key === "Enter" && sel()) {
        e.preventDefault();
        $("#prompt")?.focus();
        return;
      }
      if (e.shiftKey && e.code === "Digit1") {
        fitView();
        return;
      }
      if (e.shiftKey && e.code === "Digit0") {
        const cx = innerWidth / 2,
          cy = innerHeight / 2;
        flyTo(cx - (cx - view.x) / view.k, cy - (cy - view.y) / view.k, 1);
        return;
      }
      if (k === "v") setTool("select");
      if (k === "h") setTool("hand");
      if (k === "?") openDialog($("#dlg-keys"));
      if (e.code === "Space" && !spaceHeld) {
        spaceHeld = true;
        stage.classList.add("hand");
        e.preventDefault();
      }
    });
    document.addEventListener("keyup", (e) => {
      if (e.code === "Space") {
        spaceHeld = false;
        stage.classList.toggle("hand", tool === "hand");
      }
    });

    /* ---------- toast ---------- */
    function toast(msg, kind = "ok") {
      const t = document.createElement("div");
      t.className = "toast " + kind;
      t.innerHTML = `<span class="d"></span>${esc(msg)}`;
      const box = $("#toasts");
      box.appendChild(t);
      while (box.children.length > 3) box.firstChild.remove();
      requestAnimationFrame(() => t.classList.add("in"));
      setTimeout(() => {
        t.classList.remove("in");
        setTimeout(() => t.remove(), 200);
      }, 2400);
    }

    /* ---------- 进入画布：加载层 + 内容入场（三种效果） ---------- */
    const MARK_SVG = `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="8" height="8" rx="2" stroke="#0d0d0e" stroke-width="1.6"/><path d="M10.5 7.2 13.5 5.5v5l-3-1.7" fill="#0d0d0e" stroke="#0d0d0e" stroke-width=".8" stroke-linejoin="round"/></svg>`;
    let loaderStyle = "a",
      booting = false;
    const loaderEl = $("#loader");

    function boot() {
      if (booting) return;
      booting = true;
      closePops();
      document.body.classList.remove("revealing", "no-brand");
      document.body.classList.add("booting");
      loaderEl.className = "ld-" + loaderStyle;
      loaderEl.hidden = false;
      loaderEl.innerHTML =
        `<div class="ld-mark">${MARK_SVG}</div><div class="ld-name">Video Canvas</div>` +
        (loaderStyle === "b" ? `<div class="ld-sub">正在打开「${esc(title.value)}」</div>` : "") +
        (loaderStyle === "c" ? `<div class="ld-bar"><i></i></div>` : "");
      // 模拟拉取画布数据：进度分几步走，C 的进度条跟着动
      const bar = $(".ld-bar i", loaderEl);
      [22, 48, 76, 100].forEach((p, i) =>
        setTimeout(() => bar && (bar.style.width = p + "%"), 160 + i * 260),
      );
      setTimeout(reveal, REDUCE ? 150 : 1350);
    }

    function reveal() {
      const body = document.body;
      // 节点按画布上的先后（先上后下、先左后右）依次出现
      [...nodes]
        .sort((p, q) => p.y - q.y || p.x - q.x)
        .forEach((n, i) => els.get(n.id)?.style.setProperty("--i", i));
      if (loaderStyle === "c") {
        // 品牌归位：大 logo 飞到左上角品牌标的位置并缩成它，落地后真品牌标接上
        const mark = $(".ld-mark", loaderEl),
          target = $("#btn-logo .logo");
        const a = mark.getBoundingClientRect(),
          b = target.getBoundingClientRect();
        body.classList.add("no-brand");
        loaderEl.classList.add("out");
        body.classList.remove("booting");
        body.classList.add("revealing");
        const scale = b.width / a.width;
        const flight = mark.animate(
          [
            { transform: "none", borderRadius: "22px" },
            {
              transform: `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px, ${b.top + b.height / 2 - (a.top + a.height / 2)}px) scale(${scale})`,
              borderRadius: `${7 / scale}px`,
            },
          ],
          { duration: REDUCE ? 0 : 640, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" },
        );
        flight.finished.then(() => {
          body.classList.remove("no-brand");
          finishBoot();
        });
        return;
      }
      loaderEl.classList.add("out");
      body.classList.remove("booting");
      body.classList.add("revealing");
      setTimeout(finishBoot, REDUCE ? 0 : loaderStyle === "b" ? 760 : 520);
    }

    function finishBoot() {
      loaderEl.hidden = true;
      loaderEl.className = "";
      loaderEl.innerHTML = "";
      booting = false;
      // 入场动画都播完再摘掉，免得之后 render 新节点也跟着播一遍
      setTimeout(() => document.body.classList.remove("revealing"), 1200);
    }

    /* 演示面板：切换加载动画（切了就重播）和连线流光 */
    function pickOption(group, btn) {
      $$("button", group).forEach((x) => x.classList.toggle("on", x === btn));
    }
    $("#opt-loader").onclick = (e) => {
      const b = e.target.closest("button[data-v]");
      if (!b) return;
      pickOption($("#opt-loader"), b);
      loaderStyle = b.dataset.v;
      boot();
    };
    $("#btn-replay").onclick = () => boot();
    $("#opt-edge").onclick = (e) => {
      const b = e.target.closest("button[data-v]");
      if (!b) return;
      pickOption($("#opt-edge"), b);
      edgeFx = b.dataset.v;
      renderEdges();
    };

    /* ---------- 启动 ---------- */
    addEventListener("resize", () => {
      layoutOverlay();
      segTo($("#seg-tool"), $("#seg-tool .on"), true);
      segTo($("#seg-view"), $("#seg-view .on"), true);
    });
    render();
    const W = innerWidth,
      H = innerHeight;
    view.k = clampK(Math.min(1, (W - 140) / 1120));
    view.x = W / 2 - 490 * view.k;
    view.y = Math.max(110, H * 0.3 - 118 * view.k);
    apply();
    buildPanel();
    syncUndo();
    syncDemo();
    setSave("idle");
    boot();
    requestAnimationFrame(() => {
      segTo($("#seg-tool"), $("#seg-tool .on"), true);
      segTo($("#seg-view"), $("#seg-view .on"), true);
      layoutOverlay();
    });
  })();
</script>
