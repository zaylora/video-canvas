<title>画布 UI 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link
  rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap"
/>
<style>
  /* 布局：全屏画布 + 五区浮层外壳（左上/右上/底中/左下/右下）+ 屏幕空间的节点历史浮条与生成面板。深色单主题，刻意只做这一套。 */
  :root {
    color-scheme: dark;
    --canvas-bg: #0d0d0e;
    --dot: rgba(255, 255, 255, 0.075);
    --chrome: rgba(28, 28, 30, 0.78);
    --chrome-solid: #1b1b1d;
    --chrome-border: rgba(255, 255, 255, 0.08);
    --surface: #161618;
    --surface-2: #232326;
    --surface-3: #2e2e32;
    --fg: #f4f4f5;
    --fg-2: #a1a1aa;
    --fg-3: #6b6b73;
    --node-ring: rgba(255, 255, 255, 0.72);
    --edge: rgba(255, 255, 255, 0.28);
    --credit: #f2c14e;
    --ok: #4ade80;
    --warn: #fbbf24;
    --bad: #f87171;
    --run: #7cb4ff;
    --font: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
    --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
    --e-out: cubic-bezier(0.2, 0, 0, 1);
  }
  html,
  body {
    height: 100%;
  }
  body {
    background: var(--canvas-bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 14px;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    cursor: pointer;
    padding: 0;
  }
  button:focus-visible,
  input:focus-visible,
  textarea:focus-visible {
    outline: 2px solid var(--node-ring);
    outline-offset: 2px;
  }
  svg.i {
    width: 16px;
    height: 16px;
    flex: none;
    fill: none;
    stroke: currentColor;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .num {
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 画布 ---------- */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    touch-action: none;
    cursor: default;
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px);
  }
  #stage.grid {
    background-image:
      linear-gradient(var(--dot) 1px, transparent 1px),
      linear-gradient(90deg, var(--dot) 1px, transparent 1px);
  }
  #stage.plain {
    background-image: none;
  }
  #stage.hand {
    cursor: grab;
  }
  #stage.panning {
    cursor: grabbing;
  }
  #world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
  }
  svg.edges {
    position: absolute;
    left: 0;
    top: 0;
    width: 1px;
    height: 1px;
    overflow: visible;
    pointer-events: none;
  }
  .edges path {
    fill: none;
    vector-effect: non-scaling-stroke;
  }
  .edges .base {
    stroke: var(--edge);
    stroke-width: 1.5;
    transition: stroke 0.18s;
  }
  .edges .hot .base {
    stroke: rgba(255, 255, 255, 0.5);
  }
  /* 流光颜色：平时白色，下游生成中换成蓝色并加速 */
  .edges g {
    --fx: rgba(255, 255, 255, 0.85);
    --speed: 1;
  }
  .edges g.hot {
    --fx: #fff;
  }
  .edges g.run {
    --fx: var(--run);
    --speed: 0.45;
  }
  /* A 彗星：一段带辉光的亮带从上游跑向下游 */
  .fx-comet-glow {
    stroke: var(--fx);
    stroke-width: 6;
    stroke-linecap: round;
    opacity: 0.28;
    filter: blur(3px);
    stroke-dasharray: 16 84;
    animation: comet calc(2.2s * var(--speed)) cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  .fx-comet-core {
    stroke: var(--fx);
    stroke-width: 2;
    stroke-linecap: round;
    stroke-dasharray: 10 90;
    animation: comet calc(2.2s * var(--speed)) cubic-bezier(0.45, 0, 0.55, 1) infinite;
  }
  @keyframes comet {
    from {
      stroke-dashoffset: 16;
    }
    to {
      stroke-dashoffset: -84;
    }
  }
  /* B 光带：渐变描边，渐变本身沿线平移 */
  .fx-sweep {
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  /* C 粒子流：圆头的零长度虚线就是一颗颗光点，偏移量滚动让它们流向下游 */
  .fx-dots {
    stroke: var(--fx);
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-dasharray: 0 13;
    animation: dots calc(0.9s * var(--speed)) linear infinite;
  }
  .fx-dots-glow {
    stroke: var(--fx);
    stroke-width: 7;
    stroke-linecap: round;
    opacity: 0.18;
    filter: blur(2px);
    stroke-dasharray: 0 13;
    animation: dots calc(0.9s * var(--speed)) linear infinite;
  }
  @keyframes dots {
    to {
      stroke-dashoffset: -13;
    }
  }

  .node {
    position: absolute;
  }
  .node-head {
    position: absolute;
    left: 2px;
    right: 2px;
    bottom: calc(100% + 8px);
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    font-weight: 600;
    white-space: nowrap;
    color: var(--fg);
  }
  .node-head .st {
    margin-left: auto;
    font-weight: 500;
    font-size: 12px;
    color: var(--run);
    font-family: var(--mono);
  }
  .node-head .st.bad {
    color: var(--bad);
    font-family: var(--font);
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    border-radius: 16px;
    overflow: hidden;
    background: var(--surface);
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.06);
    transition: box-shadow 0.12s var(--e-out);
  }
  .node:hover .card {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.2);
  }
  .node.sel .card {
    box-shadow:
      0 0 0 2px var(--node-ring),
      0 12px 40px rgba(0, 0, 0, 0.5);
  }
  .node.empty .card {
    background: #141416;
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.08);
  }
  .node.empty.sel .card {
    box-shadow:
      inset 0 0 0 1.5px rgba(255, 255, 255, 0.12),
      0 0 0 2px var(--node-ring);
  }
  .media {
    position: absolute;
    inset: 0;
    background-size: cover;
  }
  .media.next {
    opacity: 0;
  }
  .media .tag {
    position: absolute;
    right: 8px;
    bottom: 8px;
    font-size: 11px;
    padding: 2px 6px;
    border-radius: 6px;
    background: rgba(0, 0, 0, 0.45);
    color: rgba(255, 255, 255, 0.7);
  }
  .empty-hint {
    position: absolute;
    inset: 0;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 10px;
    color: var(--fg-3);
    font-size: 12px;
  }
  .empty-hint svg.i {
    width: 30px;
    height: 30px;
    stroke-width: 1.4;
  }
  .shimmer {
    position: absolute;
    inset: 0;
    display: none;
    background: linear-gradient(
        100deg,
        transparent 30%,
        rgba(255, 255, 255, 0.06) 50%,
        transparent 70%
      )
      #18181b;
    background-size: 200% 100%;
    animation: shimmer 1.4s linear infinite;
  }
  .node.running .shimmer {
    display: block;
  }
  @keyframes shimmer {
    from {
      background-position: 150% 0;
    }
    to {
      background-position: -50% 0;
    }
  }
  .prog {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    height: 2px;
    background: rgba(255, 255, 255, 0.06);
    display: none;
  }
  .node.running .prog {
    display: block;
  }
  .prog i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--run);
    transition: width 0.2s linear;
  }
  .fail {
    position: absolute;
    inset: 0;
    display: none;
    place-content: center;
    justify-items: center;
    gap: 8px;
    text-align: center;
    padding: 16px;
    color: var(--fg-2);
    font-size: 12px;
    background: #161214;
  }
  .node.failed .fail {
    display: grid;
  }
  .fail b {
    color: var(--bad);
    font-weight: 600;
    font-size: 13px;
  }
  .fail button {
    margin-top: 4px;
    padding: 5px 12px;
    border-radius: 999px;
    background: var(--surface-3);
    font-size: 12px;
  }
  .textout {
    position: absolute;
    inset: 0;
    padding: 16px;
    font-size: 13px;
    line-height: 1.7;
    color: var(--fg-2);
    overflow: hidden;
  }
  .wave {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    padding: 0 24px;
  }
  .wave i {
    flex: 1;
    max-width: 4px;
    border-radius: 2px;
    background: rgba(255, 255, 255, 0.4);
  }

  .port {
    position: absolute;
    top: 50%;
    width: 28px;
    height: 28px;
    margin-top: -14px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    color: var(--fg-2);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.35);
    background: var(--canvas-bg);
    opacity: 0;
    transform: scale(0.6);
    transition:
      opacity 0.12s var(--e-out),
      transform 0.18s var(--e-out),
      color 0.12s,
      box-shadow 0.12s;
  }
  .port svg.i {
    width: 14px;
    height: 14px;
  }
  .port.l {
    left: -48px;
  }
  .port.r {
    right: -48px;
  }
  .node:hover .port,
  .node.sel .port {
    opacity: 1;
    transform: scale(1);
  }
  .port:hover {
    color: var(--fg);
    box-shadow: inset 0 0 0 1.5px var(--fg);
    transform: scale(1.1) !important;
  }

  /* ---------- 外壳胶囊 ---------- */
  .zone {
    position: fixed;
    display: flex;
    align-items: center;
    gap: 8px;
    z-index: 20;
  }
  .z-tl {
    left: 12px;
    top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .z-tr {
    right: 12px;
    top: calc(12px + env(safe-area-inset-top, 0px));
  }
  .z-bc {
    left: 50%;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
  }
  .z-bl {
    left: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .z-br {
    right: 12px;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  }
  .pill {
    display: flex;
    align-items: center;
    gap: 2px;
    height: 40px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--chrome);
    backdrop-filter: blur(20px) saturate(1.4);
    -webkit-backdrop-filter: blur(20px) saturate(1.4);
    box-shadow:
      0 0 0 1px var(--chrome-border),
      0 8px 24px rgba(0, 0, 0, 0.35);
  }
  .pill.big {
    height: 52px;
    padding: 0 6px;
    gap: 4px;
  }
  .sep {
    width: 1px;
    height: 18px;
    background: var(--chrome-border);
    margin: 0 4px;
    flex: none;
  }
  .ib {
    position: relative;
    height: 32px;
    min-width: 32px;
    padding: 0 8px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    color: var(--fg-2);
    transition:
      background 0.12s,
      color 0.12s,
      transform 0.12s;
    white-space: nowrap;
  }
  .ib:hover {
    background: rgba(255, 255, 255, 0.07);
    color: var(--fg);
  }
  .ib:active {
    transform: scale(0.96);
  }
  .ib[disabled] {
    opacity: 0.35;
    pointer-events: none;
  }
  .pill.big .ib {
    height: 40px;
    min-width: 40px;
  }
  .ib.primary {
    background: var(--fg);
    color: #0d0d0e;
    width: 40px;
    padding: 0;
  }
  .ib.primary:hover {
    background: #fff;
    color: #0d0d0e;
  }
  .ib.primary svg.i {
    width: 20px;
    height: 20px;
    stroke-width: 2.2;
  }
  .ib.on {
    color: var(--fg);
  }
  .kbd {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--fg-3);
  }

  .seg {
    position: relative;
    display: flex;
    align-items: center;
    gap: 2px;
  }
  .seg-ind {
    position: absolute;
    left: 0;
    top: 50%;
    height: 32px;
    margin-top: -16px;
    width: 0;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.12);
    pointer-events: none;
  }
  .pill.big .seg-ind {
    height: 40px;
    margin-top: -20px;
  }
  .no-motion-lib .seg-ind {
    transition:
      transform 0.22s cubic-bezier(0.3, 1.25, 0.5, 1),
      width 0.22s cubic-bezier(0.3, 1.25, 0.5, 1);
  }
  .seg > button {
    position: relative;
    z-index: 1;
  }

  .brand {
    width: 34px;
    height: 30px;
    border-radius: 999px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 2px;
    color: var(--fg);
  }
  .brand .logo {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    background: var(--fg);
    display: grid;
    place-items: center;
  }
  .brand .logo i {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--canvas-bg);
    box-shadow: 5px 0 0 -1px var(--canvas-bg);
    transform: translateX(-2px);
  }
  .title-in {
    width: 9ch;
    min-width: 4ch;
    max-width: 28ch;
    background: transparent;
    border: 0;
    color: var(--fg);
    font: 600 14px var(--font);
    padding: 4px 6px;
    border-radius: 8px;
  }
  .title-in:hover {
    background: rgba(255, 255, 255, 0.06);
  }
  .title-in:focus {
    background: rgba(255, 255, 255, 0.08);
    outline: none;
  }
  .proto {
    font-size: 11px;
    color: var(--fg-3);
    padding: 2px 7px;
    border-radius: 999px;
    box-shadow: inset 0 0 0 1px var(--chrome-border);
  }
  .save {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--fg-3);
    padding: 0 8px 0 4px;
    height: 32px;
    border-radius: 999px;
  }
  .save .lbl {
    max-width: 80px;
    overflow: hidden;
    transition:
      max-width 0.24s var(--e-out),
      opacity 0.18s;
  }
  .save.idle .lbl {
    max-width: 0;
    opacity: 0;
  }
  .save.saving svg.i {
    animation: spin 1s linear infinite;
  }
  .save.error {
    color: var(--bad);
    cursor: pointer;
  }
  .save.error:hover {
    background: rgba(248, 113, 113, 0.1);
  }
  @keyframes spin {
    to {
      transform: rotate(360deg);
    }
  }

  .credits {
    gap: 6px;
    padding: 0 12px 0 10px;
    color: var(--fg);
    font-weight: 600;
    font-family: var(--mono);
  }
  .credits .spark {
    color: var(--credit);
    fill: var(--credit);
    stroke: none;
  }
  .ws {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 3px rgba(74, 222, 128, 0.15);
  }
  .ws.down {
    background: var(--warn);
    box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.18);
    animation: blink 1s ease-in-out infinite;
  }
  @keyframes blink {
    50% {
      opacity: 0.35;
    }
  }
  .avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: grid;
    place-items: center;
    font-weight: 600;
    font-size: 14px;
    background: conic-gradient(from 200deg, #3b3b40, #6b6b73, #3b3b40);
    box-shadow: 0 0 0 1px var(--chrome-border);
  }
  .stat {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--fg-2);
    padding: 0 8px;
    height: 32px;
    border-radius: 999px;
  }
  .stat.warn {
    color: var(--warn);
  }
  button.stat:hover {
    background: rgba(255, 255, 255, 0.07);
  }
  .zoom-v {
    font-family: var(--mono);
    font-size: 12px;
    min-width: 64px;
  }

  /* ---------- 弹出层 ---------- */
  .pop {
    position: fixed;
    z-index: 60;
    min-width: 200px;
    padding: 6px;
    border-radius: 14px;
    background: var(--chrome-solid);
    box-shadow:
      0 0 0 1px var(--chrome-border),
      0 16px 48px rgba(0, 0, 0, 0.55);
    opacity: 0;
    visibility: hidden;
    transform: translateY(var(--dy, 4px)) scale(0.96);
    pointer-events: none;
    transition:
      opacity 0.13s var(--e-out),
      transform 0.13s var(--e-out),
      visibility 0s 0.13s;
  }
  .pop.open {
    opacity: 1;
    visibility: visible;
    transform: none;
    pointer-events: auto;
    transition:
      opacity 0.18s var(--e-out),
      transform 0.18s var(--e-out);
  }
  .mi {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 8px 10px;
    border-radius: 9px;
    font-size: 13px;
    color: var(--fg);
    text-align: left;
  }
  .mi:hover,
  .mi:focus-visible {
    background: rgba(255, 255, 255, 0.07);
    outline: none;
  }
  .mi svg.i {
    color: var(--fg-2);
  }
  .mi .kbd,
  .mi .r {
    margin-left: auto;
  }
  .mi .ck {
    margin-left: auto;
    color: var(--fg);
    visibility: hidden;
  }
  .mi.checked .ck {
    visibility: visible;
  }
  .mi .sub {
    display: block;
    font-size: 11px;
    color: var(--fg-3);
    margin-top: 1px;
  }
  .mlabel {
    padding: 8px 10px 4px;
    font-size: 11px;
    color: var(--fg-3);
    letter-spacing: 0.04em;
  }
  .msep {
    height: 1px;
    background: var(--chrome-border);
    margin: 6px 4px;
  }
  .prow {
    padding: 6px 8px;
    display: grid;
    gap: 6px;
  }
  .prow .k {
    font-size: 11px;
    color: var(--fg-3);
  }
  .chips {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
  }
  .chip-o {
    padding: 5px 10px;
    border-radius: 8px;
    font-size: 12px;
    background: var(--surface-2);
    color: var(--fg-2);
  }
  .chip-o:hover {
    color: var(--fg);
  }
  .chip-o.on {
    background: var(--fg);
    color: #0d0d0e;
  }
  .ledger {
    display: grid;
    gap: 2px;
    padding: 4px 6px 6px;
    font-size: 12px;
  }
  .ledger div {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    color: var(--fg-2);
    padding: 4px 4px;
  }
  .ledger .neg {
    color: var(--fg);
    font-family: var(--mono);
  }
  .ledger .pos {
    color: var(--ok);
    font-family: var(--mono);
  }
  .bal {
    padding: 10px 10px 6px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .bal b {
    font: 600 24px var(--mono);
  }

  /* ---------- 节点历史浮条 ---------- */
  #hist {
    position: fixed;
    z-index: 15;
    left: 0;
    top: 0;
    display: flex;
    align-items: center;
    height: 40px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--chrome);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 0 0 1px var(--chrome-border),
      0 8px 24px rgba(0, 0, 0, 0.35);
    opacity: 0;
    transform: translateY(6px) scale(0.97);
    pointer-events: none;
    transition:
      opacity 0.18s var(--e-out),
      transform 0.18s var(--e-out);
  }
  #hist.show {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  #hist.dim,
  #panel.dim {
    opacity: 0.35 !important;
    pointer-events: none !important;
  }
  #hist .cnt {
    font-family: var(--mono);
    font-size: 11px;
    color: #0d0d0e;
    background: var(--fg);
    border-radius: 999px;

  #hist .thumbs {

  .thumb {

  .thumb-ring {
    position: absolute;

    top: 0;

  .ring-st {

  /* ---------- 生成面板 ---------- */
  #panel {
    position: fixed;
    z-index: 16;
    left: 0;
    top: 0;
    padding: 14px;
    border-radius: 22px;
    background: rgba(24, 24, 27, 0.94);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow:
      0 0 0 1px var(--chrome-border),
      0 24px 64px rgba(0, 0, 0, 0.55);
    display: grid;
    gap: 12px;
    opacity: 0;
    transform: translateY(var(--pdy, -6px)) scale(0.98);
    pointer-events: none;
    transition:
      opacity 0.18s var(--e-out),
      transform 0.18s var(--e-out);
  }
  #panel.show {
    opacity: 1;
    transform: none;
    pointer-events: auto;
  }
  .p-top {

    align-items: flex-start;
    gap: 8px;
    min-width: 0;
  }
  .tabs {

  .tabs button {
    height: 30px;
    padding: 0 14px;
    border-radius: 999px;
    font-size: 13px;
    color: var(--fg-2);

    transition: color 0.12s;
  }
  .tabs button.on {
    color: var(--fg);
  }
  .expand {
    margin-left: auto;
    width: 32px;
    height: 32px;
    border-radius: 9px;
    display: grid;
    place-items: center;
    color: var(--fg-2);
    box-shadow: inset 0 0 0 1px var(--chrome-border);
    flex: none;
  }
  .expand:hover {
    color: var(--fg);
    background: rgba(255, 255, 255, 0.06);
  }
  /* 引用条：所有节点的面板顶部都有，列出接进来的上游（连线 = 引用），横向放不下就滚动 */
  .refs {
    display: flex;
    gap: 8px;
    align-items: center;
    min-width: 0;
    overflow-x: auto;
    scrollbar-width: none;
    padding: 2px;
    margin: -2px;
  }
  .ref {
    position: relative;
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 10px;
    background-size: cover;
    background-position: center;
    box-shadow: 0 0 0 1px var(--chrome-border);
    display: grid;
    place-items: center;
    color: var(--fg-2);
    background-color: var(--surface-2);
    cursor: pointer;
    transition:
      box-shadow 0.12s,
      opacity 0.12s,
      transform 0.12s;
  }
  .ref:hover,
  .ref.hl {
    box-shadow: 0 0 0 2px var(--node-ring);
  }
  .ref:active {
    transform: scale(0.96);
  }
  .ref:focus-visible {
    outline: 2px solid var(--node-ring);
    outline-offset: 2px;
  }
  .ref.txt {
    place-items: start;
    padding: 21px 6px 4px;
    font-size: 9.5px;
    line-height: 1.35;
    color: var(--fg-2);
    text-align: left;
    overflow: hidden;
  }
  .ref.txt span {
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .ref.aud svg.i {
    width: 22px;
    height: 22px;
    color: var(--ok);
  }
  .ref.none {
    background: transparent;
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12);
    color: var(--fg-3);
  }
  .ref.unused {
    opacity: 0.4;
  }
  .ref .kb {
    position: absolute;
    right: 3px;
    bottom: 3px;
    width: 16px;
    height: 16px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.6);
    color: var(--fg);
  }
  .ref .kb svg.i {
    width: 10px;
    height: 10px;
    stroke-width: 2.4;
  }
  .node.ref-hl .card {
    outline: 2px dashed var(--node-ring);
    outline-offset: 4px;
  }
  .ref .lk {
    position: absolute;
    left: 3px;
    top: 3px;
    width: 16px;
    height: 16px;
    border-radius: 5px;
    display: grid;
    place-items: center;
    background: rgba(0, 0, 0, 0.6);
  }
  .ref .lk svg.i {
    width: 10px;
    height: 10px;
    stroke-width: 2.4;
  }
  .addref {
    flex: none;
    width: 56px;
    height: 56px;
    border-radius: 10px;
    display: grid;
    place-items: center;
    color: var(--fg-3);
    box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12);
    border: 0;
    background-image: none;
    outline-offset: 2px;
  }
  .addref {
    box-shadow: none;
    border: 1.5px dashed rgba(255, 255, 255, 0.18);
  }
  .addref:hover {
    color: var(--fg);
    border-color: rgba(255, 255, 255, 0.4);
  }
  .ta-wrap {
    position: relative;
  }
  /* 提示词编辑器：可编辑的 div，@ 进来的素材是不可编辑的 chip，整体删除 */
  .pe {
    width: 100%;
    color: var(--fg);
    font: 15px/1.75 var(--font);
    padding: 0 2px;
    min-height: 52px;
    max-height: 214px;

    white-space: pre-wrap;
    word-break: break-word;
    cursor: text;
  }
  .pe.is-empty::before {

    position: absolute;
  }
  .pe:focus {
    outline: none;
  }
  .mention {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    max-width: 168px;
    margin: 0 2px;
    padding: 0 8px 0 3px;
    border-radius: 7px;
    vertical-align: -7px;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--chrome-border);

  .mention .mi-ic {

  }
  .mention .mi-ic.aud svg.i {

  }
  .mention .ml {
    overflow: hidden;

    white-space: nowrap;
  }
  .mention.hl {
    box-shadow: inset 0 0 0 1.5px var(--node-ring);
    background: var(--surface-3);
  }
  .mention.gone {
    background: transparent;
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.14);
    color: var(--fg-3);
  }
  .mention.gone .ml {
    text-decoration: line-through;
  }
  .mention.gone .mi-ic {
    opacity: 0.35;
  }
  /* ---------- 节点预设（设计稿 6.13）：底栏入口、提示词里的预设 chip、选择器 ---------- */
  :root {
    --preset: oklch(0.6 0.19 295);
  }
  .pt {
    position: relative;
    display: inline-grid;
    place-items: center;
    width: 36px;
    height: 34px;
    border-radius: 999px;
    color: var(--fg-2);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    transition:
      background 0.12s,
      color 0.12s,
      transform 0.12s;
  }
  .pt:hover {
    background: rgba(255, 255, 255, 0.06);
    color: var(--fg);
  }
  .pt:active {
    transform: scale(0.96);
  }
  .pt.on,
  .pt[aria-expanded="true"] {
    background: rgba(255, 255, 255, 0.1);
    color: var(--fg);
  }
  .pt[aria-disabled="true"] {
    opacity: 0.4;
    pointer-events: none;
  }
  .pt svg.i {
    width: 17px;
    height: 17px;
  }
  .pt .dot {
    position: absolute;
    top: 4px;
    right: 6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--preset);
    box-shadow: 0 0 0 2px #232326;
  }
  .pt .cnt {
    position: absolute;
    top: 0;
    right: 0;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border-radius: 8px;
    background: var(--preset);
    color: #fff;
    font: 600 10px/15px var(--mono);
    text-align: center;
  }
  .pchip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    height: 26px;
    max-width: 168px;
    margin: 0 2px;
    padding: 0 8px 0 3px;
    border-radius: 7px;
    vertical-align: -7px;
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--chrome-border);
    font-weight: 600;
    font-size: 13px;
    color: var(--fg);
    cursor: pointer;
    transition: background 0.12s;
  }
  .pchip:hover {
    background: var(--surface-3);
  }
  .pchip .pi {
    flex: none;
    width: 20px;
    height: 20px;
    border-radius: 5px;
    background: var(--preset);
    color: #fff;
    display: grid;
    place-items: center;
  }
  .pchip .pi svg.i {
    width: 12px;
    height: 12px;
  }
  .pchip .ml {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .pchip.gone {
    background: transparent;
    color: var(--fg-3);
  }
  .pchip.gone .ml {
    text-decoration: line-through;
  }
  /* 只放了模板、还没写字：占位文字跟在 chip 后面 */
  .pe.tpl-only::after {
    content: attr(data-ph2);
    color: var(--fg-3);
    pointer-events: none;
  }
  #pop-preset {
    z-index: 70;
    padding: 0;
    width: min(620px, calc(100vw - 16px));
    overflow: hidden;
  }
  .pk-tabs {
    display: flex;
    gap: 4px;
    padding: 10px 10px 6px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .pk-tabs::-webkit-scrollbar {
    display: none;
  }
  .pk-tab {
    flex: none;
    height: 28px;
    padding: 0 11px;
    border-radius: 999px;
    font-size: 12px;
    color: var(--fg-2);
    transition:
      background 0.12s,
      color 0.12s;
  }
  .pk-tab:hover {
    color: var(--fg);
  }
  .pk-tab.on {
    background: var(--surface-3);
    color: var(--fg);
  }
  .pk-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    padding: 6px 10px 10px;
    max-height: min(318px, 46vh);
    overflow-y: auto;
  }
  .pk-card {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    aspect-ratio: 16 / 9;
    background: var(--surface-3);
    text-align: left;
    outline: none;
    box-shadow: inset 0 0 0 1px var(--chrome-border);
    transition:
      box-shadow 0.12s,
      transform 0.12s;
  }
  .pk-grid.sq .pk-card {
    aspect-ratio: 1;
  }
  .pk-card:active {
    transform: scale(0.97);
  }
  .pk-card:hover,
  .pk-card:focus-visible {
    box-shadow: inset 0 0 0 1.5px var(--node-ring);
  }
  .pk-card.on {
    box-shadow: 0 0 0 2px var(--preset);
  }
  .pk-card img,
  .pk-card canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .pk-card .nm {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 14px 8px 5px;
    font-size: 12px;
    font-weight: 600;
    color: #fff;
    background: linear-gradient(transparent, rgba(0, 0, 0, 0.62));
  }
  .pk-card .ck {
    position: absolute;
    top: 5px;
    right: 5px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--preset);
    color: #fff;
    display: none;
    place-items: center;
  }
  .pk-card.on .ck {
    display: grid;
  }
  .pk-card .ck svg.i {
    width: 11px;
    height: 11px;
    stroke-width: 3;
  }
  /* 信息条会随悬停变高，弹窗锚在底部就会上下抖，已取消；留着节点只为不动脚本 */
  .pk-foot {
    display: none !important;
  }
  .pk-foot-old {
    display: flex;
    align-items: center;
    gap: 12px;

  .pk-foot .refs {

  .pk-foot .refs span {

    background-position: center;
    box-shadow: inset 0 0 0 1px var(--chrome-border);
  }
  .tpl-cols {

  .tpl-cols .gap {

  .tpl-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 6px 8px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    text-align: left;
    color: var(--fg);
    outline: none;
    transition: background 0.12s;
  }
  .tpl-item:hover,
  .tpl-item:focus-visible {
    background: rgba(255, 255, 255, 0.07);
  }
  .tpl-item .ti {

    width: 34px;

    place-items: center;
    color: var(--fg-2);
  }

    width: 17px;
    height: 17px;
  }
  .tpl-item.on .ti {
    background: var(--preset);
    color: #fff;
  }
  .tpl-item[aria-disabled="true"] {
    opacity: 0.4;
  }
  @media (max-width: 860px) {
    .pk-grid {
      grid-template-columns: repeat(3, 1fr);
    }
    .tpl-cols {
      grid-template-columns: 1fr 1fr;
    }
  }
  @media (max-width: 520px) {
    .pk-grid {
      grid-template-columns: repeat(2, 1fr);
    }
    .tpl-cols {
      grid-template-columns: 1fr;
    }

      display: none;
    }
  }
  /* @ 菜单：贴着光标，放不下翻到光标上方 */

      opacity 0.18s var(--e-out),

  /* 流光层用画布单位：虚线间距、亮带长度跟着缩放走，pathLength 才算得准 */
  .edges path:not(.base) {
    vector-effect: none;
  }

  /* ---------- 进入画布的加载层 ---------- */
  @property --hole {
    syntax: "<length>";
    inherits: false;
    initial-value: 0px;
  }
  @property --ripple {
    syntax: "<length>";
    inherits: false;
    initial-value: 0px;
  }
  #loader {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: grid;
    place-content: center;
    justify-items: center;
    gap: 22px;
    background-color: var(--canvas-bg);
    background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px);
    background-size: 20px 20px;
    background-position: center;
  }
  #loader[hidden] {
    display: none;
  }
  .ld-mark {
    width: 72px;
    height: 72px;
    border-radius: 22px;
    background: var(--fg);
    display: grid;
    place-items: center;
  }
  .ld-mark svg {
    width: 40px;
    height: 40px;
  }
  .ld-name {
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: var(--fg);
  }
  .ld-sub {
    font-size: 12px;
    color: var(--fg-3);
    margin-top: -14px;
  }
  .ld-bar {
    width: 140px;
    height: 3px;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }
  .ld-bar i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--fg);
    transition: width 0.25s var(--e-out);
  }
  /* A 聚焦显影 */
  .ld-a .ld-mark,
  .ld-a .ld-name {
    animation: focusIn 0.9s var(--e-out) both;
  }
  .ld-a .ld-name {
    animation-delay: 0.12s;
  }
  .ld-a.out .ld-mark,
  .ld-a.out .ld-name {
    animation: focusOut 0.32s cubic-bezier(0.4, 0, 1, 1) both;
  }
  .ld-a.out {
    transition: opacity 0.38s 0.1s;
    opacity: 0;
  }
  @keyframes focusIn {
    from {
      opacity: 0;
      filter: blur(16px);
      transform: scale(1.12);
    }
    to {
      opacity: 1;
      filter: blur(0);
      transform: none;
    }
  }
  @keyframes focusOut {
    to {
      opacity: 0;
      filter: blur(10px);
      transform: scale(0.94);
    }
  }
  /* B 点阵涟漪：一圈更亮的点阵从中心往外扩；结束时中心开洞，画布从洞里露出来 */
  .ld-b::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image: radial-gradient(circle, rgba(255, 255, 255, 0.55) 1.1px, transparent 1.5px);
    background-size: 20px 20px;
    background-position: center;
    -webkit-mask: radial-gradient(
      circle at 50% 50%,
      transparent calc(var(--ripple) - 60px),
      #000 var(--ripple),
      transparent calc(var(--ripple) + 60px)
    );
    mask: radial-gradient(
      circle at 50% 50%,
      transparent calc(var(--ripple) - 60px),
      #000 var(--ripple),
      transparent calc(var(--ripple) + 60px)
    );
    animation: ripple 1.6s cubic-bezier(0.3, 0, 0.3, 1) infinite;
  }
  @keyframes ripple {
    from {
      --ripple: 0px;
      opacity: 1;
    }
    to {
      --ripple: 75vmax;
      opacity: 0;
    }
  }
  .ld-b .ld-mark {
    background: transparent;
    box-shadow: inset 0 0 0 2px var(--fg);
  }
  .ld-b .ld-mark svg * {
    stroke: var(--fg);
    stroke-dasharray: 60;
    stroke-dashoffset: 60;
    animation: draw 1.1s var(--e-out) 0.1s forwards;
  }
  .ld-b .ld-mark svg path[fill] {
    fill: var(--fg);
    fill-opacity: 0;
    animation:
      draw 1.1s var(--e-out) 0.1s forwards,
      fillIn 0.4s 0.9s forwards;
  }
  @keyframes draw {
    to {
      stroke-dashoffset: 0;
    }
  }
  @keyframes fillIn {
    to {
      fill-opacity: 1;
    }
  }
  .ld-b {
    -webkit-mask: radial-gradient(
      circle at 50% 45%,
      transparent var(--hole),
      #000 calc(var(--hole) + 1px)
    );
    mask: radial-gradient(circle at 50% 45%, transparent var(--hole), #000 calc(var(--hole) + 1px));
  }
  .ld-b.out {
    transition: --hole 0.7s cubic-bezier(0.65, 0, 0.35, 1);
    --hole: 120vmax;
  }
  .ld-b .ld-name,
  .ld-b .ld-sub {
    animation: rise 0.6s var(--e-out) 0.3s both;
  }
  @keyframes rise {
    from {
      opacity: 0;
      transform: translateY(6px);
    }
  }
  /* C 品牌归位：大 logo 飞去左上角变成品牌标，其余淡出 */
  .ld-c .ld-mark {
    animation: popIn 0.5s cubic-bezier(0.3, 1.3, 0.5, 1) both;
    transform-origin: center;
  }
  .ld-c .ld-name,
  .ld-c .ld-bar {
    animation: rise 0.5s var(--e-out) 0.15s both;
  }
  .ld-c.out {
    background-color: transparent;
    background-image: none;
    transition: background-color 0.35s;
  }
  .ld-c.out .ld-name,
  .ld-c.out .ld-bar {
    transition: opacity 0.2s;
    opacity: 0;
  }
  @keyframes popIn {
    from {
      opacity: 0;
      transform: scale(0.6);
    }
  }

  /* 画布内容的入场：加载层撤下时依次出现 */
  .booting .zone,
  .booting #world,
  .booting #hist,
  .booting #panel,
  .booting #fxdemo {
    opacity: 0;
  }
  .revealing .node {
    animation: nodeIn 0.55s var(--e-out) both;
    animation-delay: calc(var(--i, 0) * 70ms + 80ms);
  }
  .revealing .edges {
    animation: fadeIn 0.5s 0.3s both;
  }
  .revealing .z-tl,
  .revealing .z-tr {
    animation: dropIn 0.45s var(--e-out) both;
    animation-delay: 0.1s;
  }
  .revealing .z-bc,
  .revealing .z-bl,
  .revealing .z-br {
    animation: liftIn 0.45s var(--e-out) both;
    animation-delay: 0.18s;
  }
  .revealing .z-bc {
    animation-name: liftInC;
  }
  .revealing #panel.show,
  .revealing #hist.show {
    animation: fadeIn 0.4s 0.45s both;
  }
  .revealing.no-brand #btn-logo .logo {
    opacity: 0;
  }
  @keyframes nodeIn {
    from {
      opacity: 0;
      filter: blur(8px);
      transform: scale(0.97) translateY(8px);
    }
  }
  @keyframes fadeIn {
    from {
      opacity: 0;
    }
  }
  @keyframes dropIn {
    from {
      opacity: 0;
      transform: translateY(-10px);
    }
  }
  @keyframes liftIn {
    from {
      opacity: 0;
      transform: translateY(10px);
    }
  }
  @keyframes liftInC {
    from {
      opacity: 0;
      transform: translate(-50%, 10px);
    }
    to {
      transform: translate(-50%, 0);
    }
  }

  /* ---------- 原型演示：切换加载动画和流光效果 ---------- */
  #fxdemo {
    position: fixed;
    z-index: 30;
    top: calc(64px + env(safe-area-inset-top, 0px));

    box-shadow:
      0 0 0 1px var(--chrome-border),

  }
  #fxdemo .lab {

  #fxdemo .opts {

  #fxdemo .opts button {

  #fxdemo .opts button:hover {

  @media (max-width: 860px) {

    .z-br,

<div class="pop" id="pop-mention" role="listbox" aria-label="引用画布素材"></div>

<div class="backdrop" id="backdrop"></div>
<div class="dialog" id="dlg-prompt" role="dialog" aria-label="编辑提示词">
  <h3>
    编辑提示词<button class="ib x" data-close aria-label="收起">
      <span data-icon="min"></span>
    </button>
  </h3>
  <div
    class="pe"
    id="big-prompt"
    contenteditable="true"
    role="textbox"
    aria-multiline="true"
    data-ph="描述画面、镜头运动和节奏…，输入 @ 引用画布里的素材"
  ></div>
  <div class="counter num" id="big-counter" style="margin-top: 8px">0/16000</div>
</div>
<div
  class="dialog"
  id="dlg-keys"
  role="dialog"
  aria-label="快捷键"
  style="width: min(420px, calc(100vw - 32px))"
>
  <h3>
    快捷键<button class="ib x" data-close aria-label="关闭"><span data-icon="x"></span></button>
  </h3>
  <div class="keys">
    <span>发送生成</span><kbd>⌘ ↵</kbd> <span>聚焦提示词</span><kbd>↵</kbd> <span>撤销 / 重做</span
    ><kbd>⌘Z / ⇧⌘Z</kbd> <span>复制 / 粘贴 / 原地复制</span><kbd>⌘C / ⌘V / ⌘D</kbd>
    <span>删除选中</span><kbd>⌫</kbd> <span>选择 / 抓手 / 临时抓手</span><kbd>V / H / 空格</kbd>
    <span>适应画布 / 100%</span><kbd>⇧1 / ⇧0</kbd> <span>取消选中、关闭弹层</span><kbd>Esc</kbd>
  </div>
</div>
<div id="toasts"></div>

<!-- 进入画布前的加载层：三种效果由下面的演示面板切换 -->
<div id="loader" class="ld-a" role="status" aria-label="正在打开画布"></div>

<!-- 原型演示：切换加载动画和连线流光 -->
<div id="fxdemo">
  <div class="grp">
    <span class="lab">加载动画</span>
    <div class="opts" id="opt-loader">
      <button data-v="a" class="on">聚焦显影</button><button data-v="b">点阵涟漪</button
      ><button data-v="c">品牌归位</button>
    </div>
    <button class="replay" id="btn-replay" title="重新播放进入画布的过程">
      <span data-icon="redo" data-size="13"></span>重播
    </button>
  </div>
  <div class="grp">
    <span class="lab">连线流光</span>
    <div class="opts" id="opt-edge">
      <button data-v="comet" class="on">彗星</button><button data-v="sweep">光带</button
      ><button data-v="dots">粒子流</button>
    </div>
  </div>
</div>

    /* ---------- 撤销 / 重做：节点和连线的快照 ---------- */
    const snap = () => JSON.stringify({ nodes, edges, selId });
    function commit(before) {
      past.push(before);
      if (past.length > 100) past.shift();
      future.length = 0;
      changed();
    }
    function restore(json) {
      const s = JSON.parse(json);
      const running = new Map(nodes.filter((n) => n.status === "running").map((n) => [n.id, n]));
      nodes = s.nodes.map((n) =>
        running.get(n.id) ? { ...n, status: "running", progress: running.get(n.id).progress } : n,
      );
      edges = s.edges;
      selId = byId(s.selId) ? s.selId : null;
      changed(true);
    }
    function undo() {
      if (!past.length) return;
      future.push(snap());
      restore(past.pop());
      toast("已撤销", "info");
    }
    function redo() {
      if (!future.length) return;
      past.push(snap());
      restore(future.pop());
      toast("已重做", "info");
    }
    function changed(rebuildPanel) {
      render();
      markDirty();
      syncUndo();
      if (rebuildPanel) buildPanel();
      else refreshPanel();
    }
    function syncUndo() {
      $("#btn-undo").disabled = !past.length;
      $("#btn-redo").disabled = !future.length;
    }

    /* ---------- 保存状态 ---------- */
    let saveT, idleT;

      const el = $("#save");

      const lbl = { saved: "已保存", idle: "已保存", saving: "保存中", error: "保存失败 · 重试" }[

      el.innerHTML = ic(icon, 14) + `<span class="lbl">${lbl}</span>`;
      el.style.maxWidth = "";
    }
    function markDirty() {
      clearTimeout(saveT);
      clearTimeout(idleT);
      setSave("saving");
      saveT = setTimeout(() => {
        if (demo.failSave) {
          setSave("error");
          toast("保存失败，修改还在本地，点左上角重试", "bad");

        }
        setSave("saved");
        idleT = setTimeout(() => setSave("idle"), 2000);
      }, 650);

    $("#save").addEventListener("click", () => {

        syncDemo();
        markDirty();

    /* ---------- 视口 ---------- */
    const stage = $("#stage"),

    function apply() {
      world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
      const g = 20 * view.k;
      stage.style.backgroundSize = `${g}px ${g}px`;
      stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
      $("#zoom").textContent = Math.round(view.k * 100) + "%";
      layoutOverlay();
    }
    const clampK = (k) => Math.min(2.5, Math.max(0.2, k));
    function zoomAt(k, cx, cy) {
      k = clampK(k);
      view.x = cx - (cx - view.x) * (k / view.k);
      view.y = cy - (cy - view.y) * (k / view.k);
      view.k = k;
      apply();
    }
    function flyTo(tx, ty, tk, d = 320) {
      if (REDUCE) d = 0;
      const s = { ...view },
        t0 = performance.now();

        const p = d ? Math.min(1, (t - t0) / d) : 1,
          e = ease(p);
        view.x = s.x + (tx - s.x) * e;
        view.y = s.y + (ty - s.y) * e;
        view.k = s.k + (tk - s.k) * e;
        apply();
        if (p < 1) requestAnimationFrame(f);
      })(t0);
    }
    function fitView(list = nodes, pad = 140) {
      if (!list.length) return flyTo(innerWidth / 2, innerHeight / 2, 1);
      let x0 = Infinity,
        y0 = Infinity,
        x1 = -Infinity,
        y1 = -Infinity;
      list.forEach((n) => {
        const k = KIND[n.kind];
        x0 = Math.min(x0, n.x);
        y0 = Math.min(y0, n.y - 30);
        x1 = Math.max(x1, n.x + k.w);
        y1 = Math.max(y1, n.y + k.h);
      });
      const W = innerWidth,
        H = innerHeight - 120 - 260;
      const k = clampK(Math.min((W - pad * 2) / (x1 - x0), Math.max(200, H) / (y1 - y0), 1.1));
      flyTo(
        W / 2 - ((x0 + x1) / 2) * k,
        64 + Math.max(40, (H - (y1 - y0) * k) / 2) - y0 * k + 40,
        k,

      const k = KIND[n.kind];
      flyTo(
        innerWidth / 2 - (n.x + k.w / 2) * view.k,

    /* ---------- 渲染节点与连线 ---------- */
    const els = new Map();

    <div class="card"><div class="media"></div><div class="media next"></div><div class="empty-hint"></div>

    <button class="port l" aria-label="添加上游节点">${ic("plus")}</button><button class="port r" aria-label="添加下游节点">${ic("plus")}</button>`;
      world.appendChild(el);

    function render() {

        el.classList.toggle("empty", !hasOut && n.status !== "running");
        el.classList.toggle("running", n.status === "running");
        el.classList.toggle("failed", n.status === "failed");
        const st =
          n.status === "running"
            ? `<span class="st num">生成中 ${Math.round(n.progress || 0)}%</span>`

        const head = ic(k.icon, 15) + `<span>${esc(n.label)}</span>` + st;

    /* 连线：底线 + 流光层。流光有三种（彗星 / 光带 / 粒子流），由演示面板切换 */
    let edgeFx = "comet";
    function edgeFxMarkup(e, d, sx, sy, tx, ty, running) {
      if (edgeFx === "comet")
        return `<path class="fx-comet-glow" pathLength="100" d="${d}"/><path class="fx-comet-core" pathLength="100" d="${d}"/>`;
      if (edgeFx === "dots")
        return `<path class="fx-dots-glow" d="${d}"/><path class="fx-dots" d="${d}"/>`;
      // 光带：沿上下游连线方向的渐变，渐变本身从上游平移到下游
      const gid = "sw-" + e.id,
        vx = tx - sx,
        vy = ty - sy;
      const color = running ? "var(--run)" : "#fff";
      const dur = running ? 1.1 : 2.6;
      const anim = REDUCE
        ? ""
        : `<animateTransform attributeName="gradientTransform" type="translate" from="${-vx} ${-vy}" to="${vx} ${vy}" dur="${dur}s" repeatCount="indefinite"/>`;
      return `<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}">
      <stop offset=".3" stop-color="${color}" stop-opacity="0"/><stop offset=".5" stop-color="${color}" stop-opacity=".95"/><stop offset=".7" stop-color="${color}" stop-opacity="0"/>${anim}
    </linearGradient></defs><path class="fx-sweep" stroke="url(#${gid})" d="${d}"/>`;
    }
    /**

     * 同一根线复用原来的 <g>，只改路径和渐变坐标，流光动画才不会被一次次打断重来。
     * 只有换了流光类型、或者生成状态变了（光带的颜色和速度写在标记里）才重建这一根。
     */
    function renderEdges() {
      const svg = $("#edges");
      const live = new Set();
      for (const e of edges) {
        const a = byId(e.source),
          b = byId(e.target);
        if (!a || !b) continue;
        live.add(e.id);
        const ka = KIND[a.kind],
          kb = KIND[b.kind];
        const sx = a.x + ka.w,
          sy = a.y + ka.h / 2,
          tx = b.x,
          ty = b.y + kb.h / 2;
        const dx = Math.max(60, Math.abs(tx - sx) / 2);
        const d = `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
        const running = b.status === "running";
        const cls = running ? "run" : selId === a.id || selId === b.id ? "hot" : "";
        const sig = edgeFx + (running ? ":run" : "");
        let g = svg.querySelector(`g[data-id="${e.id}"]`);
        if (!g || g.dataset.sig !== sig) {
          g?.remove();
          g = document.createElementNS("http://www.w3.org/2000/svg", "g");
          g.dataset.id = e.id;
          g.dataset.sig = sig;
          g.innerHTML = `<path class="base" d="${d}"/>${edgeFxMarkup(e, d, sx, sy, tx, ty, running)}`;
          svg.appendChild(g);
        }
        if (g.getAttribute("class") !== cls) g.setAttribute("class", cls);
        g.querySelectorAll("path").forEach(
          (p) => p.getAttribute("d") !== d && p.setAttribute("d", d),
        );
        const grad = g.querySelector("linearGradient");
        if (grad) {
          grad.setAttribute("x1", sx);
          grad.setAttribute("y1", sy);
          grad.setAttribute("x2", tx);
          grad.setAttribute("y2", ty);
          const t = grad.querySelector("animateTransform");
          t?.setAttribute("from", `${sx - tx} ${sy - ty}`);
          t?.setAttribute("to", `${tx - sx} ${ty - sy}`);
        }
      }
      svg.querySelectorAll("g[data-id]").forEach((g) => {
        if (!live.has(g.dataset.id)) g.remove();
      });

    /* 节点种类规则 + 下游当前生成方式收哪些上游（对应代码里的 canLinkNodes） */

    /* ---------- 生成面板 ---------- */

    <div class="ta-wrap"><div class="pe" id="prompt" contenteditable="true" role="textbox" aria-multiline="true" aria-label="提示词" data-ph="${k.ph}输入 @ 引用画布里的素材"></div></div>

    <div class="p-bar">

        n.kind === "video"
          ? `<button class="pc" id="chip-param">${n.params.res} · ${n.params.ratio} · ${n.params.dur}s</button>
        <button class="pc hide-sm" aria-disabled="true" title="二期：分镜栏编辑">${ic("grid", 15)}分镜栏编辑</button>`

    /* 编辑器自己长高，最多 8 行（CSS max-height），这里只负责让面板重新贴位 */

    /* ---------- 节点预设：入口状态、插入 / 替换 / 取消 chip、选择器 ---------- */
    const chipsOf = (el, kind) => $$(`.pchip[data-pk="${kind}"]`, el);
    /* 入口按钮的选中态（高亮 + 小点，运镜选了 2 条以上显示数量）和模板的占位文字 */
    function syncPresetUI(n) {

        b.innerHTML = ic(PKIND[k].icon) + (cs.length > 1 ? `<span class="cnt num">${cs.length}</span>` : cs.length ? '<i class="dot"></i>' : "");

    function makeChip(kind, id) {

    const popIn = (el) =>
      M && !REDUCE && M.animate(el, { opacity: [0, 1], scale: [0.9, 1] }, { duration: 0.12, ease: [0.2, 0, 0, 1] });
    /* 选中一个预设：同类单选的原位替换，运镜点一下加、再点取消；再点已选的单选项也是取消 */
    function applyPreset(kind, id, target) {
      const n = sel(),
        el = $("#prompt");
