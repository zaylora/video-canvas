<title>画布 UI 原型</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap">
<style>
/* 布局：全屏画布 + 五区浮层外壳（左上/右上/底中/左下/右下）+ 屏幕空间的节点历史浮条与生成面板。深色单主题，刻意只做这一套。 */
:root {
  color-scheme: dark;
  --canvas-bg: #0d0d0e;
  --dot: rgba(255,255,255,.075);
  --chrome: rgba(28,28,30,.78);
  --chrome-solid: #1b1b1d;
  --chrome-border: rgba(255,255,255,.08);
  --surface: #161618;
  --surface-2: #232326;
  --surface-3: #2e2e32;
  --fg: #f4f4f5;
  --fg-2: #a1a1aa;
  --fg-3: #6b6b73;
  --node-ring: rgba(255,255,255,.72);
  --edge: rgba(255,255,255,.28);
  --credit: #f2c14e;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
  --run: #7cb4ff;
  --font: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --e-out: cubic-bezier(.2,0,0,1);
}
html, body { height: 100%; }
body { background: var(--canvas-bg); color: var(--fg); font-family: var(--font); font-size: 14px; overflow: hidden; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--node-ring); outline-offset: 2px; }
svg.i { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- 画布 ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: default;
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); }
#stage.grid { background-image: linear-gradient(var(--dot) 1px, transparent 1px), linear-gradient(90deg, var(--dot) 1px, transparent 1px); }
#stage.plain { background-image: none; }
#stage.hand { cursor: grab; } #stage.panning { cursor: grabbing; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
svg.edges { position: absolute; left: 0; top: 0; width: 1px; height: 1px; overflow: visible; pointer-events: none; }
.edges path { fill: none; vector-effect: non-scaling-stroke; }
.edges .base { stroke: var(--edge); stroke-width: 1.5; transition: stroke .18s; }
.edges .hot .base { stroke: rgba(255,255,255,.5); }
/* 流光颜色：平时白色，下游生成中换成蓝色并加速 */
.edges g { --fx: rgba(255,255,255,.85); --speed: 1; }
.edges g.hot { --fx: #fff; }
.edges g.run { --fx: var(--run); --speed: .45; }
/* A 彗星：一段带辉光的亮带从上游跑向下游 */
.fx-comet-glow { stroke: var(--fx); stroke-width: 6; stroke-linecap: round; opacity: .28; filter: blur(3px); stroke-dasharray: 16 84; animation: comet calc(2.2s * var(--speed)) cubic-bezier(.45,0,.55,1) infinite; }
.fx-comet-core { stroke: var(--fx); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 10 90; animation: comet calc(2.2s * var(--speed)) cubic-bezier(.45,0,.55,1) infinite; }
@keyframes comet { from { stroke-dashoffset: 16; } to { stroke-dashoffset: -84; } }
/* B 光带：渐变描边，渐变本身沿线平移 */
.fx-sweep { stroke-width: 2.5; stroke-linecap: round; }
/* C 粒子流：圆头的零长度虚线就是一颗颗光点，偏移量滚动让它们流向下游 */
.fx-dots { stroke: var(--fx); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 0 13; animation: dots calc(.9s * var(--speed)) linear infinite; }
.fx-dots-glow { stroke: var(--fx); stroke-width: 7; stroke-linecap: round; opacity: .18; filter: blur(2px); stroke-dasharray: 0 13; animation: dots calc(.9s * var(--speed)) linear infinite; }
@keyframes dots { to { stroke-dashoffset: -13; } }

.node { position: absolute; }
.node-head { position: absolute; left: 2px; right: 2px; bottom: calc(100% + 8px); display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--fg); }
.node-head .st { margin-left: auto; font-weight: 500; font-size: 12px; color: var(--run); font-family: var(--mono); }
.node-head .st.bad { color: var(--bad); font-family: var(--font); }
.card { position: relative; width: 100%; height: 100%; border-radius: 16px; overflow: hidden; background: var(--surface);
  box-shadow: 0 0 0 1px rgba(255,255,255,.06); transition: box-shadow .12s var(--e-out); }
.node:hover .card { box-shadow: 0 0 0 1px rgba(255,255,255,.2); }
.node.sel .card { box-shadow: 0 0 0 2px var(--node-ring), 0 12px 40px rgba(0,0,0,.5); }
.node.empty .card { background: #141416; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.08); }
.node.empty.sel .card { box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12), 0 0 0 2px var(--node-ring); }
.media { position: absolute; inset: 0; background-size: cover; }
.media.next { opacity: 0; }
.media .tag { position: absolute; right: 8px; bottom: 8px; font-size: 11px; padding: 2px 6px; border-radius: 6px; background: rgba(0,0,0,.45); color: rgba(255,255,255,.7); }
.empty-hint { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 10px; color: var(--fg-3); font-size: 12px; }
.empty-hint svg.i { width: 30px; height: 30px; stroke-width: 1.4; }
.shimmer { position: absolute; inset: 0; display: none; background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.06) 50%, transparent 70%) #18181b; background-size: 200% 100%; animation: shimmer 1.4s linear infinite; }
.node.running .shimmer { display: block; }
@keyframes shimmer { from { background-position: 150% 0; } to { background-position: -50% 0; } }
.prog { position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.06); display: none; }
.node.running .prog { display: block; }
.prog i { display: block; height: 100%; width: 0; background: var(--run); transition: width .2s linear; }
.fail { position: absolute; inset: 0; display: none; place-content: center; justify-items: center; gap: 8px; text-align: center; padding: 16px; color: var(--fg-2); font-size: 12px; background: #161214; }
.node.failed .fail { display: grid; }
.fail b { color: var(--bad); font-weight: 600; font-size: 13px; }
.fail button { margin-top: 4px; padding: 5px 12px; border-radius: 999px; background: var(--surface-3); font-size: 12px; }
.textout { position: absolute; inset: 0; padding: 16px; font-size: 13px; line-height: 1.7; color: var(--fg-2); overflow: hidden; }
.wave { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: 3px; padding: 0 24px; }
.wave i { flex: 1; max-width: 4px; border-radius: 2px; background: rgba(255,255,255,.4); }

.port { position: absolute; top: 50%; width: 28px; height: 28px; margin-top: -14px; border-radius: 50%; display: grid; place-items: center;
  color: var(--fg-2); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.35); background: var(--canvas-bg);
  opacity: 0; transform: scale(.6); transition: opacity .12s var(--e-out), transform .18s var(--e-out), color .12s, box-shadow .12s; }
.port svg.i { width: 14px; height: 14px; }
.port.l { left: -48px; } .port.r { right: -48px; }
.node:hover .port, .node.sel .port { opacity: 1; transform: scale(1); }
.port:hover { color: var(--fg); box-shadow: inset 0 0 0 1.5px var(--fg); transform: scale(1.1) !important; }

/* ---------- 外壳胶囊 ---------- */
.zone { position: fixed; display: flex; align-items: center; gap: 8px; z-index: 20; }
.z-tl { left: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); }
.z-tr { right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); }
.z-bc { left: 50%; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); }
.z-bl { left: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.z-br { right: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); }
.pill { display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 4px; border-radius: 999px; background: var(--chrome);
  backdrop-filter: blur(20px) saturate(1.4); -webkit-backdrop-filter: blur(20px) saturate(1.4); box-shadow: 0 0 0 1px var(--chrome-border), 0 8px 24px rgba(0,0,0,.35); }
.pill.big { height: 52px; padding: 0 6px; gap: 4px; }
.sep { width: 1px; height: 18px; background: var(--chrome-border); margin: 0 4px; flex: none; }
.ib { position: relative; height: 32px; min-width: 32px; padding: 0 8px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  color: var(--fg-2); transition: background .12s, color .12s, transform .12s; white-space: nowrap; }
.ib:hover { background: rgba(255,255,255,.07); color: var(--fg); }
.ib:active { transform: scale(.96); }
.ib[disabled] { opacity: .35; pointer-events: none; }
.pill.big .ib { height: 40px; min-width: 40px; }
.ib.primary { background: var(--fg); color: #0d0d0e; width: 40px; padding: 0; }
.ib.primary:hover { background: #fff; color: #0d0d0e; }
.ib.primary svg.i { width: 20px; height: 20px; stroke-width: 2.2; }
.ib.on { color: var(--fg); }
.kbd { font-family: var(--mono); font-size: 11px; color: var(--fg-3); }

.seg { position: relative; display: flex; align-items: center; gap: 2px; }
.seg-ind { position: absolute; left: 0; top: 50%; height: 32px; margin-top: -16px; width: 0; border-radius: 999px; background: rgba(255,255,255,.12); pointer-events: none; }
.pill.big .seg-ind { height: 40px; margin-top: -20px; }
.no-motion-lib .seg-ind { transition: transform .22s cubic-bezier(.3,1.25,.5,1), width .22s cubic-bezier(.3,1.25,.5,1); }
.seg > button { position: relative; z-index: 1; }

.brand { width: 34px; height: 30px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 2px; color: var(--fg); }
.brand .logo { width: 22px; height: 22px; border-radius: 7px; background: var(--fg); display: grid; place-items: center; }
.brand .logo i { width: 9px; height: 9px; border-radius: 50%; background: var(--canvas-bg); box-shadow: 5px 0 0 -1px var(--canvas-bg); transform: translateX(-2px); }
.title-in { width: 9ch; min-width: 4ch; max-width: 28ch; background: transparent; border: 0; color: var(--fg); font: 600 14px var(--font); padding: 4px 6px; border-radius: 8px; }
.title-in:hover { background: rgba(255,255,255,.06); }
.title-in:focus { background: rgba(255,255,255,.08); outline: none; }
.proto { font-size: 11px; color: var(--fg-3); padding: 2px 7px; border-radius: 999px; box-shadow: inset 0 0 0 1px var(--chrome-border); }
.save { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--fg-3); padding: 0 8px 0 4px; height: 32px; border-radius: 999px; }
.save .lbl { max-width: 80px; overflow: hidden; transition: max-width .24s var(--e-out), opacity .18s; }
.save.idle .lbl { max-width: 0; opacity: 0; }
.save.saving svg.i { animation: spin 1s linear infinite; }
.save.error { color: var(--bad); cursor: pointer; }
.save.error:hover { background: rgba(248,113,113,.1); }
@keyframes spin { to { transform: rotate(360deg); } }

.credits { gap: 6px; padding: 0 12px 0 10px; color: var(--fg); font-weight: 600; font-family: var(--mono); }
.credits .spark { color: var(--credit); fill: var(--credit); stroke: none; }
.ws { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 3px rgba(74,222,128,.15); }
.ws.down { background: var(--warn); box-shadow: 0 0 0 3px rgba(251,191,36,.18); animation: blink 1s ease-in-out infinite; }
@keyframes blink { 50% { opacity: .35; } }
.avatar { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; font-size: 14px;
  background: conic-gradient(from 200deg, #3b3b40, #6b6b73, #3b3b40); box-shadow: 0 0 0 1px var(--chrome-border); }
.stat { display: inline-flex; align-items: center; gap: 4px; font-family: var(--mono); font-size: 12px; color: var(--fg-2); padding: 0 8px; height: 32px; border-radius: 999px; }
.stat.warn { color: var(--warn); }
button.stat:hover { background: rgba(255,255,255,.07); }
.zoom-v { font-family: var(--mono); font-size: 12px; min-width: 64px; }

/* ---------- 弹出层 ---------- */
.pop { position: fixed; z-index: 60; min-width: 200px; padding: 6px; border-radius: 14px; background: var(--chrome-solid);
  box-shadow: 0 0 0 1px var(--chrome-border), 0 16px 48px rgba(0,0,0,.55);
  opacity: 0; visibility: hidden; transform: translateY(var(--dy, 4px)) scale(.96); pointer-events: none;
  transition: opacity .13s var(--e-out), transform .13s var(--e-out), visibility 0s .13s; }
.pop.open { opacity: 1; visibility: visible; transform: none; pointer-events: auto; transition: opacity .18s var(--e-out), transform .18s var(--e-out); }
.mi { display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 10px; border-radius: 9px; font-size: 13px; color: var(--fg); text-align: left; }
.mi:hover, .mi:focus-visible { background: rgba(255,255,255,.07); outline: none; }
.mi svg.i { color: var(--fg-2); }
.mi .kbd, .mi .r { margin-left: auto; }
.mi .ck { margin-left: auto; color: var(--fg); visibility: hidden; }
.mi.checked .ck { visibility: visible; }
.mi .sub { display: block; font-size: 11px; color: var(--fg-3); margin-top: 1px; }
.mlabel { padding: 8px 10px 4px; font-size: 11px; color: var(--fg-3); letter-spacing: .04em; }
.msep { height: 1px; background: var(--chrome-border); margin: 6px 4px; }
.prow { padding: 6px 8px; display: grid; gap: 6px; }
.prow .k { font-size: 11px; color: var(--fg-3); }
.chips { display: flex; gap: 4px; flex-wrap: wrap; }
.chip-o { padding: 5px 10px; border-radius: 8px; font-size: 12px; background: var(--surface-2); color: var(--fg-2); }
.chip-o:hover { color: var(--fg); }
.chip-o.on { background: var(--fg); color: #0d0d0e; }
.ledger { display: grid; gap: 2px; padding: 4px 6px 6px; font-size: 12px; }
.ledger div { display: flex; justify-content: space-between; gap: 24px; color: var(--fg-2); padding: 4px 4px; }
.ledger .neg { color: var(--fg); font-family: var(--mono); } .ledger .pos { color: var(--ok); font-family: var(--mono); }
.bal { padding: 10px 10px 6px; display: flex; align-items: baseline; gap: 6px; }
.bal b { font: 600 24px var(--mono); }

/* ---------- 节点历史浮条 ---------- */
#hist { position: fixed; z-index: 15; left: 0; top: 0; display: flex; align-items: center; height: 40px; padding: 0 4px; border-radius: 999px;
  background: var(--chrome); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: 0 0 0 1px var(--chrome-border), 0 8px 24px rgba(0,0,0,.35);
  opacity: 0; transform: translateY(6px) scale(.97); pointer-events: none; transition: opacity .18s var(--e-out), transform .18s var(--e-out); }
#hist.show { opacity: 1; transform: none; pointer-events: auto; }
#hist.dim, #panel.dim { opacity: .35 !important; pointer-events: none !important; }
#hist .cnt { font-family: var(--mono); font-size: 11px; color: #0d0d0e; background: var(--fg); border-radius: 999px; padding: 1px 6px; }
#hist .thumbs { position: relative; display: flex; gap: 6px; max-width: 0; opacity: 0; overflow: hidden; transition: max-width .24s var(--e-out), opacity .18s, margin .24s; }
#hist.open .thumbs { opacity: 1; margin: 0 4px; }
.thumb { width: 52px; height: 30px; border-radius: 7px; background-size: cover; flex: none; opacity: .65; transition: opacity .12s; }
.thumb:hover, .thumb.on { opacity: 1; }
.thumb-ring { position: absolute; left: 0; top: 0; width: 52px; height: 30px; border-radius: 7px; box-shadow: 0 0 0 2px var(--fg); pointer-events: none; }
.no-motion-lib .thumb-ring { transition: transform .22s cubic-bezier(.3,1.25,.5,1); }
.ring-st { width: 18px; height: 18px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--fg-2); }
.ring-st.run { box-shadow: inset 0 0 0 1.5px rgba(124,180,255,.25); border-top: 1.5px solid var(--run); animation: spin .9s linear infinite; }
.ring-st.ok { box-shadow: inset 0 0 0 1.5px var(--ok); }

/* ---------- 生成面板 ---------- */
#panel { position: fixed; z-index: 16; left: 0; top: 0; padding: 14px; border-radius: 22px; background: rgba(24,24,27,.94);
  backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 0 0 1px var(--chrome-border), 0 24px 64px rgba(0,0,0,.55);
  display: grid; gap: 12px; opacity: 0; transform: translateY(var(--pdy, -6px)) scale(.98); pointer-events: none;
  transition: opacity .18s var(--e-out), transform .18s var(--e-out); }
#panel.show { opacity: 1; transform: none; pointer-events: auto; }
.p-top { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.tabs { padding: 3px; border-radius: 999px; background: var(--surface-2); overflow-x: auto; scrollbar-width: none; min-width: 0; }
.tabs .seg-ind { height: 30px; margin-top: -15px; background: var(--surface-3); box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tabs button { height: 30px; padding: 0 14px; border-radius: 999px; font-size: 13px; color: var(--fg-2); white-space: nowrap; transition: color .12s; }
.tabs button.on { color: var(--fg); }
.expand { margin-left: auto; width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; color: var(--fg-2); box-shadow: inset 0 0 0 1px var(--chrome-border); flex: none; }
.expand:hover { color: var(--fg); background: rgba(255,255,255,.06); }
.refs { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ref { position: relative; width: 56px; height: 56px; border-radius: 10px; background-size: cover; background-position: center; box-shadow: 0 0 0 1px var(--chrome-border); }
.ref .lk { position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 5px; display: grid; place-items: center; background: rgba(0,0,0,.6); }
.ref .lk svg.i { width: 10px; height: 10px; stroke-width: 2.4; }
.addref { width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; color: var(--fg-3); box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.12); border: 0; background-image: none; outline-offset: 2px; }
.addref { box-shadow: none; border: 1.5px dashed rgba(255,255,255,.18); }
.addref:hover { color: var(--fg); border-color: rgba(255,255,255,.4); }
.style-chips { display: flex; gap: 8px; }
.sc { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border-radius: 9px; font-size: 12px; color: var(--fg-3); background: var(--surface-2); }
.sc:hover { color: var(--fg); }
.ta-wrap { position: relative; }
#prompt { width: 100%; resize: none; border: 0; background: transparent; color: var(--fg); font: 15px/1.6 var(--font); padding: 0 2px; min-height: 48px; display: block; }
#prompt::placeholder { color: var(--fg-3); }
#prompt:focus { outline: none; }
#prompt.shake { animation: shake .32s; }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.counter { text-align: right; font: 12px var(--mono); color: var(--fg-3); }
.counter.warn { color: var(--warn); }
.p-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pc { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 999px; font-size: 13px; color: var(--fg); background: transparent; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: background .12s, transform .12s; white-space: nowrap; }
.pc:hover { background: rgba(255,255,255,.06); }
.pc:active { transform: scale(.96); }
.pc[aria-disabled="true"] { color: var(--fg-3); }
.pc .vendor { width: 18px; height: 18px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: var(--surface-3); }
.p-bar .grow { flex: 1; }
.send { display: inline-flex; align-items: center; gap: 2px; height: 40px; padding: 0 3px 0 12px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
.send .cost { display: inline-flex; align-items: center; gap: 6px; font: 600 15px var(--mono); padding-right: 8px; }
.send .cost svg { width: 16px; height: 16px; fill: var(--credit); stroke: none; }
.go { width: 34px; height: 34px; border-radius: 50%; background: var(--fg); color: #0d0d0e; display: grid; place-items: center; transition: transform .12s, opacity .12s; }
.go:hover { transform: scale(1.05); } .go:active { transform: scale(.94); }
.go svg.i { stroke-width: 2.4; }
.send.off { opacity: .45; } .send.off .go { pointer-events: none; }
.send.off .cost svg { fill: var(--fg-3); }

/* ---------- 空状态、对话框、toast ---------- */
#empty { position: fixed; inset: 0; display: grid; place-content: center; justify-items: center; gap: 18px; z-index: 5; pointer-events: none; }
#empty[hidden] { display: none !important; }
#empty h2 { margin: 0; font-size: 18px; font-weight: 600; }
#empty p { margin: 0; color: var(--fg-3); font-size: 13px; }
.qcards { display: flex; gap: 12px; pointer-events: auto; flex-wrap: wrap; justify-content: center; padding: 0 16px; }
.qc { width: 150px; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: 0 0 0 1px var(--chrome-border); display: grid; gap: 10px; text-align: left; transition: transform .18s var(--e-out), box-shadow .12s; }
.qc:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255,255,255,.22); }
.qc b { font-size: 14px; font-weight: 600; } .qc span { font-size: 12px; color: var(--fg-3); }

/* 连线：底线 + 流光层。流光有三种（彗星 / 光带 / 粒子流），由演示面板切换 */
let edgeFx = "comet";
function edgeFxMarkup(e, d, sx, sy, tx, ty, running) {
  if (edgeFx === "comet")
    return `<path class="fx-comet-glow" pathLength="100" d="${d}"/><path class="fx-comet-core" pathLength="100" d="${d}"/>`;
  if (edgeFx === "dots")
    return `<path class="fx-dots-glow" d="${d}"/><path class="fx-dots" d="${d}"/>`;
  // 光带：沿上下游连线方向的渐变，渐变本身从上游平移到下游
  const gid = "sw-" + e.id, vx = tx - sx, vy = ty - sy;
  const color = running ? "var(--run)" : "#fff";
  const dur = running ? 1.1 : 2.6;
  const anim = REDUCE ? "" : `<animateTransform attributeName="gradientTransform" type="translate" from="${-vx} ${-vy}" to="${vx} ${vy}" dur="${dur}s" repeatCount="indefinite"/>`;
  return `<defs><linearGradient id="${gid}" gradientUnits="userSpaceOnUse" x1="${sx}" y1="${sy}" x2="${tx}" y2="${ty}">
      <stop offset=".3" stop-color="${color}" stop-opacity="0"/><stop offset=".5" stop-color="${color}" stop-opacity=".95"/><stop offset=".7" stop-color="${color}" stop-opacity="0"/>${anim}
    </linearGradient></defs><path class="fx-sweep" stroke="url(#${gid})" d="${d}"/>`;

/**
 * 每帧都可能调用（拖节点、生成进度），所以不整块重建：
 * 同一根线复用原来的 <g>，只改路径和渐变坐标，流光动画才不会被一次次打断重来。
 * 只有换了流光类型、或者生成状态变了（光带的颜色和速度写在标记里）才重建这一根。
 */
function renderEdges() {
  const svg = $("#edges");
  const live = new Set();
  for (const e of edges) {
    const a = byId(e.source), b = byId(e.target); if (!a || !b) continue;
    live.add(e.id);
    const ka = KIND[a.kind], kb = KIND[b.kind];
    const sx = a.x + ka.w, sy = a.y + ka.h / 2, tx = b.x, ty = b.y + kb.h / 2;
    const dx = Math.max(60, Math.abs(tx - sx) / 2);
    const d = `M${sx},${sy} C${sx + dx},${sy} ${tx - dx},${ty} ${tx},${ty}`;
    const running = b.status === "running";
    const cls = running ? "run" : (selId === a.id || selId === b.id) ? "hot" : "";
    const sig = edgeFx + (running ? ":run" : "");
    let g = svg.querySelector(`g[data-id="${e.id}"]`);
    if (!g || g.dataset.sig !== sig) {
      g?.remove();
      g = document.createElementNS("http://www.w3.org/2000/svg", "g");
      g.dataset.id = e.id; g.dataset.sig = sig;
      g.innerHTML = `<path class="base" d="${d}"/>${edgeFxMarkup(e, d, sx, sy, tx, ty, running)}`;
      svg.appendChild(g);
    }
    if (g.getAttribute("class") !== cls) g.setAttribute("class", cls);
    g.querySelectorAll("path").forEach(p => p.getAttribute("d") !== d && p.setAttribute("d", d));
    const grad = g.querySelector("linearGradient");
    if (grad) {
      grad.setAttribute("x1", sx); grad.setAttribute("y1", sy); grad.setAttribute("x2", tx); grad.setAttribute("y2", ty);
      const t = grad.querySelector("animateTransform");
      t?.setAttribute("from", `${sx - tx} ${sy - ty}`); t?.setAttribute("to", `${tx - sx} ${ty - sy}`);
    }

/* ---------- 生成（模拟异步任务 + 积分冻结/退回） ---------- */
function setCredits(v) {
  const from = credits; credits = v;
  roll($("#credits"), from, v); roll($("#bal-big"), from, v);
  refreshPanel();
}
function roll(el, from, to) {
  const t0 = performance.now(), d = REDUCE ? 0 : 520;
  (function f(t) {
    const p = d ? Math.min(1, (t - t0) / d) : 1, e = 1 - Math.pow(1 - p, 3);
    el.textContent = fmt(Math.round(from + (to - from) * e));

  })(t0);
}
function addLedger(label, amt) {
  ledger.unshift({ label, amt });
  $("#ledger").innerHTML = ledger.slice(0, 6).map(l => `<div><span>${esc(l.label)}</span><span class="${l.amt < 0 ? "neg" : "pos"}">${l.amt < 0 ? "−" : "+"}${fmt(Math.abs(l.amt))}</span></div>`).join("");
}
function send(n) {
  const ta = $("#prompt");
  if (n.status === "running") return;
  if (!(n.prompt || "").trim()) { ta?.classList.remove("shake"); void ta?.offsetWidth; ta?.classList.add("shake"); ta?.focus(); return; }
  const c = cost(n);
  if (credits < c) { toast(`积分不足，还差 ${fmt(c - credits)}`, "bad"); return; }
  setCredits(credits - c); addLedger(`${n.label} · ${KIND[n.kind].name}`, -c);
  n.status = "running"; n.progress = 0; n.error = null;
  const willFail = demo.failGen; demo.failGen = false; syncDemo();

  render(); refreshPanel();

      setCredits(credits + c); addLedger(`${n.label} · 失败退回`, c);
      toast(`生成失败，已退回 ${fmt(c)} 积分`, "bad"); render(); refreshPanel(); markDirty(); return;
    }
    if (p < 1) { render(); requestAnimationFrame(tick); return; }
    const b = n.params.batch || 1;
    for (let i = 0; i < b; i++) n.outputs.push({ id: "o" + (++uid), seed: ++seedN });
    if (n.kind === "text") n.text = SAMPLE_TEXT;
    if (n.outputs.length > 20) n.outputs.splice(0, n.outputs.length - 20);

    toast(n.outputs.length > 1 ? `生成完成，已加入节点历史（共 ${n.outputs.length} 版）` : "生成完成", "ok");
  })(t0);
}

$("#btn-undo").onclick = undo; $("#btn-redo").onclick = redo;
$("#btn-help").onclick = () => openDialog($("#dlg-keys"));
$("#btn-assets").onclick = () => toast("原型：素材库会从底部升起抽屉", "info");
$("#btn-tasks").onclick = () => toast("原型：任务历史抽屉列出全部生成记录", "info");
$("#st-warn").onclick = () => {
  const f = nodes.filter(n => n.status === "failed");
  if (!f.length) return toast("没有失败的节点", "info");
  const n = f[(f.indexOf(sel()) + 1) % f.length]; select(n.id); centerOn(n);
};
document.addEventListener("click", e => {
  const nw = e.target.closest("[data-new]");
  if (nw) {
    const at = $("#pop-add").dataset.at; closePops();
    addNode(nw.dataset.new, at ? JSON.parse(at) : null); $("#pop-add").dataset.at = ""; return;
  }
  const z = e.target.closest("[data-zoom]");
  if (z) {
    const v = z.dataset.zoom, cx = innerWidth / 2, cy = innerHeight / 2;
    if (v === "fit") fitView(); else if (v === "100") flyTo(cx - (cx - view.x) / view.k, cy - (cy - view.y) / view.k, 1);
    else zoomAt(view.k * (v === "in" ? 1.2 : 1 / 1.2), cx, cy);
    return;
  }
  const d = e.target.closest("[data-demo]");
  if (d) { demo[d.dataset.demo] = !demo[d.dataset.demo]; syncDemo(); if (d.dataset.demo === "failSave") markDirty(); return; }
  const a = e.target.closest("[data-act]");
  if (a) {
    closePops();
    const act = a.dataset.act;
    if (act === "keys") openDialog($("#dlg-keys"));
    else if (act === "clear") { const b = snap(); nodes = []; edges = []; selId = null; commit(b); buildPanel(); toast("已清空，⌘Z 可恢复", "info"); }
    else if (act === "upload") toast("原型：打开文件选择，上传后生成素材节点", "info");
    else toast({ back: "原型：返回项目列表", newcanvas: "原型：新建画布", settings: "原型：打开画布设置", admin: "原型：进入管理后台", logout: "原型：退出登录" }[act], "info");
  }
  if (e.target.closest("[data-close]") || e.target.id === "backdrop") closeDialog();
});
function syncDemo() {
  $$("[data-demo]").forEach(b => b.classList.toggle("checked", demo[b.dataset.demo]));
  const ws = $("#ws"); ws.classList.toggle("down", demo.wsDown);
  ws.title = demo.wsDown ? "实时进度已断开，正在重连" : "实时进度已连接";
}

/* ---------- 底部分段：工具 / 背景 ---------- */
function setTool(t) {
  tool = t; stage.classList.toggle("hand", t === "hand");
  const seg = $("#seg-tool"), b = $(`[data-tool="${t}"]`, seg);
  $$("button", seg).forEach(x => x.classList.toggle("on", x === b)); segTo(seg, b);
}
$("#seg-tool").onclick = e => { const b = e.target.closest("[data-tool]"); if (b) setTool(b.dataset.tool); };
$("#seg-view").onclick = e => {
  const b = e.target.closest("[data-view]"); if (!b) return;
  stage.classList.toggle("grid", b.dataset.view === "grid");
  $$("#seg-view button").forEach(x => x.classList.toggle("on", x === b)); segTo($("#seg-view"), b);
};

/* ---------- 标题 ---------- */
const title = $("#title");
const sizeTitle = () => { title.style.width = Math.max(4, [...title.value].reduce((s, c) => s + (c.charCodeAt(0) > 255 ? 2 : 1.05), 0) + 1) + "ch"; };
let titleBefore = title.value;
title.addEventListener("input", sizeTitle);
title.addEventListener("focus", () => { titleBefore = title.value; title.select(); });
title.addEventListener("keydown", e => { if (e.key === "Enter") title.blur(); if (e.key === "Escape") { title.value = titleBefore; sizeTitle(); title.blur(); } });
title.addEventListener("blur", () => { if (!title.value.trim()) title.value = titleBefore; sizeTitle(); if (title.value !== titleBefore) markDirty(); });
sizeTitle();

/* ---------- 对话框（放大编辑提示词，从面板位置展开） ---------- */
let dlgOpen = null, flipFrom = null;
function openDialog(dlg, fromEl) {
  closePops(); dlgOpen = dlg;
  $("#backdrop").classList.add("open"); dlg.classList.add("open");
  if (REDUCE) return;
  if (fromEl && M) {
    const a = fromEl.getBoundingClientRect(), b = dlg.getBoundingClientRect();
    flipFrom = { x: a.left + a.width / 2 - (b.left + b.width / 2), y: a.top + a.height / 2 - (b.top + b.height / 2), s: a.width / b.width };
    M.animate(dlg, { x: [flipFrom.x, 0], y: [flipFrom.y, 0], scale: [flipFrom.s, 1], opacity: [0.4, 1] }, SPRING);
  } else if (M) { flipFrom = null; M.animate(dlg, { scale: [.96, 1], opacity: [0, 1] }, { duration: .24, ease: [.2, 0, 0, 1] }); }
}
function closeDialog() {
  if (!dlgOpen) return;
  const dlg = dlgOpen; dlgOpen = null;
  $("#backdrop").classList.remove("open");
  if (dlg.id === "dlg-prompt") {
    const n = sel(); if (n) { n.prompt = $("#big-prompt").value; buildPanel(); markDirty(); }
  }
  const done = () => { dlg.classList.remove("open"); dlg.style.transform = ""; dlg.style.opacity = ""; };
  if (M && !REDUCE) {
    const to = flipFrom && dlg.id === "dlg-prompt" ? { x: flipFrom.x, y: flipFrom.y, scale: flipFrom.s, opacity: 0 } : { scale: .97, opacity: 0 };
    M.animate(dlg, to, { duration: .17, ease: [.4, 0, 1, 1] }).then(done);
  } else done();
}
function openPromptDialog() {
  const n = sel(); if (!n) return;
  const big = $("#big-prompt"); big.value = n.prompt || "";
  $("#big-counter").textContent = `${big.value.length}/16000`;
  openDialog($("#dlg-prompt"), panel);
  setTimeout(() => big.focus(), 80);
}
$("#big-prompt").addEventListener("input", e => { $("#big-counter").textContent = `${e.target.value.length}/16000`; });
$("#big-prompt").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); const n = sel(); closeDialog(); if (n) send(n); } });

/* ---------- 键盘 ---------- */
const typing = el => el && (el.tagName === "INPUT" || el.tagName === "TEXTAREA" || el.isContentEditable);
document.addEventListener("keydown", e => {
  const mod = e.metaKey || e.ctrlKey;
  if (e.key === "Escape") { if (dlgOpen) return closeDialog(); if (openPopEl) return closePops(); if (!typing(document.activeElement)) select(null); return; }
  if (typing(document.activeElement) || dlgOpen) return;
  const k = e.key.toLowerCase();
  if (mod && k === "z") { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === "y") { e.preventDefault(); redo(); return; }
  if (mod && k === "d") { e.preventDefault(); if (sel()) duplicate(sel()); return; }
  if (mod && k === "c") { if (sel()) { clipboard = JSON.stringify(sel()); toast("已复制节点", "info"); } return; }
  if (mod && k === "v") { if (clipboard) { const src = JSON.parse(clipboard); src.x += 48; src.y += 48; duplicate(src, 0); clipboard = JSON.stringify(src); } return; }
  if (mod && (k === "=" || k === "+")) { e.preventDefault(); zoomAt(view.k * 1.2, innerWidth / 2, innerHeight / 2); return; }
  if (mod && k === "-") { e.preventDefault(); zoomAt(view.k / 1.2, innerWidth / 2, innerHeight / 2); return; }
  if (mod) return;
  if (e.key === "Delete" || e.key === "Backspace") { e.preventDefault(); deleteSel(); return; }
  if (e.key === "Enter" && sel()) { e.preventDefault(); $("#prompt")?.focus(); return; }
  if (e.shiftKey && e.code === "Digit1") { fitView(); return; }
  if (e.shiftKey && e.code === "Digit0") { const cx = innerWidth / 2, cy = innerHeight / 2; flyTo(cx - (cx - view.x) / view.k, cy - (cy - view.y) / view.k, 1); return; }
  if (k === "v") setTool("select");
  if (k === "h") setTool("hand");
  if (k === "?") openDialog($("#dlg-keys"));
  if (e.code === "Space" && !spaceHeld) { spaceHeld = true; stage.classList.add("hand"); e.preventDefault(); }
});
document.addEventListener("keyup", e => { if (e.code === "Space") { spaceHeld = false; stage.classList.toggle("hand", tool === "hand"); } });

/* ---------- toast ---------- */
function toast(msg, kind = "ok") {
  const t = document.createElement("div");
  t.className = "toast " + kind; t.innerHTML = `<span class="d"></span>${esc(msg)}`;
  const box = $("#toasts"); box.appendChild(t);
  while (box.children.length > 3) box.firstChild.remove();
  requestAnimationFrame(() => t.classList.add("in"));
  setTimeout(() => { t.classList.remove("in"); setTimeout(() => t.remove(), 200); }, 2400);
}

/* ---------- 进入画布：加载层 + 内容入场（三种效果） ---------- */
const MARK_SVG = `<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="8" height="8" rx="2" stroke="#0d0d0e" stroke-width="1.6"/><path d="M10.5 7.2 13.5 5.5v5l-3-1.7" fill="#0d0d0e" stroke="#0d0d0e" stroke-width=".8" stroke-linejoin="round"/></svg>`;
let loaderStyle = "a", booting = false;
const loaderEl = $("#loader");

function boot() {
  if (booting) return;
  booting = true;
  closePops();
  document.body.classList.remove("revealing", "no-brand");
  document.body.classList.add("booting");
  loaderEl.className = "ld-" + loaderStyle;
  loaderEl.hidden = false;
  loaderEl.innerHTML = `<div class="ld-mark">${MARK_SVG}</div><div class="ld-name">Video Canvas</div>` +
    (loaderStyle === "b" ? `<div class="ld-sub">正在打开「${esc(title.value)}」</div>` : "") +
    (loaderStyle === "c" ? `<div class="ld-bar"><i></i></div>` : "");
  // 模拟拉取画布数据：进度分几步走，C 的进度条跟着动
  const bar = $(".ld-bar i", loaderEl);
  [22, 48, 76, 100].forEach((p, i) => setTimeout(() => bar && (bar.style.width = p + "%"), 160 + i * 260));
  setTimeout(reveal, REDUCE ? 150 : 1350);
}

function reveal() {
  const body = document.body;
  // 节点按画布上的先后（先上后下、先左后右）依次出现
  [...nodes].sort((p, q) => p.y - q.y || p.x - q.x).forEach((n, i) => els.get(n.id)?.style.setProperty("--i", i));
  if (loaderStyle === "c") {
    // 品牌归位：大 logo 飞到左上角品牌标的位置并缩成它，落地后真品牌标接上
    const mark = $(".ld-mark", loaderEl), target = $("#btn-logo .logo");
    const a = mark.getBoundingClientRect(), b = target.getBoundingClientRect();
    body.classList.add("no-brand");
    loaderEl.classList.add("out");
    body.classList.remove("booting"); body.classList.add("revealing");
    const scale = b.width / a.width;
    const flight = mark.animate([
      { transform: "none", borderRadius: "22px" },
      { transform: `translate(${b.left + b.width / 2 - (a.left + a.width / 2)}px, ${b.top + b.height / 2 - (a.top + a.height / 2)}px) scale(${scale})`, borderRadius: `${7 / scale}px` },
    ], { duration: REDUCE ? 0 : 640, easing: "cubic-bezier(.65,0,.25,1)", fill: "forwards" });
    flight.finished.then(() => { body.classList.remove("no-brand"); finishBoot(); });
    return;
  }
  loaderEl.classList.add("out");
  body.classList.remove("booting"); body.classList.add("revealing");
  setTimeout(finishBoot, REDUCE ? 0 : loaderStyle === "b" ? 760 : 520);
}

function finishBoot() {
  loaderEl.hidden = true;
  loaderEl.className = "";
  loaderEl.innerHTML = "";
  booting = false;
  // 入场动画都播完再摘掉，免得之后 render 新节点也跟着播一遍
  setTimeout(() => document.body.classList.remove("revealing"), 1200);
}

/* 演示面板：切换加载动画（切了就重播）和连线流光 */
function pickOption(group, btn) {
  $$("button", group).forEach(x => x.classList.toggle("on", x === btn));
}
$("#opt-loader").onclick = e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  pickOption($("#opt-loader"), b); loaderStyle = b.dataset.v; boot();
};
$("#btn-replay").onclick = () => boot();
$("#opt-edge").onclick = e => {
  const b = e.target.closest("button[data-v]"); if (!b) return;
  pickOption($("#opt-edge"), b); edgeFx = b.dataset.v; renderEdges();
};

/* ---------- 启动 ---------- */
addEventListener("resize", () => { layoutOverlay(); segTo($("#seg-tool"), $("#seg-tool .on"), true); segTo($("#seg-view"), $("#seg-view .on"), true); });
render();
const W = innerWidth, H = innerHeight;
view.k = clampK(Math.min(1, (W - 140) / 1120));
view.x = W / 2 - 490 * view.k; view.y = Math.max(110, H * 0.3 - 118 * view.k);
apply(); buildPanel(); syncUndo(); syncDemo(); setSave("idle");
boot();
requestAnimationFrame(() => { segTo($("#seg-tool"), $("#seg-tool .on"), true); segTo($("#seg-view"), $("#seg-view .on"), true); layoutOverlay(); });
})();
</script>
