<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>添加节点菜单原型</title>
<style>
  /* 颜色与时长抄自 web/src/index.css、web/src/lib/motion.ts；--menu 是本次新增的 token */
  :root {
    --canvas-bg: oklch(0.975 0 0);
    --foreground: oklch(0.145 0 0);
    --popover: oklch(1 0 0);
    --menu: oklch(1 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --chrome-hover: oklch(0 0 0 / 0.05);
    --ease-out: cubic-bezier(0.2, 0, 0, 1);
  }
  [data-theme="dark"] {
    --canvas-bg: oklch(0.13 0 0);
    --foreground: oklch(0.985 0 0);
    --popover: oklch(0.205 0 0);
    --menu: oklch(0.269 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --chrome-hover: oklch(1 0 0 / 0.07);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--canvas-bg); color: var(--foreground);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .bar {
    position: fixed; top: 12px; right: 12px; z-index: 10; display: flex; gap: 8px; align-items: center; padding: 6px;
    border-radius: 12px; background: var(--popover); font-size: 12px; box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent);
  }
  .seg { display: flex; padding: 2px; border-radius: 8px; background: var(--muted); }
  .seg button {
    border: 0; background: transparent; color: var(--muted-foreground); font: inherit; padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--canvas-bg); color: var(--foreground); }
  .tip { position: fixed; left: 16px; top: 14px; max-width: 420px; font-size: 12px; color: var(--muted-foreground); }
  .stage { min-height: 100vh; display: grid; place-items: center; padding: 80px 16px 40px; }
  .hint { color: var(--muted-foreground); text-align: center; font-size: 13px; }
  .hint b { color: var(--foreground); }

  .menu {
    position: fixed; z-index: 5; text-align: left; animation: pop 100ms var(--ease-out); transform-origin: top left;
    background: var(--menu); color: var(--foreground); padding: 8px; display: flex; flex-direction: column;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.95) translateY(-4px); } }
  @media (prefers-reduced-motion: reduce) { .menu { animation: none; } }
  .menu[hidden] { display: none; }
  .label { color: var(--muted-foreground); font-size: 12px; }
  .item {
    display: flex; align-items: center; border: 0; background: transparent; color: inherit; font: inherit; width: 100%;
    text-align: left; cursor: pointer; transition: background-color 120ms;
  }
  .item:hover, .item:focus-visible { background: var(--chrome-hover); outline: 0; }
  .item[disabled] { opacity: .5; pointer-events: none; }
  .item svg { flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .sep { height: 1px; }
  .desc, .hintr { color: var(--muted-foreground); }

  /* ===== 现状 ===== */
  [data-variant="old"] .menu {
    width: 288px; border-radius: 16px; background: var(--popover);
    box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 10%, transparent), 0 10px 15px -3px rgba(0,0,0,.3);
  }
  [data-variant="old"] .label { padding: 8px 12px 4px; }
  [data-variant="old"] .item { gap: 14px; padding: 8px 12px; border-radius: 12px; min-height: 56px; }
  [data-variant="old"] .item svg { width: 20px; height: 20px; color: var(--muted-foreground); }
  [data-variant="old"] .title { font-size: 15px; line-height: 20px; }
  [data-variant="old"] .text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  [data-variant="old"] .desc { font-size: 12px; }
  [data-variant="old"] .hintr { margin-left: auto; font-size: 12px; }
  [data-variant="old"] .sep { margin: 6px 4px; background: color-mix(in oklch, var(--foreground) 10%, transparent); }
  [data-variant="old"] .only-new { display: none !important; }

  /* ===== 改版后 ===== */
  [data-variant="new"] .menu {
    width: 200px; border-radius: 10px; box-shadow: 0 20px 25px -5px rgba(0,0,0,.35);
  }
  [data-variant="new"] .label { padding: 4px 8px; line-height: 18px; color: color-mix(in oklch, var(--muted-foreground) 65%, transparent); }
  [data-variant="new"] .item { gap: 8px; padding: 0 8px; border-radius: 8px; height: 40px; font-size: 14px; }
  [data-variant="new"] .item svg { width: 16px; height: 16px; }
  [data-variant="new"] .sep { margin: 4px 8px; background: color-mix(in oklch, var(--foreground) 8%, transparent); }
  [data-variant="new"] .only-old { display: none !important; }
</style>
</head>
<body data-theme="dark">
<div class="tip">在画布空白处点一下（或双击）弹出菜单；右上角切「现状 / 改版后」看差别，切深色 / 浅色，再切「接不上」看禁用态。点菜单项会收起。</div>
<div class="bar">
  <div class="seg" id="variant"><button data-v="old" aria-pressed="false">现状</button><button data-v="new" aria-pressed="true">改版后</button></div>
  <div class="seg" id="theme"><button data-t="dark" aria-pressed="true">深色</button><button data-t="light" aria-pressed="false">浅色</button></div>
  <div class="seg" id="dis"><button data-d="0" aria-pressed="true">都能点</button><button data-d="1" aria-pressed="false">接不上</button></div>
</div>

<div class="stage" id="stage" data-variant="new">
  <p class="hint">点击这里任意位置弹出菜单<br /><span id="picked"></span></p>
</div>

<div class="menu" id="menu" hidden data-variant="new"></div>

<script>
  const icons = {
    image: '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>',
    video: '<svg viewBox="0 0 24 24"><path d="m16 13 5.2 3.5a.5.5 0 0 0 .8-.4V7.9a.5.5 0 0 0-.8-.4L16 11"/><rect x="2" y="6" width="14" height="12" rx="2"/></svg>',
    text: '<svg viewBox="0 0 24 24"><path d="M4 7V5h16v2M9 19h6M12 5v14"/></svg>',
    audio: '<svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>',
    upload: '<svg viewBox="0 0 24 24"><path d="M12 15V3M7 8l5-5 5 5M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/></svg>',
  };
  const items = [
    { k: "image", t: "图片生成", d: "文字或参考图出图" },
    { k: "video", t: "视频生成", d: "文生、参考、编辑、延长" },
    { k: "text", t: "文本", d: "脚本、分镜描述" },
    { k: "audio", t: "音频", d: "配乐、音效、配音" },
  ];
  const $ = (s) => document.querySelector(s);
  const menu = $("#menu"), stage = $("#stage");
  let variant = "new", disabled = false;

  function render() {
    menu.dataset.variant = variant; stage.dataset.variant = variant;
    document.body.dataset.variant = variant;
    menu.innerHTML =
      `<div class="label">添加节点</div>` +
      items.map((i) => `<button class="item" data-k="${i.k}" ${disabled && i.k !== "image" ? "disabled" : ""}>${icons[i.k]}<span class="text"><span class="title">${i.t}</span><span class="desc only-old">${i.d}</span></span></button>`).join("") +
      `<div class="sep"></div>` +
      `<button class="item" data-k="upload" ${disabled ? "disabled" : ""}>${icons.upload}<span class="text"><span class="title">上传素材</span></span><span class="hintr only-old">图片、视频、音频</span></button>`;
  }
  function open(x, y) {
    render(); menu.hidden = false;
    const w = variant === "old" ? 288 : 200, h = menu.offsetHeight;
    menu.style.left = Math.min(x, innerWidth - w - 8) + "px";
    menu.style.top = Math.min(y, innerHeight - h - 8) + "px";
    menu.style.animation = "none"; void menu.offsetWidth; menu.style.animation = "";
  }
  stage.addEventListener("click", (e) => { if (e.target.closest(".menu")) return; open(e.clientX, e.clientY); });
  document.addEventListener("click", (e) => { if (!e.target.closest(".menu") && !e.target.closest(".stage")) menu.hidden = true; });
  menu.addEventListener("click", (e) => {
    const b = e.target.closest(".item"); if (!b || b.disabled) return;
    $("#picked").textContent = "选了：" + b.querySelector(".title").textContent; menu.hidden = true;
  });
  function pressed(g, b) { g.querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", String(x === b))); }
  $("#variant").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pressed($("#variant"), b); variant = b.dataset.v; if (!menu.hidden) { const r = menu.getBoundingClientRect(); open(r.left, r.top); } else render(); });
  $("#theme").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pressed($("#theme"), b); document.body.dataset.theme = b.dataset.t; });
  $("#dis").addEventListener("click", (e) => { const b = e.target.closest("button"); if (!b) return; pressed($("#dis"), b); disabled = b.dataset.d === "1"; render(); });
  render();
</script>
</body>
</html>
