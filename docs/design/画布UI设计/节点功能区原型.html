<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>节点功能区原型</title>
<style>
  /* 颜色与时长抄自 web/src/index.css、web/src/lib/motion.ts，没有自造的颜色 */
  :root {
    --background: oklch(1 0 0);
    --foreground: oklch(0.145 0 0);
    --card: oklch(1 0 0);
    --popover: oklch(1 0 0);
    --muted: oklch(0.97 0 0);
    --muted-foreground: oklch(0.556 0 0);
    --chrome: oklch(1 0 0 / 0.82);
    --chrome-border: oklch(0 0 0 / 0.08);
    --chrome-hover: oklch(0 0 0 / 0.05);
    --node-ring: oklch(0.2 0 0 / 0.85);
    --credit: oklch(0.72 0.15 75);
    --destructive: oklch(0.577 0.245 27.325);
    --status-running: oklch(0.58 0.15 250);
    --status-success: oklch(0.6 0.15 155);
    --ease-out: cubic-bezier(0.2, 0, 0, 1);
    --d-fast: 120ms;
    --d-base: 180ms;
    --d-exit: 126ms;
    --z: 1;
  }
  [data-theme="dark"] {
    --background: oklch(0.145 0 0);
    --foreground: oklch(0.985 0 0);
    --card: oklch(0.205 0 0);
    --popover: oklch(0.205 0 0);
    --muted: oklch(0.269 0 0);
    --muted-foreground: oklch(0.708 0 0);
    --chrome: oklch(0.2 0 0 / 0.78);
    --chrome-border: oklch(1 0 0 / 0.08);
    --chrome-hover: oklch(1 0 0 / 0.07);
    --node-ring: oklch(1 0 0 / 0.72);
    --credit: oklch(0.82 0.15 85);
    --status-running: oklch(0.75 0.12 240);
    --status-success: oklch(0.75 0.15 155);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--background); color: var(--foreground);
    font: 14px/1.5 -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; }

  /* ===== 原型控制条（不属于产品） ===== */
  .ctrl {
    position: fixed; top: 12px; left: 12px; right: 12px; z-index: 30; display: flex; flex-wrap: wrap; gap: 8px 14px;
    align-items: center; padding: 6px 10px; border-radius: 12px; background: var(--card);
    border: 1px solid var(--chrome-border); font-size: 12px; color: var(--muted-foreground);
  }
  .ctrl label { display: flex; align-items: center; gap: 6px; }
  .seg { display: flex; padding: 2px; border-radius: 8px; background: var(--muted); }
  .seg button {
    border: 0; background: transparent; color: var(--muted-foreground); padding: 3px 10px; border-radius: 6px; cursor: pointer;
    transition: background-color var(--d-fast), color var(--d-fast);
  }
  .seg button[aria-pressed="true"] { background: var(--background); color: var(--foreground); }
  .ctrl input[type="range"] { width: 110px; accent-color: var(--foreground); }
  .tabnum { font-variant-numeric: tabular-nums; min-width: 3ch; display: inline-block; }

  /* ===== 画布与节点 ===== */
  .stage {
    min-height: 100vh; display: grid; place-items: center; padding: 200px 16px 120px;
    background-image: radial-gradient(var(--chrome-border) 1px, transparent 1px); background-size: 20px 20px;
  }
  .node-box { position: relative; width: calc(576px * var(--z)); height: calc(324px * var(--z)); }
  .node-scale { position: absolute; inset: 0 auto auto 0; width: 576px; height: 324px; transform: scale(var(--z)); transform-origin: top left; }
  .node-title {
    position: absolute; left: 2px; right: 2px; bottom: calc(100% + 8px); display: flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 600; pointer-events: none; white-space: nowrap;
  }
  .node-title svg { width: 14px; height: 14px; color: var(--muted-foreground); }
  .node-title .st { margin-left: auto; font-weight: 400; font-size: 12px; font-variant-numeric: tabular-nums; }
  .node-card {
    width: 100%; height: 100%; border-radius: 8px; background: var(--card); overflow: hidden; cursor: pointer;
    box-shadow: 0 0 0 1px var(--chrome-border); transition: box-shadow var(--d-fast);
    display: grid; place-items: center; color: var(--muted-foreground); position: relative;
  }
  .node-box[data-selected="true"] .node-card { box-shadow: 0 0 0 2px var(--node-ring); }
  .node-card.video { background: linear-gradient(135deg, oklch(0.32 0 0), oklch(0.18 0 0) 60%, oklch(0.26 0.02 250)); }
  .node-card.image { background: linear-gradient(160deg, oklch(0.4 0.04 60), oklch(0.2 0.02 280)); }
  .node-card.audio { background: var(--muted); }
  .node-card.script { background: var(--card); place-items: start; padding: 20px; font-size: 14px; line-height: 1.7; color: var(--foreground); }
  .node-card .bar { position: absolute; left: 12px; right: 12px; bottom: 10px; height: 3px; border-radius: 2px; background: oklch(1 0 0 / 0.25); }
  .node-card .bar i { display: block; width: 38%; height: 100%; border-radius: 2px; background: oklch(1 0 0 / 0.85); }
  .running-mask { position: absolute; inset: 0; display: none; place-items: center; background: oklch(0 0 0 / 0.35); color: #fff; font-size: 13px; }
  .node-box[data-state="running"] .running-mask { display: grid; }

  /* ===== 功能区（本次设计的主体） ===== */
  /* 屏幕尺寸固定，不随缩放；离标题行 16px，标题行高度跟着缩放 */
  .tb-anchor {
    position: absolute; left: 50%; bottom: calc(100% + 28px * var(--z) + 16px); z-index: 20;
    translate: -50% 0; /* 居中走独立的 translate，免得入场动画的 transform 把它盖掉、变成从右往左滑 */
    max-width: calc(100vw - 24px);
  }
  .tb-enter { animation: tb-in var(--d-base) var(--ease-out); }
  .tb-exit { animation: tb-out var(--d-exit) var(--ease-out) forwards; }
  @keyframes tb-in { from { opacity: 0; transform: translateY(6px); } }
  @keyframes tb-out { to { opacity: 0; transform: translateY(6px); } }

  .tb {
    display: flex; align-items: center; gap: 2px; height: 40px; padding: 0 4px; border-radius: 999px; white-space: nowrap;
    background: var(--chrome); color: var(--foreground); box-shadow: 0 10px 15px -3px oklch(0 0 0 / 0.2), 0 0 0 1px var(--chrome-border);
    backdrop-filter: blur(24px) saturate(1.5); -webkit-backdrop-filter: blur(24px) saturate(1.5);
  }
  .tb-sep { width: 1px; height: 18px; margin: 0 4px; background: var(--chrome-border); flex: none; }
  .tb-btn {
    position: relative; display: inline-flex; align-items: center; gap: 6px; flex: none; height: 32px; min-width: 32px; padding: 0 10px;
    border: 0; border-radius: 999px; background: transparent; color: var(--foreground); font-size: 14px; cursor: pointer; outline: none;
    transition: background-color var(--d-fast), color var(--d-fast), opacity var(--d-fast), transform var(--d-fast) var(--ease-out);
  }
  .tb-btn.icon { padding: 0 8px; color: var(--muted-foreground); }
  .tb-btn:hover { background: var(--chrome-hover); }
  .tb-btn.icon:hover { color: var(--foreground); }
  .tb-btn:active { transform: scale(0.96); }
  .tb-btn:focus-visible { box-shadow: 0 0 0 2px var(--node-ring); }
  .tb-btn[aria-expanded="true"] { background: var(--chrome-hover); }
  .tb-btn:disabled { opacity: 0.35; pointer-events: none; }
  .tb-btn svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tb-btn .chev { width: 14px; height: 14px; opacity: 0.6; transition: transform var(--d-fast) var(--ease-out); }
  .tb-btn[aria-expanded="true"] .chev { transform: rotate(180deg); }
  .paid { width: 12px !important; height: 12px !important; color: var(--credit); fill: currentColor !important; stroke: none !important; margin-left: -2px; }
  .badge {
    background: var(--foreground); color: var(--background); border-radius: 999px; padding: 0 6px; font: 600 11px/16px ui-monospace, monospace;
    font-variant-numeric: tabular-nums;
  }
  /* 窄屏：只留图标（文字进 tooltip） */
  .narrow .lbl, .narrow .paid { display: none; }
  .narrow .tb-btn { padding: 0 8px; }
  @media (max-width: 767px) { .lbl, .paid { display: none; } .tb-btn { padding: 0 8px; } }

  /* 下拉菜单：贴触发按钮下方 8px，从触发点向下展开；退出比进入快 */
  .menu {
    position: absolute; top: calc(100% + 8px); min-width: 176px; padding: 4px; border-radius: 12px; z-index: 25;
    background: var(--popover); color: var(--foreground); box-shadow: 0 10px 15px -3px oklch(0 0 0 / 0.25), 0 0 0 1px var(--chrome-border);
    opacity: 0; visibility: hidden; transform: translateY(6px); pointer-events: none;
    transition: opacity var(--d-exit) var(--ease-out), transform var(--d-exit) var(--ease-out), visibility 0s linear var(--d-exit);
  }
  .menu[data-open="true"] {
    opacity: 1; visibility: visible; transform: none; pointer-events: auto;
    transition: opacity var(--d-base) var(--ease-out), transform var(--d-base) var(--ease-out), visibility 0s;
  }
  .menu.end { right: 0; }
  .menu-label { padding: 6px 10px 4px; font-size: 12px; color: var(--muted-foreground); }
  .menu-item {
    display: flex; align-items: center; gap: 10px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px;
    background: transparent; text-align: left; cursor: pointer; outline: none; font-size: 14px; position: relative;
    transition: background-color var(--d-fast);
  }
  .menu-item:hover, .menu-item:focus-visible { background: var(--chrome-hover); }
  .menu-item svg { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; color: var(--muted-foreground); }
  .menu-item .paid { margin-left: 0; }
  .wrap { position: relative; flex: none; }

  /* 历史缩略图条 */
  .hist { padding: 8px; }
  .hist-row { display: flex; gap: 6px; max-width: 480px; overflow-x: auto; scrollbar-width: none; }
  .thumb {
    position: relative; flex: none; width: 52px; height: 30px; border: 0; padding: 0; border-radius: 7px; cursor: pointer; overflow: hidden;
    opacity: 0.6; transition: opacity var(--d-fast); outline: none;
  }
  .thumb:hover, .thumb[aria-pressed="true"], .thumb:focus-visible { opacity: 1; }
  .thumb[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--foreground); }
  .hist-tip { margin-top: 6px; padding: 0 2px; font-size: 12px; color: var(--muted-foreground); }

  /* toast / lightbox 只是原型里模拟「点了之后发生什么」 */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 8px); opacity: 0; z-index: 60; padding: 8px 14px; border-radius: 10px;
    background: var(--popover); box-shadow: 0 10px 15px -3px oklch(0 0 0 / 0.25), 0 0 0 1px var(--chrome-border); font-size: 13px; pointer-events: none;
    transition: opacity var(--d-base) var(--ease-out), transform var(--d-base) var(--ease-out);
  }
  .toast[data-show="true"] { opacity: 1; transform: translate(-50%, 0); }
  .lb { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: oklch(0 0 0 / 0.7); color: #fff; cursor: zoom-out; }
  .lb[data-show="true"] { display: grid; }
  .note { position: fixed; left: 12px; bottom: 12px; max-width: 420px; font-size: 12px; color: var(--muted-foreground); z-index: 5; }

  @media (prefers-reduced-motion: reduce) {
    .tb-enter, .tb-exit { animation: none; }
    .menu, .menu[data-open="true"], .tb-btn, .tb-btn .chev { transition-property: opacity; }
    .tb-btn:active { transform: none; }
  }
</style>
</head>
<body data-theme="dark">

<div class="ctrl">
  <label>节点<span class="seg" id="kindSeg">
    <button data-v="video" aria-pressed="true">视频</button><button data-v="image" aria-pressed="false">图片</button>
    <button data-v="audio" aria-pressed="false">音频</button><button data-v="script" aria-pressed="false">文本</button></span></label>
  <label>状态<span class="seg" id="stateSeg">
    <button data-v="ok" aria-pressed="true">已生成</button><button data-v="running" aria-pressed="false">生成中</button>
    <button data-v="empty" aria-pressed="false">还没素材</button></span></label>
  <label>缩放<input id="zoom" type="range" min="30" max="150" value="100" /><span class="tabnum" id="zoomVal">100%</span></label>
  <label>主题<span class="seg" id="themeSeg">
    <button data-v="dark" aria-pressed="true">深色</button><button data-v="light" aria-pressed="false">浅色</button></span></label>
  <label><input id="narrow" type="checkbox" /> 模拟窄屏（&lt;768px）</label>
</div>

<div class="stage" id="stage"></div>

<div class="toast" id="toast" role="status"></div>
<div class="lb" id="lb"><div id="lbText">放大预览（原型里是现有灯箱 MediaLightbox）· 点任意处关闭</div></div>
<div class="note">点节点选中 / 取消选中（功能区只在选中时出现）。灰显的功能点击提示「敬请期待」；放大、下载、历史、复制是真接通的。拖动缩放条看功能区大小不变、位置跟着标题行走。</div>

<script>
/* ---------- 图标（线条风，对应 lucide；代码里用 lucide-react 同类图标） ---------- */
const I = {
  retake: '<path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><path d="M12 9l1.2 2.8L16 13l-2.8 1.2L12 17l-1.2-2.8L8 13l2.8-1.2z"/>',
  upscale: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 15v-4M7 13h3M10 11v4M14 11h2a1.5 1.5 0 0 1 0 3h-2z"/>',
  edit: '<rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3"/>',
  trim: '<path d="M4 4v16M20 4v16M9 8h6M9 16h6"/>',
  tools: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.5-.7-.7-2.5z"/>',
  frames: '<path d="M12 3l9 9-9 9-9-9z"/>',
  mocap: '<circle cx="12" cy="5" r="2"/><path d="M12 7v7M5 10l7 1 7-1M9 21l3-7 3 7"/>',
  first: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/>',
  last: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>',
  custom: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 4v16M16 4v16"/>',
  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  zoom: '<path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5M5 21h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M4 16V6a2 2 0 0 1 2-2h10"/>',
  chev: '<path d="M6 9l6 6 6-6"/>',
  pen: '<path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  expand: '<path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>',
  cut: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',
  voice: '<path d="M3 12h2M7 8v8M11 5v14M15 8v8M19 11v2"/>',
  video: '<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
};
const svg = (name, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[name]}</svg>`;
const star = '<svg class="paid" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l2.2 7.8L22 12l-7.8 2.2L12 22l-2.2-7.8L2 12l7.8-2.2z"/></svg>';

/* ---------- 各节点种类的功能区配置：只改这张表就能换名字（对应 web 里的 NODE_TOOLBAR） ---------- */
const MEDIA_TAIL = { history: true, zoom: true, download: true };
const CONFIG = {
  video: { title: '镜头7', icon: 'video', items: [
    { id: 'retake', label: '局部重拍', icon: 'retake', paid: true, soon: true },
    { id: 'upscale', label: '智能超清', icon: 'upscale', paid: true, soon: true },
    { id: 'edit', label: '视频编辑', icon: 'edit', paid: true, soon: true },
    { id: 'frame', label: '截取帧', icon: 'camera', menu: [ { label: '首帧', icon: 'first' }, { label: '尾帧', icon: 'last' }, { label: '自定义', icon: 'custom' } ], soon: true },
    { id: 'trim', label: '视频修剪', icon: 'trim', soon: true },
    { id: 'tools', label: '工具', icon: 'tools', menu: [ { group: '编辑' }, { label: '补帧', icon: 'frames', paid: true }, { label: '深度动作捕捉', icon: 'mocap' } ], soon: true },
  ], tail: MEDIA_TAIL },
  image: { title: '图片 1', icon: 'edit', items: [
    { id: 'repaint', label: '局部重绘', icon: 'retake', paid: true, soon: true },
    { id: 'upscale', label: '智能超清', icon: 'upscale', paid: true, soon: true },
    { id: 'edit', label: '图片编辑', icon: 'pen', paid: true, soon: true },
    { id: 'expand', label: '扩图', icon: 'expand', paid: true, soon: true },
    { id: 'tools', label: '工具', icon: 'tools', menu: [ { group: '编辑' }, { label: '抠图', icon: 'cut', paid: true }, { label: '去水印', icon: 'pen', paid: true } ], soon: true },
  ], tail: MEDIA_TAIL },
  audio: { title: '音频 1', icon: 'voice', items: [
    { id: 'trim', label: '音频修剪', icon: 'trim', soon: true },
    { id: 'split', label: '人声分离', icon: 'voice', paid: true, soon: true },
  ], tail: { history: true, download: true } },
  script: { title: '文本 1', icon: 'pen', items: [
    { id: 'polish', label: '润色', icon: 'pen', paid: true, soon: true },
    { id: 'longer', label: '扩写', icon: 'expand', paid: true, soon: true },
    { id: 'shorter', label: '缩写', icon: 'trim', paid: true, soon: true },
  ], tail: { copy: true, zoom: true } },
};
const THUMBS = ['oklch(0.4 0.04 60)', 'oklch(0.35 0.05 250)', 'oklch(0.45 0.05 150)', 'oklch(0.3 0.03 20)'];

const st = { kind: 'video', state: 'ok', selected: true, open: null, active: 3, narrow: false };
const $ = (s) => document.querySelector(s);
const stage = $('#stage');
let toastTimer;
function toast(text) {
  const el = $('#toast'); el.textContent = text; el.dataset.show = 'true';
  clearTimeout(toastTimer); toastTimer = setTimeout(() => (el.dataset.show = 'false'), 1600);
}

function btn(item, disabled) {
  const open = st.open === item.id;
  const chev = item.menu ? svg('chev', 'chev') : '';
  const body = `${svg(item.icon)}<span class="lbl">${item.label}</span>${item.paid ? star : ''}${chev}`;
  const attrs = `data-id="${item.id}" ${disabled ? 'disabled' : ''} ${item.menu ? `aria-haspopup="menu" aria-expanded="${open}"` : ''} aria-label="${item.label}" title="${item.label}"`;
  if (!item.menu) return `<button class="tb-btn" ${attrs}>${body}</button>`;
  const rows = item.menu.map((m) => m.group
    ? `<div class="menu-label">${m.group}</div>`
    : `<button class="menu-item" role="menuitem" data-menu="${item.id}" data-label="${m.label}">${svg(m.icon)}${m.label}${m.paid ? star : ''}</button>`).join('');
  return `<span class="wrap"><button class="tb-btn" ${attrs}>${body}</button><div class="menu" role="menu" data-open="${open}">${rows}</div></span>`;
}

function histBtn(count, disabled) {
  const open = st.open === 'history';
  const thumbs = THUMBS.map((c, i) => `<button class="thumb" data-thumb="${i}" aria-pressed="${i === st.active}" aria-label="第 ${i + 1} 版" style="background:${c}"></button>`).join('');
  return `<span class="wrap"><button class="tb-btn icon" data-id="history" ${disabled ? 'disabled' : ''} aria-haspopup="menu" aria-expanded="${open}" aria-label="节点生成历史" title="节点生成历史${count ? '' : '：生成后，每一版结果都会留在这里'}">${svg('history')}${count > 1 ? `<span class="badge">${count}</span>` : ''}</button>
    <div class="menu end hist" data-open="${open}"><div class="hist-row">${thumbs}</div><div class="hist-tip">点缩略图切换版本 · 拖到画布上新建节点</div></div></span>`;
}

function render() {
  const cfg = CONFIG[st.kind];
  const noOutput = st.state !== 'ok';
  const running = st.state === 'running';
  const items = cfg.items.map((it) => btn(it, noOutput)).join('');
  const t = cfg.tail;
  const tail = [
    t.history ? histBtn(noOutput ? (running ? 4 : 0) : 4, st.state === 'empty') : '',
    t.copy ? `<button class="tb-btn icon" data-id="copy" aria-label="复制文本" title="复制文本（⌘C）" ${noOutput ? 'disabled' : ''}>${svg('copy')}</button>` : '',
    t.zoom ? `<button class="tb-btn icon" data-id="zoom" aria-label="放大预览" title="放大预览" ${noOutput ? 'disabled' : ''}>${svg('zoom')}</button>` : '',
    t.download ? `<button class="tb-btn icon" data-id="download" aria-label="下载" title="下载" ${noOutput ? 'disabled' : ''}>${svg('download')}</button>` : '',
  ].join('');
  const body = { video: '<div class="bar"><i></i></div>', image: '', audio: '', script: '一段镜头脚本：雨夜，老人在窗前沉默，镜头缓慢推近……' }[st.kind];
  const label = { video: '视频', image: '图片', audio: '音频', script: '' }[st.kind];
  const status = running ? '<span class="st" style="color:var(--status-running)">生成中 42%</span>' : '';
  const prevToolbar = $('.tb-anchor');
  stage.innerHTML = `
    <div class="node-box" id="node" data-selected="${st.selected}" data-state="${st.state}">
      <div class="node-scale">
        <div class="node-title">${svg(cfg.icon)}<span>${cfg.title}</span>${status}</div>
        <div class="node-card ${st.kind}" id="card">${st.kind === 'script' ? body : label + (st.state === 'empty' ? ' · 选中后输入提示词生成' : '')}${st.kind === 'video' ? body : ''}
          <div class="running-mask">生成中…</div></div>
      </div>
      ${st.selected ? `<div class="tb-anchor ${prevToolbar ? '' : 'tb-enter'}"><div class="tb" role="toolbar" aria-label="${cfg.title} 的功能区">
        ${items}${items && tail ? '<span class="tb-sep"></span>' : ''}${tail}</div></div>` : ''}
    </div>`;
}

/* 选中 / 取消选中：功能区淡入淡出（退出比进入快） */
function setSelected(next) {
  if (next === st.selected) return;
  if (next) { st.selected = true; st.open = null; render(); return; }
  const anchor = $('.tb-anchor');
  st.open = null;
  if (anchor) {
    anchor.classList.remove('tb-enter'); anchor.classList.add('tb-exit');
    $('#node').dataset.selected = 'false';
    setTimeout(() => { st.selected = false; render(); }, 126);
  } else { st.selected = false; render(); }
}

function toggleMenu(id) { st.open = st.open === id ? null : id; syncMenus(); }
/* 只改属性、不重建 DOM，菜单的进出才有过渡 */
function syncMenus() {
  document.querySelectorAll('.tb-btn[aria-haspopup]').forEach((b) => {
    const on = st.open === b.dataset.id;
    b.setAttribute('aria-expanded', on);
    b.nextElementSibling.dataset.open = on;
  });
}

stage.addEventListener('click', (e) => {
  const thumb = e.target.closest('[data-thumb]');
  if (thumb) {
    if (st.state === 'running') return toast('生成中不能切换版本');
    st.active = +thumb.dataset.thumb;
    document.querySelectorAll('.thumb').forEach((b, i) => b.setAttribute('aria-pressed', i === st.active));
    return toast(`已切换到第 ${st.active + 1} 版`);
  }
  const item = e.target.closest('.menu-item');
  if (item) { st.open = null; syncMenus(); return toast(`「${item.dataset.label}」敬请期待`); }
  const b = e.target.closest('.tb-btn');
  if (b) {
    const id = b.dataset.id;
    if (b.hasAttribute('aria-haspopup')) return toggleMenu(id);
    st.open = null; syncMenus();
    if (id === 'zoom') { $('#lb').dataset.show = 'true'; return; }
    if (id === 'download') return toast('已开始下载（原型示意）');
    if (id === 'copy') return toast('已复制文本');
    return toast(`「${b.getAttribute('aria-label')}」敬请期待`);
  }
  if (e.target.closest('#card')) return setSelected(!st.selected);
});
$('#lb').addEventListener('click', () => ($('#lb').dataset.show = 'false'));
document.addEventListener('pointerdown', (e) => {
  if (st.open && !e.target.closest('.wrap')) { st.open = null; syncMenus(); }
});
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if ($('#lb').dataset.show === 'true') return ($('#lb').dataset.show = 'false');
  if (st.open) { st.open = null; syncMenus(); } else setSelected(false);
});

function bindSeg(id, key, after) {
  $(id).addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    $(id).querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', x === b));
    after(b.dataset.v);
  });
}
bindSeg('#kindSeg', 'kind', (v) => { st.kind = v; st.open = null; render(); });
bindSeg('#stateSeg', 'state', (v) => { st.state = v; st.open = null; render(); });
bindSeg('#themeSeg', 'theme', (v) => (document.body.dataset.theme = v));
$('#zoom').addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--z', e.target.value / 100);
  $('#zoomVal').textContent = e.target.value + '%';
});
$('#narrow').addEventListener('change', (e) => { document.body.classList.toggle('narrow', e.target.checked); });
render();
</script>
</body>
</html>
