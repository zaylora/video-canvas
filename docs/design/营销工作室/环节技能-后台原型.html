<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>环节技能后台原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
      /* 令牌照抄 web/src/index.css（:root / .dark / 后台浅色与首页外壳同一套米色）；布局照 pages/admin/layout.tsx。对应设计文档 §6.9 / §6.11 */
      :root {
        --background: oklch(0.95 0.007 85); --foreground: oklch(0.145 0 0);
        --card: oklch(0.985 0.004 85); --popover: oklch(0.985 0.004 85); --popover-foreground: oklch(0.145 0 0);
        --muted: oklch(0.92 0.008 85); --muted-foreground: oklch(0.5 0.015 85);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.22 0.02 85 / 0.1); --input: oklch(0.22 0.02 85 / 0.16); --ring: oklch(0.708 0 0);
        --sidebar: oklch(0.925 0.009 85);
        --chrome: oklch(0.97 0.006 85 / 0.8); --chrome-border: oklch(0.22 0.02 85 / 0.1); --chrome-hover: oklch(0.22 0.02 85 / 0.06);
        --credit: oklch(0.72 0.15 75);
        --status-running: oklch(0.58 0.15 250); --status-success: oklch(0.6 0.15 155); --status-warning: oklch(0.7 0.16 70);
        --beam: oklch(0.62 0.16 55); --preset: oklch(0.55 0.2 295);
        --font-sans: "Geist", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
        --font-mono: "Geist Mono", "SF Mono", Consolas, monospace;
        color-scheme: light;
      }
      .dark {
        --background: oklch(0.145 0 0); --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0); --popover: oklch(0.205 0 0); --popover-foreground: oklch(0.985 0 0);
        --muted: oklch(0.269 0 0); --muted-foreground: oklch(0.708 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%); --input: oklch(1 0 0 / 15%); --ring: oklch(0.556 0 0);
        --sidebar: oklch(0.205 0 0);
        --chrome: oklch(0.2 0 0 / 0.78); --chrome-border: oklch(1 0 0 / 0.08); --chrome-hover: oklch(1 0 0 / 0.07);
        --credit: oklch(0.82 0.15 85);
        --status-running: oklch(0.75 0.12 240); --status-success: oklch(0.75 0.15 155); --status-warning: oklch(0.8 0.15 75);
        --beam: oklch(0.78 0.15 70); --preset: oklch(0.6 0.19 295);
        color-scheme: dark;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body { font-family: var(--font-sans); font-size: 14px; line-height: 1.5; color: var(--foreground); background: var(--sidebar); -webkit-font-smoothing: antialiased; overflow: hidden; }
      button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
      button:disabled { cursor: not-allowed; }
      input, select { font: inherit; color: inherit; }
      [data-lucide] { width: 16px; height: 16px; flex: none; stroke-width: 2; }
      .mono { font-family: var(--font-mono); }
      .tnum { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted-foreground); }
      .row { display: flex; align-items: center; }
      .grow { flex: 1; min-width: 0; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .spin { animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pop { from { opacity: 0; transform: scale(0.97); } }
      @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
      @keyframes fade { from { opacity: 0; } }

      .chrome { background: var(--chrome); box-shadow: 0 10px 15px -3px oklch(0 0 0 / 0.1), 0 0 0 1px var(--chrome-border); backdrop-filter: blur(24px) saturate(1.5); }
      .pill-bar { display: flex; align-items: center; gap: 2px; border-radius: 999px; height: 40px; padding: 0 4px; }
      .icon-btn { width: 32px; height: 32px; border-radius: 999px; display: inline-grid; place-items: center; }
      .icon-btn:hover { background: var(--chrome-hover); }
      .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 999px; font-size: 13px; font-weight: 500; white-space: nowrap; transition: opacity 0.15s, background 0.15s; }
      .btn-xs { height: 28px; padding: 0 10px; font-size: 12.5px; }
      .btn-primary { background: var(--foreground); color: var(--background); }
      .btn-primary:hover:not(:disabled) { opacity: 0.88; }
      .btn-primary:disabled { background: var(--chrome-hover); color: var(--muted-foreground); }
      .btn-outline { box-shadow: inset 0 0 0 1px var(--border); }
      .btn-outline:hover:not(:disabled) { background: var(--chrome-hover); }
      .btn-outline:disabled, .btn-ghost:disabled { opacity: 0.5; }
      .btn-ghost:hover:not(:disabled) { background: var(--chrome-hover); }
      .status { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 8px; border-radius: 999px; font-size: 11px; font-weight: 500; line-height: 1; white-space: nowrap; flex: none; }
      .status [data-lucide] { width: 12px; height: 12px; }
      .s-success { background: color-mix(in oklch, var(--status-success) 15%, transparent); color: var(--status-success); }
      .s-running { background: color-mix(in oklch, var(--status-running) 15%, transparent); color: var(--status-running); }
      .s-warning { background: color-mix(in oklch, var(--status-warning) 15%, transparent); color: var(--status-warning); }
      .s-bad { background: color-mix(in oklch, var(--destructive) 12%, transparent); color: var(--destructive); }
      .s-muted { background: var(--muted); color: var(--muted-foreground); }
      .s-preset { background: color-mix(in oklch, var(--preset) 14%, transparent); color: var(--preset); }
      .s-beam { background: color-mix(in oklch, var(--beam) 16%, transparent); color: var(--beam); }

      /* ---- 后台外壳 ---- */
      .shell { display: flex; height: 100vh; }
      .sidebar { width: 256px; flex: none; padding: 8px; display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
      .brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; margin: 4px 0 6px; font-weight: 600; }
      .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(135deg, oklch(0.78 0.15 70), var(--beam)); display: grid; place-items: center; color: #1a1205; }
      .grp { font-size: 12px; color: var(--muted-foreground); padding: 14px 12px 4px; }
      .nav { position: relative; display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 12px; border-radius: 10px; font-size: 13.5px; color: var(--muted-foreground); width: 100%; text-align: left; }
      .nav:hover { background: var(--chrome-hover); color: var(--foreground); }
      .nav.on { background: var(--chrome-hover); color: var(--foreground); font-weight: 600; box-shadow: 0 0 0 1px var(--chrome-border); }
      .nav .new { margin-left: auto; font-size: 10px; padding: 0 6px; border-radius: 999px; background: color-mix(in oklch, var(--beam) 15%, transparent); color: var(--beam); font-weight: 500; }
      .inset { flex: 1; min-width: 0; margin: 8px 8px 8px 0; border-radius: 22px; background: var(--background); box-shadow: 0 12px 40px -18px oklch(0 0 0 / 0.35), 0 0 0 1px var(--border); display: flex; flex-direction: column; overflow: hidden; position: relative; }
      .hdr { height: 56px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 20px; }
      .crumb { display: flex; align-items: center; gap: 6px; font-size: 13.5px; color: var(--muted-foreground); }
      .crumb b { color: var(--foreground); font-weight: 500; }
      .crumb [data-lucide] { width: 14px; height: 14px; }
      .main { flex: 1; overflow-y: auto; padding: 4px 24px 40px; }
      .page-title { display: flex; align-items: center; gap: 10px; margin: 6px 0 16px; }
      .page-title h1 { margin: 0; font-size: 20px; font-weight: 600; }

      .banner { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 10px 14px; margin-bottom: 14px; font-size: 13.5px; background: color-mix(in oklch, var(--status-warning) 12%, transparent); }
      .banner [data-lucide] { color: var(--status-warning); }
      .panel { border-radius: 18px; background: var(--card); box-shadow: 0 0 0 1px var(--border); overflow: hidden; margin-bottom: 16px; }
      .panel-h { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; font-size: 14px; }
      table { border-collapse: collapse; width: 100%; }
      th { text-align: left; font-weight: 500; font-size: 12px; color: var(--muted-foreground); padding: 8px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; }
      td { padding: 11px 16px; border-bottom: 1px solid var(--border); font-size: 13.5px; vertical-align: middle; }
      tr:last-child td { border-bottom: 0; }
      tbody tr.click { cursor: pointer; }
      tbody tr.click:hover td { background: var(--chrome-hover); }
      tbody tr.dim td { color: var(--muted-foreground); }
      .key { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted-foreground); }
      .meth { display: inline-flex; align-items: center; gap: 6px; }
      .meth [data-lucide] { width: 14px; height: 14px; color: var(--muted-foreground); }
      .tbl-wrap { overflow-x: auto; }

      /* ---- 抽屉 ---- */
      .sheet-bg { position: fixed; inset: 0; z-index: 40; background: oklch(0 0 0 / 0.4); animation: fade 0.15s; }
      .sheet { position: fixed; top: 8px; right: 8px; bottom: 8px; z-index: 41; width: min(880px, calc(100vw - 16px)); border-radius: 20px; background: var(--popover); box-shadow: 0 25px 60px -12px oklch(0 0 0 / 0.5), 0 0 0 1px var(--border); display: flex; flex-direction: column; animation: slide 0.2s ease-out; }
      .sheet-h { padding: 16px 18px 0; }
      .sheet-h h2 { margin: 0; font-size: 17px; font-weight: 600; }
      .tabs { display: flex; gap: 2px; margin-top: 12px; border-bottom: 1px solid var(--border); }
      .tab { height: 36px; padding: 0 14px; font-size: 13.5px; color: var(--muted-foreground); border-bottom: 2px solid transparent; margin-bottom: -1px; display: inline-flex; align-items: center; gap: 6px; }
      .tab.on { color: var(--foreground); border-bottom-color: var(--foreground); font-weight: 500; }
      .tab [data-lucide] { width: 14px; height: 14px; }
      .sheet-b { flex: 1; overflow-y: auto; padding: 16px 18px 24px; display: grid; gap: 16px; align-content: start; }
      .sec h3 { margin: 0 0 8px; font-size: 13px; font-weight: 600; display: flex; align-items: center; gap: 6px; }
      .sec h3 .status { font-weight: 500; }
      .box { border-radius: 14px; box-shadow: inset 0 0 0 1px var(--border); padding: 12px 14px; font-size: 13.5px; }
      .code { font-family: var(--font-mono); font-size: 12px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; background: var(--muted); border-radius: 12px; padding: 12px 14px; max-height: 300px; overflow: auto; margin: 0; }
      ul.rules { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
      .layers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
      .layer { border-radius: 12px; padding: 10px 12px; font-size: 12.5px; box-shadow: inset 0 0 0 1px var(--border); }
      .layer b { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 4px; }
      .layer.swap { box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--beam) 60%, transparent); background: color-mix(in oklch, var(--beam) 6%, transparent); }
      .cand { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 12px; box-shadow: inset 0 0 0 1px var(--border); width: 100%; text-align: left; }
      .cand:hover:not(:disabled) { background: var(--chrome-hover); }
      .cand.on { box-shadow: inset 0 0 0 1.5px var(--foreground); }
      .cand:disabled { opacity: 0.5; }
      .radio { width: 16px; height: 16px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--foreground) 40%, transparent); flex: none; display: grid; place-items: center; }
      .cand.on .radio::after { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--foreground); }
      .sel { height: 30px; border-radius: 8px; border: 0; box-shadow: inset 0 0 0 1px var(--input); background: transparent; padding: 0 8px; font-size: 12.5px; }
      .sel option { background: var(--popover); color: var(--popover-foreground); }
      .hist { display: grid; gap: 0; }
      .hist > div { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 13px; }
      .hist > div:first-child { border-top: 0; }
      .form { display: grid; grid-template-columns: 90px minmax(0, 1fr); gap: 10px 12px; align-items: center; font-size: 13px; }
      .form > label { color: var(--muted-foreground); font-size: 12.5px; }
      .seg { display: inline-flex; flex-wrap: wrap; gap: 6px; }
      .seg button { height: 30px; padding: 0 12px; border-radius: 999px; font-size: 12.5px; box-shadow: inset 0 0 0 1px var(--border); color: var(--muted-foreground); }
      .seg button.on { box-shadow: inset 0 0 0 1.5px var(--foreground); color: var(--foreground); font-weight: 500; }
      .seg button:disabled { opacity: 0.4; }
      .cmp { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .col { border-radius: 14px; box-shadow: inset 0 0 0 1px var(--border); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
      .col.cand-col { box-shadow: inset 0 0 0 1.5px color-mix(in oklch, var(--beam) 55%, transparent); }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
      .metric { border-radius: 10px; background: var(--muted); padding: 6px 8px; font-size: 11.5px; color: var(--muted-foreground); }
      .metric b { display: block; font-size: 14px; color: var(--foreground); font-weight: 600; font-variant-numeric: tabular-nums; }
      .err { font-size: 12.5px; color: var(--destructive); display: grid; gap: 3px; }
      .flagl { font-size: 12.5px; color: var(--status-warning); display: grid; gap: 3px; }
      .sheet-f { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .overlay { position: fixed; inset: 0; z-index: 60; background: oklch(0 0 0 / 0.5); backdrop-filter: blur(4px); display: grid; place-items: center; padding: 16px; animation: fade 0.15s; }
      .dialog { width: 100%; max-width: 560px; border-radius: 16px; background: var(--popover); box-shadow: 0 25px 50px -12px oklch(0 0 0 / 0.45), 0 0 0 1px var(--border); padding: 18px; display: grid; gap: 14px; animation: pop 0.16s ease-out; max-height: calc(100vh - 48px); overflow-y: auto; }
      .dialog h3 { margin: 0; font-size: 16px; font-weight: 600; }
      .foot { display: flex; justify-content: flex-end; gap: 8px; }
      .toast { position: fixed; bottom: 24px; right: 24px; z-index: 99; display: grid; gap: 8px; }
      .toast > div { display: flex; align-items: center; gap: 10px; border-radius: 12px; padding: 11px 14px; background: var(--popover); box-shadow: 0 10px 30px oklch(0 0 0 / 0.25), 0 0 0 1px var(--border); font-size: 13.5px; animation: pop 0.2s ease-out; max-width: 420px; }
      .toast .ok { color: var(--status-success); } .toast .bad { color: var(--destructive); } .toast .warn { color: var(--status-warning); }
      .demo { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); z-index: 30; border-radius: 16px; padding: 7px 10px; font-size: 12px; display: flex; align-items: center; gap: 10px; }
      .demo label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
      .demo b { font-weight: 600; color: rgb(167 139 250); }
      @media (max-width: 900px) { .sidebar { display: none; } .inset { margin: 0; border-radius: 0; } .layers, .cmp, .metrics { grid-template-columns: 1fr; } .demo { top: auto; bottom: 12px; } }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="inset">
        <header class="hdr">
          <button class="icon-btn" title="收起侧栏"><i data-lucide="panel-left"></i></button>
          <div class="crumb"><span>AI 配置</span><i data-lucide="chevron-right"></i><b>环节技能</b></div>
          <div class="grow"></div>
          <div class="chrome pill-bar"><button class="icon-btn" id="themeBtn" title="切换明暗"><i data-lucide="sun-moon"></i></button></div>
        </header>
        <main class="main" id="main"></main>
      </div>
    </div>
    <div id="layer"></div>
    <div class="toast" id="toastBox"></div>
    <div class="demo chrome"><b>演示</b><label><input type="checkbox" id="dDisable" /> 停用 daihuo-fanpai 技能</label><button class="btn btn-ghost btn-xs" id="dReset"><i data-lucide="rotate-ccw"></i>重置</button></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
      const ic = (n, cls = "") => `<i data-lucide="${n}" class="${cls}"></i>`;
      const icons = () => { if (window.lucide) lucide.createIcons(); };
      const clone = (o) => JSON.parse(JSON.stringify(o));
      function toast(msg, kind = "ok") {
        const el = document.createElement("div");
        el.innerHTML = `${ic({ ok: "circle-check", bad: "circle-x", warn: "triangle-alert" }[kind], kind)}<span>${esc(msg)}</span>`;
        $("#toastBox").appendChild(el); icons(); setTimeout(() => el.remove(), 2800);
      }

      /* ================= 数据（示意） ================= */
      const SKILLS = {
        "daihuo-fanpai": { title: "带货翻拍", versions: [1, 2, 3], active: 3, scripts: true, chars: 38000, enabled: true },
        "tvc-director": { title: "TVC 导演", versions: [1], active: 1, scripts: false, chars: 9200, enabled: true },
        "creatify-ad-prompt-guide": { title: "广告提示词指南", versions: [1], active: 1, scripts: false, chars: 7600, enabled: true },
        "creatify-ad-reverse": { title: "竞品广告拆解", versions: [1], active: 1, scripts: false, chars: 5400, enabled: true },
        "old-ad-writer": { title: "老版广告文案", versions: [1], active: 1, scripts: false, chars: 3100, enabled: true },
        hypit: { title: "Hypit", versions: [1], active: 1, scripts: true, chars: 21000, enabled: true },
      };
      const SAMPLES = {
        perfume: { name: "晨雾香水 · 抖音 · 无参考", ref: false },
        blender: { name: "便携榨汁杯 · TikTok · 英文", ref: false },
        cream: { name: "护手霜 · 抖音 · 带 10 秒参考片", ref: true },
      };
      const TMS = { gemini: { name: "Gemini 3 Pro", vision: true, video: true }, claude: { name: "Claude Sonnet 5.5", vision: true, video: false }, ds: { name: "DeepSeek V4", vision: false, video: false } };
      const STEPS = [
        { key: "marketing.facts", title: "商品事实卡", studio: "营销工作室", media: "看图", needVision: true, refSample: false,
          duty: "从商品图和用户描述里提取商品事实：外观锚点、已证实卖点、禁用说法、目标人群与引导下单。只写图里看得见、描述里说过的。",
          inputs: [["product_images", "图片 1–4", "商品图（多模态附件）"], ["description", "文本 ≤1000", "用户描述，可空"], ["platform", "枚举", "投放平台"], ["language", "zh | en", "旁白语言"]],
          schema: `{\n  "name": "string",\n  "category": "string",\n  "anchors": ["string, 1–8 条"],\n  "selling_points": [{ "text": "string", "proof": "string", "source": "description | image" }],\n  "prohibited": ["string"],\n  "audience": "string",\n  "cta": "string"\n}`,
          hard: ["必须是合法 JSON 且字段齐全", "anchors 1–8 条，selling_points 1–5 条", "source 只能是 description 或 image"], soft: ["卖点含广告法极限词（国内平台）"],
          binding: { source: "builtin" }, fail7d: "0.4%", lastTrial: { ok: true, at: "11-09 10:12" } },
        { key: "marketing.reverse", title: "拆解参考片", studio: "营销工作室", media: "看视频（退回看图 + 截帧）", needVision: true, refSample: true,
          duty: "把参考视频拆成逐镜头的分镜表：每镜的景别、运镜、主体 + 动作（写到发力过程）、商品怎么出现、台词、关键颜色、是否前 3 秒，以及整条为什么火、出现的第三方品牌与背书话术。",
          inputs: [["video", "视频 ≤15s", "参考视频（原生视频输入；不支持时为截帧图片）"], ["duration", "秒", "参考片时长"], ["cuts", "秒[]", "ffmpeg 检测到的镜头切点"]],
          schema: `{\n  "overall": { "style", "narrative_arc", "why_viral", "transcript", "category" },\n  "shots": [{\n    "id", "start", "end", "is_opening_3s",\n    "shot_size", "camera", "subject", "action",\n    "scene", "lighting", "person", "product_in_frame",\n    "product_role": "none | dynamic | hero_real | package_text",\n    "dialogue", "onscreen_text", "key_colors": []\n  }],\n  "brands": [], "claims": []\n}`,

            <div class="sheet-f">
              ${S.tab !== "trial" ? `<span class="muted" style="font-size:12.5px">候选：${esc(label(S.cand))}</span><span class="grow"></span><button class="btn btn-primary" data-act="tab" data-t="trial">${ic("flask-conical")}去试跑</button>`
                : `<span class="muted" style="font-size:12.5px">${t && !running ? `本次试跑 ✦${t.cand.res.credits + (t.base ? t.base.res.credits : 0)}，记在你的账户` : "试跑费用记在操作人账户"}</span><span class="grow"></span>
                   <button class="btn btn-outline" data-act="run" ${running ? "disabled" : ""}>${running ? ic("loader-2", "spin") : ic("play")}${t ? "再跑一次" : "开始试跑"}</button>
                   <button class="btn btn-primary" data-act="activate" ${canActivate ? "" : "disabled"} title="${esc(why)}">${ic("check")}设为生效</button>`}
            </div>
          </div>
          ${S.confirm ? confirmHTML(st) : ""}${S.fmt ? fmtHTML() : ""}`;
        icons();
      }
      function trialCol(x, isCand) {
        if (x.running) return `<div class="col ${isCand ? "cand-col" : ""}"><div class="row" style="gap:6px"><b style="font-weight:500">${isCand ? "候选" : "当前"} · ${esc(label(x.c))}</b></div><div class="muted row" style="gap:6px">${ic("loader-2", "spin")}试跑中…</div></div>`;
        const r = x.res;
        return `<div class="col ${isCand ? "cand-col" : ""}">
          <div class="row" style="gap:6px;flex-wrap:wrap"><b style="font-weight:500">${isCand ? "候选" : "当前"} · ${esc(label(x.c))}</b><span class="grow"></span><span class="status ${r.passed ? "s-success" : "s-bad"}">${ic(r.passed ? "check" : "x")}${r.passed ? "格式校验通过" : "格式校验失败"}</span></div>
          <div class="metrics"><div class="metric">耗时<b>${r.dur}s</b></div><div class="metric">输入<b>${r.tin.toLocaleString()}</b></div><div class="metric">输出<b>${r.tout.toLocaleString()}</b></div><div class="metric">积分<b>✦${r.credits}</b></div></div>
          ${r.errors.length ? `<div class="err">${r.errors.map((e) => `<span class="row" style="gap:6px;align-items:flex-start">${ic("circle-x")}${esc(e)}</span>`).join("")}</div>` : ""}
          ${r.flags.length ? `<div class="flagl">${r.flags.map((e) => `<span class="row" style="gap:6px">${ic("triangle-alert")}软问题：${esc(e)}</span>`).join("")}</div>` : ""}
          <div class="muted" style="font-size:12px">${r.attempts > 1 ? "重写 1 次" : "一次通过"} · 输出预览</div>
          <pre class="code" style="max-height:180px">${esc(r.preview)}</pre>
        </div>`;
      }
      function confirmHTML(st) {
        return `<div class="overlay"><div class="dialog"><h3>把「${esc(st.title)}」换成 ${esc(label(S.cand))}？</h3>
          <div class="muted" style="font-size:13.5px">立即生效：之后新开始的环节都用它，进行中的不受影响。输出格式不变，下游不需要任何调整。</div>
          <div class="box row" style="gap:8px;font-size:13px">${esc(effective(st).fallback ? "内置方法" : label(st.binding))} ${ic("arrow-right")} <b style="font-weight:500">${esc(label(S.cand))}</b></div>
          <div class="foot"><button class="btn btn-ghost" data-act="confirm-no">取消</button><button class="btn btn-primary" data-act="confirm-yes">设为生效</button></div></div></div>`;
      }
      function fmtHTML() {
        const k = S.fmt;
        const seed = `[基本参数] 9:16，15 秒，有声\n[参考素材] @图片1：晨雾香水 50ml，外观的唯一依据，禁止重新设计、改色、改形、改 logo。\n[整体视觉] 前 3 秒强钩子，节奏快；痛点-解决\n[商品] 方形磨砂玻璃瓶身；金色金属瓶盖；正面 logo「BRUME」\n[分镜] 镜头1（0–3s）特写，固定：地铁车厢里女生低头闻袖口，微微皱眉。旁白：「早上喷的香，中午就没了？」\n       …\n[音乐与配音] 旁白：中文，年轻女声；配乐：轻快电子节拍\n[硬性约束] 商品外观与参考图一致；商品不出画；除商品本身印刷的文字外画面不出现任何文字…`;
        const gen = `一条 15 秒、9:16 的有声商品广告。@图片1：晨雾香水 50ml，外观的唯一依据……\n\n整体风格：前 3 秒强钩子，节奏快；痛点-解决。商品外观：方形磨砂玻璃瓶身、金色金属瓶盖……\n\n镜头1（0–3s）特写，固定：地铁车厢里女生低头闻袖口……\n\n要求：商品外观与参考图一致；商品不出画……`;
        return `<div class="overlay" data-act="fmt-close"><div class="dialog" style="max-width:640px"><h3>格式化器预览 · ${esc(k)}</h3>
          <div class="muted" style="font-size:13px">同一份脚本，经代码拼装成视频模型的提示词。它不读技能，换技能不影响这里；改写法需要改代码发版。</div>
          <pre class="code">${esc(k === "seedance" ? seed : gen)}</pre><div class="foot"><button class="btn btn-primary" data-act="fmt-close">好的</button></div></div></div>`;
      }

      function runTrial() {
        const st = stepByKey(S.open);
        const e = effective(st);
        const base = S.compare && !(sameCand(S.cand, st.binding) && !e.fallback) ? (e.fallback ? { source: "builtin" } : clone(st.binding)) : null;
        S.trial = { cand: { c: clone(S.cand), running: true }, base: base ? { c: base, running: true } : null };
        renderSheet();
        setTimeout(() => {
          if (!S.trial) return;
          S.trial.cand = { c: S.trial.cand.c, running: false, res: simulate(st, S.trial.cand.c) };
          if (S.trial.base) S.trial.base = { c: S.trial.base.c, running: false, res: simulate(st, S.trial.base.c) };
          st.lastTrial = { ok: S.trial.cand.res.passed, at: "刚刚" };
          renderSheet(); renderMain();
          toast(S.trial.cand.res.passed ? "候选通过格式校验" : "候选没有通过格式校验", S.trial.cand.res.passed ? "ok" : "bad");
        }, 1600);
      }

      /* ================= 事件 ================= */
      document.addEventListener("click", (ev) => {
        const el = ev.target.closest("[data-act]");
        if (!el || el.disabled) return;
        const a = el.dataset.act;
        const st = S.open && stepByKey(S.open);
        switch (a) {
          case "open": openSheet(el.dataset.k); break;
          case "close": S.open = null; S.trial = null; $("#layer").innerHTML = ""; break;
          case "tab": S.tab = el.dataset.t; renderSheet(); break;
          case "cand": {
            const src = el.dataset.s;
            const c = src === "builtin" ? { source: "builtin" } : { source: "skill", skill: el.dataset.skill, version: S.skills[el.dataset.skill].active };
            if (!sameCand(c, S.cand)) { S.cand = c; S.trial = null; }
            renderSheet(); break;
          }
          case "sample": S.sample = el.dataset.k; S.trial = null; renderSheet(); break;
          case "tm": S.tm = el.dataset.k; S.trial = null; renderSheet(); break;
          case "run": runTrial(); break;
          case "activate": S.confirm = true; renderSheet(); break;
          case "confirm-no": S.confirm = null; renderSheet(); break;
          case "confirm-yes": {
            const from = effective(st).fallback ? "内置方法" : label(st.binding);
            st.binding = clone(S.cand);
            S.history[st.key].push({ at: "刚刚", who: "你", from, to: label(st.binding) });
            S.confirm = null; S.trial = null; S.tab = "method";
            renderSheet(); renderMain();
            toast(`「${st.title}」已换成 ${label(st.binding)}`);
            break;
          }
          case "restore": {
            const to = el.dataset.to;
            if (to === "内置方法") S.cand = { source: "builtin" };
            else { const [skill, v] = to.split(" v"); S.cand = { source: "skill", skill, version: Number(v) }; }
            S.trial = null; S.tab = "trial"; renderSheet();
            toast("恢复也需要先试跑通过", "warn");
            break;
          }
          case "fmt": S.fmt = el.dataset.k; if (!S.open) { $("#layer").innerHTML = fmtHTML(); icons(); } else renderSheet(); break;
          case "fmt-close": if (ev.target !== el && !ev.target.closest("button")) return; S.fmt = null; if (S.open) renderSheet(); else $("#layer").innerHTML = ""; break;
        }
      });
      document.addEventListener("change", (ev) => {
        const t = ev.target;
        if (t.dataset.act === "ver") { S.cand.version = Number(t.value); S.trial = null; renderSheet(); }
        if (t.dataset.act === "compare") { S.compare = t.checked; S.trial = null; renderSheet(); }
      });
      document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") { if (S.fmt) { S.fmt = null; S.open ? renderSheet() : ($("#layer").innerHTML = ""); } else if (S.confirm) { S.confirm = null; renderSheet(); } else if (S.open) { S.open = null; $("#layer").innerHTML = ""; } } });
      $("#themeBtn").addEventListener("click", () => document.documentElement.classList.toggle("dark"));
      $("#dDisable").addEventListener("change", (ev) => { S.skills["daihuo-fanpai"].enabled = !ev.target.checked; renderMain(); if (S.open) renderSheet(); });
      $("#dReset").addEventListener("click", () => { $("#dDisable").checked = false; $("#layer").innerHTML = ""; init(); renderMain(); });

      init();
      renderSidebar();
      renderMain();
    </script>
  </body>
</html>
