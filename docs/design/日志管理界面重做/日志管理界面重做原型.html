.shell{display:grid;grid-template-columns:200px minmax(0,1fr);min-height:calc(100vh - 45px)}

  if (sec == null) return "";
  if (sec < 60) return `${Math.max(1, Math.round(sec))} 秒`;
  if (sec < 3600) { const m = Math.floor(sec / 60), s = Math.round(sec % 60); return s ? `${m} 分 ${s} 秒` : `${m} 分钟`; }
  const h = Math.floor(sec / 3600), m = Math.round((sec % 3600) / 60); return m ? `${h} 小时 ${m} 分` : `${h} 小时`;
}
function relTime(min) {
  if (min < 1) return "刚刚"; if (min < 60) return `${Math.floor(min)} 分钟前`;
  if (min < 1440) return `${Math.floor(min / 60)} 小时前`; return `${Math.floor(min / 1440)} 天前`;
}
function statusView(t) {
  const k = kindName(t.kind);
  switch (t.st) {
    case "succeeded": return { tone: "ok", title: `生成了一个${k}`, verdict: "生成成功", pulse: false };
    case "failed": return { tone: "bad", title: `生成${k}失败了`, verdict: "生成失败", pulse: false };
    case "expired": return { tone: "warn", title: `生成${k}超时了`, verdict: "等太久，已超时", pulse: false };
    case "canceled": return { tone: "", title: `取消了${k}生成`, verdict: "已取消", pulse: false };
    case "pending": case "queued": return { tone: "info", title: `正在排队生成${k}`, verdict: "排队中", pulse: true };
    default: return { tone: "info", title: `正在生成${k}`, verdict: "正在生成", pulse: true };
  }
}
function creditText(t) {
  if (t.test) return "不扣积分";
  if (isActive(t.st)) return `已冻结 ${t.cr} 积分`;
  if (t.st === "succeeded") return `用了 ${t.charged} 积分`;
  return "积分已退回";
}
function secondLine(t) {
  const parts = [MODEL[t.m]];
  if (t.st === "succeeded") parts.push(creditText(t), `用时 ${humanSpan(t.sec)}`);
  else if (t.st === "failed" || t.st === "expired" || t.st === "canceled") parts.push(t.msg ? `${t.msg}` : "积分已退回");
  else parts.push(`${t.st === "running" ? "生成中" : "排队中"} · 已 ${humanSpan((NOW - ago(t.created)) / 1000)}`);
  if ((t.st === "failed" || t.st === "expired" || t.st === "canceled") && !/积分已退回/.test(t.msg || "")) parts.push("积分已退回");
  return parts.join(" · ");
}
/* 失败时给运营的「怎么办」（按错误码映射，未知码给通用文案） */
function advice(t) {
  if (t.st === "canceled") return ["已取消", "用户或管理员取消了这个任务，积分已退回，无需处理。"];
  if (t.st === "expired") return ["等太久，已超时", "任务在规定时间内没出结果，积分已自动退回，可以让用户重试。"];
  if (t.st !== "failed") return null;
  switch (t.code) {
    case "moderation": return ["不是系统问题", "内容没通过审核，让用户改改提示词再试即可。"];
    case "invalid_param": return ["不是系统问题", "用户填的参数不合适，让用户调整后重试。"];
    case "provider_balance": return ["需要运维处理", "上游账户余额不足，请联系运维充值；用户的积分已退回。"];
    case "submit_unknown": return ["建议核对", "提交结果不确定，上游可能已经扣费，建议让运维核对一下。"];
    default: return ["可以先让用户重试", "平台暂时出了问题，积分已退回；如果反复出现，请找运维（切到「详细」看原因）。"];
  }
}
const EVENT_TEXT = { created: "提交了任务", submitted: "平台开始处理", finalizing: "生成完成，正在保存结果", succeeded: "完成", failed: "失败了", canceled: "被取消", expired: "等太久，已超时" };
function timeline(t) {
  if (t.old) return null;
  const c = ago(t.created); const ev = [["created", c]];
  if (t.st !== "expired") ev.push(["submitted", new Date(c.getTime() + 1200)]);
  if (t.st === "succeeded") { ev.push(["finalizing", new Date(c.getTime() + (t.sec - 4) * 1000)]); ev.push(["succeeded", new Date(c.getTime() + t.sec * 1000)]); }
  else if (!isActive(t.st)) ev.push([t.st, new Date(c.getTime() + t.sec * 1000)]);
  else if (t.st === "running") ev.push(["_now", NOW]);
  return ev;
}

try { S.mode = localStorage.getItem("admin.usage.drawerMode") === "detail" ? "detail" : "simple"; } catch (e) {}

}
function toast(msg) { const el = $("#toast"); el.textContent = msg; el.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (el.hidden = true), 1800); }

/* ============ 过滤 ============ */
function uFiltered(ignoreStatus) {

<script>
/* ============ 侧栏 ============ */
function renderSide() {
  const items = [
    ["用户", [["users", "用户管理", "users", true], ["payment", "支付管理", "wallet", true], ["usage", "使用记录", "activity", false, true]]],
    ["日志管理", [["audits", "操作审计", "scroll-text", false, true]]],
  ];
  $("#side").innerHTML = items.map(([g, list]) => `<div class="grp">${g}</div>` + list.map(([k, n, ic, off, isNew]) =>
    `<button class="nav" ${off ? 'disabled title="本稿不涉及：已有页面"' : `data-route="${k}"`} ${S.route === k ? 'aria-current="page"' : ""}><i data-lucide="${ic}"></i><span>${n}</span>${isNew ? '<span class="new">新</span>' : ""}</button>`).join("")).join("");
}

/* ============ 通用：骨架 / 空 / 失败 / 分页 ============ */
const skeleton = (n = 6) => `<div class="list">${Array.from({ length: n }, () => '<div class="skel"></div>').join("")}</div>`;
const errorBox = () => `<div class="empty"><i data-lucide="circle-alert" style="color:var(--destructive)"></i><b>加载失败</b><span class="muted">请检查网络后重试</span><button class="btn sm" data-act="retry"><i data-lucide="rotate-cw"></i>重试</button></div>`;
function pager(total, f, key) {
  const pages = Math.max(1, Math.ceil(total / f.size));
  const nums = pages <= 5 ? Array.from({ length: pages }, (_, i) => i + 1) : (f.page <= 3 ? [1, 2, 3, 4, "…", pages] : f.page >= pages - 2 ? [1, "…", pages - 3, pages - 2, pages - 1, pages] : [1, "…", f.page - 1, f.page, f.page + 1, "…", pages]);
  return `<div class="pager"><span>共 <b class="tnum" style="color:var(--foreground)">${total}</b> 条 · 每页 <select class="in" style="height:28px" data-size="${key}">${[10, 20, 30].map((n) => `<option ${n === f.size ? "selected" : ""}>${n}</option>`).join("")}</select></span>
  <span class="pg"><button data-pg="${key}:${f.page - 1}" ${f.page <= 1 ? "disabled" : ""} aria-label="上一页">‹</button>${nums.map((n) => n === "…" ? '<span style="align-self:center">…</span>' : `<button data-pg="${key}:${n}" ${n === f.page ? 'aria-current="page"' : ""}>${n}</button>`).join("")}<button data-pg="${key}:${f.page + 1}" ${f.page >= pages ? "disabled" : ""} aria-label="下一页">›</button></span></div>`;
}

/* ============ 使用记录页 ============ */
function renderUsage() {
  const f = S.u, all = uFiltered(true), rows = uFiltered(false);
  const c = (st) => all.filter((t) => t.st === st).length, act = all.filter((t) => isActive(t.st)).length;
  const bad = c("failed"), ok = c("succeeded"), total = all.length, attn = bad + c("expired") + c("canceled");
  const rate = total - act ? Math.round((ok / Math.max(1, total - act)) * 1000) / 10 : 0;
  const stat = (key, icon, label, val, hint, warn) => `<button class="stat" data-stat="${key}" aria-pressed="${f.status === key}" ${val === 0 && S.phase === "ready" ? "disabled" : ""}><span class="l"><i data-lucide="${icon}"></i>${label}</span><span class="v tnum">${S.phase === "ready" ? val : "–"}</span><span class="h ${warn ? "warn" : ""}">${hint}</span></button>`;
  const stats = S.phase === "loading" ? `<div class="stats">${Array.from({ length: 4 }, () => '<div class="skel" style="height:92px;border-radius:12px"></div>').join("")}</div>`
    : `<div class="note"><div class="stats" style="margin:0">
      ${stat("all", "layout-list", "全部", total, RANGE_LABEL[f.range])}
      ${stat("succeeded", "circle-check", "成功", ok, `成功率 ${rate}%`)}
      ${stat("failed", "triangle-alert", "需要关注", attn, `失败 ${bad} · 超时 ${c("expired")} · 取消 ${c("canceled")}`, attn > 0)}
      ${stat("active", "loader", "进行中", act, "现在正在生成")}
    </div></div><div class="note-t">设计：用 4 张概览卡替换原来一行小字；点卡片就是一键筛选。「需要关注」大于 0 时副标题用琥珀色，其余保持中性，不到处刷绿。</div>`;
  const moreCount = (f.kind ? 1 : 0) + (f.model ? 1 : 0) + (f.test ? 1 : 0);
  const sel = (k, v, opts) => `<select class="in" data-more="${k}">${opts.map(([val, name]) => `<option value="${val}" ${v === val ? "selected" : ""}>${name}</option>`).join("")}</select>`;
  const bar = `<div class="note"><div class="bar">
    <div class="search"><i data-lucide="search"></i><input class="in" id="uq" placeholder="找人：输入用户名或邮箱，也可以粘贴任务编号" value="${esc(f.q)}" aria-label="搜索"></div>
    <div class="seg" role="group" aria-label="状态">${[["all", "全部"], ["succeeded", "成功"], ["failed", "失败"], ["active", "进行中"]].map(([k, n]) => `<button data-status="${k}" aria-pressed="${f.status === k}">${n}</button>`).join("")}</div>
    <select class="in" data-range="u" aria-label="时间范围">${Object.entries(RANGE_LABEL).map(([k, n]) => `<option value="${k}" ${f.range === k ? "selected" : ""}>${n}</option>`).join("")}</select>
    <span style="position:relative"><button class="btn" data-act="more" aria-expanded="${f.pop}"><i data-lucide="sliders-horizontal"></i>更多筛选${moreCount ? `<span class="badge">${moreCount}</span>` : ""}</button>
      ${f.pop ? `<div class="pop" role="dialog" aria-label="更多筛选"><label>类型${sel("kind", f.kind, [["", "全部类型"], ["video", "视频"], ["image", "图片"], ["audio", "音频"], ["text", "文本"]])}</label>
        <label>模型${sel("model", f.model, [["", "全部模型"], ...Object.entries(MODEL)])}</label>
        <label class="row" style="flex-direction:row;color:var(--foreground)"><input type="checkbox" data-more="test" ${f.test ? "checked" : ""}> 同时显示运营试跑的任务</label></div>` : ""}</span>
    ${f.userId ? `<span class="chip">用户：${USERS[f.userId]}<button data-act="clearUser" aria-label="清除用户筛选"><i data-lucide="x"></i></button></span>` : ""}
  </div></div><div class="note-t">设计：最常用的「状态」从下拉改成分段控件（与渠道页同款）；类型、模型、含试跑收进「更多筛选」，有已选项时按钮上显示数字。</div>`;
  let body;
  if (S.phase === "loading") body = skeleton(6);
  else if (S.phase === "error") body = errorBox();
  else if (!rows.length) {
    const filtered = f.q || f.status !== "all" || f.kind || f.model || f.userId;
    body = `<div class="empty"><i data-lucide="search-x"></i><b>${filtered ? "没有符合条件的记录" : "这个时间范围内还没有人生成过内容"}</b><span class="muted">${filtered ? "换个条件试试，或清除筛选。" : "可以放宽到近 30 天再看看。"}</span><button class="btn sm" data-act="${filtered ? "clearAll" : "widen"}">${filtered ? "清除筛选" : "放宽到近 30 天"}</button></div>`;
  } else {
    const start = (f.page - 1) * f.size, page = rows.slice(start, start + f.size);
    body = `<div class="note"><div class="list">${page.map((t, i) => taskCard(t, i)).join("")}</div></div><div class="note-t">设计：用卡片替换 7 列表格——第一行是一句人话，第二行是模型 / 积分 / 用时；状态用圆点颜色表达，进行中的圆点会脉动、用时每秒增长。</div>${pager(rows.length, f, "u")}`;
  }
  $("#page").innerHTML = `<div class="ph"><h1>使用记录</h1><p>查看谁生成了什么、结果怎么样；点一条看详情。</p></div>${stats}${bar}${body}`;
}
const RANGE_LABEL = { today: "今天", "24h": "近 24 小时", "7d": "近 7 天", "30d": "近 30 天" };
function taskCard(t, i) {
  const v = statusView(t), [, ic] = KIND[t.kind];
  return `<button class="card enter" style="animation-delay:${Math.min(i, 6) * 30}ms" data-task="${t.n}" aria-current="${S.drawer === t.n}">
    <span class="dot ${v.tone} ${v.pulse ? "pulse" : ""}"></span>
    <span class="main1"><span class="t1"><b class="who" data-who="${t.u}" title="只看这个用户">${USERS[t.u]}</b><span>${v.title}</span>${t.test ? '<span class="tag">试跑</span>' : ""}</span>
    <span class="t2" style="display:block">${secondLine(t)}</span></span>
    <span class="time" title="${absT(ago(t.created))}">${relTime(t.created)}</span><i data-lucide="chevron-right" class="muted"></i></button>`;
}

/* ============ 操作审计页 ============ */
function renderAudits() {
  const f = S.a, rows = aFiltered();
  const bar = `<div class="note"><div class="bar">
    <div class="search"><i data-lucide="search"></i><input class="in" id="aq" placeholder="输入操作人的用户名" value="${esc(f.q)}" aria-label="搜索操作人"></div>
    <select class="in" data-cat aria-label="分类">${Object.entries(CATS).map(([k, n]) => `<option value="${k}" ${f.cat === k ? "selected" : ""}>${n}</option>`).join("")}</select>
    <select class="in" data-range="a" aria-label="时间范围">${[...Object.entries(RANGE_LABEL), ["90d", "近 90 天"]].map(([k, n]) => `<option value="${k}" ${f.range === k ? "selected" : ""}>${n}</option>`).join("")}</select>
  </div></div><div class="note-t">设计：筛选只剩 3 个；「模块」改名「分类」，占位符写明要输入什么。</div>`;
  let body;
  if (S.phase === "loading") body = skeleton(6);
  else if (S.phase === "error") body = errorBox();
  else if (!rows.length) body = `<div class="empty"><i data-lucide="search-x"></i><b>${f.q || f.cat !== "all" ? "没有符合条件的记录" : "这个时间范围内没有操作记录"}</b><span class="muted">换个条件，或放宽时间范围。</span></div>`;
  else {

  }
  $("#page").innerHTML = `<div class="ph"><h1>操作审计</h1><p>看看最近后台有谁做了什么调整。</p></div>${bar}${body}`;
}
function auditCard(x, i) {
  const who = x.who === 0 ? "系统" : USERS[x.who];
  return `<button class="card enter" style="animation-delay:${Math.min(i, 6) * 30}ms" data-audit="${x.id}" aria-current="${S.audit === x.id}">
    <span class="ico"><i data-lucide="${x.icon}"></i></span>
    <span class="main1"><span class="t1"><b>${who}</b><span>${x.verb}${x.obj ? ` · <b style="font-weight:500">${x.obj}</b>` : ""}</span>${x.auto ? '<span class="tag">自动</span>' : ""}${x.legacy ? '<span class="tag">历史</span>' : ""}</span>
    <span class="t2" style="display:block">${x.note}</span></span><span class="time" title="${absT(ago(x.ago))}">${relTime(x.ago)}</span><i data-lucide="chevron-right" class="muted"></i></button>`;
}

function render() { renderSide(); S.route === "usage" ? renderUsage() : renderAudits(); icons(); }
</script>

<script>
/* ============ 抽屉：任务详情（简单 / 详细） ============ */
function closeLayer() {
  const d = $(".drawer"), sc = $(".scrim");
  if (!d) return;
  d.classList.add("out"); sc && sc.classList.add("out");
  setTimeout(() => { $("#layer").innerHTML = ""; S.drawer = null; S.audit = null; render(); }, 168);
}
function openLayer(html) { $("#layer").innerHTML = `<div class="scrim" data-close></div><aside class="drawer" role="dialog" aria-modal="true">${html}</aside>`; icons(); }

function taskDrawerHtml(t) {
  const v = statusView(t), detail = S.mode === "detail", adv = advice(t);
  const [, ic] = KIND[t.kind];
  const head = `<div class="dh"><div style="min-width:0;flex:1"><h2>${USERS[t.u]} · 生成${kindName(t.kind)}</h2><p class="muted" style="font-size:12.5px">${relTime(t.created)} · ${MODEL[t.m]}${t.test ? " · 试跑" : ""}</p></div>
    <div class="seg" role="group" aria-label="显示方式"><button data-mode="simple" aria-pressed="${!detail}">简单</button><button data-mode="detail" aria-pressed="${detail}">详细</button></div>
    <button class="btn sm" data-close aria-label="关闭"><i data-lucide="x"></i></button></div>`;
  const sub = t.st === "succeeded" ? `用时 ${humanSpan(t.sec)} · ${creditText(t)}` : isActive(t.st) ? `已 ${humanSpan((NOW - ago(t.created)) / 1000)} · ${creditText(t)}` : `${t.msg || "积分已退回"}`;
  const verdict = `<div class="note"><div class="verdict ${v.tone}"><span class="dot ${v.tone} ${v.pulse ? "pulse" : ""}" style="margin-top:7px"></span><div><div class="vt">${v.verdict}</div><div class="vs">${sub}</div></div></div></div>
    <div class="note-t">设计：结论卡是抽屉里的第一屏——先给结论，再给细节；简单和详细模式都有它。</div>`;
  const help = adv ? `<div class="help"><i data-lucide="lightbulb" style="margin-top:2px"></i><div><b>${adv[0]}</b>${adv[1]}</div></div>` : "";
  const prompt = `<div class="sec"><h3>提示词</h3><p style="font-size:14px">${esc(t.prompt)}</p></div>`;
  const out = t.st === "succeeded" ? `<div class="sec"><h3>生成结果</h3>${t.kind === "text" ? '<pre class="code" style="font-family:inherit;max-height:none">1. 一只猫的奔跑日记\n2. 草地上的小飞毛腿\n3. 今天也要元气满满</pre>' : t.kind === "audio" ? '<div class="media" style="aspect-ratio:auto;height:56px"><i data-lucide="music"></i><span class="pl">示意 · 音频播放器 0:06</span></div>' : `<div class="media" style="aspect-ratio:${t.kind === "image" ? "1/1" : "16/9"}"><i data-lucide="${ic}" style="font-size:34px"></i><span class="pl">示意 · ${t.kind === "image" ? "图片缩略图（点击开原图）" : "视频播放器"}</span></div>`}</div>` : "";
  const credit = t.test ? "" : `<div class="sec"><h3>积分</h3><p style="font-size:13px">${isActive(t.st) ? `已冻结 ${t.cr} 积分，完成后按实际扣。` : t.st === "succeeded" ? `冻结了 ${t.cr}，最后扣了 ${t.charged}${t.cr - t.charged > 0 ? `，多的 ${t.cr - t.charged} 已退回` : ""}。` : `冻结了 ${t.cr}，已全部退回，没有扣费。`}</p></div>`;
  let more = "";
  if (detail) {
    const tl = timeline(t);
    const tlHtml = tl ? `<ol class="tl">${tl.map(([e, d], i) => {
      const gap = i ? ` · +${humanSpan((d - tl[i - 1][1]) / 1000)}` : "";
      return e === "_now" ? `<li><span class="dot info pulse" style="margin-top:6px"></span><span>正在生成</span><span class="time">现在${gap}</span></li>` : `<li><span class="dot ${e === "failed" ? "bad" : e === "succeeded" ? "ok" : e === "expired" ? "warn" : ""}" style="margin-top:6px"></span><span>${EVENT_TEXT[e]}</span><span class="time">${hms(d)}${gap}</span></li>`;
    }).join("")}</ol>` : '<div class="help"><i data-lucide="info"></i><div>无记录：此任务创建于日志功能上线前，没有状态变化记录。</div></div>';
    more = `<div class="detail-only" style="display:flex;flex-direction:column;gap:16px"><div class="note"><div class="sec"><h3>经过</h3>${tlHtml}</div></div>
      <div class="sec"><h3>参数</h3><dl class="kv"><dt>画面比例</dt><dd class="mono">${t.ratio || "—"}</dd><dt>时长</dt><dd class="mono">${t.dur || "—"}</dd><dt>其它</dt><dd class="mono">resolution 1K · seed 1386169686</dd></dl></div>
      ${t.upstream ? `<div class="sec"><h3>失败原因</h3><dl class="kv"><dt>错误码</dt><dd class="mono">${t.code}</dd></dl><h3 style="margin-top:8px">上游返回的原文（仅渠道 Key 被遮）</h3><pre class="code mono">${esc(t.upstream)}</pre></div>` : t.code ? `<div class="sec"><h3>失败原因</h3><dl class="kv"><dt>错误码</dt><dd class="mono">${t.code}</dd><dt>上游原文</dt><dd class="muted">没有（${t.old ? "创建于日志功能上线前" : t.st === "expired" ? "排队超时没有请求上游" : "用户取消"}）</dd></dl></div>` : ""}
      <div class="sec"><h3>任务信息</h3><dl class="kv"><dt>任务编号</dt><dd class="mono" style="font-size:12px">9f3ac1d7e2b84a60${pad(t.n)}0e1c05d93a2 <button class="btn sm" data-copy>复制</button></dd><dt>渠道 / 插件</dt><dd class="mono">kling-official · kling@1.2.0</dd><dt>画布 / 节点</dt><dd class="mono">c-8f21 / node-${t.n}</dd></dl></div></div>`;
  }
  return head + `<div class="db">${verdict}${help}${prompt}${out}${credit}${more}<div class="note-t" style="margin-top:-4px">设计：「简单」只保留运营回复用户需要的；「详细」多出时间线、参数、错误码、上游原文和任务编号。切换只影响抽屉（已确认），选择记在本机浏览器。</div></div>`;
}
function openTask(n) {
  S.drawer = n; const t = TASKS.find((x) => x.n === n);
  if (S.sim === "error") { openLayer(`<div class="dh"><h2>任务详情</h2><button class="btn sm sp" data-close><i data-lucide="x"></i></button></div><div class="db">${errorBox()}</div>`); return; }
  openLayer(`<div class="dh"><div class="skel" style="width:200px;height:20px"></div></div><div class="db"><div class="skel"></div><div class="skel"></div><div class="skel" style="height:90px"></div></div>`);
  setTimeout(() => { if (S.drawer === n) { $(".drawer").innerHTML = taskDrawerHtml(t); icons(); } }, 320);
  render();
}
function openAudit(id) {
  S.audit = id; const x = AUDITS.find((a) => a.id === id), who = x.who === 0 ? "系统" : USERS[x.who];
  openLayer(`<div class="dh"><div style="flex:1"><h2>${who} ${x.verb}${x.obj ? " · " + x.obj : ""}</h2><p class="muted" style="font-size:12.5px">${absT(ago(x.ago))}${x.auto ? " · 自动" : ""}${x.legacy ? " · 历史动作" : ""}</p></div><button class="btn sm" data-close><i data-lucide="x"></i></button></div>
  <div class="db"><div class="verdict"><i data-lucide="${x.icon}" style="margin-top:3px"></i><div><div class="vt">${x.verb}</div><div class="vs">${x.note}</div></div></div>
  <details class="fold"><summary>技术详情（给运维看）</summary><dl class="kv" style="margin-top:8px"><dt>动作代码</dt><dd class="mono">${x.tech.action}</dd><dt>来源表</dt><dd class="mono">${x.tech.source}</dd></dl><pre class="code mono">${esc(JSON.stringify(x.tech.detail, null, 2))}</pre></details>
  <div class="note-t">设计：审计内容很少，不加「简单 / 详细」切换，用折叠块收起动作代码和原始 JSON。</div></div>`);
  render();
}

/* ============ 事件 ============ */
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-route],[data-status],[data-stat],[data-act],[data-task],[data-audit],[data-who],[data-pg],[data-mode],[data-close],[data-copy]");
  if (!t) { if (S.u.pop && !e.target.closest(".pop")) { S.u.pop = false; render(); } return; }
  const d = t.dataset;
  if (d.route) { S.route = d.route; S.u.page = S.a.page = 1; closeSilently(); load(); }
  else if (d.who) { e.stopPropagation(); S.u.userId = +d.who; S.u.page = 1; toast(`已只看「${USERS[d.who]}」`); load(); }
  else if (d.task) openTask(+d.task);
  else if (d.audit) openAudit(+d.audit);
  else if (d.status !== undefined || d.stat !== undefined) { S.u.status = d.status ?? d.stat; S.u.page = 1; load(); }
  else if (d.pg) { const [k, n] = d.pg.split(":"); S[k].page = +n; load(); }
  else if (d.mode) { S.mode = d.mode; try { localStorage.setItem("admin.usage.drawerMode", d.mode); } catch (er) {} const x = TASKS.find((a) => a.n === S.drawer); if (x) { $(".drawer").innerHTML = taskDrawerHtml(x); icons(); } }
  else if (d.close !== undefined) closeLayer();
  else if (d.copy !== undefined) toast("已复制任务编号");
  else if (d.act === "retry") { S.sim = "ok"; $("#sim").value = "ok"; load(); }
  else if (d.act === "more") { S.u.pop = !S.u.pop; render(); }
  else if (d.act === "clearUser") { S.u.userId = null; load(); }
  else if (d.act === "clearAll") { S.u = { ...S.u, q: "", status: "all", kind: "", model: "", userId: null, page: 1, test: false }; load(); }
  else if (d.act === "widen") { S.u.range = "30d"; load(); }
});
function closeSilently() { $("#layer").innerHTML = ""; S.drawer = null; S.audit = null; }
document.addEventListener("change", (e) => {
  const t = e.target;
  if (t.dataset.range) { S[t.dataset.range].range = t.value; S[t.dataset.range].page = 1; load(); }
  else if (t.dataset.more) { S.u[t.dataset.more] = t.type === "checkbox" ? t.checked : t.value; S.u.page = 1; load(); }
  else if (t.dataset.cat !== undefined) { S.a.cat = t.value; S.a.page = 1; load(); }
  else if (t.dataset.size) { S[t.dataset.size].size = +t.value; S[t.dataset.size].page = 1; load(); }
  else if (t.id === "sim") { S.sim = t.value; load(); }
});
let debounce;
document.addEventListener("input", (e) => {
  const t = e.target; if (t.id !== "uq" && t.id !== "aq") return;
  clearTimeout(debounce); debounce = setTimeout(() => { const f = t.id === "uq" ? S.u : S.a; f.q = t.value; f.page = 1; const pos = t.selectionStart; load(); const el = $("#" + t.id); if (el) { el.focus(); el.setSelectionRange(pos, pos); } }, 300);
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (S.u.pop) { S.u.pop = false; render(); } else closeLayer(); } });
$("#themeBtn").onclick = () => document.documentElement.classList.toggle("dark");
$("#noteBtn").onclick = () => { const on = document.body.classList.toggle("show-notes"); $("#noteBtn").textContent = on ? "隐藏设计标注" : "显示设计标注"; };
load();
</script>
</body>
</html>
