<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>版本与升级 · 原型</title>
    <style>
      /* 颜色抄自 web/src/index.css 的 .admin-theme / .dark.admin-theme 与 --status-* */
      :root {
        --background: hsl(0 0% 100%);
        --foreground: hsl(240 10% 3.9%);
        --card: hsl(0 0% 100%);
        --primary: hsl(240 5.9% 10%);
        --primary-foreground: hsl(0 0% 98%);
        --muted: hsl(240 4.8% 95.9%);
        --muted-foreground: hsl(240 3.8% 46.1%);
        --accent: hsl(240 4.8% 95.9%);
        --border: hsl(240 5.9% 91.5%);
        --sidebar: hsl(0 0% 98%);
        --sidebar-foreground: hsl(240 5.3% 26.1%);
        --sidebar-accent: hsl(240 4.8% 95.9%);
        --sidebar-border: hsl(220 13% 91%);
        --status-running: oklch(0.58 0.15 250);
        --status-success: oklch(0.6 0.15 155);
        --status-warning: oklch(0.7 0.16 70);
        --destructive: hsl(0 72% 51%);
        /* lib/motion.ts */
        --ease-out: cubic-bezier(0.2, 0, 0, 1);
        --d-fast: 120ms;
        --d-base: 180ms;
        --d-exit: 126ms;
        --sans: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        --mono: "JetBrains Mono", "Cascadia Code", Consolas, monospace;
      }
      .dark {
        --background: hsl(240 10% 3.9%);
        --foreground: hsl(0 0% 98%);
        --card: hsl(240 6% 7.5%);
        --primary: hsl(0 0% 98%);
        --primary-foreground: hsl(240 5.9% 10%);
        --muted: hsl(240 3.7% 15.9%);
        --muted-foreground: hsl(240 5% 64.9%);
        --accent: hsl(240 3.7% 15.9%);
        --border: hsl(240 3.7% 13.5%);
        --sidebar: hsl(240 5.9% 10%);
        --sidebar-foreground: hsl(240 4.8% 95.9%);
        --sidebar-accent: hsl(240 3.7% 15.9%);
        --sidebar-border: hsl(240 3.7% 15.9%);
        --status-running: oklch(0.75 0.12 240);
        --status-success: oklch(0.75 0.15 155);
        --status-warning: oklch(0.8 0.15 75);
        --destructive: hsl(0 62.8% 45%);
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: var(--sans); background: var(--background); color: var(--foreground); font-size: 14px; -webkit-font-smoothing: antialiased; }
      .mono { font-family: var(--mono); font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted-foreground); }
      button { font: inherit; color: inherit; }

      /* 原型控制条（不属于设计） */
      .proto { position: fixed; z-index: 50; right: 12px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; max-width: 560px; padding: 10px; border-radius: 12px; background: #111827; color: #e5e7eb; font-size: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.25); }
      .proto b { width: 100%; font-size: 11px; color: #9ca3af; font-weight: 500; }
      .proto button { border: 1px solid #374151; background: #1f2937; border-radius: 6px; padding: 3px 8px; cursor: pointer; }
      .proto button.on { background: #f9fafb; color: #111827; }

      .app { display: flex; min-height: 100vh; }
      /* 侧栏 */
      .sidebar { width: 240px; flex-shrink: 0; background: var(--sidebar); color: var(--sidebar-foreground); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; transition: width var(--d-base) var(--ease-out); }
      .collapsed .sidebar { width: 52px; }
      .brand { height: 52px; display: flex; align-items: center; gap: 8px; padding: 0 14px; font-weight: 600; }
      .group { padding: 8px; }
      .group-label { font-size: 12px; opacity: .55; padding: 4px 10px; }
      .item { position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 10px; border-radius: 6px; cursor: pointer; white-space: nowrap; overflow: hidden; border: 0; background: none; width: 100%; text-align: left; transition: background var(--d-fast) var(--ease-out), transform var(--d-fast) var(--ease-out); }
      .item:hover { background: var(--sidebar-accent); }
      .item:active { transform: scale(0.96); }
      .item:focus-visible { outline: 2px solid var(--status-running); outline-offset: 1px; }
      .item.active { background: var(--sidebar-accent); font-weight: 500; }
      .item svg { width: 16px; height: 16px; flex-shrink: 0; }
      .item .label { flex: 1; }
      .collapsed .item .label, .collapsed .item .badge, .collapsed .group-label, .collapsed .brand span { display: none; }
      .badge { font-size: 11px; opacity: .55; font-family: var(--mono); }
      .footer { margin-top: auto; border-top: 1px solid var(--sidebar-border); padding: 8px; display: flex; flex-direction: column; gap: 2px; }
      .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--status-running); margin-left: auto; opacity: 0; transform: scale(.5); transition: opacity var(--d-exit) var(--ease-out), transform var(--d-exit) var(--ease-out); }
      .dot.show { opacity: 1; transform: scale(1); transition-duration: var(--d-base); }
      .collapsed .dot { position: absolute; left: 25px; top: 7px; margin: 0; box-shadow: 0 0 0 2px var(--sidebar); }
      .account { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
      .avatar { width: 24px; height: 24px; border-radius: 999px; background: var(--muted); display: grid; place-items: center; font-size: 11px; flex-shrink: 0; }
      .collapsed .account span { display: none; }
      .tip { position: fixed; z-index: 40; pointer-events: none; padding: 4px 8px; border-radius: 6px; font-size: 12px; background: var(--primary); color: var(--primary-foreground); opacity: 0; transition: opacity var(--d-fast) var(--ease-out); }

      /* 正文 */
      .main { flex: 1; min-width: 0; }
      .topbar { height: 52px; border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 20px; gap: 6px; color: var(--muted-foreground); font-size: 13px; }
      .topbar .cur { color: var(--foreground); }
      .page { max-width: 880px; padding: 24px 20px 120px; margin: 0 auto; }
      .page-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
      h1 { font-size: 24px; font-weight: 600; letter-spacing: -.01em; margin: 0; }
      .btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--border); background: var(--card); cursor: pointer; transition: transform var(--d-fast) var(--ease-out), background var(--d-fast); }
      .btn:hover { background: var(--accent); }
      .btn:active { transform: scale(.96); }
      .btn:focus-visible { outline: 2px solid var(--status-running); outline-offset: 2px; }
      .btn[disabled] { opacity: .5; cursor: default; }
      .btn svg { width: 14px; height: 14px; }
      .spin { animation: spin .8s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }

      .stack { display: flex; flex-direction: column; gap: 16px; }
      .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; animation: in var(--d-base) var(--ease-out); }
      @keyframes in { from { opacity: 0; transform: translateY(4px); } }
      .card-title { display: flex; align-items: center; gap: 8px; font-weight: 600; margin-bottom: 12px; }
      .card-title .right { margin-left: auto; font-weight: 400; font-size: 13px; }
      a { color: var(--status-running); text-decoration: none; }
      a:hover { text-decoration: underline; }

      .ver { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
      .ver-now .num { font-size: 28px; font-weight: 600; }
      .ver-now .meta { font-size: 12px; margin-top: 4px; }
      .ver-state { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; font-size: 12px; }
      .tag { display: inline-flex; align-items: center; gap: 4px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; font-weight: 500; }
      .tag.info { color: var(--status-running); background: color-mix(in oklab, var(--status-running) 12%, transparent); }
      .tag.success { color: var(--status-success); background: color-mix(in oklab, var(--status-success) 12%, transparent); }
      .tag.warning { color: var(--status-warning); background: color-mix(in oklab, var(--status-warning) 14%, transparent); }
      .tag.danger { color: var(--destructive); background: color-mix(in oklab, var(--destructive) 12%, transparent); }
      .tag.neutral { color: var(--muted-foreground); background: var(--muted); }

      .notice { display: flex; gap: 8px; padding: 10px 12px; border-radius: 8px; font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
      .notice.warning { background: color-mix(in oklab, var(--status-warning) 10%, transparent); border: 1px solid color-mix(in oklab, var(--status-warning) 30%, transparent); }
      .notice b { white-space: nowrap; }

      .md { position: relative; max-height: 320px; overflow: hidden; line-height: 1.7; font-size: 13px; transition: max-height 240ms var(--ease-out); }
      .md.open { max-height: 2000px; }
      .md:not(.open)::after { content: ""; position: absolute; inset: auto 0 0; height: 64px; background: linear-gradient(transparent, var(--card)); }
      .md h3 { font-size: 14px; margin: 12px 0 4px; }
      .md ul { margin: 0; padding-left: 20px; }
      .more { margin-top: 8px; border: 0; background: none; color: var(--muted-foreground); cursor: pointer; padding: 4px 0; }
      .more:hover { color: var(--foreground); }

      .steps { display: flex; flex-direction: column; gap: 12px; }
      .step { display: grid; grid-template-columns: 24px 1fr; gap: 10px; }
      .step .n { width: 24px; height: 24px; border-radius: 999px; background: var(--muted); display: grid; place-items: center; font-size: 12px; font-family: var(--mono); }
      .step .t { font-weight: 500; margin: 2px 0 6px; }
      .copy { display: flex; align-items: center; gap: 8px; background: color-mix(in oklab, var(--muted) 40%, transparent); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; }
      .copy code { flex: 1; min-width: 0; overflow-x: auto; white-space: nowrap; font-family: var(--mono); font-size: 12px; }
      .copy button { border: 0; background: none; cursor: pointer; color: var(--muted-foreground); padding: 2px; border-radius: 4px; display: grid; }
      .copy button:hover { color: var(--foreground); }
      .copy svg { width: 14px; height: 14px; }

      table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 12px; }
      th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
      th { color: var(--muted-foreground); font-weight: 500; }
      .sk { background: var(--muted); border-radius: 6px; animation: pulse 1.4s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: .5; } }

      .btn.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
      .btn.primary:hover { background: color-mix(in oklab, var(--primary) 88%, var(--background)); }
      .btn.danger { color: var(--destructive); }
      .notice.danger { background: color-mix(in oklab, var(--destructive) 8%, transparent); border: 1px solid color-mix(in oklab, var(--destructive) 30%, transparent); }
      .notice.success { background: color-mix(in oklab, var(--status-success) 10%, transparent); border: 1px solid color-mix(in oklab, var(--status-success) 30%, transparent); }
      .notice.info { background: color-mix(in oklab, var(--status-running) 8%, transparent); border: 1px solid color-mix(in oklab, var(--status-running) 25%, transparent); }
      .prog { display: flex; flex-direction: column; gap: 2px; margin-top: 4px; }
      .prog .p { display: grid; grid-template-columns: 22px 1fr auto; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
      .prog .ic { width: 18px; height: 18px; border-radius: 999px; display: grid; place-items: center; font-size: 11px; color: #fff; }
      .ic.done { background: var(--status-success); }
      .ic.todo { border: 1.5px solid var(--border); }
      .ic.bad { background: var(--destructive); }
      .ic.run { border: 2px solid var(--status-running); border-top-color: transparent; animation: spin .8s linear infinite; }
      .prog .p.todo { color: var(--muted-foreground); }
      .bar { height: 3px; border-radius: 999px; background: var(--muted); overflow: hidden; margin: 12px 0 4px; }
      .bar i { display: block; height: 100%; background: var(--status-running); transition: width 240ms var(--ease-out); }
      .scrim { position: fixed; inset: 0; z-index: 30; background: rgb(0 0 0 / .4); display: none; place-items: center; padding: 16px; }
      .scrim.show { display: grid; animation: fade var(--d-base) var(--ease-out); }
      @keyframes fade { from { opacity: 0; } }
      .dialog { width: 100%; max-width: 440px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; animation: pop 240ms var(--ease-out); }
      @keyframes pop { from { opacity: 0; transform: scale(.96); } }
      .dialog h2 { font-size: 16px; margin: 0 0 12px; }
      .dialog ul { margin: 0 0 12px; padding-left: 18px; line-height: 1.8; font-size: 13px; }
      .dialog .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
      .side-spin { width: 12px; height: 12px; margin-left: auto; border-radius: 999px; border: 2px solid var(--status-running); border-top-color: transparent; animation: spin .8s linear infinite; }
      @media (max-width: 768px) {
        .sidebar { display: none; }
        .ver { flex-direction: column; }
        .ver-state { align-items: flex-start; text-align: left; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { transition-property: opacity !important; animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div class="app" id="app">
      <aside class="sidebar">
        <div class="brand">▣ <span>video-canvas 后台</span></div>
        <div class="group">
          <div class="group-label">AI 配置</div>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/></svg><span class="label">总览</span></button>
        </div>
        <div class="group">
          <div class="group-label">系统设置</div>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12H2M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span class="label">存储配置</span></button>
          <button class="item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 5L2 7"/></svg><span class="label">邮件服务</span></button>
          <button class="item active" data-tip="版本与升级"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 16V8"/></svg><span class="label">版本与升级</span><span class="badge" id="navBadge"></span></button>
        </div>
        <div class="footer">
          <button class="item" id="verItem"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m16 12-4-4-4 4M12 16V8"/></svg><span class="label mono" id="verLabel">v0.3.2</span><span class="dot" id="dot"></span></button>
          <button class="item" data-tip="返回画布"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7M19 12H5"/></svg><span class="label">返回画布</span></button>
          <div class="account"><div class="avatar">管</div><span>admin</span></div>
        </div>
      </aside>
      <main class="main">
        <div class="topbar">系统设置 <span>/</span> <span class="cur">版本与升级</span></div>
        <div class="page">
          <div class="page-header">
            <h1>版本与升级</h1>
            <button class="btn" id="recheck"><svg id="recheckIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg><span id="recheckText">重新检查</span></button>
          </div>
          <div class="stack" id="content"></div>
        </div>
      </main>
    </div>
    <div class="tip" id="tip"></div>
    <div class="scrim" id="scrim"><div class="dialog" role="dialog" aria-modal="true" id="dialog"></div></div>

    <div class="proto">
      <b>原型控制（不属于设计）· 状态</b>
      <button data-s="update" class="on">有新版本</button>
      <button data-s="latest">已是最新</button>
      <button data-s="dev">开发构建</button>
      <button data-s="disabled">已关闭</button>
      <button data-s="failStale">检查失败（有旧结果）</button>
      <button data-s="fail">检查失败（无结果）</button>
      <button data-s="loading">加载中</button>
      <b>三期 · 一键升级（先选「有新版本」）</b>
      <button data-u="off">updater 未启用</button>
      <button data-u="on" class="on">updater 已启用</button>
      <button data-u="latest">部署用 latest</button>
      <button id="tAdmin">以 admin 身份看</button>
      <b>三期 · 点「升级」后的结局</b>
      <button data-o="ok" class="on">成功</button>
      <button data-o="pull">拉取失败（未改动）</button>
      <button data-o="rolled">启动失败已退回</button>
      <button data-o="attention">需要人工处理</button>
      <b>其他</b>
      <button id="tMig">迁移异常</button>
      <button id="tDark">深色</button>
      <button id="tCollapse">折叠侧栏</button>
      <button id="tNarrow">窄屏 (≤768)</button>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const COPY_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
      const CHECK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>';
      const ui = { s: "update", mig: false, checking: false, u: "on", admin: false, o: "ok", run: null };
      let CURRENT = "0.3.2", LATEST = "0.4.0";
      const PREVIOUS = "0.3.1";
      const STEPS = ["准备", "拉取镜像", "备份数据库", "重建服务（新版本启动时自动迁移数据库）", "等待新版本就绪"];

      function tag(tone, text) { return `<span class="tag ${tone}">${text}</span>`; }
      function copy(cmd) {
        return `<div class="copy"><code>${cmd.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</code><button aria-label="复制" onclick="copied(this)">${COPY_ICON}</button></div>`;
      }
      window.copied = (btn) => { btn.innerHTML = CHECK_ICON; setTimeout(() => (btn.innerHTML = COPY_ICON), 1200); };

      function versionCard() {
        const s = ui.s;
        let right;
        if (s === "loading") right = `<div class="sk" style="width:110px;height:24px"></div><div class="sk" style="width:150px;height:14px"></div>`;
        else if (s === "update" || s === "failStale") right = `${tag("info", "v" + LATEST + " 可升级")}<span class="muted">发布于 2026-10-20</span><span class="muted">上次检查 ${s === "failStale" ? "2 小时前" : "3 分钟前"}</span>${upgradeButton()}`;
        else if (s === "latest") right = `${tag("success", "已是最新版本")}<span class="muted">上次检查 3 分钟前</span>`;
        else if (s === "dev") right = `${tag("neutral", "开发构建，不检查更新")}`;
        else if (s === "disabled") right = `${tag("neutral", "检查更新已关闭")}<span class="muted">配置项 <span class="mono">update.check_enabled</span></span>`;
        else right = `${tag("neutral", "未能检查")}`;
        const ver = s === "dev" ? "dev" : "v" + CURRENT;
        const warn = s === "fail" || s === "failStale"
          ? `<div class="notice warning" style="margin:16px 0 0"><b>检查更新失败</b><span>无法连接 GitHub：dial tcp: i/o timeout。${s === "failStale" ? "下面显示的是上次的结果。" : ""}5 分钟后可再试，或检查服务器能否访问 api.github.com。</span></div>`
          : "";
        return `<section class="card"><div class="ver"><div class="ver-now"><div class="muted" style="font-size:12px">当前版本</div><div class="num mono">${ver}</div><div class="meta muted mono">81381c0 · 构建于 2026-10-13 18:20 · 数据库已迁移到 0001_baseline.sql</div></div><div class="ver-state">${right}</div></div>${warn}</section>`;
      }

      function changelogCard() {
        return `<section class="card"><div class="card-title">更新日志 <span class="mono">v${LATEST}</span><a class="right" href="javascript:void 0">在 GitHub 查看 ↗</a></div>
          <div class="md" id="md"><h3>新增</h3><ul><li>后台新增「版本与升级」页面，可查看新版本和升级步骤</li><li>数据库改为版本化迁移，启动时自动执行</li><li>画布节点支持批量重命名</li><li>首页对话支持把结果发到画布</li></ul><h3>修复</h3><ul><li>缩放画布时生成面板里的引用缩略图不再滑动</li><li>扩图生成的节点不再显示提示词面板</li><li>后台详情弹窗加载时显示骨架屏</li></ul><h3>数据库</h3><ul><li>新增 2 个迁移：0002_add_canvas_folder.sql、0003_idx_assets_created.notx.sql</li></ul><h3>升级注意</h3><ul><li>从 v0.3.x 升级会在首次启动时自动补齐数据库结构，耗时取决于数据量</li></ul></div>
          <button class="more" id="more">展开全部 ▾</button></section>`;
      }

      function stepsCard() {
        const backup = `docker compose exec -T postgres pg_dump -U postgres -Fc video_canvas > backup-${CURRENT}-$(date +%Y%m%d%H%M).dump`;
        return `<section class="card"><div class="card-title">升级步骤</div>
          <div class="notice warning"><b>先备份</b><span>数据库迁移只向前，没有自动回滚。新版本启动时会自动迁移；出了问题需要用备份恢复。</span></div>
          <div class="steps">
            <div class="step"><div class="n">1</div><div><div class="t">备份数据库</div>${copy(backup)}</div></div>
            <div class="step"><div class="n">2</div><div><div class="t">把部署目录 .env 里的版本改为 ${LATEST}</div>${copy("IMAGE_TAG=" + LATEST)}</div></div>
            <div class="step"><div class="n">3</div><div><div class="t">拉取镜像并重建</div>${copy("docker compose pull && docker compose up -d")}</div></div>
          </div>
          ${ui.u === "latest"
            ? `<div class="notice warning" style="margin:12px 0 0"><b>无法一键升级</b><span>部署目录 .env 里是 <span class="mono">IMAGE_TAG=latest</span>：无法确认版本，失败也无法回退。按上面第 2 步改成具体版本号后即可使用一键升级。</span></div>`
            : `<div class="notice info" style="margin:12px 0 0"><b>想在这里一键升级？</b><span>在部署目录的 .env 加一行 <span class="mono">UPDATER_TOKEN=随机字符串</span>，再执行 <span class="mono">docker compose --profile updater up -d</span>。updater 会挂载 Docker，等同服务器 root 权限，按需启用。</span></div>`}
          <p class="muted" style="font-size:12px;margin:12px 0 0">也可以在部署目录执行 <span class="mono">./update.sh --tag ${LATEST}</span>，它会自动完成以上三步并在失败时回退。</p></section>`;
      }

      /** 版本卡右侧的升级按钮：updater 未启用时不出现；admin 看得到但不能点 */
      function upgradeButton() {
        if (ui.u === "off" || ui.run) return "";
        if (ui.u === "latest") return `<button class="btn primary" disabled title="部署用的是 latest，见下方说明">升级到 v${LATEST}</button>`;
        if (ui.admin) return `<button class="btn primary" disabled title="仅超级管理员可升级">升级到 v${LATEST}</button><span class="muted">仅超级管理员可升级</span>`;
        return `<button class="btn primary" id="upBtn">升级到 v${LATEST}</button>`;
      }

      /** 升级进度：步骤列表 + 进度条；backend 重启那几步显示重连提示；结束后显示结局 */
      function progressCard() {
        const r = ui.run;
        const rows = STEPS.map((name, i) => {
          let cls = "todo", ic = "";
          if (i < r.step) { cls = "done"; ic = "✓"; }
          if (i === r.step) { cls = r.failed ? "bad" : r.done ? "done" : "run"; ic = r.failed ? "✕" : r.done ? "✓" : ""; }
          const note = i === 2 && i < r.step ? `<span class="muted mono">backups/pre-${r.target}-20261020.dump</span>` : "";
          return `<div class="p ${cls === "todo" ? "todo" : ""}"><span class="ic ${cls}">${ic}</span><span>${name}</span>${note}</div>`;
        }).join("");
        const pct = r.done ? 100 : Math.round((r.step / STEPS.length) * 100);
        let foot = "";
        if (!r.result && r.step >= 3) foot = `<div class="notice info" style="margin:12px 0 0"><b>服务重启中</b><span>后台会短暂无法访问，页面正在自动重连，不要关闭。</span></div>`;
        if (r.rollingBack) foot = `<div class="notice warning" style="margin:12px 0 0"><b>新版本启动失败</b><span>正在退回 v${CURRENT}…</span></div>`;
        if (r.result === "ok") foot = `<div class="notice success" style="margin:12px 0 0"><b>升级完成</b><span>已运行 v${r.target}，<span id="cd">2</span> 秒后自动刷新页面。</span></div>`;
        if (r.result === "pull") foot = `<div class="notice warning" style="margin:12px 0 0"><b>升级失败，服务未改动</b><span>拉取镜像失败：failed to resolve reference ghcr.io/…:${r.target}。检查服务器能否访问 ghcr.io 后重试。</span></div>`;
        if (r.result === "rolled") foot = `<div class="notice warning" style="margin:12px 0 0"><b>升级失败，已退回 v${CURRENT}</b><span>新版本启动失败，服务已恢复正常。新版本日志的最后 100 行在服务器上：docker compose logs backend。</span></div>`;
        if (r.result === "attention") foot = `<div class="notice danger" style="margin:12px 0 0"><b>需要人工处理</b><span>退回 v${CURRENT} 后它拒绝启动：数据库已被 v${r.target} 迁移过。确认那些迁移只新增表或列后，在 .env 加 <span class="mono">APP_DATABASE_ALLOW_NEWER_SCHEMA=true</span> 再 <span class="mono">docker compose up -d</span>；否则用备份 <span class="mono">backups/pre-${r.target}-20261020.dump</span> 恢复（步骤见部署文档）。</span></div>`;
        const close = r.result && r.result !== "ok" ? `<button class="more right" id="runClose" style="margin:0">关闭</button>` : "";
        return `<section class="card"><div class="card-title">${r.kind === "rollback" ? "回退" : "升级"}到 <span class="mono">v${r.target}</span>${close}</div><div class="bar"><i style="width:${pct}%"></i></div><div class="prog">${rows}</div>${foot}</section>`;
      }

      /** 升级记录与备份：只在 updater 启用时出现 */
      function historyCard() {
        const rollbackBtn = ui.admin ? "" : `<button class="btn danger right" id="rbBtn" style="font-weight:400">回退到 v${PREVIOUS}</button>`;
        return `<section class="card"><div class="card-title">升级记录与备份${ui.run ? "" : rollbackBtn}</div>
          <div class="muted" style="font-size:13px">上次升级：v${PREVIOUS} → v${CURRENT}，2026-10-14 12:27 成功</div>
          <table><thead><tr><th>数据库备份（保留最近 3 份）</th><th>大小</th><th>时间</th></tr></thead><tbody>
            <tr><td class="mono">backups/pre-${CURRENT}-20261014122704.dump</td><td class="mono">162 KB</td><td class="mono">2026-10-14 12:27</td></tr>
            <tr><td class="mono">backups/pre-${PREVIOUS}-20261013155743.dump</td><td class="mono">160 KB</td><td class="mono">2026-10-13 15:57</td></tr>
          </tbody></table>
          <p class="muted" style="font-size:12px;margin:10px 0 0">备份在服务器的部署目录里；恢复会丢掉备份之后写入的数据，请按部署文档在服务器上手动执行。</p></section>`;
      }

      function openDialog(html, onOk) {
        $("dialog").innerHTML = html;
        $("scrim").classList.add("show");
        const close = () => $("scrim").classList.remove("show");
        $("dlgCancel").onclick = close;
        $("dlgOk").onclick = () => { close(); onOk(); };
        $("dlgOk").focus();
      }

      function confirmUpgrade() {
        openDialog(`<h2>升级到 v${LATEST}</h2><ul><li>先备份数据库，再拉取镜像并重建服务</li><li>服务会中断约 1 分钟，期间后台和画布都无法访问</li><li>失败会自动退回 v${CURRENT}</li></ul>
          <div class="notice warning" style="margin:0"><b>3 个生成任务进行中</b><span>会被中断，服务恢复后自动对账，不会重复扣积分。</span></div>
          <div class="actions"><button class="btn" id="dlgCancel">取消</button><button class="btn primary" id="dlgOk">开始升级</button></div>`, () => startRun("upgrade", LATEST));
      }

      function confirmRollback() {
        openDialog(`<h2>回退到 v${PREVIOUS}</h2><ul><li>先备份数据库，再换回 v${PREVIOUS} 的镜像并重建服务</li><li>服务会中断约 1 分钟</li></ul>
          <div class="notice warning" style="margin:0"><b>数据库变更不会撤销</b><span>v${CURRENT} 执行过 1 个迁移：<span class="mono">0001_baseline.sql</span>。如果其中有删除或改名，v${PREVIOUS} 可能无法启动，届时需要用备份恢复。</span></div>
          <div class="actions"><button class="btn" id="dlgCancel">取消</button><button class="btn primary" id="dlgOk">开始回退</button></div>`, () => startRun("rollback", PREVIOUS));
      }

      /** 模拟一次升级：每 0.9 秒前进一步，按原型控制条选的结局结束 */
      function startRun(kind, target) {
        const outcome = ui.o;
        ui.run = { kind, target, step: 0 };
        render();
        const failAt = { ok: 99, pull: 1, rolled: 3, attention: 4 }[outcome];
        const tick = () => {
          const r = ui.run;
          if (!r) return;
          if (r.step === failAt) {
            if (outcome === "pull") { r.failed = true; r.result = "pull"; render(); return; }
            r.failed = true; r.rollingBack = true; render();
            setTimeout(() => { r.rollingBack = false; r.result = outcome; render(); }, 1400);
            return;
          }
          if (r.step === STEPS.length - 1) { r.done = true; r.result = "ok"; render(); countdown(); return; }
          r.step += 1;
          render();
          setTimeout(tick, 900);
        };
        setTimeout(tick, 900);
      }

      function countdown() {
        let n = 2;
        const t = setInterval(() => {
          n -= 1;
          if ($("cd")) $("cd").textContent = n;
          if (n <= 0) {
            clearInterval(t);
            CURRENT = ui.run.target;
            ui.run = null;
            ui.s = CURRENT === LATEST ? "latest" : "update";
            render();
          }
        }, 1000);
      }

      function migrationCard() {
        const rows = [["0001_baseline.sql", tag("success", "已执行"), "2026-10-14 10:42", "0.4.0"]];
        if (ui.mig) rows.push(["0002_add_canvas_folder.sql", tag("warning", "库里有、程序里没有"), "2026-10-21 09:10", "0.5.0"]);
        else rows.push(["0002_add_canvas_folder.sql", tag("neutral", "待执行"), "—", "—"]);
        const open = ui.mig || ui.migOpen;
        return `<section class="card"><div class="card-title">数据库迁移 ${ui.mig ? tag("warning", "库比程序新") : ""}<button class="more right" id="migMore" style="margin:0">${open ? "收起明细 ▴" : "展开明细 ▾"}</button></div>
          <div class="muted" style="font-size:13px">已执行到 <span class="mono">0001_baseline.sql</span> · 共 2 个，${ui.mig ? "1 个是更新版本执行的" : "1 个待执行（升级后启动时自动执行）"}</div>
          ${open ? `<table><thead><tr><th>文件</th><th>状态</th><th>执行时间</th><th>执行版本</th></tr></thead><tbody>${rows.map((r) => `<tr><td class="mono">${r[0]}</td><td>${r[1]}</td><td class="mono">${r[2]}</td><td class="mono">${r[3]}</td></tr>`).join("")}</tbody></table>` : ""}</section>`;
      }

      function render() {
        const s = ui.s;
        const has = s === "update" || s === "failStale";
        let html = versionCard();
        if (ui.run) html += progressCard();
        if (s === "loading") html += `<section class="card"><div class="sk" style="height:14px;width:40%"></div><div class="sk" style="height:60px;margin-top:12px"></div></section>`;
        if (has) html += changelogCard() + (ui.u === "on" ? "" : stepsCard());
        if (s !== "loading") html += migrationCard();
        if (s !== "loading" && ui.u === "on") html += historyCard();
        $("content").innerHTML = html;
        $("dot").classList.toggle("show", has && !ui.run);
        const spin = document.querySelector("#verItem .side-spin");
        if (ui.run && !ui.run.result && !spin) $("verItem").insertAdjacentHTML("beforeend", '<span class="side-spin" aria-label="升级中"></span>');
        if ((!ui.run || ui.run.result) && spin) spin.remove();
        if ($("upBtn")) $("upBtn").onclick = confirmUpgrade;
        if ($("rbBtn")) $("rbBtn").onclick = confirmRollback;
        if ($("runClose")) $("runClose").onclick = () => { ui.run = null; render(); };
        $("navBadge").textContent = has ? "新" : "";
        $("verLabel").textContent = s === "dev" ? "dev" : "v" + CURRENT;
        $("verItem").dataset.tip = has ? `当前 v${CURRENT} · 有新版本 v${LATEST}` : s === "dev" ? "开发构建" : `当前 v${CURRENT}`;
        const more = $("more");
        if (more) more.onclick = () => { const md = $("md"); md.classList.toggle("open"); more.textContent = md.classList.contains("open") ? "收起 ▴" : "展开全部 ▾"; };
        const mm = $("migMore");
        if (mm) mm.onclick = () => { ui.migOpen = !ui.migOpen; render(); };
      }

      $("recheck").onclick = () => {
        if (ui.checking) return;
        ui.checking = true;
        $("recheck").disabled = true;
        $("recheckIcon").classList.add("spin");
        $("recheckText").textContent = "检查中…";
        setTimeout(() => {
          ui.checking = false;
          $("recheck").disabled = false;
          $("recheckIcon").classList.remove("spin");
          $("recheckText").textContent = "重新检查";
          render();
        }, 900);
      };
      $("verItem").onclick = () => window.scrollTo({ top: 0, behavior: "smooth" });

      document.querySelectorAll("[data-s]").forEach((b) => (b.onclick = () => {
        ui.s = b.dataset.s;
        document.querySelectorAll("[data-s]").forEach((x) => x.classList.toggle("on", x === b));
        render();
      }));
      const toggle = (id, fn) => ($(id).onclick = () => { $(id).classList.toggle("on"); fn($(id).classList.contains("on")); });
      toggle("tMig", (on) => { ui.mig = on; render(); });
      toggle("tAdmin", (on) => { ui.admin = on; render(); });
      const group = (attr, key) => document.querySelectorAll(`[data-${attr}]`).forEach((b) => (b.onclick = () => {
        ui[key] = b.dataset[attr];
        document.querySelectorAll(`[data-${attr}]`).forEach((x) => x.classList.toggle("on", x === b));
        render();
      }));
      group("u", "u");
      group("o", "o");
      $("scrim").onclick = (e) => { if (e.target === $("scrim")) $("scrim").classList.remove("show"); };
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("scrim").classList.remove("show"); });
      toggle("tDark", (on) => document.documentElement.classList.toggle("dark", on));
      toggle("tCollapse", (on) => $("app").classList.toggle("collapsed", on));
      toggle("tNarrow", (on) => { document.body.style.maxWidth = on ? "390px" : ""; document.body.style.margin = on ? "0 auto" : ""; document.body.style.borderInline = on ? "1px dashed #999" : ""; $("app").querySelector(".sidebar").style.display = on ? "none" : ""; });

      /* 侧栏折叠时的 tooltip */
      document.addEventListener("mouseover", (e) => {
        const el = e.target.closest("[data-tip]");
        const tip = $("tip");
        if (!el || !$("app").classList.contains("collapsed") && el.id !== "verItem") { tip.style.opacity = 0; return; }
        const r = el.getBoundingClientRect();
        tip.textContent = el.dataset.tip;
        tip.style.left = r.right + 8 + "px";
        tip.style.top = r.top + 6 + "px";
        tip.style.opacity = 1;
      });
      render();
    </script>
  </body>
</html>
