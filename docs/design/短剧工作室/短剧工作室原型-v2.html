function drawPalette() {
  const q = palState.q;
  const items = palItems().filter(it => !q || it.label.includes(q) || it.g.includes(q) || String(it.label).toLowerCase().includes(q.toLowerCase()));
  palState.items = items;
  let g = '', html = '';
  items.slice(0,40).forEach((it,i)=>{ if (it.g!==g) { g = it.g; html += `<div class="pal-g">${g}</div>`; } html += `<button class="pal-it ${i===palState.i?'on':''}" data-pal="${i}">${ic(it.ic)}${esc(it.label)}${it.kbd?`<kbd>${it.kbd}</kbd>`:''}</button>`; });
  $('#palList').innerHTML = html || `<div class="empty" style="padding:30px"><p>没有找到「${esc(q)}」</p></div>`;
  $('#palList .pal-it.on')?.scrollIntoView({block:'nearest'});
}

/* ================= Tasks popover ================= */
function toggleTasks() {
  const old = $('#tasksPop'); if (old) { old.remove(); return; }
  const p = document.createElement('div'); p.id = 'tasksPop'; p.className = 'pop tasks-pop';
  const r = $('#tasksBtn').getBoundingClientRect(); p.style.top = (r.bottom+8)+'px'; p.style.right = (innerWidth-r.right)+'px';
  document.body.appendChild(p); drawTasks();
}
function drawTasks() {
  const p = $('#tasksPop'); if (!p) return;
  const rows = [
    ...S.jobs.map(j=>({t:j.title, p:j.p, ok:j.p>=100})),
    ...EP.flatMap(e=>e.segs.filter(s=>s.status==='running').map(s=>({t:`第 ${e.no} 集 · 片段 ${pad(e.segs.indexOf(s)+1)}`, p:s.progress}))),
    ...Object.values(A).filter(a=>a.status==='running').map(a=>({t:`形象 · ${ASSET_LABEL(a)}`, p:a.progress})),
  ];
  p.innerHTML = `<h4>后台任务 · 刷新页面不会中断</h4>` + (rows.length ? rows.map(r=>`<div class="job ${r.ok?'ok':''}"><div class="row"><span>${esc(r.t)}</span><span class="mono dim" style="font-size:11.5px">${r.ok?'完成':r.p+'%'}</span></div><div class="bar"><i style="width:${r.p}%"></i></div></div>`).join('') : `<div class="empty" style="padding:24px"><p>没有进行中的任务</p></div>`);
}

/* ================= Toast ================= */
function toast(msg, action, fn) {
  const t = document.createElement('div'); t.className = 'toast'; t.setAttribute('role','status');
  t.innerHTML = `${ic('check')}<span>${esc(msg)}</span>${action?`<button>${esc(action)}</button>`:''}`;
  if (action) t.querySelector('button').onclick = () => { fn && fn(); kill(); };
  $('#toasts').appendChild(t);
  const kill = () => { t.classList.add('out'); setTimeout(()=>t.remove(), 200); };
  setTimeout(kill, 4200);
}

/* ================= Ticker (simulated backend) ================= */
setInterval(() => {
  let changed = false;
  S.jobs.forEach(j => {
    if (j.p >= 100) return;
    j.p = Math.min(100, j.p + (j.kind==='compose'?6:j.kind==='breakdown'?5:1)); changed = true;
    if (j.p >= 100) j.done && j.done();
  });
  S.jobs = S.jobs.filter(j => j.p < 100 || (j.doneAt ||= Date.now()) > Date.now()-6000);
  EP.forEach(e => e.segs.forEach(s => {
    if (s.status!=='running') return;
    s.progress = Math.min(100, s.progress + 4 + Math.round(Math.random()*4)); changed = true;
    if (s.progress >= 100) segDone(e, s);
    else if (S.stage==='studio' && e===ep()) {
      const i = e.segs.indexOf(s);
      const c = $(`#track .clip[data-clip="${i}"] .prog`); if (c) c.style.width = s.progress+'%';
      if (i===S.segIdx) { const o = $('#plOv .ring-lg'); if (o) { o.style.setProperty('--p', s.progress); o.querySelector('b').textContent = s.progress+'%'; o.nextElementSibling.textContent = `正在生成 · 预计还需 ${Math.max(3,Math.round((100-s.progress)*.9))} 秒`; } const f = $('#inspF .btn-soft'); if (f) f.innerHTML = `${ic('refresh','spin')}生成中 ${s.progress}%`; }
    }
  }));
  Object.values(A).forEach(a => {
    if (a.status!=='running') return;
    a.progress = Math.min(100, a.progress + 5 + Math.round(Math.random()*5)); changed = true;
    if (a.progress >= 100) { a.status = 'done'; a.takes.push(a.takes.length); a.chosen = a.takes.length-1; toast(`「${ASSET_LABEL(a)}」形象已生成`); if (S.stage==='assets') { renderMain(true); const c = $(`[data-asset-card="${a.id}"]`); c && c.classList.add('flash'); } renderTabs(); if (sheetId===a.id) openSheetQuiet(a.id); }
    else if (S.stage==='assets') { const c = $(`[data-asset-card="${a.id}"] .ring-sm`) || $(`.node[data-v="${a.id}"] .ring-sm`); if (c) { c.style.setProperty('--p', a.progress); c.querySelector('span').textContent = a.progress+'%'; } }
  });
  if (changed) { renderTop(); drawTasks(); if (S.stage==='final') { const j = S.jobs.find(j=>j.kind==='compose'&&j.ep===S.ep&&j.p<100); const f = $('#composeF .bar i'); if (j && f) { f.style.width = j.p+'%'; $('#composeF .mono').textContent = j.p+'%'; } } }
}, 400);
function openSheetQuiet(id) { openSheet(id); const s = $('#layer .sheet'), sc = $('#layer .scrim'); if (s) s.style.animation = 'none'; if (sc) sc.style.animation = 'none'; }

/* ================= Actions ================= */
function toggleTheme() { S.theme = S.theme==='dark'?'light':'dark'; document.documentElement.dataset.theme = S.theme; renderTop(); }
const ACT = {
  stage: el => go(el.dataset.v),
  goto: el => { const n = +el.dataset.ep; if (el.dataset.stage==='assets') S.assetEp = n; else if (n) { if (n!==S.ep) { S.segIdx = 0; S.t = 0; } S.ep = n; } go(el.dataset.stage, {force:true}); },
  ep: el => {
    const n = +el.dataset.v;
    if (S.stage==='assets') { S.assetEp = n; renderRail(); renderMain(); return; }
    if (n===S.ep) return;
    stopPlay(); S.ep = n; S.segIdx = 0; S.t = 0; renderRail(); renderMain(); $('#main').scrollTop = 0;
  },
  'script-tab': el => { S.scriptTab = el.dataset.v; renderMain(); },
  jump: el => document.getElementById(el.dataset.v)?.scrollIntoView({behavior:reduced?'auto':'smooth', block:'start'}),
  'script-gen': () => { const e = ep(); e.script = 'running'; S.credits -= 4; S.jobs.push({id:'j'+Date.now(), title:`撰写分集剧本 · 第 ${e.no} 集`, p:10, kind:'script', done:()=>{ e.script='ready'; toast(`第 ${e.no} 集剧本已写好`); if (S.stage==='script') renderMain(); renderRail(); }}); renderMain(); renderRail(); renderTabs(); },
  'sb-gen': () => { const e = ep(); S.credits -= 4; S.jobs.push({id:'j'+Date.now(), title:`生成分镜脚本 · 第 ${e.no} 集`, p:20, kind:'breakdown', done:()=>{ e.sb='ready'; [10,12,9,14,8].forEach((sec,k)=>mkSeg(e.no,sec,0,`{${['s5','c2','c4','p3','c7'][k]}}${e.syn.slice(0,16)}……`,GEN_SHOT)); toast(`第 ${e.no} 集分镜已生成 · 5 个片段`,'进片场',()=>go('studio',{force:true})); if (S.stage==='studio'||S.stage==='script') renderMain(); renderRail(); }}); toast('已开始生成分镜脚本，大约 30 秒'); renderTop(); },
  breakdown: openBreakdown,
  'bd-ep': el => { const n = +el.dataset.v; BD.eps.has(n) ? BD.eps.delete(n) : BD.eps.add(n); drawBreakdown(); },
  'bd-all': () => { EP.filter(e=>e.script==='ready'&&!e.locked).forEach(e=>BD.eps.add(e.no)); drawBreakdown(); },
  'bd-go': () => {
    const eps = [...BD.eps].sort((a,b)=>a-b); closeLayer(); S.credits -= eps.length*6;
    S.jobs.push({id:'j'+Date.now(), title:`资产拆解 · 第 ${eps.join('、')} 集`, p:4, kind:'breakdown', done:()=>{
      eps.forEach(n=>{ EP[n-1].locked = true; });
      A.p5 = {id:'p5',type:'prop',name:'银质烛台',look:'',eps:[...eps],hue:48,status:'pending',progress:0,takes:[],chosen:0,prompt:defaultPrompt('prop','银质烛台')}; NODE_POS.p5 = [1380,960];
      A.s3.eps = [...new Set([...A.s3.eps, ...eps])];
      toast(`拆解完成：新增 1 个道具，1 个场景追加了出场集数`, '查看', ()=>{ S.assetEp = eps[0]; go('assets',{force:true}); });
      renderRail(); renderTabs(); if (S.stage!=='studio') renderMain(true);
    }});
    toast(`开始拆解第 ${eps.join('、')} 集，完成后通知你`); renderTop();
  },
  'asset-tab': el => { S.assetTab = el.dataset.v; renderMain(); },
  'asset-view': el => { S.assetView = el.dataset.v; S.selecting = false; renderMain(); },
  'asset-open': el => openSheet(el.dataset.v),
  'asset-gen': el => { genAsset(el.dataset.v); if (S.stage==='assets') renderMain(true); if (sheetId) openSheetQuiet(sheetId); renderTop(); },
  'asset-take': el => { const a = A[sheetId]; a.chosen = +el.dataset.v; openSheetQuiet(a.id); if (S.stage==='assets') renderMain(true); toast(`已把版本 ${a.chosen+1} 设为${a.type==='char'?'形象':'主图'}，后续生成片段都会用它`); },
  'asset-ep': el => { const a = A[sheetId], n = +el.dataset.v; a.eps = a.eps.includes(n) ? a.eps.filter(x=>x!==n) : [...a.eps, n].sort((x,y)=>x-y); openSheetQuiet(a.id); if (S.stage==='assets') renderMain(true); },
  'asset-locate': el => { const id = el.dataset.v; closeLayer(); S.assetView = 'canvas'; S.assetEp = 0; S.assetTab = 'all'; S.selecting = false; if (S.stage!=='assets') go('assets'); else { renderRail(); renderMain(); } setTimeout(()=>cvFocus(id), 60); },
  'gen-pending': () => { const p = Object.values(A).filter(a=>a.status==='pending'||a.status==='error'); p.forEach(a=>genAsset(a.id)); toast(`已提交 ${p.length} 个形象生成`); renderMain(true); renderTop(); },
  'select-mode': () => { S.selecting = !S.selecting; S.sel.clear(); renderMain(true); },
  pick: el => { const id = el.dataset.v; if (A[id].status==='running') return; S.sel.has(id) ? S.sel.delete(id) : S.sel.add(id); renderMain(true); },
  'select-all': () => { Object.values(A).filter(a=>a.status==='pending'||a.status==='error').forEach(a=>S.sel.add(a.id)); renderMain(true); },
  'batch-gen': () => { const n = S.sel.size; S.sel.forEach(genAsset); S.sel.clear(); S.selecting = false; toast(`已提交 ${n} 个生成任务`); renderMain(true); renderTop(); },
  'cv-node': el => { CV.on = el.dataset.v; $$('.node').forEach(n=>n.classList.toggle('on', n.dataset.v===CV.on)); openSheet(CV.on); },
  'cv-focus': el => cvFocus(el.dataset.v),
  'cv-zoom': el => { const v = +el.dataset.v; CV.z = v===0 ? .82 : Math.max(.4, Math.min(1.6, CV.z + v*.12)); $('#world').style.transform = `translate(${CV.x}px,${CV.y}px) scale(${CV.z})`; el.closest('.cv-zoom').children[1].textContent = Math.round(CV.z*100)+'%'; },
  seg: el => selectSeg(+el.dataset.v),
  'seg-gen': () => genSeg(),
  'batch-seg': () => { const e = ep(); let n = 0; e.segs.forEach((s,i)=>{ if (s.chosen<0 && s.status!=='running') { genSeg(i); n++; } }); toast(`已提交 ${n} 个片段`); if (S.stage==='studio') { $('#plOv').innerHTML = overlayHtml(seg()); renderInspF(); } else renderMain(true); },
  take: el => { const s = seg(); S.viewTake[s.id] = +el.dataset.v; $('#plFrame').innerHTML = playerFrame(s, S.viewTake[s.id]); $('#plBadge').innerHTML = badgeHtml(s, S.viewTake[s.id]); $('#takeRow').innerHTML = takeRowHtml(s); },
  adopt: () => { const s = seg(); s.chosen = S.viewTake[s.id]; $('#takeRow').innerHTML = takeRowHtml(s); $('#plBadge').innerHTML = badgeHtml(s, s.chosen); renderTimeline(); toast(`片段 ${pad(S.segIdx+1)} 已采用版本 ${s.chosen+1}`); },
  play: togglePlay,
  dur: el => { const s = seg(); s.sec = Math.max(3, Math.min(15, s.sec + +el.dataset.v)); $('#durV').textContent = s.sec+'s'; renderTimeline(); renderInspF(); },
  'add-seg': () => { const e = ep(); mkSeg(e.no, 8, 0, '', [{t:8,size:'中景',cam:'固定',act:'新片段'}]); S.segIdx = e.segs.length-1; renderTimeline(); renderSet(); renderInsp(); $('#editor').focus(); $('#tlScroll').scrollLeft = 1e5; },
  'lib-insert': el => { const ed = $('#editor'); if (!ed) return; const sel = getSelection(); let r; if (sel.rangeCount && ed.contains(sel.getRangeAt(0).startContainer)) r = sel.getRangeAt(0); else { r = document.createRange(); r.selectNodeContents(ed); r.collapse(false); } insertChip(r, el.dataset.v); },
  compose: () => { const e = ep(); stopPlay(); S.jobs.push({id:'j'+Date.now(), kind:'compose', ep:e.no, title:`合成整集 · 第 ${e.no} 集`, p:3, done:()=>{ e.final='done'; toast(`第 ${e.no} 集成片已合成`,'下载',()=>toast('开始下载')); if (S.stage==='final') renderMain(true); renderRail(); }}); renderMain(true); renderTop(); },
  assist: () => toggleAssist(),
  'ai-send': () => sendAI($('#asIn').value),
  'ai-sugg': el => sendAI(el.textContent),
  'ai-approve': el => {
    const v = el.dataset.v, card = el.closest('.appr');
    const last = S.msgs[S.msgs.length-1];
    if (v==='script') { last.card = last.card.replace('class="appr"','class="appr done"').replace('<span class="tag tag-mute">未锁定，可修改</span>','<span class="tag tag-ok">已应用</span>'); toast('第 5 集剧本已更新', '去看看', ()=>{ S.ep = 5; S.scriptTab = 'ep'; go('script',{force:true}); }); }
    else if (v.startsWith('assets:')) { v.slice(7).split(',').filter(Boolean).forEach(genAsset); last.card = last.card.replace('class="appr"','class="appr done"'); toast('已开始生成形象'); renderTop(); }
    else if (v==='segs') { const e = EP[2]; e.segs.forEach((s,i)=>{ if (s.chosen<0 && s.status!=='running') { s.status='running'; s.progress=2; S.credits -= s.sec*2; } }); last.card = last.card.replace('class="appr"','class="appr done"'); toast('已提交第 3 集剩余片段'); if (S.stage==='studio' && S.ep===3) { renderTimeline(); $('#plOv').innerHTML = overlayHtml(seg()); renderInspF(); } renderTop(); }
    S.msgs.push({who:'a', html:'好了，已经执行。'}); drawMsgs();
  },
  'ai-reject': () => { const last = S.msgs[S.msgs.length-1]; last.card = last.card.replace('class="appr"','class="appr done" style="opacity:.55"'); S.msgs.push({who:'a', html:'好的，没有改动。'}); drawMsgs(); },
  palette: openPalette, tasks: toggleTasks, theme: toggleTheme,
  'close-layer': closeLayer,
  toast: el => toast(el.dataset.v),
};
document.addEventListener('click', e => {
  const pal = e.target.closest('[data-pal]');
  if (pal && palState) { const it = palState.items[+pal.dataset.pal]; closeLayer(); setTimeout(it.run, 30); return; }
  if (!e.target.closest('#tasksPop,#tasksBtn')) $('#tasksPop')?.remove();
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.disabled) return;
  ACT[a.dataset.act]?.(a, e);
});
document.addEventListener('dragstart', e => { const d = e.target.closest?.('[data-drag]'); if (d) { e.dataTransfer.setData('application/x-asset', d.dataset.drag); e.dataTransfer.effectAllowed = 'copy'; } });

/* mention hover cards in the script */
let hc;
document.addEventListener('mouseover', e => {
  const m = e.target.closest?.('.mention'); if (!m) return;
  const a = A[m.dataset.asset]; if (!a) return;
  hc?.remove(); hc = document.createElement('div'); hc.className = 'pop hover-card';
  hc.innerHTML = `<div style="position:relative;border-radius:9px;overflow:hidden;aspect-ratio:4/3">${a.status==='done'?art(a.hue+a.chosen*10,a.type):`<div class="pend">${ic(TYPE_META[a.type].ic,'i-lg')}待生成</div>`}</div><b>${esc(ASSET_LABEL(a))}</b><small>${TYPE_META[a.type].label} · ${a.eps.length?'第 '+a.eps.join('、')+' 集':'全集出现'}</small>`;
  document.body.appendChild(hc);
  const r = m.getBoundingClientRect(); hc.style.left = Math.min(r.left, innerWidth-236)+'px'; hc.style.top = (r.bottom+8 > innerHeight-230 ? r.top-230 : r.bottom+8)+'px';
});
document.addEventListener('mouseout', e => { if (e.target.closest?.('.mention')) { hc?.remove(); hc = null; } });

/* keyboard */
document.addEventListener('keydown', e => {
  const typing = e.target.closest('input,textarea,[contenteditable="true"]');
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase()==='k') { e.preventDefault(); palState ? closeLayer() : openPalette(); return; }
  if (mod && e.key.toLowerCase()==='j') { e.preventDefault(); toggleAssist(); return; }
  if (e.key==='Escape') { if ($('#layer').children.length) return closeLayer(); if ($('#tasksPop')) return $('#tasksPop').remove(); if (S.assist) return toggleAssist(false); }
  if (typing || mod || $('#layer').children.length) return;
  if (/^[1-5]$/.test(e.key)) { go(STAGES[+e.key-1].k); }
  else if (e.key===']' || e.key==='[') { const n = Math.max(1, Math.min(16, (S.stage==='assets'?S.assetEp||1:S.ep) + (e.key===']'?1:-1))); ACT.ep({dataset:{v:n}}); }
  else if (e.key===' ' && (S.stage==='studio'||S.stage==='final')) { e.preventDefault(); togglePlay(); }
});
addEventListener('resize', moveInd);

/* boot */
renderTabs(); renderRail(); renderMain();
document.fonts?.ready.then(moveInd);
</script>
