<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>短剧工作室原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
    <style>
      /* 颜色全部抄自 web/src/index.css；动效参数抄自 web/src/lib/motion.ts */
      :root {
        color-scheme: light;
        --background: oklch(1 0 0);
        --foreground: oklch(0.145 0 0);
        --card: oklch(1 0 0);
        --popover: oklch(1 0 0);
        --primary: oklch(0.205 0 0);
        --primary-foreground: oklch(0.985 0 0);
        --secondary: oklch(0.97 0 0);
        --muted: oklch(0.97 0 0);
        --muted-foreground: oklch(0.556 0 0);
        --accent: oklch(0.97 0 0);
        --destructive: oklch(0.577 0.245 27.325);
        --border: oklch(0.922 0 0);
        --input: oklch(0.922 0 0);
        --ring: oklch(0.708 0 0);
        --sidebar: oklch(0.985 0 0);
        --sidebar-border: oklch(0.922 0 0);
        --canvas-bg: oklch(0.975 0 0);
        --canvas-dot: oklch(0 0 0 / 0.16);
        --panel: oklch(1 0 0);
        --menu: oklch(1 0 0);
        --chrome: oklch(1 0 0 / 0.82);
        --chrome-border: oklch(0 0 0 / 0.08);
        --chrome-hover: oklch(0 0 0 / 0.05);
        --node-ring: oklch(0.2 0 0 / 0.85);
        --credit: oklch(0.72 0.15 75);
        --preset: oklch(0.55 0.2 295);
        --status-running: oklch(0.58 0.15 250);
        --status-success: oklch(0.6 0.15 155);
        --status-warning: oklch(0.7 0.16 70);
        --elevation-near: oklch(0 0 0 / 0.06);
        --elevation-far: oklch(0 0 0 / 0.18);
        --beam: oklch(0.62 0.16 55);
        --cover-scrim: oklch(0 0 0 / 0.62);
        --cover-foreground: oklch(0.985 0 0);
        --sheen: oklch(1 0 0 / 0.7);
        --group-blue: oklch(0.55 0.18 255);
        --group-green: oklch(0.6 0.17 150);
        --group-orange: oklch(0.64 0.17 55);
        --group-purple: oklch(0.55 0.2 295);
        --radius: 0.625rem;
        /* lib/motion.ts */
        --ease: cubic-bezier(0.2, 0, 0, 1);
        --d-fast: 120ms;
        --d-base: 180ms;
        --d-exit: 126ms;
        --d-slow: 240ms;
        --d-slow-exit: 168ms;
      }
      .dark {
        color-scheme: dark;
        --background: oklch(0.145 0 0);
        --foreground: oklch(0.985 0 0);
        --card: oklch(0.205 0 0);
        --popover: oklch(0.205 0 0);
        --primary: oklch(0.922 0 0);
        --primary-foreground: oklch(0.205 0 0);
        --secondary: oklch(0.269 0 0);
        --muted: oklch(0.269 0 0);
        --muted-foreground: oklch(0.708 0 0);
        --accent: oklch(0.269 0 0);
        --destructive: oklch(0.704 0.191 22.216);
        --border: oklch(1 0 0 / 10%);
        --input: oklch(1 0 0 / 15%);
        --ring: oklch(0.556 0 0);
        --sidebar: oklch(0.205 0 0);
        --sidebar-border: oklch(1 0 0 / 10%);
        --canvas-bg: oklch(0.13 0 0);
        --canvas-dot: oklch(1 0 0 / 0.14);
        --panel: oklch(0.243 0 0);
        --menu: oklch(0.269 0 0);
        --chrome: oklch(0.2 0 0 / 0.78);
        --chrome-border: oklch(1 0 0 / 0.08);
        --chrome-hover: oklch(1 0 0 / 0.07);
        --node-ring: oklch(1 0 0 / 0.72);
        --credit: oklch(0.82 0.15 85);
        --preset: oklch(0.6 0.19 295);
        --status-running: oklch(0.75 0.12 240);
        --status-success: oklch(0.75 0.15 155);
        --status-warning: oklch(0.8 0.15 75);
        --elevation-near: oklch(0 0 0 / 0.1);
        --elevation-far: oklch(0 0 0 / 0.42);
        --beam: oklch(0.78 0.15 70);
        --cover-scrim: oklch(0 0 0 / 0.7);
        --sheen: oklch(1 0 0 / 0.09);
        --group-blue: oklch(0.72 0.15 255);
        --group-green: oklch(0.76 0.17 150);
        --group-orange: oklch(0.76 0.16 55);
        --group-purple: oklch(0.7 0.16 295);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body { margin: 0; font-family: Geist, "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--background); color: var(--foreground); font-size: 13px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden; }
      button, input, select, textarea { font: inherit; color: inherit; }
      button { background: none; border: 0; padding: 0; cursor: pointer; }
      [data-lucide] { width: 16px; height: 16px; flex: none; stroke-width: 1.75; }
      .i14 [data-lucide], [data-lucide].i14 { width: 14px; height: 14px; }
      .num { font-variant-numeric: tabular-nums; }
      .muted { color: var(--muted-foreground); }
      .row { display: flex; align-items: center; gap: 8px; }
      .col { display: flex; flex-direction: column; }
      .grow { flex: 1; min-width: 0; }
      .scroll { overflow: auto; min-height: 0; }
      .truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: var(--chrome-hover); border-radius: 8px; }
      :focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }

      /* ---------- 原型说明条 ---------- */
      .proto-bar { position: fixed; top: 0; left: 0; right: 0; height: 32px; z-index: 100; display: flex; align-items: center; gap: 10px; padding: 0 12px; font-size: 12px; background: var(--preset); color: white; }
      .proto-bar button { height: 22px; padding: 0 8px; border-radius: 6px; background: oklch(1 0 0 / 0.18); display: inline-flex; align-items: center; gap: 4px; }
      .proto-bar button:hover { background: oklch(1 0 0 / 0.28); }
      #app { position: fixed; inset: 32px 0 0 0; }

      /* ---------- 通用控件 ---------- */
      .btn { height: 32px; padding: 0 12px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-weight: 500; white-space: nowrap; transition: background var(--d-fast) var(--ease), transform var(--d-fast) var(--ease), opacity var(--d-fast); user-select: none; }
      .btn:active:not(:disabled) { transform: scale(0.96); }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .btn-ghost:hover:not(:disabled) { background: var(--chrome-hover); }
      .btn-primary { background: var(--primary); color: var(--primary-foreground); }
      .btn-primary:hover:not(:disabled) { opacity: 0.9; }
      .btn-outline { border: 1px solid var(--border); background: var(--card); }
      .btn-outline:hover:not(:disabled) { background: var(--accent); }
      .btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 7px; }
      .btn-icon { width: 32px; padding: 0; }
      .btn-sm.btn-icon { width: 28px; }
      .credit { color: var(--credit); }
      .pill { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 500; white-space: nowrap; background: var(--muted); color: var(--muted-foreground); }
      .pill.run { background: color-mix(in oklch, var(--status-running) 16%, transparent); color: var(--status-running); }
      .pill.ok { background: color-mix(in oklch, var(--status-success) 16%, transparent); color: var(--status-success); }
      .pill.warn { background: color-mix(in oklch, var(--status-warning) 18%, transparent); color: var(--status-warning); }
      .pill.bad { background: color-mix(in oklch, var(--destructive) 16%, transparent); color: var(--destructive); }
      .pill.vio { background: color-mix(in oklch, var(--preset) 16%, transparent); color: var(--preset); }
      .kbd { font-family: "Geist Mono", monospace; font-size: 10.5px; padding: 0 4px; border: 1px solid var(--border); border-radius: 4px; color: var(--muted-foreground); }
      .chrome { background: var(--chrome); border: 1px solid var(--chrome-border); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); box-shadow: 0 1px 2px var(--elevation-near), 0 12px 32px var(--elevation-far); }
      .input { height: 32px; border: 1px solid var(--input); border-radius: 8px; padding: 0 10px; background: transparent; outline: none; transition: border-color var(--d-fast); }
      .input:focus { border-color: var(--ring); }
      .shimmer { background: linear-gradient(90deg, var(--muted-foreground) 0%, var(--foreground) 50%, var(--muted-foreground) 100%); background-size: 200% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; animation: shimmer 1.6s linear infinite; }
      @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
      .spin { animation: spin 0.9s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      .fade-up { animation: fadeUp var(--d-base) var(--ease) both; }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .stagger > * { animation: fadeUp var(--d-base) var(--ease) both; }
      .stagger > *:nth-child(1) { animation-delay: 0ms; } .stagger > *:nth-child(2) { animation-delay: 30ms; } .stagger > *:nth-child(3) { animation-delay: 60ms; } .stagger > *:nth-child(4) { animation-delay: 90ms; } .stagger > *:nth-child(5) { animation-delay: 120ms; } .stagger > *:nth-child(n + 6) { animation-delay: 150ms; }
      .no-anim .stagger > *, .no-anim .fade-up { animation: none; }

      /* 分段控件：滑块用 transform 移动（SPRING 的近似：base 时长 + ease-out） */
      .seg { position: relative; display: inline-flex; padding: 2px; border-radius: 9px; background: var(--muted); }
      .seg .knob { position: absolute; top: 2px; bottom: 2px; left: 2px; border-radius: 7px; background: var(--card); box-shadow: 0 1px 2px var(--elevation-near), 0 1px 3px var(--elevation-near); transition: transform var(--d-base) var(--ease), width var(--d-base) var(--ease); }
      .seg button { position: relative; z-index: 1; height: 26px; padding: 0 10px; font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; gap: 5px; color: var(--muted-foreground); border-radius: 7px; transition: color var(--d-fast); }
      .seg button[aria-pressed="true"] { color: var(--foreground); }

      /* 浮层（菜单 / popover）：从触发点方向出来，退出更快 */
      .pop { position: fixed; z-index: 60; min-width: 200px; border-radius: 12px; padding: 6px; background: var(--menu); border: 1px solid var(--chrome-border); box-shadow: 0 1px 2px var(--elevation-near), 0 16px 40px var(--elevation-far); transform-origin: var(--origin, top left); animation: popIn var(--d-base) var(--ease) both; }
      .pop.out { animation: popOut var(--d-exit) var(--ease) both; }
      @keyframes popIn { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: none; } }
      @keyframes popOut { to { opacity: 0; transform: scale(0.96); } }
      .menu-item { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 8px; border-radius: 7px; text-align: left; font-size: 12.5px; }
      .menu-item:hover, .menu-item.active { background: var(--chrome-hover); }
      .menu-label { padding: 6px 8px 4px; font-size: 11px; color: var(--muted-foreground); }

      /* 对话框 */
      .dlg-bg { position: fixed; inset: 32px 0 0 0; z-index: 70; background: oklch(0 0 0 / 0.5); display: grid; place-items: center; animation: fade var(--d-slow) var(--ease) both; }
      .dlg-bg.out { animation: fadeOut var(--d-slow-exit) var(--ease) both; }
      .dlg { width: min(600px, calc(100vw - 32px)); max-height: calc(100vh - 80px); overflow: auto; border-radius: 16px; background: var(--popover); border: 1px solid var(--chrome-border); box-shadow: 0 24px 64px var(--elevation-far); animation: dlgIn var(--d-slow) var(--ease) both; }
      .dlg-bg.out .dlg { animation: dlgOut var(--d-slow-exit) var(--ease) both; }
      @keyframes fade { from { opacity: 0; } }
      @keyframes fadeOut { to { opacity: 0; } }
      @keyframes dlgIn { from { opacity: 0; transform: scale(0.96) translateY(8px); } }
      @keyframes dlgOut { to { opacity: 0; transform: scale(0.97); } }

      /* toast */
      #toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 90; display: grid; gap: 8px; justify-items: center; pointer-events: none; }
      .toast { display: flex; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 10px; font-size: 12.5px; animation: toastIn var(--d-base) var(--ease) both; }
      .toast.out { animation: toastOut var(--d-exit) var(--ease) both; }
      @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } }
      @keyframes toastOut { to { opacity: 0; transform: translateY(6px); } }

      /* 海报占位：素材的示意画面（不是 UI 颜色） */
      .poster { position: relative; overflow: hidden; background: var(--g); }
      .poster::after { content: ""; position: absolute; inset: 0; background: radial-gradient(120% 70% at 30% 20%, oklch(1 0 0 / 0.16), transparent 60%); pointer-events: none; }
      .scrim { position: absolute; inset: auto 0 0 0; padding: 28px 10px 8px; background: linear-gradient(transparent, var(--cover-scrim)); color: var(--cover-foreground); }

      /* ---------- 首页布局 ---------- */
      .home { display: flex; height: 100%; }
      .sidebar { width: 232px; flex: none; background: var(--sidebar); border-right: 1px solid var(--sidebar-border); display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; }
      .brand { display: flex; align-items: center; gap: 8px; padding: 4px 8px 14px; font-weight: 600; font-size: 14px; }
      .brand-mark { width: 26px; height: 26px; border-radius: 8px; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; }
      .nav { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 8px; color: var(--muted-foreground); font-weight: 500; transition: background var(--d-fast), color var(--d-fast); }
      .nav:hover { background: var(--chrome-hover); color: var(--foreground); }
      .nav[aria-current="true"] { background: var(--accent); color: var(--foreground); }
      .new-badge { margin-left: auto; font-size: 10px; padding: 0 5px; border-radius: 5px; background: color-mix(in oklch, var(--beam) 22%, transparent); color: var(--beam); font-weight: 600; }
      .side-sec { margin-top: 14px; padding: 0 10px 4px; font-size: 11px; color: var(--muted-foreground); }
      .side-item { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; border-radius: 7px; color: var(--muted-foreground); font-size: 12.5px; }
      .side-item:hover { background: var(--chrome-hover); color: var(--foreground); }
      .home-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .site-header { height: 52px; flex: none; display: flex; align-items: center; justify-content: flex-end; gap: 10px; padding: 0 20px; }
      .avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, var(--group-purple), var(--group-blue)); }
      .hero { max-width: 860px; margin: 0 auto; width: 100%; padding: 28px 24px 0; }
      .hero h1 { margin: 0; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; text-align: center; }
      .hero h1 .beam { background: linear-gradient(90deg, var(--beam), var(--credit)); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .composer { margin-top: 22px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); box-shadow: 0 1px 2px var(--elevation-near), 0 20px 50px var(--elevation-far); overflow: hidden; }
      .composer-tabs { display: flex; gap: 2px; padding: 8px 8px 0; }
      .ctab { height: 32px; padding: 0 14px; border-radius: 9px 9px 0 0; font-weight: 500; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 6px; }
      .ctab[aria-selected="true"] { background: var(--muted); color: var(--foreground); }
      .drop { margin: 0 8px; border-radius: 0 12px 12px 12px; background: var(--muted); min-height: 168px; display: grid; place-items: center; padding: 18px; border: 1.5px dashed transparent; transition: border-color var(--d-fast), background var(--d-fast); }
      .drop.over { border-color: var(--ring); }
      .drop textarea { width: 100%; height: 150px; border: 0; outline: none; background: transparent; resize: none; line-height: 1.7; }
      .filechip { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); }
      .filechip .ext { width: 34px; height: 40px; border-radius: 6px; display: grid; place-items: center; font-size: 10px; font-weight: 700; background: color-mix(in oklch, var(--group-blue) 18%, transparent); color: var(--group-blue); }
      .composer-foot { display: flex; align-items: center; gap: 6px; padding: 10px 12px; flex-wrap: wrap; }
      .cchip { height: 30px; padding: 0 10px; border-radius: 8px; display: inline-flex; align-items: center; gap: 6px; color: var(--muted-foreground); font-weight: 500; transition: background var(--d-fast), color var(--d-fast); }
      .cchip:hover { background: var(--chrome-hover); color: var(--foreground); }
      .cchip.set { color: var(--foreground); }
      .send { width: 36px; height: 36px; border-radius: 50%; background: var(--primary); color: var(--primary-foreground); display: grid; place-items: center; margin-left: auto; transition: transform var(--d-fast) var(--ease), opacity var(--d-fast); }
      .send:active:not(:disabled) { transform: scale(0.96); }
      .send:disabled { opacity: 0.35; cursor: not-allowed; }
      .proj-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
      .proj { text-align: left; border-radius: 14px; transition: transform var(--d-fast) var(--ease); }
      .proj:active { transform: scale(0.985); }
      .proj .poster { aspect-ratio: 16/10; border-radius: 12px; }
      .proj:hover .poster { box-shadow: 0 0 0 1px var(--node-ring); }
      .stepper { display: flex; gap: 4px; margin-top: 6px; }
      .stepper i { height: 3px; flex: 1; border-radius: 3px; background: var(--muted); }
      .stepper i.on { background: var(--foreground); }
      .stepper i.half { background: linear-gradient(90deg, var(--foreground) 50%, var(--muted) 50%); }
      .style-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; padding: 4px; }
      .style-card { text-align: left; border-radius: 9px; padding: 3px; border: 1.5px solid transparent; transition: border-color var(--d-fast); }
      .style-card .poster { aspect-ratio: 4/5; border-radius: 7px; }
      .style-card[aria-pressed="true"] { border-color: var(--foreground); }
      .style-card span { display: block; font-size: 11px; padding: 3px 2px 1px; }

      /* ---------- 工作台 ---------- */
      .ws { display: flex; height: 100%; background: var(--background); }
      .rail { width: 64px; flex: none; border-right: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; padding: 10px 0; gap: 2px; position: relative; }
      .rail-btn { width: 52px; padding: 7px 0 5px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--muted-foreground); font-size: 10.5px; position: relative; z-index: 1; transition: color var(--d-fast); }
      .rail-btn [data-lucide] { width: 18px; height: 18px; }
      .rail-btn:hover { color: var(--foreground); }
      .rail-btn[aria-current="true"] { color: var(--foreground); }
      .rail-knob { position: absolute; left: 6px; width: 52px; height: 50px; border-radius: 10px; background: var(--accent); transition: transform var(--d-base) var(--ease); }
      .rail-step { position: absolute; right: 7px; top: 6px; width: 7px; height: 7px; border-radius: 50%; }
      .ws-main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
      .topbar { height: 52px; flex: none; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 6px; padding: 0 12px; }
      .title-input { height: 30px; border: 1px solid transparent; border-radius: 7px; padding: 0 8px; background: transparent; font-weight: 600; font-size: 14px; width: 180px; outline: none; transition: border-color var(--d-fast), background var(--d-fast); }
      .title-input:hover { background: var(--chrome-hover); }
      .title-input:focus { border-color: var(--ring); background: transparent; }
      .saved { font-size: 11.5px; color: var(--muted-foreground); display: inline-flex; align-items: center; gap: 4px; }
      .ws-body { flex: 1; min-height: 0; display: flex; }
      .ws-content { flex: 1; min-width: 0; display: flex; position: relative; }
      .side { width: 320px; flex: none; border-left: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; background: var(--background); }
      .side-head { height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 12px; }

      /* 剧本 */
      .toc { width: 212px; flex: none; border-right: 1px solid var(--border); padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
      .toc-item { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; font-size: 12.5px; color: var(--muted-foreground); text-align: left; transition: background var(--d-fast), color var(--d-fast); }
      .toc-item:hover { background: var(--chrome-hover); color: var(--foreground); }
      .toc-item[aria-current="true"] { background: var(--accent); color: var(--foreground); font-weight: 500; }
      .toc-item .st { margin-left: auto; }
      .paper-wrap { flex: 1; min-width: 0; overflow: auto; position: relative; }
      .paper { max-width: 720px; margin: 0 auto; padding: 32px 40px 120px; }
      .paper h2 { margin: 0 0 4px; font-size: 22px; font-weight: 600; letter-spacing: -0.01em; }
      .doc { outline: none; font-size: 14px; line-height: 1.9; margin-top: 20px; }
      .doc p { margin: 0 0 10px; }

      .ep-dots { display: inline-flex; gap: 3px; }

      .ring-prog { width: 30px; height: 30px; }
      .canvas { flex: 1; position: relative; overflow: hidden; background-color: var(--canvas-bg); background-image: radial-gradient(var(--canvas-dot) 1px, transparent 1px); background-size: 20px 20px; cursor: grab; }
      .canvas.panning { cursor: grabbing; }
      .world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }

      .cnode { position: absolute; width: 168px; }

      .cnode .body { border-radius: 14px; background: var(--panel); border: 1px solid var(--chrome-border); overflow: hidden; box-shadow: 0 1px 2px var(--elevation-near), 0 8px 24px var(--elevation-near); transition: box-shadow var(--d-fast); cursor: pointer; }

      .node-bar { position: absolute; bottom: calc(100% + 30px); left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 4px; border-radius: 12px; white-space: nowrap; transform-origin: bottom center; animation: barIn var(--d-base) var(--ease) both; z-index: 5; }

      /* 节点下方的生成面板：复用无限画布 TaskPromptPanel（NodePromptInput）的样式与结构 */
      .gpanel { position: absolute; top: calc(100% + 12px); left: 50%; width: 440px; display: flex; flex-direction: column; gap: 12px; padding: 16px; border-radius: 18px; background: var(--panel); box-shadow: 0 0 0 1px color-mix(in oklch, var(--foreground) 5%, transparent), 0 25px 50px -12px oklch(0 0 0 / 0.35); cursor: default; z-index: 6; transform: translateX(-50%); transform-origin: top center; animation: gpIn var(--d-base) var(--ease) both; }

      .lib-float { position: absolute; left: 12px; top: 12px; bottom: 12px; width: 236px; border-radius: 14px; display: flex; flex-direction: column; z-index: 4; cursor: default; }

      /* 片段工作区 */
      .studio { display: flex; flex-direction: column; height: 100%; }

      .seditor-in { max-width: 760px; margin: 0 auto; padding: 22px 28px 40px; }
      .prompt { min-height: 150px; border-radius: 14px; border: 1px solid var(--border); background: var(--panel); padding: 14px 16px; line-height: 2.05; font-size: 13.5px; outline: none; transition: border-color var(--d-fast), box-shadow var(--d-fast); }

      .refs { display: flex; gap: 6px; flex-wrap: wrap; }

      .job { border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; display: grid; gap: 6px; background: var(--card); }

      @media (max-width: 1100px) { .side { display: none; } .preview { width: 240px; } }

  <body>
    <div class="proto-bar">
      <i data-lucide="flask-conical" class="i14"></i>
      <b>短剧工作室 · 高保真原型</b>
      <span style="opacity: 0.85" class="truncate">数据在内存里，刷新复原；所有生成都是模拟。失败演示：项目名含 <code>bad</code> 时拆解失败；片段提示词写「失败」再生成。</span>
      <span style="margin-left: auto" class="row">
        <button data-act="reset"><i data-lucide="rotate-ccw" class="i14"></i>重置</button>
        <button data-act="theme"><i data-lucide="sun-moon" class="i14"></i>明暗</button>
      </span>
    </div>
    <div id="app"></div>
    <div id="toasts"></div>
    <div id="layer"></div>

    <script>
      const $ = (s, r = document) => r.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const icons = () => window.lucide && lucide.createIcons();
      const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

      /* 素材示意画面：按名字算出一个稳定的色相，生成电影感的渐变海报 */
      function hue(s) { let h = 0; for (const c of String(s)) h = (h * 31 + c.charCodeAt(0)) % 360; return h; }
      function g(s, kind) {
        const h = hue(s), h2 = (h + 40) % 360;
        if (kind === "scene") return `radial-gradient(90% 60% at 70% 30%, oklch(0.72 0.12 ${h} / .9), transparent 60%), linear-gradient(180deg, oklch(0.42 0.08 ${h2}) 0%, oklch(0.22 0.05 ${h}) 70%, oklch(0.14 0.02 ${h}) 100%)`;
        if (kind === "prop") return `radial-gradient(40% 40% at 50% 55%, oklch(0.82 0.12 ${h}) 0%, oklch(0.5 0.1 ${h}) 45%, transparent 60%), linear-gradient(160deg, oklch(0.3 0.03 ${h2}), oklch(0.16 0.02 ${h}))`;
        return `radial-gradient(34% 26% at 50% 34%, oklch(0.78 0.06 ${h}) 0%, oklch(0.62 0.07 ${h}) 60%, transparent 62%), radial-gradient(60% 48% at 50% 100%, oklch(0.5 0.1 ${h2}) 0%, oklch(0.4 0.1 ${h2}) 70%, transparent 72%), linear-gradient(170deg, oklch(0.36 0.05 ${h}), oklch(0.18 0.03 ${h2}))`;
      }

        return `<div class="scroll" style="flex:1; padding:4px 12px; display:flex; flex-direction:column; gap:10px">
          ${S.chat.map((m) => `<div class="msg ${m.me ? "me" : "ai"}">${esc(m.t)}</div>`).join("")}
          ${S.approval === "pending" ? `<div class="approve fade-up">
            <div class="row"><i data-lucide="file-pen" class="i14"></i><b style="font-size:12.5px">修改第 3 集剧本</b><span class="pill warn" style="margin-left:auto">待你确认</span></div>
            <div class="diff"><div class="del">林川转身离开了井边。</div><div class="add">林川在井沿摸到半枚双鱼玉佩，背面刻着母亲的名字。</div></div>
            ${ep3.locked ? `<div style="font-size:12px;color:var(--status-warning)">第 3 集已拆解资产，剧本已锁定，不能修改。</div>` : ""}
            <div class="row"><button class="btn btn-primary btn-sm" data-act="approve" ${ep3.locked ? "disabled" : ""}>写入第 3 集</button><button class="btn btn-ghost btn-sm" data-act="reject">不用了</button></div>
          </div>` : `<div class="muted" style="font-size:12px">${S.approval === "ok" ? "✓ 已写入第 3 集，可在剧本里撤销。" : "已放弃这次修改。"}</div>`}
        </div>
        <div class="chatbox"><textarea placeholder="说说想怎么改剧本、资产或分镜…" id="chatIn"></textarea><button class="send" style="width:30px;height:30px" data-act="chat" aria-label="发送"><i data-lucide="arrow-up" class="i14"></i></button></div>`;
      }

      /* ---------- 剧本 ---------- */
      function viewScript() {
        const e = S.doc.startsWith("ep") ? E(+S.doc.slice(2)) : null;
        const analyzing = S.analyzing;
        const unscripted = S.episodes.filter((x) => !x.scripted);
        const title = S.doc === "outline" ? "故事大纲" : S.doc === "people" ? "人物传记" : e ? `第 ${e.no} 集 · ${e.title}` : "";
        const html = S.doc === "outline" ? S.outline : S.doc === "people" ? S.people : e ? e.html : "";
        let pill = "";
        if (!analyzing && S.episodes.length) {
          if (unscripted.length) pill = `<span>${unscripted.length} 集还没有剧本</span><span class="muted num">约 <span class="credit">${unscripted.length * 3}</span> 积分</span><button class="btn btn-primary btn-sm" data-act="genScripts" ${textBusy() ? "disabled title='有进行中的流水线任务'" : ""}><i data-lucide="sparkles" class="i14"></i>生成分集剧本</button>`;
          else if (S.episodes.some((x) => !x.locked)) pill = `<span>剧本整理完毕，下一步拆解角色和场景</span><button class="btn btn-primary btn-sm" data-act="openBreakdown" ${textBusy() ? "disabled title='有进行中的流水线任务'" : ""}><i data-lucide="scan-search" class="i14"></i>资产拆解</button>`;
        }
        return `<div class="toc scroll">
            <button class="toc-item" aria-current="${S.doc === "outline"}" data-act="doc" data-v="outline"><i data-lucide="list-tree" class="i14"></i>故事大纲</button>
            <button class="toc-item" aria-current="${S.doc === "people"}" data-act="doc" data-v="people"><i data-lucide="users" class="i14"></i>人物传记</button>
            <div class="row" style="padding:12px 8px 4px; font-size:11px" class="muted"><span class="muted">分集剧本</span><span class="muted num" style="margin-left:auto">${S.episodes.length} 集</span></div>
            <div class="stagger" style="display:grid;gap:1px">${S.episodes.map((x) => `<button class="toc-item" aria-current="${S.doc === "ep" + x.no}" data-act="doc" data-v="ep${x.no}">
              <span class="num muted" style="width:16px">${x.no}</span><span class="truncate">${esc(x.title)}</span>
              <span class="st">${x.locked ? '<i data-lucide="lock" class="i14" style="color:var(--status-warning)"></i>' : x.gen ? '<i data-lucide="loader-circle" class="i14 spin"></i>' : x.scripted ? "" : '<span class="pill" style="height:18px">待生成</span>'}</span></button>`).join("")}</div>
            ${analyzing ? `<div style="padding:8px; display:grid; gap:8px">${[80, 60, 70, 50].map((w) => `<div class="skel" style="width:${w}%"></div>`).join("")}</div>` : ""}
          </div>
          <div class="paper-wrap">
            ${analyzing ? analyzingView() : `<div class="paper fade-up" key="${S.doc}">
              <div class="row"><h2>${esc(title)}</h2>${e && e.locked ? '<span class="pill warn"><i data-lucide="lock" class="i14"></i>已锁定</span>' : ""}</div>
              ${e ? `<div class="muted" style="font-size:12px">约 ${e.no === 1 ? 58 : 60} 秒 · ${e.scripted ? "2 场" : "—"}</div>` : ""}
              ${e && e.locked ? `<div class="lockbar"><i data-lucide="lock" class="i14" style="color:var(--status-warning)"></i><div>这一集已经拆解资产，剧本已锁定。资产和分镜都以这一版为准。</div></div>` : ""}
              ${e && !e.scripted ? `<div style="margin-top:40px; text-align:center" class="muted"><i data-lucide="file-pen-line" style="width:28px;height:28px"></i><div style="margin-top:8px">这一集还没有剧本</div><div style="font-size:12px">可以直接在下面手写，或用底部的「生成分集剧本」</div></div>` : ""}
              <div class="doc" id="docEd" contenteditable="${!(e && e.locked)}" spellcheck="false">${html}</div>
            </div>`}
            ${pill ? `<div class="nextpill chrome">${pill}</div>` : ""}
          </div>`;
      }
      function analyzingView() {
        const steps = [["研读剧本", "判断是剧本还是小说，整理章节与人物"], ["故事大纲与人物传记", "提炼主线、人物关系和每集梗概"], ["按集拆分", "生成分集目录"]];
        return `<div class="paper"><h2 class="shimmer">正在研读剧本…</h2><div class="muted" style="margin-top:4px">可以离开这个页面，完成后会通知你</div>
          <div class="analyze-steps">${steps.map(([t, s], i) => `<div class="astep ${i < S.analyzeStep ? "done" : i === S.analyzeStep ? "on" : ""}"><span class="dotc">${i < S.analyzeStep ? '<i data-lucide="check" class="i14"></i>' : i === S.analyzeStep ? '<i data-lucide="loader-circle" class="i14 spin"></i>' : ""}</span><div><div style="font-weight:500">${t}</div><div class="muted" style="font-size:12px">${s}</div></div></div>`).join("")}</div>
          <div style="margin-top:28px; display:grid; gap:10px">${[96, 88, 92, 70, 84].map((w) => `<div class="skel" style="width:${w}%"></div>`).join("")}</div></div>`;
      }

      /* ---------- 资产 ---------- */
      function filtered() {
        return S.assets.filter((a) => {
          if (a.type !== S.type) return false;
          if (S.epFilter === "none") return a.eps === null;
          if (a.eps === null) return false;
          return S.epFilter === "all" || inEp(a, +S.epFilter);
        });
      }
      function viewAssets() {
        const fl = S.epFilter === "all" ? "全集" : S.epFilter === "none" ? "未分类" : `第 ${S.epFilter} 集`;
        return `<div class="assets">
          <div class="assets-head">
            <div class="seg"><span class="knob"></span>
              <button aria-pressed="${S.assetView === "list"}" data-act="aview" data-v="list"><i data-lucide="layout-grid" class="i14"></i>列表</button>
              <button aria-pressed="${S.assetView === "canvas"}" data-act="aview" data-v="canvas"><i data-lucide="frame" class="i14"></i>画布</button>
            </div>
            <span class="muted" style="font-size:12px">同一份资产，两种看法</span>
            <span style="flex:1"></span>
            <button class="btn btn-outline btn-sm" data-act="pop" data-v="epFilter"><i data-lucide="filter" class="i14"></i>${fl}<i data-lucide="chevron-down" class="i14"></i></button>
            ${S.assetView === "list" ? `<button class="btn ${S.multi ? "btn-primary" : "btn-outline"} btn-sm" data-act="multi"><i data-lucide="list-checks" class="i14"></i>${S.multi ? "完成" : "多选"}</button>` : ""}
            <button class="btn btn-outline btn-sm" data-act="openBreakdown" ${textBusy() ? "disabled" : ""}><i data-lucide="scan-search" class="i14"></i>资产拆解</button>
          </div>
          ${S.assetView === "list" ? assetList() : assetCanvas()}
        </div>`;
      }
      function assetList() {
        const items = filtered();
        const t = TYPES.find((x) => x[0] === S.type);
        const pending = S.assets.filter((a) => a.type === S.type && a.eps !== null && (a.st === "idle" || a.st === "error"));
        const tabs = TYPES.map(([k, l]) => `<button class="ttab" role="tab" aria-selected="${S.type === k}" data-act="atype" data-v="${k}">${l}<span class="cnt num">${S.assets.filter((a) => a.type === k && (S.epFilter === "none" ? a.eps === null : a.eps !== null)).length}</span></button>`).join("");
        return `<div class="typetabs" role="tablist">${tabs}</div>
          <div class="scroll" style="flex:1">
            ${pending.length && ["character", "scene", "prop"].includes(S.type) ? `<div class="banner fade-up"><i data-lucide="sparkles" class="i14" style="color:var(--credit)"></i>
              <div class="grow"><b>还有 ${pending.length} 个${t[1]}没有图</b><span class="muted">　可以上传，或勾选后批量生成</span></div>
              ${S.multi ? `<button class="btn btn-primary btn-sm" data-act="batchGen" ${S.selected.size ? "" : "disabled title='先勾选卡片'"}>生成 ${S.selected.size} 个 · <span class="num">${S.selected.size * 2}</span> 积分</button>`
                : `<button class="btn btn-outline btn-sm" data-act="selectPending"><i data-lucide="wand-sparkles" class="i14"></i>全部生成</button>`}</div>` : ""}
            <div class="acards stagger">
              ${items.map(assetCard).join("")}
              <button class="acard ${S.type}" data-act="newAsset"><div class="frame"><div class="empty"><div><i data-lucide="plus"></i><div style="margin-top:4px">新建${t[1]}</div></div></div></div>
                <div class="meta"><div class="sub">${S.epFilter === "all" || S.epFilter === "none" ? "全集出现" : `出现在第 ${S.epFilter} 集`}</div></div></button>
            </div>
            ${!items.length ? `<div class="muted" style="text-align:center; padding:0 0 30px">${S.epFilter === "none" ? "画布里没有未分类的" + t[1] : "这个筛选下还没有" + t[1]}</div>` : ""}
          </div>`;
      }
      function assetCard(a) {
        const sel = S.selected.has(a.id);
        const can = a.st === "idle" || a.st === "error";
        let inner;
        if (a.st === "done") inner = poster(a.name + a.look, a.type) + `<div class="scrim"><div style="font-weight:600;font-size:12.5px">${esc(a.name)}</div></div>`;
        else if (a.st === "run") inner = `<div class="empty" style="border-style:solid"><div><svg class="ring-prog" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="var(--muted)" stroke-width="3"/><circle cx="18" cy="18" r="15" fill="none" stroke="var(--status-running)" stroke-width="3" stroke-dasharray="94" stroke-dashoffset="${94 - (a.p || 10) * 0.94}" transform="rotate(-90 18 18)" style="transition:stroke-dashoffset 200ms linear"/></svg><div class="shimmer" style="margin-top:6px">生成中</div></div></div>`;
        else if (a.st === "analyzing") inner = `<div class="empty"><div><i data-lucide="loader-circle" class="spin"></i><div class="shimmer" style="margin-top:6px">正在分析设定</div></div></div>`;
        else if (a.st === "error") inner = `<div class="empty" style="border-color:color-mix(in oklch,var(--destructive) 40%,transparent)"><div style="color:var(--destructive)"><i data-lucide="circle-x"></i><div style="margin-top:4px">生成失败</div><div class="muted" style="font-size:11px">内容审核未通过</div></div></div>`;
        else inner = `<div class="empty"><div><i data-lucide="${TYPES.find((t) => t[0] === a.type)[2]}"></i><div style="margin-top:4px">${a.type === "character" ? "待生成形象" : "待生成"}</div></div></div>`;
        return `<div class="acard ${a.type} ${sel ? "sel" : ""}">
          <div class="frame">${inner}
            ${S.multi && can ? `<button class="ck" data-act="sel" data-v="${a.id}" aria-label="选择">${sel ? '<i data-lucide="check" class="i14"></i>' : ""}</button>` : ""}
            ${!S.multi ? `<div class="hover">${can ? `<button class="btn btn-primary btn-sm" data-act="genOne" data-v="${a.id}"><i data-lucide="sparkles" class="i14"></i>${a.st === "error" ? "重试" : "生成"}</button>` : ""}<button class="btn btn-sm chrome" data-act="locate" data-v="${a.id}"><i data-lucide="locate-fixed" class="i14"></i>画布</button></div>` : ""}
          </div>
          <div class="meta"><div class="name truncate">${esc(a.name)}${a.look ? `<span class="muted" style="font-weight:400"> · ${esc(a.look)}</span>` : ""}</div>
            <div class="sub row" style="gap:6px">${a.voice ? '<i data-lucide="audio-lines" class="i14" title="已绑定音色"></i>' : ""}${a.eps === null ? "未分类" : a.eps.length === 0 ? '<span class="pill" style="height:16px;font-size:10px">全集</span>' : `<span class="ep-dots">${a.eps.map((n) => `<i class="num">${n}</i>`).join("")}</span>`}</div></div>
        </div>`;
      }
      function assetCanvas() {
        const sel = S.assets.find((a) => a.id === S.canvasSel);
        const groups = {};
        S.assets.filter((a) => S.epFilter === "none" ? a.eps === null : a.eps !== null && (S.epFilter === "all" || inEp(a, +S.epFilter))).forEach((a) => ((groups[a.type] = groups[a.type] || []).push(a)));
        return `<div class="canvas" id="cv">
          <div class="world ${S.ease ? "ease" : ""}" id="world" style="transform:translate(${S.pan.x}px, ${S.pan.y}px)">
            ${S.assets.map((a) => {
              const isSel = a.id === S.canvasSel;
              const t = TYPES.find((x) => x[0] === a.type);
              return `<div class="cnode ${isSel ? "sel" : ""} ${S.flash === a.id ? "flash" : ""}" style="left:${a.x}px; top:${a.y}px">
                ${isSel ? `<div class="node-bar chrome">
                  <button class="btn btn-ghost btn-sm" data-act="pop" data-v="nodeEps"><i data-lucide="calendar-range" class="i14"></i>出现集数 · ${esc(epText(a))}</button>
                  <button class="btn btn-ghost btn-sm" data-act="toList" data-v="${a.id}"><i data-lucide="layout-grid" class="i14"></i>列表</button></div>` : ""}
                <div class="lbl"><i data-lucide="${a.type === "character" ? "contact-round" : t[2]}" class="i14"></i>${a.type === "character" ? "角色卡" : t[1]}${a.eps === null ? ' · <span style="color:var(--status-warning)">未分类</span>' : ""}</div>
                <div class="body" data-act="nodeSel" data-v="${a.id}">
                  ${a.st === "done" ? poster(a.name + a.look, a.type) : `<div class="ph">${a.st === "run" ? '<span class="shimmer">生成中…</span>' : a.st === "error" ? '<span style="color:var(--destructive)">生成失败</span>' : `<i data-lucide="${t[2]}"></i>`}</div>`}
                  <div style="padding:8px 10px"><div style="font-weight:500" class="truncate">${esc(label(a))}</div>${a.type === "character" ? `<div class="muted row" style="font-size:11px;gap:4px"><i data-lucide="audio-lines" class="i14"></i>${a.voice ? "已绑定参考音频" : "音色：清亮少年音"}</div>` : ""}</div>
                </div>
                ${isSel ? genPanel(a) : ""}
              </div>`;
            }).join("")}
          </div>
          <div class="lib-float chrome" data-stop>
            <div class="row" style="padding:10px 10px 4px"><b>资产库</b><span class="muted num" style="font-size:11px">${S.assets.length}</span><button class="btn btn-ghost btn-sm" style="margin-left:auto" data-act="pop" data-v="epFilter">${S.epFilter === "all" ? "全集" : S.epFilter === "none" ? "未分类" : "第 " + S.epFilter + " 集"}<i data-lucide="chevron-down" class="i14"></i></button></div>
            <div style="padding:0 10px 6px"><input class="input" style="width:100%;height:30px;font-size:12px" placeholder="搜索资产"></div>
            <div class="scroll" style="flex:1;padding-bottom:8px">${Object.entries(groups).map(([k, list]) => `<div class="lib-group"><i data-lucide="${TYPES.find((t) => t[0] === k)[2]}" class="i14"></i>${TYPES.find((t) => t[0] === k)[1]}<span class="num">${list.length}</span></div>${list.map((a) => `<div class="lib-item" data-act="locate" data-v="${a.id}"><span class="lib-thumb">${a.st === "done" ? poster(a.name + a.look, a.type) : `<i data-lucide="${TYPES.find((t) => t[0] === a.type)[2]}" class="i14"></i>`}</span><span class="truncate grow">${esc(label(a))}</span></div>`).join("")}`).join("") || `<div class="muted" style="padding:16px 12px;font-size:12px">这个筛选下没有资产</div>`}</div>
          </div>
          <div class="chrome row" style="position:absolute;right:12px;bottom:12px;border-radius:10px;padding:4px 10px;font-size:11.5px" data-stop><i data-lucide="hand" class="i14"></i>拖动空白处平移 · 点节点设置出现集数</div>
        </div>`;
      }

      /* 节点生成面板：与无限画布同一个组件（TaskPromptPanel），默认带上拆解时写好的资产提示词 */
      function genPanel(a) {
        const locked = a.st === "run";
        const preset = a.type === "character" ? (a.preset ?? "角色三视图") : a.type === "scene" ? (a.preset ?? "场景参考图") : a.type === "prop" ? (a.preset ?? "道具参考图") : "";
        const len = (a.prompt || "").replace(/<[^>]+>/g, "").length;
        return `<div class="gpanel" data-stop>
          <div class="row" style="align-items:flex-start">
            <div class="gp-refs">
              ${a.type === "character" && a.st === "done" ? `<span class="gp-ref" title="当前形象">${poster(a.name + a.look, a.type)}<span class="tag">形象</span></span>` : ""}
              ${a.voice ? `<span class="gp-ref" title="角色卡绑定的参考音频"><i data-lucide="audio-lines"></i><span class="tag">音色</span></span>` : ""}
              <button class="gp-ref add" data-act="toast" data-v="上传参考图，或从画布连线 / @ 引用（同无限画布）" title="添加参考素材"><i data-lucide="plus"></i></button>
              <span class="muted" style="font-size:11.5px; line-height:1.4">参考素材<br>连线、上传或 @</span>
            </div>
            <button class="gp-icon" data-act="toast" data-v="放大编辑提示词（同无限画布）" title="放大编辑"><i data-lucide="maximize-2" class="i14"></i></button>
          </div>
          <div class="gp-prompt" id="gprompt" data-asset="${a.id}" contenteditable="${!locked}" spellcheck="false" data-ph="写下你想要的画面，输入 @ 引用画布里的素材。">${a.prompt || ""}</div>
          <span class="gp-count" id="gpcount" style="${len ? "" : "visibility:hidden"}">${len}/2000</span>
          ${a.st === "error" ? `<div class="gp-notice">上次生成失败：内容审核未通过。改一下提示词再试，失败不扣积分。</div>` : ""}
          <div class="gp-tools">
            <button class="pchip" data-act="pop" data-v="imgModel"><span class="truncate">${esc(S.imgModel || "Seedream 4.0")}</span><i data-lucide="chevron-down"></i></button>
            <button class="pchip" data-act="pop" data-v="imgParams"><span class="truncate num">${esc(a.type === "character" ? "3:4" : S.project.ratio || "16:9")} · ${esc(S.imgRes || "2K")}</span><i data-lucide="chevron-down"></i></button>
            ${preset ? `<button class="pchip" data-act="pop" data-v="preset" style="color:var(--preset)"><i data-lucide="sparkle" class="i14"></i><span class="truncate">${esc(preset)}</span></button>` : ""}
            <span class="gp-credits" title="生成 1 张"><i data-lucide="sparkle"></i>2</span>
            <button class="gp-submit" data-act="genFromPanel" data-v="${a.id}" ${locked ? "disabled" : ""} title="${locked ? "生成中" : "开始生成 ⌘↵"}">${locked ? '<i data-lucide="loader-circle" class="i14 spin"></i>' : '<i data-lucide="arrow-up" class="i14" style="stroke-width:2.5"></i>'}</button>
          </div>
        </div>`;
      }

      /* ---------- 分集视频 ---------- */
      function viewEpisodes() {
        return `<div class="scroll" style="flex:1">
          <div class="row" style="padding:22px 20px 16px; align-items:flex-end">
            <div><div style="font-size:20px;font-weight:600">分集视频</div><div class="muted num" style="font-size:12px">共 ${S.episodes.length} 集 · 每集先生成分镜脚本，再逐片段出视频</div></div>
            <span style="flex:1"></span>
            <button class="btn btn-outline btn-sm" data-act="addEp"><i data-lucide="plus" class="i14"></i>新增一集</button>
          </div>
          <div class="eps-grid stagger">${S.episodes.map(epCard).join("")}</div>
        </div>`;
      }
      function epCard(e) {
        const chars = S.assets.filter((a) => a.type === "character" && inEp(a, e.no)).length;
        const scenes = S.assets.filter((a) => a.type === "scene" && inEp(a, e.no)).length;
        const segs = S.segs[e.no] || [];
        const done = segs.filter((s) => s.chosen >= 0).length;
        const st = e.sb === "ready" ? `<span class="pill ${done === segs.length && segs.length ? "ok" : "run"}">${done}/${segs.length} 片段已出视频</span>` : e.sb === "gen" ? '<span class="pill run"><i data-lucide="loader-circle" class="i14 spin"></i>生成脚本中</span>' : e.locked ? '<span class="pill">待生成脚本</span>' : '<span class="pill warn">需先资产拆解</span>';
        const btn = e.sb === "ready" ? `<button class="btn btn-primary btn-sm" data-act="studio" data-v="${e.no}">进入制作<i data-lucide="arrow-right" class="i14"></i></button>`
          : e.sb === "gen" ? `<button class="btn btn-outline btn-sm" disabled>生成中…</button>`

            <section class="seditor">

                <div class="row" style="align-items:baseline"><div style="font-size:22px;font-weight:600" class="num">片段 ${String(S.curSeg + 1).padStart(2, "0")}</div>

                  : `<div style="text-align:center" class="muted"><i data-lucide="clapperboard"></i><div style="margin-top:6px;font-size:12px">还没有生成内容</div></div>`}
              </div>
              ${s && s.takes.length ? `<div><div class="muted" style="font-size:11.5px;margin-bottom:6px">生成结果 · 点选即采用</div><div class="takes">${s.takes.map((_, i) => `<button class="take" aria-pressed="${s.chosen === i}" data-act="take" data-v="${i}">${poster(s.id + "t" + i, "scene")}</button>`).join("")}</div></div>` : ""}

              <span class="pill vio" style="height:16px;font-size:10px">连播 · 三期</span>

      function playX() { const segs = S.segs[S.curEp]; let x = 0, t = S.playT; for (const s of segs) { if (t <= s.sec) return x + t * 12; t -= s.sec; x += s.sec * 12 + 4; } return x; }

      /* ================= 浮层 ================= */
      let popEl = null, popKey = "";

        const w = el.offsetWidth, h = el.offsetHeight;

      function popContent(key) {

        if (key === "vmodel") return `<div class="menu-label">视频模型 · 片段要用参考图</div>${[["Seedance 2.0 Fast", "参考图 ≤9 · 参考音频 · ≤15s"], ["Kling 3.0", "参考图 ≤4 · ≤10s"]].map(([m, d]) => `<button class="menu-item ${(S.vmodel || "Seedance 2.0 Fast") === m ? "active" : ""}" data-act="vmodel" data-v="${m}"><i data-lucide="clapperboard" class="i14"></i><div><div>${m}</div><div class="muted" style="font-size:11px">${d}</div></div></button>`).join("")}<button class="menu-item" disabled style="opacity:.45;cursor:not-allowed"><i data-lucide="clapperboard" class="i14"></i><div><div>Veo Lite</div><div class="muted" style="font-size:11px">不支持参考图，片段里的 @ 资产会失效</div></div></button>`;
        if (key === "epFilter") return `<button class="menu-item ${S.epFilter === "all" ? "active" : ""}" data-act="epf" data-v="all"><i data-lucide="layers" class="i14"></i>全集</button><div class="menu-label">按集</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:2px">${S.episodes.map((e) => `<button class="menu-item ${S.epFilter == e.no ? "active" : ""} num" data-act="epf" data-v="${e.no}">第 ${e.no} 集</button>`).join("")}</div><button class="menu-item ${S.epFilter === "none" ? "active" : ""}" data-act="epf" data-v="none"><i data-lucide="inbox" class="i14"></i>未分类<span class="muted" style="margin-left:auto;font-size:11px">画布里随手建的</span></button>`;

      /* ---------- 对话框：资产拆解 ---------- */

        S.pan = { x: panning.px + dx, y: panning.py + dy }; const w = $("#world"); if (w) w.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px)`;
      });
      document.addEventListener("mouseup", () => { if (panning) { const cv = $("#cv"); cv && cv.classList.remove("panning"); panning = null; setTimeout(() => (panMoved = false), 0); } });

      /* ---------- 动作实现 ---------- */
      function locate(id) {
        S.area = "assets"; S.assetView = "canvas"; S.canvasSel = id; S.flash = id; S.ease = true;
        render();
        const cv = $("#cv"), a = S.assets.find((x) => x.id === id);
        if (cv && a) { S.pan = { x: cv.clientWidth / 2 - a.x - 84 + 110, y: Math.max(40, cv.clientHeight * 0.18) - a.y }; requestAnimationFrame(() => { const w = $("#world"); if (w) w.style.transform = `translate(${S.pan.x}px, ${S.pan.y}px)`; }); }
        setTimeout(() => { S.ease = false; const w = $("#world"); w && w.classList.remove("ease"); }, 260);
        setTimeout(() => { S.flash = null; const n = document.querySelector(".cnode.flash"); n && n.classList.remove("flash"); }, 950);
      }
      function genAsset(id) {
        const a = S.assets.find((x) => x.id === id); if (!a) return;
        a.st = "run"; a.p = 5; render();
        const tk = setInterval(() => {
          a.p = Math.min(100, a.p + 7 + Math.random() * 6);
          if (a.p >= 100) { clearInterval(tk); a.st = "done"; render(); if (a.type === "character") toast(`${label(a)} 已生成，并设为角色卡形象`); }
        }, 160);
        const repaint = setInterval(() => { if (a.st !== "run") return clearInterval(repaint); if (S.route === "ws" && S.area === "assets") render(); }, 480);
      }
      function breakdown(eps, isRetry) {
        const willFail = /bad/i.test(S.project.title) && !isRetry;
        const j = runJob({ step: `资产拆解 · 第 ${eps.join("、")} 集`, ms: 2200, sub: "识别角色、场景、道具，并与已有资产合并", fail: () => willFail, done: () => {
          eps.forEach((n) => (E(n).locked = true));
          const merged = [];
          S.assets.filter((a) => a.name === "林川" || a.name === "沈月").forEach((a) => { if (a.eps) eps.forEach((n) => !a.eps.includes(n) && (a.eps.push(n), merged.push(a.name))); });
          const add = (type, name, look) => { const k = S.assets.length; const a = { id: "a" + ++uid, type, name, look, eps: [...eps], st: "analyzing", x: (k % 5) * 200, y: 540 + Math.floor((k - 9) / 5) * 270 }; S.assets.push(a); return a; };
          const fresh = [add("character", "老村长", "基础形象"), add("scene", "老井", "井边 · 黄昏"), add("prop", "双鱼玉佩", "半枚")];
          fresh[0].prompt = "六十岁老人，佝偻，灰白胡子，黑布对襟褂，手持铜烟锅；目光阴沉。写实电影质感。"; fresh[1].prompt = "村后老井，青石井沿长满青苔，辘轳绳索断了一半；黄昏冷暖对比。"; fresh[2].prompt = "半枚青白玉佩，双鱼纹，断口参差，背面阴刻小字，纯色背景微距。";
          toast(`拆解完成：新增 ${fresh.length} 个资产${merged.length ? "，已有角色只追加了出现集数" : ""}`);
          runJob({ step: "资产提示词 · 3 个新资产", ms: 1400, sub: "按画风写图片提示词", done: () => fresh.forEach((a) => (a.st = "idle")) });
        } });
        j.eps = eps;
      }
      function curSeg() { return (S.segs[S.curEp] || [])[S.curSeg]; }
      function genSeg(s) {
        if (!s || s.st === "run") return;
        const ids = [...s.html.matchAll(/data-id="(\w+)"/g)].map((m) => m[1]);
        const noImg = [...new Set(ids)].map((id) => S.assets.find((a) => a.id === id)).filter((a) => a && a.st !== "done");
        if (noImg.length) toast(`${noImg.map(label).join("、")} 还没有图，只按文字描述生成`, "warn");
        s.st = "run"; S.justGen = false; render();
        const fail = /失败/.test(s.html.replace(/<[^>]+>/g, ""));
        setTimeout(() => {
          if (fail) { s.st = "error"; toast("片段生成失败", "bad"); }
          else { s.takes.push(Date.now()); s.chosen = s.takes.length - 1; s.st = "done"; if (s === curSeg()) S.justGen = true; toast("片段已生成，已设为采用"); }
          if (S.route === "studio") render();
        }, 1800);
      }
      let playTimer = null;
      function togglePlay() {
        const segs = S.segs[S.curEp] || [];
        if (!segs.some((s) => s.chosen >= 0)) return toast("还没有可播放的片段", "info");
        S.playing = !S.playing;
        if (!S.playing) { clearInterval(playTimer); render(); return; }
        const total = segs.reduce((t, s) => t + s.sec, 0);
        if (S.playT >= total) S.playT = 0;
        render();
        playTimer = setInterval(() => {
          S.playT += 0.4; // 4 倍速示意
          let t = S.playT, idx = 0; for (; idx < segs.length; idx++) { if (t <= segs[idx].sec) break; t -= segs[idx].sec; }
          if (S.playT >= total) { S.playing = false; clearInterval(playTimer); render(); toast("连播结束（没出视频的片段会跳过）", "info"); return; }
          if (idx !== S.curSeg) { S.curSeg = idx; render(); }
          else { const ph = $("#ph"); if (ph) ph.style.left = playX() + "px"; const tt = document.querySelector(".timeline .num.muted"); if (tt) tt.textContent = `${fmt(S.playT)} / ${fmt(total)}`; }
        }, 100);
      }

      seed();
      render();
      addEventListener("resize", () => document.querySelectorAll(".seg").forEach(placeKnob));
    </script>
  </body>
</html>
