name: 功能建议
description: 新功能、体验改进、新的模型插件需求
title: "[建议] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。一个 Issue 只提一个建议。
        打算自己实现的大改动，请先在这里讨论方案，再动手写代码。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题或场景
      description: 你在做什么时遇到了困难？现在是怎么处理的？为什么不方便？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 希望的方案
      description: 期望的行为和交互。可以附草图、截图或参考产品。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的其他方案
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 画布 / 节点
        - 首页对话
        - 生成任务 / 队列
        - 模型插件 / 渠道
        - 画布 Agent
        - 3D 导演台
        - 资产库
        - 管理后台
        - 积分 / 支付
        - 部署 / 升级
        - 其他
  - type: dropdown
    id: contribute
    attributes:
      label: 你是否愿意参与实现？
      options:
        - 愿意提交 PR
        - 可以协助测试
        - 只提建议
    validations:
      required: true
