name: Bug 报告
description: 功能异常、报错、结果与预期不符
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先搜索已有 Issue。**不要在这里贴 API Key、令牌、`.env` 或数据库连接串。**
        安全漏洞请不要公开提交，见 [贡献指南](https://github.com/zaylora/video-canvas/blob/master/CONTRIBUTING.md)。
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 一两句话说清发生了什么。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 看到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
      description: 可以附截图、录屏。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本号
      description: 管理后台的版本设置页，或仓库 `VERSION` 文件里的版本，例如 0.4.7。
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - Docker 生产部署（deploy.sh）
        - Docker 开发环境
        - 本地开发
        - 其他
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 涉及模块
      multiple: true
      options:
        - 画布 / 节点
        - 首页对话
        - 生成任务 / 队列
        - 模型插件 / 渠道
        - 画布 Agent
        - 3D 导演台
        - 资产库
        - 管理后台
        - 积分 / 支付
        - 部署 / 升级
        - 其他
  - type: input
    id: env
    attributes:
      label: 浏览器与系统
      placeholder: Chrome 130 / Windows 11
  - type: textarea
    id: task
    attributes:
      label: 生成任务信息（生成失败时填写）
      description: 任务 ID、使用的插件和模型名称、页面或后台显示的失败原因。不要填密钥。
  - type: textarea
    id: logs
    attributes:
      label: 日志与报错
      description: 浏览器控制台报错、后端日志的相关片段（请先去掉敏感信息）。
      render: text
