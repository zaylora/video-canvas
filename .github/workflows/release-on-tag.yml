name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-on-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Generate changelog and release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git cliff --latest --strip header --output release-notes.md
          git cliff --output full-changelog.md
          test -s release-notes.md
          test -s full-changelog.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Update CHANGELOG.md on master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_VALUE="${RELEASE_TAG#v}"
          git fetch origin master
          git switch --force-create release-changelog origin/master
          cp full-changelog.md CHANGELOG.md
          printf '%s\n' "$VERSION_VALUE" > VERSION
          if git diff --quiet -- CHANGELOG.md VERSION; then
            echo "CHANGELOG.md and VERSION are already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md VERSION
          git commit -m "docs: update changelog for $RELEASE_TAG"
          git push origin HEAD:master
