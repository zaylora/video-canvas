name: Release on tag

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-on-tag-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish release from confirmed changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Read confirmed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_VALUE="${RELEASE_TAG#v}"
          test -s CHANGELOG.md
          awk -v version="$VERSION_VALUE" '
            $0 ~ "^## \\[" version "\\]" || $0 ~ "^## v" version "([[:space:]]|$)" {
              found = 1
              print
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          grep -Eq "^## (v$VERSION_VALUE|\\[$VERSION_VALUE\\])([[:space:]]|$|-)" release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi

      - name: Update VERSION on master
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_VALUE="${RELEASE_TAG#v}"
          git fetch origin master
          git switch --force-create release-changelog origin/master
          printf '%s\n' "$VERSION_VALUE" > VERSION
          if git diff --quiet -- VERSION; then
            echo "VERSION is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION
          git commit -m "docs: update changelog for $RELEASE_TAG"
          git push origin HEAD:master
