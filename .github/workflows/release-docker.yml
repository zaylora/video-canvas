name: Release Docker images

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-docker-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  # 先于构建做快速校验：tag、VERSION、CHANGELOG 有问题时不要白白推送镜像
  validate:
    name: Validate release inputs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Read confirmed release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_VALUE="${RELEASE_TAG#v}"
          test -s CHANGELOG.md
          # 用 index() 做字面量匹配：awk 字符串里的 \[ 会被当成普通 [，正则会匹配不到标题
          awk -v version="$VERSION_VALUE" '
            BEGIN {
              bracket = "## [" version "]"
              plain = "## v" version
            }
            index($0, bracket) == 1 || (index($0, plain) == 1 && substr($0, length(plain) + 1) ~ /^([[:space:]]|$)/) {
              found = 1
              print
              next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
          grep -Eq "^## (v$VERSION_VALUE|\[$VERSION_VALUE\])([[:space:]]|$|-)" release-notes.md

      - name: Validate VERSION matches tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION_VALUE="${RELEASE_TAG#v}"
          if [ "$(tr -d '[:space:]' < VERSION)" != "$VERSION_VALUE" ]; then
            echo "VERSION ($(cat VERSION)) does not match tag $RELEASE_TAG; update VERSION in the release commit before tagging"
            exit 1
          fi

      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md

  quality:
    name: Code quality
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Go format and vet
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...

      - name: 安装 ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Go tests
        working-directory: backend
        run: go test ./...

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # agent/package.json 的 engines 要求 >= 22.19
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Agent typecheck and tests
        working-directory: agent
        run: |
          npm ci
          npm run typecheck
          npm test

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile

      - name: Web typecheck
        working-directory: web
        run: bun run typecheck

      - name: Web lint
        working-directory: web
        run: bun run lint

      - name: Web tests
        working-directory: web
        run: bun run test

  docker:
    name: Build and publish images
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (backend)
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/video-canvas-backend
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker metadata (web)
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/video-canvas-web
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker metadata (agent)
        id: meta-agent
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/video-canvas-agent
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Docker metadata (updater)
        id: meta-updater
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/video-canvas-updater
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta-backend.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILDTIME=${{ github.event.release.published_at || github.event.head_commit.timestamp }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build and push web
        uses: docker/build-push-action@v6
        with:
          context: ./web
          file: ./web/Dockerfile
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}
          build-args: VITE_API_BASE_URL=/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # Agent 服务（compose profile: agent），和 backend / web 同一个版本号发布：backend 和 agent 之间的协议只在同版本里保证兼容
      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: ./agent
          file: ./agent/Dockerfile
          push: true
          tags: ${{ steps.meta-agent.outputs.tags }}
          labels: ${{ steps.meta-agent.outputs.labels }}
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      # 一键升级的执行端（compose profile: updater），和 backend / web 同一个版本号发布
      - name: Build and push updater
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./backend/Dockerfile.updater
          push: true
          tags: ${{ steps.meta-updater.outputs.tags }}
          labels: ${{ steps.meta-updater.outputs.labels }}
          cache-from: type=gha,scope=updater
          cache-to: type=gha,mode=max,scope=updater

  # 镜像全部推送成功后才创建 GitHub Release：一键升级会按 Release 判断新版本，
  # 若 Release 先于镜像出现，用户会拉取到尚不存在的镜像。
  release:
    name: Publish release
    needs: [validate, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # 本 job 不 checkout 仓库，gh 找不到 .git，必须显式指定仓库
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TAG" --notes-file release-notes.md
          else
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
          fi
