name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 仓储 / 并发（积分行锁、首个超管、最后超管保护）的集成测试要真实的 Postgres 和 Redis，
    # 没有这两个服务时它们会 t.Skip，看起来全绿其实没跑
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: video_canvas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d video_canvas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_DSN: host=127.0.0.1 port=5432 user=test password=test dbname=video_canvas_test sslmode=disable
      TEST_REDIS_ADDR: 127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # lint 需要 merge-base 计算增量

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: golangci-lint（仅检查相对 master 的增量）
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0 # 与 backend/Makefile 的 LINT_VERSION 保持一致
          working-directory: backend
          args: --new-from-merge-base=origin/master ./...

      - name: Build
        run: go build ./...

      - name: Test
        run: go test -race ./...

  web:
    name: Web (format + typecheck + lint + test + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build
